name: Verify and publish private course source

on:
  schedule:
    # Best-effort fallback, not a five-minute SLA. Immediate release uses workflow_dispatch.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-course.yml', '.github/scripts/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: course-site-sync
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and deploy course Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out current public publisher
        uses: actions/checkout@v4
        with:
          ref: main
          path: public
      - name: Check out current private course source
        uses: actions/checkout@v4
        with:
          repository: levshaazz/llm-serving-mastery
          ref: main
          token: ${{ secrets.COURSE_REPO_TOKEN }}
          persist-credentials: false
          path: course
      - name: Detect unpublished source against the live site
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          source_sha=$(git -C course rev-parse HEAD)
          live_sha=$(curl --fail --silent --show-error --max-time 20 "https://levshaazz.github.io/.course-source-sha?run=$GITHUB_RUN_ID" || true)
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          if [[ "$source_sha" == "$live_sha" && "$EVENT_NAME" != push ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Report real validation start to private source
        if: steps.version.outputs.changed == 'true'
        env:
          COURSE_TOKEN: ${{ secrets.COURSE_REPO_TOKEN }}
          SOURCE_SHA: ${{ steps.version.outputs.source_sha }}
        run: python public/.github/scripts/course-status.py pending
      - uses: actions/setup-node@v4
        if: steps.version.outputs.changed == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: course/package-lock.json
      - uses: actions/setup-python@v5
        if: steps.version.outputs.changed == 'true'
        with:
          python-version: '3.12'
      - name: Cache pinned browser binaries
        if: steps.version.outputs.changed == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ubuntu24-playwright-all-v1-${{ hashFiles('course/package-lock.json') }}
      - name: Install course dependencies
        if: steps.version.outputs.changed == 'true'
        working-directory: course
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
          python -m pip install PyYAML==6.0.2 matplotlib==3.10.7
      - name: Verify every gate and build
        if: steps.version.outputs.changed == 'true'
        working-directory: course
        env:
          PUBLIC_BUILD_SHA: ${{ steps.version.outputs.source_sha }}
          LSM_CHECK_JOBS: '2'
        run: |
          npm run check
          npm run build
          npm run check:site
      - name: Preserve reviewed generated site and stage Pages artifact
        if: steps.version.outputs.changed == 'true'
        env:
          SOURCE_SHA: ${{ steps.version.outputs.source_sha }}
        run: |
          set -euo pipefail
          # Refresh the branch before writing; queued events must not push from their old event SHA.
          git -C public pull --ff-only origin main
          mkdir -p public/llm-serving-mastery
          rsync --archive --delete course/docs/ public/llm-serving-mastery/
          cp course/docs/index.html public/index.html
          touch public/.nojekyll
          printf '%s\n' "$SOURCE_SHA" > public/.course-source-sha
          git -C public config user.name 'github-actions[bot]'
          git -C public config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C public add llm-serving-mastery index.html .nojekyll .course-source-sha
          if ! git -C public diff --cached --quiet; then
            git -C public commit -m "Publish course site from $SOURCE_SHA"
            git -C public push origin main
          fi
          # Never upload a checkout, .git, the private source or instructor directory.
          mkdir -p site/llm-serving-mastery
          cp -a course/docs/. site/llm-serving-mastery/
          cp public/index.html public/.nojekyll public/.course-source-sha site/
      - name: Configure Pages
        if: steps.version.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - name: Upload only the generated Pages artifact
        if: steps.version.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.version.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
      - name: Verify the live source receipt
        if: steps.version.outputs.changed == 'true'
        env:
          SOURCE_SHA: ${{ steps.version.outputs.source_sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            live_sha=$(curl --fail --silent --max-time 15 "https://levshaazz.github.io/.course-source-sha?run=$GITHUB_RUN_ID&attempt=$attempt" || true)
            if [[ "$live_sha" == "$SOURCE_SHA" ]]; then
              echo "Live source receipt verified: $SOURCE_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Pages receipt does not match the verified source"
          exit 1
      - name: Verify delivered Topic 04 artifacts and public notebook
        if: steps.version.outputs.changed == 'true'
        working-directory: course
        run: node scripts/check-published-topic04.mjs ${{ steps.version.outputs.source_sha }}
      - name: Report actual delivery result to private source
        if: always() && steps.version.outputs.changed == 'true'
        env:
          COURSE_TOKEN: ${{ secrets.COURSE_REPO_TOKEN }}
          SOURCE_SHA: ${{ steps.version.outputs.source_sha }}
          RESULT: ${{ job.status }}
        run: |
          if [[ "$RESULT" == success ]]; then
            python public/.github/scripts/course-status.py success
          else
            python public/.github/scripts/course-status.py failure
          fi
