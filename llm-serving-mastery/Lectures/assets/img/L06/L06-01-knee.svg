<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 506" role="img" aria-label="Throughput curve bending at the saturation knee with one defended working point">
  <rect width="900" height="506" fill="#FAF6ED"/>
  <!-- axes -->
  <line x1="110" y1="410" x2="830" y2="410" stroke="#14181F" stroke-width="3" stroke-linecap="round"/>
  <line x1="110" y1="410" x2="110" y2="60" stroke="#14181F" stroke-width="3" stroke-linecap="round"/>
  <text x="470" y="470" font-family="Georgia, serif" font-size="24" fill="#6B7280" text-anchor="middle">clients</text>
  <text x="60" y="235" font-family="Georgia, serif" font-size="24" fill="#6B7280" text-anchor="middle" transform="rotate(-90 60 235)">orders / hour</text>
  <!-- throughput curve rising then flattening -->
  <path d="M110 410 C 220 400, 300 330, 400 200 C 470 110, 560 80, 800 74" fill="none" stroke="#2A6FDB" stroke-width="7" stroke-linecap="round"/>
  <!-- the knee annotation -->
  <circle cx="430" cy="168" r="46" fill="none" stroke="#E8743B" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round"/>
  <text x="500" y="150" font-family="Georgia, serif" font-size="26" fill="#B4521F">the knee</text>
  <!-- flat roof hint -->
  <line x1="560" y1="74" x2="830" y2="74" stroke="#B8B19E" stroke-width="3" stroke-dasharray="4 12"/>
  <text x="695" y="52" font-family="Georgia, serif" font-size="22" fill="#6B7280">stove is finite</text>
  <!-- working point below the knee -->
  <circle cx="322" cy="288" r="16" fill="#1B4FA0"/>
  <line x1="322" y1="288" x2="250" y2="330" stroke="#1B4FA0" stroke-width="3"/>
  <path d="M250 330 l-26 -8 l14 -22 z" fill="#1B4FA0"/>
  <text x="180" y="368" font-family="Georgia, serif" font-size="24" fill="#1B4FA0">working point</text>
  <!-- latency clocks growing past the knee -->
  <g stroke="#6B7280" stroke-width="3" fill="none">
    <circle cx="640" cy="150" r="17"/><path d="M640 150 v-9"/>
    <circle cx="710" cy="190" r="20"/><path d="M710 190 v-11"/>
    <circle cx="785" cy="240" r="24"/><path d="M785 240 v-13"/>
  </g>
  <text x="712" y="300" font-family="Georgia, serif" font-size="22" fill="#6B7280" text-anchor="middle">waits grow</text>
</svg>
