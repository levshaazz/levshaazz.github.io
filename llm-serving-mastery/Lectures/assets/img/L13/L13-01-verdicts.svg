<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 506" role="img" aria-label="A flat latency trace with one burst spike: the mean line stays calm while the p95 line and the alert catch the tail">
  <rect width="900" height="506" fill="#FAF6ED"/>
  <!-- chart frame -->
  <line x1="110" y1="400" x2="830" y2="400" stroke="#14181F" stroke-width="3" stroke-linecap="round"/>
  <line x1="110" y1="400" x2="110" y2="70" stroke="#14181F" stroke-width="3" stroke-linecap="round"/>
  <text x="470" y="462" font-family="Georgia, serif" font-size="24" fill="#6B7280" text-anchor="middle">21:00 – 21:05</text>
  <text x="58" y="235" font-family="Georgia, serif" font-size="24" fill="#6B7280" text-anchor="middle" transform="rotate(-90 58 235)">TTFT, s</text>
  <!-- p95 threshold -->
  <line x1="110" y1="120" x2="830" y2="120" stroke="#AF372B" stroke-width="3" stroke-dasharray="12 9"/>
  <text x="824" y="108" font-family="Georgia, serif" font-size="22" fill="#AF372B" text-anchor="end">SLO: p95 ≤ 2 s</text>
  <!-- the trace: calm band with one burst spike -->
  <path d="M110 330 L 560 330 L 600 96 L 640 330 L 830 330" fill="none" stroke="#2A6FDB" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="600" cy="96" r="10" fill="#AF372B"/>
  <!-- the mean line: calm while the spike happens -->
  <line x1="110" y1="298" x2="830" y2="298" stroke="#89540A" stroke-width="3" stroke-dasharray="4 10"/>
  <text x="126" y="290" font-family="Georgia, serif" font-size="22" fill="#89540A">mean — barely moves</text>
  <!-- labels -->
  <text x="600" y="72" font-family="Georgia, serif" font-size="24" fill="#AF372B" text-anchor="middle">the burst second</text>
  <text x="700" y="380" font-family="Georgia, serif" font-size="24" fill="#2A6FDB">96 calm requests</text>
  <text x="150" y="380" font-family="Georgia, serif" font-size="24" fill="#6B7280">4 users in the tail</text>
  <!-- the alert bell -->
  <line x1="600" y1="120" x2="600" y2="96" stroke="#AF372B" stroke-width="3"/>
  <path d="M576 108 h48 M580 108 v-6 a20 14 0 0 1 40 0 v6 z" fill="none" stroke="#AF372B" stroke-width="3" stroke-linejoin="round"/>
  <text x="742" y="152" font-family="Georgia, serif" font-size="24" fill="#14181F">page: burn 8.3×</text>
  <line x1="660" y1="120" x2="736" y2="144" stroke="#6B7280" stroke-width="2"/>
</svg>
