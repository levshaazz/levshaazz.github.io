<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 506" role="img" aria-label="Container image as ordered layers; one edited layer rebuilds everything above it">
  <rect width="900" height="506" fill="#FAF6ED"/>
  <!-- ordered layer stack, bottom = base -->
  <g font-family="Georgia, serif" font-size="26" text-anchor="middle">
    <rect x="210" y="376" width="480" height="62" rx="12" fill="#DCE8F8" stroke="#2A6FDB" stroke-width="5"/>
    <text x="450" y="416" fill="#1B4FA0">base image (pinned)</text>
    <rect x="210" y="298" width="480" height="62" rx="12" fill="#FFFFFF" stroke="#14181F" stroke-width="4"/>
    <text x="450" y="338" fill="#14181F">dependencies</text>
    <rect x="210" y="220" width="480" height="62" rx="12" fill="#FFFFFF" stroke="#14181F" stroke-width="4"/>
    <text x="450" y="260" fill="#14181F">code</text>
    <rect x="210" y="122" width="480" height="74" rx="12" fill="#FBE6D8" stroke="#E8743B" stroke-width="6"/>
    <text x="450" y="168" fill="#B4521F" font-weight="bold">one line edited</text>
  </g>
  <!-- cached marks on stable layers -->
  <g stroke="#2A6FDB" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M688 407 l10 10 l18 -22"/>
    <path d="M688 329 l10 10 l18 -22"/>
  </g>
  <!-- rebuild ripple: everything above the edit is re-baked -->
  <g stroke="#E8743B" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="3 9">
    <path d="M700 250 q40 -6 40 -34 t-40 -34"/>
    <path d="M700 172 q40 -6 40 -34 t-40 -34"/>
  </g>
  <!-- the edit line feeds the new top layers -->
  <path d="M700 159 h60" stroke="#E8743B" stroke-width="5" stroke-linecap="round"/>
  <path d="M760 159 l-22 -13 v26 z" fill="#E8743B"/>
  <text x="742" y="112" font-family="Georgia, serif" font-size="23" fill="#B4521F">rebuilt</text>
  <text x="450" y="60" font-family="Georgia, serif" font-size="27" fill="#6B7280" text-anchor="middle">an image is ordered layers — order the Dockerfile so edits rebuild little</text>
</svg>
