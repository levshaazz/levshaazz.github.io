<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Lower allocated bytes did not lower reserved bytes</title><desc id="desc">FP16 peak allocated 1260388352 bytes versus NF4 663721984. FP16 peak reserved 1277165568 bytes versus NF4 1310720000. Allocated fell about 47.3 percent while reserved rose about 2.6 percent.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="25" y="48" fill="#8cbcff" font-size="32" text-anchor="start">Counter</text><text x="570" y="48" fill="#8cbcff" font-size="32" text-anchor="start">FP16 GiB</text><text x="865" y="48" fill="#8cbcff" font-size="32" text-anchor="start">NF4 GiB</text><text x="1160" y="48" fill="#8cbcff" font-size="32" text-anchor="start">Difference</text><line x1="25" y1="78" x2="1410" y2="78" stroke="#becad4" stroke-width="4"/><text x="25" y="145" fill="#becad4" font-size="32" text-anchor="start">Allocated</text><text x="570" y="145" fill="#f1f3ed" font-size="32" text-anchor="start">1.174</text><text x="865" y="145" fill="#f1f3ed" font-size="32" text-anchor="start">0.618</text><text x="1160" y="145" fill="#f1f3ed" font-size="32" text-anchor="start">-0.556</text><text x="25" y="222" fill="#becad4" font-size="32" text-anchor="start">Reserved</text><text x="570" y="222" fill="#f1f3ed" font-size="32" text-anchor="start">1.189</text><text x="865" y="222" fill="#f1f3ed" font-size="32" text-anchor="start">1.221</text><text x="1160" y="222" fill="#f1f3ed" font-size="32" text-anchor="start">+0.031</text><text x="25" y="348" fill="#7addbb" font-size="34" text-anchor="start">Allocated: live tensors tracked by the allocator</text><text x="25" y="421" fill="#ffcc79" font-size="32" text-anchor="start">Reserved: memory held in its pool, including reusable blocks</text></g></svg>
