<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Kernel events occupy only part of the profiled span</title><desc id="desc">At P128/O8, physical kernel-event union is 33.331 ms inside a 322.362 ms kernel span. At P4096/O8 it is 82.421 ms inside 300.923 ms. The remainder is outside recorded kernel events, not proof of idle GPU time or a CPU root cause.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="25" y="123" fill="#f1f3ed" font-size="34" text-anchor="start">P=128</text><rect x="255" y="85" width="113.3244935546875" height="65" fill="#8cbcff" opacity="1"/><rect x="368.3244935546875" y="85" width="982.7059080078125" height="65" fill="#293744" opacity="1"/><text x="255" y="203" fill="#f1f3ed" font-size="36" text-anchor="start">33.3 ms kernels / 322.4 ms span</text><text x="25" y="313" fill="#f1f3ed" font-size="34" text-anchor="start">P=4096</text><rect x="255" y="275" width="280.2324890625" height="65" fill="#8cbcff" opacity="1"/><rect x="535.2324890625" y="275" width="742.9053025390624" height="65" fill="#293744" opacity="1"/><text x="255" y="393" fill="#f1f3ed" font-size="36" text-anchor="start">82.4 ms kernels / 300.9 ms span</text><text x="25" y="470" fill="#becad4" font-size="32" text-anchor="start">0.5B · B1 · O8 · two separate profiled captures</text></g></svg>
