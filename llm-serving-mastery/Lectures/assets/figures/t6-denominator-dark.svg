<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">A correct completed response is not the same as a useful arrival</title><desc id="desc">Invented six-arrival example:3complete,2correct,1correct and timely. Completed-only accuracy2/3 and correct+timely per arrival1/6 answer different questions. Six visible outcomes preserve three explicit failure terminals.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="35" y="45" fill="#becad4" font-size="32" text-anchor="start">Six intended arrivals; retain all six terminal records</text><rect x="35" y="100" width="205" height="120" rx="8" fill="#293744" stroke="#7addbb" stroke-width="3"/><text x="137.5" y="150.5" fill="#7addbb" font-size="34" text-anchor="middle">Correct</text><text x="137.5" y="191.5" fill="#f1f3ed" font-size="34" text-anchor="middle">timely</text><rect x="270" y="100" width="205" height="120" rx="8" fill="#293744" stroke="#ffae99" stroke-width="3"/><text x="372.5" y="150.5" fill="#ffae99" font-size="34" text-anchor="middle">Wrong</text><text x="372.5" y="191.5" fill="#f1f3ed" font-size="34" text-anchor="middle">timely</text><rect x="505" y="100" width="205" height="120" rx="8" fill="#293744" stroke="#ffcc79" stroke-width="3"/><text x="607.5" y="150.5" fill="#ffcc79" font-size="34" text-anchor="middle">Correct</text><text x="607.5" y="191.5" fill="#f1f3ed" font-size="34" text-anchor="middle">late</text><rect x="740" y="100" width="205" height="120" rx="8" fill="#293744" stroke="#ffae99" stroke-width="3"/><text x="842.5" y="150.5" fill="#ffae99" font-size="34" text-anchor="middle">Observed</text><text x="842.5" y="191.5" fill="#f1f3ed" font-size="34" text-anchor="middle">deadline</text><rect x="975" y="100" width="205" height="120" rx="8" fill="#293744" stroke="#ffae99" stroke-width="3"/><text x="1077.5" y="150.5" fill="#ffae99" font-size="34" text-anchor="middle">Observed</text><text x="1077.5" y="191.5" fill="#f1f3ed" font-size="34" text-anchor="middle">refusal</text><rect x="1210" y="100" width="205" height="120" rx="8" fill="#293744" stroke="#ffae99" stroke-width="3"/><text x="1312.5" y="150.5" fill="#ffae99" font-size="34" text-anchor="middle">Observed</text><text x="1312.5" y="191.5" fill="#f1f3ed" font-size="34" text-anchor="middle">cancel</text><text x="35" y="320" fill="#8cbcff" font-size="36" text-anchor="start">Complete-only accuracy: 2/3</text><text x="35" y="390" fill="#7addbb" font-size="36" text-anchor="start">Correct AND timely per arrival: 1/6</text><text x="35" y="455" fill="#becad4" font-size="30" text-anchor="start">Different denominators answer different product questions</text></g></svg>
