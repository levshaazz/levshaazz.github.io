<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Equal aggregate scores can hide different flips</title><desc id="desc">Of 200 paired prompts, 160 pass both, 10 pass only baseline, 4 pass only candidate, and 26 fail both. Baseline passes 170, candidate 164, net difference −6/200 = −3 percentage points. There are 14 discordant pairs, not 6.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="530" y="51" fill="#7addbb" font-size="34" text-anchor="start">Candidate pass</text><text x="1030" y="51" fill="#ffae99" font-size="34" text-anchor="start">Candidate fail</text><text x="25" y="154" fill="#f1f3ed" font-size="34" text-anchor="start">Baseline pass</text><text x="25" y="296" fill="#f1f3ed" font-size="34" text-anchor="start">Baseline fail</text><rect x="495" y="95" width="390" height="92" rx="8" fill="#293744" stroke="#7addbb" stroke-width="3"/><text x="690" y="152" fill="#7addbb" font-size="34" text-anchor="middle">160 pass both</text><rect x="980" y="95" width="415" height="92" rx="8" fill="#293744" stroke="#ffae99" stroke-width="3"/><text x="1187.5" y="152" fill="#ffae99" font-size="34" text-anchor="middle">10 regressions</text><rect x="495" y="238" width="390" height="92" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="690" y="295" fill="#8cbcff" font-size="34" text-anchor="middle">4 improvements</text><rect x="980" y="238" width="415" height="92" rx="8" fill="#293744" stroke="#becad4" stroke-width="3"/><text x="1187.5" y="295" fill="#becad4" font-size="34" text-anchor="middle">26 fail both</text><line x1="25" y1="368" x2="1410" y2="368" stroke="#becad4" stroke-width="4"/><text x="25" y="439" fill="#f1f3ed" font-size="32" text-anchor="start">Baseline 170/200; candidate 164/200; net (4 − 10)/200 = −3 pp</text></g></svg>
