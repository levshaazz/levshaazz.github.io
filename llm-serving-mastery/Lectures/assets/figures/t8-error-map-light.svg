<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Honest errors: every outcome maps to a code with a next action</title><desc id="desc">Four terminal outcomes and their honest HTTP answers. An invalid request (caps are public) becomes 400 bad request and the client fixes the input. An overloaded gateway (queue and pool full) becomes 429 with Retry-After and the client backs off, retrying with the same id. An engine with no healthy worker becomes 503 and the owner gets paged with the request id. A deadline exceeded (queue wait over budget) becomes 504 gateway timeout and the client retries or gives up — the id explains why. Nothing ever returns 200 with an error body.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="35" y="44" fill="#4b6070" font-size="31" text-anchor="start">Honest errors: every outcome maps to a code with a next action</text><text x="230" y="88" fill="#4b6070" font-size="30" text-anchor="middle">engine outcome</text><text x="680" y="88" fill="#4b6070" font-size="30" text-anchor="middle">honest code</text><text x="1170" y="88" fill="#4b6070" font-size="30" text-anchor="middle">client action</text><rect x="40" y="100" width="380" height="80" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="230" y="130.5" fill="#175cad" font-size="34" text-anchor="middle">invalid request</text><text x="230" y="171.5" fill="#172b35" font-size="34" text-anchor="middle">caps at the door</text><line x1="426" y1="140" x2="524" y2="140" stroke="#175cad" stroke-width="4"/><path d="M 510.8362615716444 147.19138307906306 L 524 140 L 510.8362615716444 132.80861692093694" fill="none" stroke="#175cad" stroke-width="4"/><rect x="530" y="100" width="300" height="80" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="680" y="130.5" fill="#175cad" font-size="34" text-anchor="middle">400</text><text x="680" y="171.5" fill="#172b35" font-size="34" text-anchor="middle">bad request</text><line x1="836" y1="140" x2="934" y2="140" stroke="#175cad" stroke-width="4"/><path d="M 920.8362615716444 147.19138307906306 L 934 140 L 920.8362615716444 132.80861692093694" fill="none" stroke="#175cad" stroke-width="4"/><rect x="940" y="100" width="460" height="80" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="1170" y="130.5" fill="#175cad" font-size="34" text-anchor="middle">fix the request</text><text x="1170" y="171.5" fill="#172b35" font-size="34" text-anchor="middle">then resend</text><rect x="40" y="188" width="380" height="80" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="230" y="218.5" fill="#175cad" font-size="34" text-anchor="middle">gateway overloaded</text><text x="230" y="259.5" fill="#172b35" font-size="34" text-anchor="middle">queue and pool full</text><line x1="426" y1="228" x2="524" y2="228" stroke="#175cad" stroke-width="4"/><path d="M 510.8362615716444 235.19138307906306 L 524 228 L 510.8362615716444 220.80861692093694" fill="none" stroke="#175cad" stroke-width="4"/><rect x="530" y="188" width="300" height="80" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="680" y="218.5" fill="#175cad" font-size="34" text-anchor="middle">429</text><text x="680" y="259.5" fill="#172b35" font-size="34" text-anchor="middle">+ Retry-After</text><line x1="836" y1="228" x2="934" y2="228" stroke="#175cad" stroke-width="4"/><path d="M 920.8362615716444 235.19138307906306 L 934 228 L 920.8362615716444 220.80861692093694" fill="none" stroke="#175cad" stroke-width="4"/><rect x="940" y="188" width="460" height="80" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="1170" y="218.5" fill="#175cad" font-size="34" text-anchor="middle">back off</text><text x="1170" y="259.5" fill="#172b35" font-size="34" text-anchor="middle">retry with the same id</text><rect x="40" y="276" width="380" height="80" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="230" y="306.5" fill="#175cad" font-size="34" text-anchor="middle">engine down</text><text x="230" y="347.5" fill="#172b35" font-size="34" text-anchor="middle">no healthy worker</text><line x1="426" y1="316" x2="524" y2="316" stroke="#175cad" stroke-width="4"/><path d="M 510.8362615716444 323.19138307906303 L 524 316 L 510.8362615716444 308.80861692093697" fill="none" stroke="#175cad" stroke-width="4"/><rect x="530" y="276" width="300" height="80" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="680" y="306.5" fill="#175cad" font-size="34" text-anchor="middle">503</text><text x="680" y="347.5" fill="#172b35" font-size="34" text-anchor="middle">unavailable</text><line x1="836" y1="316" x2="934" y2="316" stroke="#175cad" stroke-width="4"/><path d="M 920.8362615716444 323.19138307906303 L 934 316 L 920.8362615716444 308.80861692093697" fill="none" stroke="#175cad" stroke-width="4"/><rect x="940" y="276" width="460" height="80" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="1170" y="306.5" fill="#175cad" font-size="34" text-anchor="middle">page the owner</text><text x="1170" y="347.5" fill="#172b35" font-size="34" text-anchor="middle">keep the request id</text><rect x="40" y="364" width="380" height="80" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="230" y="394.5" fill="#175cad" font-size="34" text-anchor="middle">deadline exceeded</text><text x="230" y="435.5" fill="#172b35" font-size="34" text-anchor="middle">queue wait over budget</text><line x1="426" y1="404" x2="524" y2="404" stroke="#175cad" stroke-width="4"/><path d="M 510.8362615716444 411.19138307906303 L 524 404 L 510.8362615716444 396.80861692093697" fill="none" stroke="#175cad" stroke-width="4"/><rect x="530" y="364" width="300" height="80" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="680" y="394.5" fill="#175cad" font-size="34" text-anchor="middle">504</text><text x="680" y="435.5" fill="#172b35" font-size="34" text-anchor="middle">gateway timeout</text><line x1="836" y1="404" x2="934" y2="404" stroke="#175cad" stroke-width="4"/><path d="M 920.8362615716444 411.19138307906303 L 934 404 L 920.8362615716444 396.80861692093697" fill="none" stroke="#175cad" stroke-width="4"/><rect x="940" y="364" width="460" height="80" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="1170" y="394.5" fill="#175cad" font-size="34" text-anchor="middle">retry or give up</text><text x="1170" y="435.5" fill="#172b35" font-size="34" text-anchor="middle">the id explains why</text><text x="35" y="472" fill="#172b35" font-size="30" text-anchor="start">Never 200-with-error-body: the status code is the first truth a client reads</text></g></svg>
