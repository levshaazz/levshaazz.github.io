<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Four client timestamps answer different questions</title><desc id="desc">The illustrative stream sees heartbeat at0.01seconds, role at0.03, first content at0.10, second content at0.14, finish at0.15, usage at0.16 and DONE at0.17. First content is100milliseconds. Terminal completion is170milliseconds. No token gaps can be inferred from these event counts.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><line x1="120" y1="217" x2="1310" y2="217" stroke="#4b6070" stroke-width="4"/><circle cx="120" cy="217" r="8" fill="#175cad"/><line x1="120" y1="211" x2="120" y2="107" stroke="#4b6070" stroke-width="4"/><text x="120" y="90" fill="#172b35" font-size="32" text-anchor="middle">send</text><text x="120" y="142" fill="#4b6070" font-size="30" text-anchor="middle">0 ms</text><circle cx="330" cy="217" r="8" fill="#175cad"/><line x1="330" y1="211" x2="330" y2="182" stroke="#4b6070" stroke-width="4"/><text x="330" y="165" fill="#172b35" font-size="32" text-anchor="middle">role</text><text x="330" y="217" fill="#4b6070" font-size="30" text-anchor="middle">30 ms</text><circle cx="820" cy="217" r="8" fill="#175cad"/><line x1="820" y1="211" x2="820" y2="107" stroke="#4b6070" stroke-width="4"/><text x="820" y="90" fill="#172b35" font-size="32" text-anchor="middle">content</text><text x="820" y="142" fill="#4b6070" font-size="30" text-anchor="middle">100 ms</text><circle cx="1100" cy="217" r="8" fill="#175cad"/><line x1="1100" y1="211" x2="1100" y2="332" stroke="#4b6070" stroke-width="4"/><text x="1100" y="315" fill="#172b35" font-size="32" text-anchor="middle">content</text><text x="1100" y="367" fill="#4b6070" font-size="30" text-anchor="middle">140 ms</text><circle cx="1310" cy="217" r="8" fill="#146957"/><line x1="1310" y1="211" x2="1310" y2="107" stroke="#4b6070" stroke-width="4"/><text x="1310" y="90" fill="#172b35" font-size="32" text-anchor="middle">DONE</text><text x="1310" y="142" fill="#4b6070" font-size="30" text-anchor="middle">170 ms</text><text x="25" y="417" fill="#175cad" font-size="36" text-anchor="start">first content − send = 100 ms; DONE − send = 170 ms</text><text x="25" y="472" fill="#4b6070" font-size="30" text-anchor="start">The 40 ms between content events is not a per-token decode time.</text></g></svg>
