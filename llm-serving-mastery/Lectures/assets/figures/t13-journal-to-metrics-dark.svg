<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Journal → metrics → dashboard: the hash chain makes the ground truth provable</title><desc id="desc">Left: the append-only journal — three entries (seq 13 experiment, seq 14 burst, seq 15 burst) where every record seals the previous one by hash. Middle: aggregation into service metrics — p95 TTFT, tokens per second, rejections per minute. Right: the dashboard, honest only while the chain verifies. Bottom strip: a tampered log line fails verification — the chain names the first broken entry, so an edited history cannot feed a dashboard.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="35" y="44" fill="#becad4" font-size="31" text-anchor="start">logs you can prove: entries seal each other; the dashboard is downstream</text><rect x="60" y="84" width="340" height="84" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="230" y="116.5" fill="#8cbcff" font-size="34" text-anchor="middle"><tspan data-notation="code">seq 13</tspan></text><text x="230" y="157.5" fill="#f1f3ed" font-size="34" text-anchor="middle">experiment</text><rect x="60" y="184" width="340" height="84" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="230" y="216.5" fill="#8cbcff" font-size="34" text-anchor="middle"><tspan data-notation="code">seq 14</tspan></text><text x="230" y="257.5" fill="#f1f3ed" font-size="34" text-anchor="middle">burst</text><rect x="60" y="284" width="340" height="84" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="230" y="316.5" fill="#8cbcff" font-size="34" text-anchor="middle"><tspan data-notation="code">seq 15</tspan></text><text x="230" y="357.5" fill="#f1f3ed" font-size="34" text-anchor="middle">burst</text><line x1="230" y1="172" x2="230" y2="180" stroke="#8cbcff" stroke-width="4"/><path d="M 222.80861692093694 166.8362615716444 L 230 180 L 237.19138307906303 166.8362615716444" fill="none" stroke="#8cbcff" stroke-width="4"/><line x1="230" y1="272" x2="230" y2="280" stroke="#8cbcff" stroke-width="4"/><path d="M 222.80861692093694 266.8362615716444 L 230 280 L 237.19138307906303 266.8362615716444" fill="none" stroke="#8cbcff" stroke-width="4"/><line x1="404" y1="210" x2="576" y2="210" stroke="#8cbcff" stroke-width="4"/><path d="M 562.8362615716444 217.19138307906306 L 576 210 L 562.8362615716444 202.80861692093694" fill="none" stroke="#8cbcff" stroke-width="4"/><text x="404" y="250" fill="#becad4" font-size="30" text-anchor="start">aggregate per window</text><rect x="580" y="84" width="300" height="64" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="730" y="127" fill="#8cbcff" font-size="34" text-anchor="middle">p95 TTFT, s</text><rect x="580" y="168" width="300" height="64" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="730" y="211" fill="#8cbcff" font-size="34" text-anchor="middle">tok / s</text><rect x="580" y="252" width="300" height="64" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="730" y="295" fill="#8cbcff" font-size="34" text-anchor="middle">429 / min</text><line x1="884" y1="116" x2="934" y2="116" stroke="#8cbcff" stroke-width="4"/><path d="M 920.8362615716444 123.19138307906304 L 934 116 L 920.8362615716444 108.80861692093696" fill="none" stroke="#8cbcff" stroke-width="4"/><line x1="884" y1="200" x2="934" y2="200" stroke="#8cbcff" stroke-width="4"/><path d="M 920.8362615716444 207.19138307906306 L 934 200 L 920.8362615716444 192.80861692093694" fill="none" stroke="#8cbcff" stroke-width="4"/><line x1="884" y1="284" x2="934" y2="284" stroke="#8cbcff" stroke-width="4"/><path d="M 920.8362615716444 291.19138307906303 L 934 284 L 920.8362615716444 276.80861692093697" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="938" y="92" width="442" height="236" fill="#7addbb" opacity="0.1"/><rect x="956" y="120" width="406" height="64" rx="8" fill="#293744" stroke="#7addbb" stroke-width="3"/><text x="1159" y="163" fill="#7addbb" font-size="34" text-anchor="middle">dashboard</text><text x="956" y="240" fill="#f1f3ed" font-size="30" text-anchor="start">honest while the chain verifies</text><text x="956" y="286" fill="#becad4" font-size="30" text-anchor="start">ground truth, not memory</text><rect x="60" y="384" width="1318" height="84" fill="#ffae99" opacity="0.08"/><rect x="76" y="396" width="340" height="60" rx="8" fill="#293744" stroke="#ffae99" stroke-width="3"/><text x="246" y="437" fill="#ffae99" font-size="34" text-anchor="middle"><tspan data-notation="code">edited log line</tspan></text><line x1="420" y1="426" x2="520" y2="426" stroke="#ffae99" stroke-width="4"/><path d="M 506.8362615716444 433.19138307906303 L 520 426 L 506.8362615716444 418.80861692093697" fill="none" stroke="#ffae99" stroke-width="4"/><rect x="528" y="396" width="470" height="60" rx="8" fill="#293744" stroke="#ffae99" stroke-width="3"/><text x="763" y="437" fill="#ffae99" font-size="34" text-anchor="middle"><tspan data-notation="code">verify: broken_at=N</tspan></text><text x="1014" y="434" fill="#ffae99" font-size="30" text-anchor="start">the rewrite is detected</text></g></svg>
