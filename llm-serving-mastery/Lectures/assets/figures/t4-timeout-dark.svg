<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Timeouts identify clocks, not the guilty component</title><desc id="desc">A client policy can set a connection deadline, a maximum wait for first content, a maximum idle interval between progress events and a total deadline. These clocks overlap. A timeout records an incomplete attempt and must close the stream. Server cancellation requires separate confirmation.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="25" y="45" fill="#8cbcff" font-size="32" text-anchor="start">CLOCK</text><text x="375" y="45" fill="#8cbcff" font-size="32" text-anchor="start">INTERVAL</text><text x="1010" y="45" fill="#8cbcff" font-size="32" text-anchor="start">INVESTIGATION</text><text x="25" y="130" fill="#f1f3ed" font-size="32" text-anchor="start">connect</text><text x="375" y="130" fill="#f1f3ed" font-size="32" text-anchor="start">TCP/TLS establishment</text><text x="1010" y="130" fill="#f1f3ed" font-size="32" text-anchor="start">route or listener</text><line x1="25" y1="156" x2="1410" y2="156" stroke="#becad4" stroke-width="4"/><text x="25" y="221" fill="#f1f3ed" font-size="32" text-anchor="start">first content</text><text x="375" y="221" fill="#f1f3ed" font-size="32" text-anchor="start">send → first nonempty delta</text><text x="1010" y="221" fill="#f1f3ed" font-size="32" text-anchor="start">queue / engine / proxy</text><line x1="25" y1="247" x2="1410" y2="247" stroke="#becad4" stroke-width="4"/><text x="25" y="312" fill="#f1f3ed" font-size="32" text-anchor="start">idle read</text><text x="375" y="312" fill="#f1f3ed" font-size="32" text-anchor="start">time since transport progress</text><text x="1010" y="312" fill="#f1f3ed" font-size="32" text-anchor="start">stalled response</text><line x1="25" y1="338" x2="1410" y2="338" stroke="#becad4" stroke-width="4"/><text x="25" y="403" fill="#f1f3ed" font-size="32" text-anchor="start">total</text><text x="375" y="403" fill="#f1f3ed" font-size="32" text-anchor="start">send → terminal completion</text><text x="1010" y="403" fill="#f1f3ed" font-size="32" text-anchor="start">whole client deadline</text></g></svg>
