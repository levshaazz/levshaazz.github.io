<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Separate pages still need one global attention normalization</title><desc id="desc">Scalar query 1, keys 1, 2, 3, 4 and values 10, 20, 30, 40. Global attention output 34.926527. Averaging independently normalized two-page outputs gives 27.310586, a different operation.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><rect x="35" y="70" width="310" height="112" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="190" y="116.5" fill="#175cad" font-size="34" text-anchor="middle">K = 1; V = 10</text><text x="190" y="157.5" fill="#172b35" font-size="34" text-anchor="middle">weight 0.032059</text><rect x="385" y="70" width="310" height="112" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="540" y="116.5" fill="#175cad" font-size="34" text-anchor="middle">K = 2; V = 20</text><text x="540" y="157.5" fill="#172b35" font-size="34" text-anchor="middle">weight 0.087144</text><rect x="735" y="70" width="310" height="112" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="890" y="116.5" fill="#175cad" font-size="34" text-anchor="middle">K = 3; V = 30</text><text x="890" y="157.5" fill="#172b35" font-size="34" text-anchor="middle">weight 0.236883</text><rect x="1085" y="70" width="310" height="112" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="1240" y="116.5" fill="#175cad" font-size="34" text-anchor="middle">K = 4; V = 40</text><text x="1240" y="157.5" fill="#172b35" font-size="34" text-anchor="middle">weight 0.643914</text><text x="35" y="245" fill="#172b35" font-size="34" text-anchor="start">Local outputs: 17.310586 and 37.310586</text><text x="35" y="310" fill="#175cad" font-size="32" text-anchor="start">Page masses: 0.119203 and 0.880797, NOT 0.5 each</text><text x="35" y="375" fill="#172b35" font-size="32" text-anchor="start">Mass-weighted merge: 34.926527; equal average: 27.310586</text><text x="35" y="450" fill="#89540a" font-size="32" text-anchor="start">Use one global normalizer; do not average page outputs</text></g></svg>
