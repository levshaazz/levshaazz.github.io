<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Four sequences advance on each batch step</title><desc id="desc">Batch one produces 31 post-first tokens in median 839.2 ms: 36.9 tokens/s, mean step 27.1 ms. Batch four produces 124 in median 799.1 ms: 155.2 tokens/s, mean step 25.8 ms. Cadence ranges overlap: 26.9–40.5 and 24.6–38.7 ms.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="30" y="42" fill="#8cbcff" font-size="36" text-anchor="start">Batch 1: 1 token each step</text><line x1="130" y1="88" x2="550" y2="88" stroke="#8cbcff" stroke-width="4"/><circle cx="130" cy="88" r="8" fill="#8cbcff"/><circle cx="270" cy="88" r="8" fill="#8cbcff"/><circle cx="410" cy="88" r="8" fill="#8cbcff"/><circle cx="550" cy="88" r="8" fill="#8cbcff"/><text x="30" y="269" fill="#8cbcff" font-size="34" text-anchor="start">31 / 0.8392 s = 36.9 tok/s</text><text x="30" y="333" fill="#f1f3ed" font-size="36" text-anchor="start">Mean step: 27.1 ms</text><text x="30" y="389" fill="#becad4" font-size="32" text-anchor="start">Range: 26.9–40.5 ms</text><text x="765" y="42" fill="#7addbb" font-size="36" text-anchor="start">Batch 4: 4 tokens each step</text><line x1="865" y1="88" x2="1285" y2="88" stroke="#7addbb" stroke-width="4"/><circle cx="865" cy="88" r="8" fill="#7addbb"/><circle cx="1005" cy="88" r="8" fill="#7addbb"/><circle cx="1145" cy="88" r="8" fill="#7addbb"/><circle cx="1285" cy="88" r="8" fill="#7addbb"/><line x1="865" y1="124" x2="1285" y2="124" stroke="#7addbb" stroke-width="4"/><circle cx="865" cy="124" r="8" fill="#7addbb"/><circle cx="1005" cy="124" r="8" fill="#7addbb"/><circle cx="1145" cy="124" r="8" fill="#7addbb"/><circle cx="1285" cy="124" r="8" fill="#7addbb"/><line x1="865" y1="160" x2="1285" y2="160" stroke="#7addbb" stroke-width="4"/><circle cx="865" cy="160" r="8" fill="#7addbb"/><circle cx="1005" cy="160" r="8" fill="#7addbb"/><circle cx="1145" cy="160" r="8" fill="#7addbb"/><circle cx="1285" cy="160" r="8" fill="#7addbb"/><line x1="865" y1="196" x2="1285" y2="196" stroke="#7addbb" stroke-width="4"/><circle cx="865" cy="196" r="8" fill="#7addbb"/><circle cx="1005" cy="196" r="8" fill="#7addbb"/><circle cx="1145" cy="196" r="8" fill="#7addbb"/><circle cx="1285" cy="196" r="8" fill="#7addbb"/><text x="765" y="269" fill="#7addbb" font-size="34" text-anchor="start">124 / 0.7991 s = 155.2 tok/s</text><text x="765" y="333" fill="#f1f3ed" font-size="36" text-anchor="start">Mean step: 25.8 ms</text><text x="765" y="389" fill="#becad4" font-size="32" text-anchor="start">Range: 24.6–38.7 ms</text><text x="30" y="465" fill="#f1f3ed" font-size="38" text-anchor="start">Question: did one sequence become four times faster?</text></g></svg>
