<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Interleaved tenants pay a swap per turn; grouped tenants pay one</title><desc id="desc">Declared teaching timeline on a 1440 by 480 canvas. The upper row shows an interleaved request stream A, B, A, B, A, B: every tenant change carries a red swap marker, six requests finish in six service slots plus five swaps. The lower row shows the same six requests grouped by tenant: A A A then B B B, with a single red swap marker between the groups. The declared swap cost is 2 ms per change.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="35" y="52" fill="#becad4" font-size="31" text-anchor="start">the same six requests, two policies — swaps are the difference</text><text x="120" y="116" fill="#f1f3ed" font-size="30" text-anchor="start">interleaved</text><rect x="380" y="86" width="100" height="54" fill="#8cbcff" opacity="0.9"/><text x="430" y="124" fill="#f1f3ed" font-size="32" text-anchor="middle">A</text><rect x="530" y="86" width="100" height="54" fill="#8cbcff" opacity="0.9"/><text x="580" y="124" fill="#f1f3ed" font-size="32" text-anchor="middle">B</text><line x1="505" y1="113" x2="505" y2="152" stroke="#ffae99" stroke-width="4" stroke-dasharray="10 8"/><rect x="680" y="86" width="100" height="54" fill="#8cbcff" opacity="0.9"/><text x="730" y="124" fill="#f1f3ed" font-size="32" text-anchor="middle">A</text><line x1="655" y1="113" x2="655" y2="152" stroke="#ffae99" stroke-width="4" stroke-dasharray="10 8"/><rect x="830" y="86" width="100" height="54" fill="#8cbcff" opacity="0.9"/><text x="880" y="124" fill="#f1f3ed" font-size="32" text-anchor="middle">B</text><line x1="805" y1="113" x2="805" y2="152" stroke="#ffae99" stroke-width="4" stroke-dasharray="10 8"/><rect x="980" y="86" width="100" height="54" fill="#8cbcff" opacity="0.9"/><text x="1030" y="124" fill="#f1f3ed" font-size="32" text-anchor="middle">A</text><line x1="955" y1="113" x2="955" y2="152" stroke="#ffae99" stroke-width="4" stroke-dasharray="10 8"/><rect x="1130" y="86" width="100" height="54" fill="#8cbcff" opacity="0.9"/><text x="1180" y="124" fill="#f1f3ed" font-size="32" text-anchor="middle">B</text><line x1="1105" y1="113" x2="1105" y2="152" stroke="#ffae99" stroke-width="4" stroke-dasharray="10 8"/><text x="1310" y="116" fill="#ffae99" font-size="30" text-anchor="start">5 swaps</text><text x="120" y="262" fill="#f1f3ed" font-size="30" text-anchor="start">grouped</text><rect x="380" y="232" width="100" height="54" fill="#7addbb" opacity="0.9"/><text x="430" y="270" fill="#f1f3ed" font-size="32" text-anchor="middle">A</text><rect x="530" y="232" width="100" height="54" fill="#7addbb" opacity="0.9"/><text x="580" y="270" fill="#f1f3ed" font-size="32" text-anchor="middle">A</text><rect x="680" y="232" width="100" height="54" fill="#7addbb" opacity="0.9"/><text x="730" y="270" fill="#f1f3ed" font-size="32" text-anchor="middle">A</text><rect x="830" y="232" width="100" height="54" fill="#7addbb" opacity="0.9"/><text x="880" y="270" fill="#f1f3ed" font-size="32" text-anchor="middle">B</text><rect x="980" y="232" width="100" height="54" fill="#7addbb" opacity="0.9"/><text x="1030" y="270" fill="#f1f3ed" font-size="32" text-anchor="middle">B</text><rect x="1130" y="232" width="100" height="54" fill="#7addbb" opacity="0.9"/><text x="1180" y="270" fill="#f1f3ed" font-size="32" text-anchor="middle">B</text><line x1="730" y1="222" x2="730" y2="296" stroke="#ffae99" stroke-width="4" stroke-dasharray="10 8"/><text x="730" y="330" fill="#ffae99" font-size="30" text-anchor="middle">1 swap</text><text x="1310" y="262" fill="#7addbb" font-size="30" text-anchor="start">1 swap</text><rect x="120" y="340" width="1180" height="92" fill="#293744" opacity="0.8"/><text x="140" y="378" fill="#f1f3ed" font-size="30" text-anchor="start">declared swap cost: 2 ms per adapter load — the 491 MB base</text><text x="140" y="416" fill="#f1f3ed" font-size="30" text-anchor="start">never moves, only the 0.22 MB adapter changes</text><text x="35" y="452" fill="#becad4" font-size="30" text-anchor="start">grouping is not free either: requests wait for their tenant batch — the capstone prices that trade</text></g></svg>
