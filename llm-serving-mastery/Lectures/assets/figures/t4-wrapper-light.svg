<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">JSON roles become a model-specific token sequence</title><desc id="desc">The client sends a user role and content. The pinned tokenizer renders system, user and assistant generation markers. Tokenization produces an integer sequence. The historical ordinary prompt count was41, but the old public record did not retain its exact token IDs.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><rect x="25" y="82" width="400" height="126" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="225" y="135.5" fill="#175cad" font-size="34" text-anchor="middle">JSON message</text><text x="225" y="176.5" fill="#172b35" font-size="34" text-anchor="middle">role + content</text><line x1="445" y1="145" x2="508" y2="145" stroke="#175cad" stroke-width="4"/><path d="M 494.8362615716444 152.19138307906306 L 508 145 L 494.8362615716444 137.80861692093694" fill="none" stroke="#175cad" stroke-width="4"/><rect x="530" y="82" width="400" height="126" rx="8" fill="#e6edf3" stroke="#89540a" stroke-width="3"/><text x="730" y="135.5" fill="#89540a" font-size="34" text-anchor="middle">chat template</text><text x="730" y="176.5" fill="#172b35" font-size="34" text-anchor="middle">roles + delimiters</text><line x1="950" y1="145" x2="1010" y2="145" stroke="#175cad" stroke-width="4"/><path d="M 996.8362615716444 152.19138307906306 L 1010 145 L 996.8362615716444 137.80861692093694" fill="none" stroke="#175cad" stroke-width="4"/><rect x="1030" y="82" width="378" height="126" rx="8" fill="#e6edf3" stroke="#146957" stroke-width="3"/><text x="1219" y="135.5" fill="#146957" font-size="34" text-anchor="middle">tokenizer</text><text x="1219" y="176.5" fill="#172b35" font-size="34" text-anchor="middle">integer token IDs</text><text x="25" y="285" fill="#172b35" font-size="34" text-anchor="start">The model consumes IDs, not the JSON braces or HTTP headers.</text><text x="25" y="361" fill="#175cad" font-size="38" text-anchor="start">Historical ordinary request: 41 prompt tokens</text><text x="25" y="446" fill="#4b6070" font-size="32" text-anchor="start">A count is insufficient to recover the exact original ID sequence.</text></g></svg>
