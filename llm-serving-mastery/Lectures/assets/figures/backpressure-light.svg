<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Admission protects a bounded worker</title><desc id="desc">Eight service slots and sixteen waiting slots admit at most twenty-four of sixty-four simultaneous requests. Forty are rejected early. The model assumes equal jobs and FIFO waves, not GPU batching.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><rect x="30" y="160" width="230" height="120" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="145" y="210.5" fill="#175cad" font-size="34" text-anchor="middle">64 arrivals</text><text x="145" y="251.5" fill="#172b35" font-size="34" text-anchor="middle">one burst</text><line x1="280" y1="220" x2="360" y2="220" stroke="#175cad" stroke-width="4"/><path d="M 346.8362615716444 227.19138307906306 L 360 220 L 346.8362615716444 212.80861692093694" fill="none" stroke="#175cad" stroke-width="4"/><rect x="380" y="70" width="300" height="110" rx="8" fill="#e6edf3" stroke="#89540a" stroke-width="3"/><text x="530" y="115.5" fill="#89540a" font-size="34" text-anchor="middle">16 waiting</text><text x="530" y="156.5" fill="#172b35" font-size="34" text-anchor="middle">queue cap</text><rect x="380" y="260" width="300" height="110" rx="8" fill="#e6edf3" stroke="#af372b" stroke-width="3"/><text x="530" y="305.5" fill="#af372b" font-size="34" text-anchor="middle">40 rejected</text><text x="530" y="346.5" fill="#172b35" font-size="34" text-anchor="middle">retry policy</text><line x1="700" y1="125" x2="880" y2="125" stroke="#175cad" stroke-width="4"/><path d="M 866.8362615716444 132.19138307906306 L 880 125 L 866.8362615716444 117.80861692093696" fill="none" stroke="#175cad" stroke-width="4"/><rect x="900" y="70" width="420" height="110" rx="8" fill="#e6edf3" stroke="#146957" stroke-width="3"/><text x="1110" y="115.5" fill="#146957" font-size="34" text-anchor="middle">8 service slots</text><text x="1110" y="156.5" fill="#172b35" font-size="34" text-anchor="middle">fixed capacity</text><text x="900" y="320" fill="#172b35" font-size="38" text-anchor="start">24 admitted maximum</text><text x="380" y="440" fill="#4b6070" font-size="34" text-anchor="start">A queue stores work; it does not add service capacity</text></g></svg>
