<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Valid labels can still be wrong</title><desc id="desc">Twelve handwritten ticket cases: all twelve valid, six correct. Rows are gold billing/access/bug; columns are predicted billing/access/bug/invalid. Counts are [[0,3,1,0],[0,4,0,0],[0,2,2,0]]. This is historical Transformers evidence, not fresh vLLM quality.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="540" y="65" fill="#175cad" font-size="30" text-anchor="middle">billing</text><text x="765" y="65" fill="#175cad" font-size="30" text-anchor="middle">access</text><text x="990" y="65" fill="#175cad" font-size="30" text-anchor="middle">bug</text><text x="1215" y="65" fill="#175cad" font-size="30" text-anchor="middle">invalid</text><text x="255" y="155" fill="#172b35" font-size="32" text-anchor="end">billing</text><rect x="445" y="105" width="190" height="75" fill="#4b6070" opacity="1"/><text x="540" y="155" fill="#faf9f5" font-size="36" text-anchor="middle">0</text><rect x="670" y="105" width="190" height="75" fill="#146957" opacity="1"/><text x="765" y="155" fill="#faf9f5" font-size="36" text-anchor="middle">3</text><rect x="895" y="105" width="190" height="75" fill="#146957" opacity="1"/><text x="990" y="155" fill="#faf9f5" font-size="36" text-anchor="middle">1</text><rect x="1120" y="105" width="190" height="75" fill="#4b6070" opacity="1"/><text x="1215" y="155" fill="#faf9f5" font-size="36" text-anchor="middle">0</text><text x="255" y="250" fill="#172b35" font-size="32" text-anchor="end">access</text><rect x="445" y="200" width="190" height="75" fill="#4b6070" opacity="1"/><text x="540" y="250" fill="#faf9f5" font-size="36" text-anchor="middle">0</text><rect x="670" y="200" width="190" height="75" fill="#146957" opacity="1"/><text x="765" y="250" fill="#faf9f5" font-size="36" text-anchor="middle">4</text><rect x="895" y="200" width="190" height="75" fill="#4b6070" opacity="1"/><text x="990" y="250" fill="#faf9f5" font-size="36" text-anchor="middle">0</text><rect x="1120" y="200" width="190" height="75" fill="#4b6070" opacity="1"/><text x="1215" y="250" fill="#faf9f5" font-size="36" text-anchor="middle">0</text><text x="255" y="345" fill="#172b35" font-size="32" text-anchor="end">bug</text><rect x="445" y="295" width="190" height="75" fill="#4b6070" opacity="1"/><text x="540" y="345" fill="#faf9f5" font-size="36" text-anchor="middle">0</text><rect x="670" y="295" width="190" height="75" fill="#146957" opacity="1"/><text x="765" y="345" fill="#faf9f5" font-size="36" text-anchor="middle">2</text><rect x="895" y="295" width="190" height="75" fill="#146957" opacity="1"/><text x="990" y="345" fill="#faf9f5" font-size="36" text-anchor="middle">2</text><rect x="1120" y="295" width="190" height="75" fill="#4b6070" opacity="1"/><text x="1215" y="345" fill="#faf9f5" font-size="36" text-anchor="middle">0</text><text x="25" y="420" fill="#172b35" font-size="32" text-anchor="start">True label: rows</text><text x="700" y="420" fill="#172b35" font-size="32" text-anchor="start">Predicted label: columns</text><text x="25" y="466" fill="#175cad" font-size="32" text-anchor="start">Correct 6/12 = 50%</text><text x="700" y="466" fill="#175cad" font-size="32" text-anchor="start">Valid 12/12 = 100%</text></g></svg>
