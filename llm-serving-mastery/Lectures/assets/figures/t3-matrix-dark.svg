<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">The entire tiny projection fits on the page</title><desc id="desc">Weight matrix has two outputs and four input features. Row 0 is [−1.83, −0.52, 0.24, 2.25]. Row 1 is [0.13, −0.88, 1.12, −2.40]. Input is [1, −2, 0.5, 1.5]. Scale 0.25 yields codes [−7, −2, 1, 7] and [1, −4, 4, −8].</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="25" y="45" fill="#8cbcff" font-size="36" text-anchor="start">x = [1, -2, 0.500, 1.500];  y = W @ x</text><text x="25" y="128" fill="#f1f3ed" font-size="34" text-anchor="start">W[0] = [-1.830, -0.520, 0.240, 2.250]</text><text x="25" y="197" fill="#f1f3ed" font-size="34" text-anchor="start">W[1] = [0.130, -0.880, 1.120, -2.400]</text><line x1="25" y1="236" x2="1410" y2="236" stroke="#becad4" stroke-width="4"/><text x="25" y="305" fill="#ffcc79" font-size="34" text-anchor="start">Q[0] = [-7, -2, 1, 7]     Q[1] = [1, -4, 4, -8]</text><text x="25" y="382" fill="#7addbb" font-size="34" text-anchor="start">Ŵ[0] = [-1.750, -0.500, 0.250, 1.750]</text><text x="25" y="452" fill="#7addbb" font-size="34" text-anchor="start">Ŵ[1] = [0.250, -1, 1, -2]</text></g></svg>
