<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">A streaming parser keeps state across reads</title><desc id="desc">Bytes flow through an incremental UTF8 decoder into a line buffer. Complete lines feed an SSE event buffer. A blank line dispatches an event, whose data is JSON or DONE. JSON updates role, content, finish reason and usage state. EOF does not finish an incomplete event.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><rect x="25" y="104" width="306" height="118" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="178" y="153.5" fill="#8cbcff" font-size="34" text-anchor="middle">bytes</text><text x="178" y="194.5" fill="#f1f3ed" font-size="34" text-anchor="middle">UTF-8 decoder</text><line x1="342" y1="164" x2="369" y2="164" stroke="#8cbcff" stroke-width="4"/><path d="M 355.8362615716444 171.19138307906306 L 369 164 L 355.8362615716444 156.80861692093694" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="381" y="104" width="306" height="118" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="534" y="153.5" fill="#8cbcff" font-size="34" text-anchor="middle">text</text><text x="534" y="194.5" fill="#f1f3ed" font-size="34" text-anchor="middle">line buffer</text><line x1="698" y1="164" x2="725" y2="164" stroke="#8cbcff" stroke-width="4"/><path d="M 711.8362615716444 171.19138307906306 L 725 164 L 711.8362615716444 156.80861692093694" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="737" y="104" width="306" height="118" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="890" y="153.5" fill="#8cbcff" font-size="34" text-anchor="middle">lines</text><text x="890" y="194.5" fill="#f1f3ed" font-size="34" text-anchor="middle">SSE event</text><line x1="1054" y1="164" x2="1081" y2="164" stroke="#8cbcff" stroke-width="4"/><path d="M 1067.8362615716444 171.19138307906306 L 1081 164 L 1067.8362615716444 156.80861692093694" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="1093" y="104" width="306" height="118" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="1246" y="153.5" fill="#8cbcff" font-size="34" text-anchor="middle">data</text><text x="1246" y="194.5" fill="#f1f3ed" font-size="34" text-anchor="middle">JSON / DONE</text><text x="25" y="302" fill="#8cbcff" font-size="34" text-anchor="start">Blank line → dispatch buffered data. Comment line → ignore.</text><text x="25" y="375" fill="#ffae99" font-size="34" text-anchor="start">EOF mid-event → keep partial status; never invent a terminator.</text><text x="25" y="453" fill="#f1f3ed" font-size="34" text-anchor="start">Then update: content, finish_reason, usage, done, error.</text></g></svg>
