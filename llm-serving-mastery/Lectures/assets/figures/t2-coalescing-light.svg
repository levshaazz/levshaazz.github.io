<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Useful bytes and transferred bytes can differ</title><desc id="desc">Four neighboring threads access four adjacent useful elements in one conceptual memory segment. Four scattered accesses span four segments instead. The useful payload is the same but the fetched footprint can differ.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="25" y="45" fill="#172b35" font-size="34" text-anchor="start">Adjacent requests</text><text x="150" y="118" fill="#175cad" font-size="34" text-anchor="middle">t0</text><line x1="150" y1="135" x2="150" y2="205" stroke="#175cad" stroke-width="4"/><path d="M 142.80861692093694 191.8362615716444 L 150 205 L 157.19138307906303 191.8362615716444" fill="none" stroke="#175cad" stroke-width="4"/><rect x="98" y="225" width="100" height="70" fill="#175cad" opacity="1"/><text x="265" y="118" fill="#175cad" font-size="34" text-anchor="middle">t1</text><line x1="265" y1="135" x2="265" y2="205" stroke="#175cad" stroke-width="4"/><path d="M 257.80861692093697 191.8362615716444 L 265 205 L 272.19138307906303 191.8362615716444" fill="none" stroke="#175cad" stroke-width="4"/><rect x="213" y="225" width="100" height="70" fill="#175cad" opacity="1"/><text x="380" y="118" fill="#175cad" font-size="34" text-anchor="middle">t2</text><line x1="380" y1="135" x2="380" y2="205" stroke="#175cad" stroke-width="4"/><path d="M 372.80861692093697 191.8362615716444 L 380 205 L 387.19138307906303 191.8362615716444" fill="none" stroke="#175cad" stroke-width="4"/><rect x="328" y="225" width="100" height="70" fill="#175cad" opacity="1"/><text x="495" y="118" fill="#175cad" font-size="34" text-anchor="middle">t3</text><line x1="495" y1="135" x2="495" y2="205" stroke="#175cad" stroke-width="4"/><path d="M 487.80861692093697 191.8362615716444 L 495 205 L 502.19138307906303 191.8362615716444" fill="none" stroke="#175cad" stroke-width="4"/><rect x="443" y="225" width="100" height="70" fill="#175cad" opacity="1"/><text x="780" y="45" fill="#172b35" font-size="34" text-anchor="start">Scattered requests</text><rect x="780" y="225" width="125" height="70" fill="#e6edf3" opacity="1"/><rect x="780" y="225" width="28" height="70" fill="#89540a" opacity="1"/><text x="794" y="118" fill="#89540a" font-size="34" text-anchor="middle">t0</text><line x1="794" y1="135" x2="794" y2="205" stroke="#175cad" stroke-width="4"/><path d="M 786.808616920937 191.8362615716444 L 794 205 L 801.191383079063 191.8362615716444" fill="none" stroke="#175cad" stroke-width="4"/><rect x="925" y="225" width="125" height="70" fill="#e6edf3" opacity="1"/><rect x="925" y="225" width="28" height="70" fill="#89540a" opacity="1"/><text x="939" y="118" fill="#89540a" font-size="34" text-anchor="middle">t1</text><line x1="939" y1="135" x2="939" y2="205" stroke="#175cad" stroke-width="4"/><path d="M 931.808616920937 191.8362615716444 L 939 205 L 946.191383079063 191.8362615716444" fill="none" stroke="#175cad" stroke-width="4"/><rect x="1070" y="225" width="125" height="70" fill="#e6edf3" opacity="1"/><rect x="1070" y="225" width="28" height="70" fill="#89540a" opacity="1"/><text x="1084" y="118" fill="#89540a" font-size="34" text-anchor="middle">t2</text><line x1="1084" y1="135" x2="1084" y2="205" stroke="#175cad" stroke-width="4"/><path d="M 1076.8086169209369 191.8362615716444 L 1084 205 L 1091.1913830790631 191.8362615716444" fill="none" stroke="#175cad" stroke-width="4"/><rect x="1215" y="225" width="125" height="70" fill="#e6edf3" opacity="1"/><rect x="1215" y="225" width="28" height="70" fill="#89540a" opacity="1"/><text x="1229" y="118" fill="#89540a" font-size="34" text-anchor="middle">t3</text><line x1="1229" y1="135" x2="1229" y2="205" stroke="#175cad" stroke-width="4"/><path d="M 1221.8086169209369 191.8362615716444 L 1229 205 L 1236.1913830790631 191.8362615716444" fill="none" stroke="#175cad" stroke-width="4"/><text x="25" y="397" fill="#172b35" font-size="38" text-anchor="start">Same four useful elements; different fetched footprint.</text></g></svg>
