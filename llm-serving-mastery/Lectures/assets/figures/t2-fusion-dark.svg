<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Fusion removes intermediate memory trips</title><desc id="desc">Three elementwise stages over N elements materialize two intermediates: read X, write A, read A, write B, read B, write Y gives six N element transfers. Fusing stages can reduce this to read X and write Y, two N transfers.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><rect x="30" y="55" width="290" height="95" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="175" y="113.5" fill="#8cbcff" font-size="34" text-anchor="middle">X</text><line x1="330" y1="103" x2="365" y2="103" stroke="#8cbcff" stroke-width="4"/><path d="M 351.8362615716444 110.19138307906304 L 365 103 L 351.8362615716444 95.80861692093696" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="380" y="55" width="290" height="95" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="525" y="113.5" fill="#8cbcff" font-size="34" text-anchor="middle">f₁ → A</text><line x1="680" y1="103" x2="715" y2="103" stroke="#8cbcff" stroke-width="4"/><path d="M 701.8362615716444 110.19138307906304 L 715 103 L 701.8362615716444 95.80861692093696" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="730" y="55" width="290" height="95" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="875" y="113.5" fill="#8cbcff" font-size="34" text-anchor="middle">f₂ → B</text><line x1="1030" y1="103" x2="1065" y2="103" stroke="#8cbcff" stroke-width="4"/><path d="M 1051.8362615716444 110.19138307906304 L 1065 103 L 1051.8362615716444 95.80861692093696" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="1080" y="55" width="290" height="95" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="1225" y="113.5" fill="#8cbcff" font-size="34" text-anchor="middle">f₃ → Y</text><rect x="30" y="260" width="385" height="95" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="222.5" y="318.5" fill="#8cbcff" font-size="34" text-anchor="middle">X</text><line x1="425" y1="308" x2="480" y2="308" stroke="#8cbcff" stroke-width="4"/><path d="M 466.8362615716444 315.19138307906303 L 480 308 L 466.8362615716444 300.80861692093697" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="495" y="260" width="385" height="95" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="687.5" y="318.5" fill="#8cbcff" font-size="34" text-anchor="middle">f₁ + f₂ + f₃</text><line x1="890" y1="308" x2="945" y2="308" stroke="#8cbcff" stroke-width="4"/><path d="M 931.8362615716444 315.19138307906303 L 945 308 L 931.8362615716444 300.80861692093697" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="960" y="260" width="385" height="95" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="1152.5" y="318.5" fill="#8cbcff" font-size="34" text-anchor="middle">Y</text><text x="30" y="195" fill="#ffae99" font-size="36" text-anchor="start">Unfused: 6N element transfers</text><text x="30" y="445" fill="#7addbb" font-size="36" text-anchor="start">Fused: 2N element transfers</text></g></svg>
