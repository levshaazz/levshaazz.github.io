<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Equal request counts can hide unequal work</title><desc id="desc">Each worker has two requests. Worker A has two 128-token prompts, total 256 input tokens. Worker B has two 4096-token prompts, total 8192 input tokens. Counts match, token work differs by thirty-two times; runtime need not differ by that factor.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><rect x="35" y="55" width="290" height="110" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="180" y="100.5" fill="#175cad" font-size="34" text-anchor="middle">Worker A</text><text x="180" y="141.5" fill="#172b35" font-size="34" text-anchor="middle">2 requests</text><rect x="35" y="240" width="290" height="110" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="180" y="285.5" fill="#175cad" font-size="34" text-anchor="middle">Worker B</text><text x="180" y="326.5" fill="#172b35" font-size="34" text-anchor="middle">2 requests</text><rect x="400" y="75" width="28" height="55" fill="#146957" opacity="1"/><rect x="400" y="260" width="896" height="55" fill="#89540a" opacity="1"/><text x="460" y="120" fill="#146957" font-size="38" text-anchor="start">128 + 128 = 256 input tokens</text><text x="850" y="375" fill="#89540a" font-size="38" text-anchor="middle">4096 + 4096 = 8192 input tokens</text><text x="720" y="462" fill="#172b35" font-size="42" text-anchor="middle">Same count; 32× input-token demand</text></g></svg>
