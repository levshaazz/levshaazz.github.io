<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">The same NF4 code means different weights in different blocks</title><desc id="desc">Two invented blocks with maximum magnitudes two and eight both contain a weight equal to twelve percent of the maximum. Both normalized values .12 select NF4 level .0795803, zero-based code eight. Multiplying by each block maximum restores .159161 and .636642 respectively.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="145" y="55" fill="#172b35" font-size="30" text-anchor="middle">Block absmax</text><text x="425" y="55" fill="#172b35" font-size="30" text-anchor="middle">Original weight</text><text x="705" y="55" fill="#172b35" font-size="30" text-anchor="middle">Normalize</text><text x="985" y="55" fill="#172b35" font-size="30" text-anchor="middle">Code / level</text><text x="1265" y="55" fill="#172b35" font-size="30" text-anchor="middle">Reconstruct</text><rect x="15" y="130" width="260" height="85" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="145" y="183.5" fill="#175cad" font-size="34" text-anchor="middle">2</text><line x1="276" y1="172" x2="292" y2="172" stroke="#175cad" stroke-width="4"/><path d="M 278.8362615716444 179.19138307906306 L 292 172 L 278.8362615716444 164.80861692093694" fill="none" stroke="#175cad" stroke-width="4"/><rect x="295" y="130" width="260" height="85" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="425" y="183.5" fill="#175cad" font-size="34" text-anchor="middle">.24</text><line x1="556" y1="172" x2="572" y2="172" stroke="#175cad" stroke-width="4"/><path d="M 558.8362615716444 179.19138307906306 L 572 172 L 558.8362615716444 164.80861692093694" fill="none" stroke="#175cad" stroke-width="4"/><rect x="575" y="130" width="260" height="85" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="705" y="183.5" fill="#175cad" font-size="34" text-anchor="middle">.12</text><line x1="836" y1="172" x2="852" y2="172" stroke="#175cad" stroke-width="4"/><path d="M 838.8362615716444 179.19138307906306 L 852 172 L 838.8362615716444 164.80861692093694" fill="none" stroke="#175cad" stroke-width="4"/><rect x="855" y="130" width="260" height="85" rx="8" fill="#e6edf3" stroke="#146957" stroke-width="3"/><text x="985" y="183.5" fill="#146957" font-size="34" text-anchor="middle">8 / .07958</text><line x1="1116" y1="172" x2="1132" y2="172" stroke="#175cad" stroke-width="4"/><path d="M 1118.8362615716444 179.19138307906306 L 1132 172 L 1118.8362615716444 164.80861692093694" fill="none" stroke="#175cad" stroke-width="4"/><rect x="1135" y="130" width="260" height="85" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="1265" y="183.5" fill="#175cad" font-size="34" text-anchor="middle">.15916</text><rect x="15" y="270" width="260" height="85" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="145" y="323.5" fill="#175cad" font-size="34" text-anchor="middle">8</text><line x1="276" y1="312" x2="292" y2="312" stroke="#175cad" stroke-width="4"/><path d="M 278.8362615716444 319.19138307906303 L 292 312 L 278.8362615716444 304.80861692093697" fill="none" stroke="#175cad" stroke-width="4"/><rect x="295" y="270" width="260" height="85" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="425" y="323.5" fill="#175cad" font-size="34" text-anchor="middle">.96</text><line x1="556" y1="312" x2="572" y2="312" stroke="#175cad" stroke-width="4"/><path d="M 558.8362615716444 319.19138307906303 L 572 312 L 558.8362615716444 304.80861692093697" fill="none" stroke="#175cad" stroke-width="4"/><rect x="575" y="270" width="260" height="85" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="705" y="323.5" fill="#175cad" font-size="34" text-anchor="middle">.12</text><line x1="836" y1="312" x2="852" y2="312" stroke="#175cad" stroke-width="4"/><path d="M 838.8362615716444 319.19138307906303 L 852 312 L 838.8362615716444 304.80861692093697" fill="none" stroke="#175cad" stroke-width="4"/><rect x="855" y="270" width="260" height="85" rx="8" fill="#e6edf3" stroke="#146957" stroke-width="3"/><text x="985" y="323.5" fill="#146957" font-size="34" text-anchor="middle">8 / .07958</text><line x1="1116" y1="312" x2="1132" y2="312" stroke="#175cad" stroke-width="4"/><path d="M 1118.8362615716444 319.19138307906303 L 1132 312 L 1118.8362615716444 304.80861692093697" fill="none" stroke="#175cad" stroke-width="4"/><rect x="1135" y="270" width="260" height="85" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="1265" y="323.5" fill="#175cad" font-size="34" text-anchor="middle">.63664</text><text x="720" y="455" fill="#172b35" font-size="32" text-anchor="middle">Same 4-bit index; different block scale; different restored weight</text></g></svg>
