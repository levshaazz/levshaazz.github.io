<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Cancellation and release acknowledgement</title><desc id="desc">Client disconnect detected at 120 ms, gateway forwards cancellation at 125 ms, scheduler removes the sequence at 140 ms, worker releases request state at 145 ms. These constructed times imply a 25 ms release lag.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><rect x="50" y="90" width="240" height="100" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="170" y="130.5" fill="#8cbcff" font-size="34" text-anchor="middle">Client</text><text x="170" y="171.5" fill="#f1f3ed" font-size="34" text-anchor="middle">120 ms</text><line x1="294" y1="140" x2="320" y2="140" stroke="#8cbcff" stroke-width="4"/><path d="M 306.8362615716444 147.19138307906306 L 320 140 L 306.8362615716444 132.80861692093694" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="330" y="90" width="240" height="100" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="450" y="130.5" fill="#8cbcff" font-size="34" text-anchor="middle">Gateway</text><text x="450" y="171.5" fill="#f1f3ed" font-size="34" text-anchor="middle">125 ms</text><line x1="574" y1="140" x2="600" y2="140" stroke="#8cbcff" stroke-width="4"/><path d="M 586.8362615716444 147.19138307906306 L 600 140 L 586.8362615716444 132.80861692093694" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="610" y="90" width="240" height="100" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="730" y="130.5" fill="#8cbcff" font-size="34" text-anchor="middle">Scheduler</text><text x="730" y="171.5" fill="#f1f3ed" font-size="34" text-anchor="middle">140 ms</text><line x1="854" y1="140" x2="880" y2="140" stroke="#8cbcff" stroke-width="4"/><path d="M 866.8362615716444 147.19138307906306 L 880 140 L 866.8362615716444 132.80861692093694" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="890" y="90" width="240" height="100" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="1010" y="130.5" fill="#8cbcff" font-size="34" text-anchor="middle">KV released</text><text x="1010" y="171.5" fill="#f1f3ed" font-size="34" text-anchor="middle">145 ms</text><text x="175" y="255" fill="#ffae99" font-size="32" text-anchor="middle">disconnect</text><text x="455" y="255" fill="#8cbcff" font-size="32" text-anchor="middle">cancel(id)</text><text x="735" y="255" fill="#8cbcff" font-size="32" text-anchor="middle">no next step</text><text x="1015" y="255" fill="#7addbb" font-size="32" text-anchor="middle">state freed</text><line x1="1120" y1="330" x2="175" y2="330" stroke="#7addbb" stroke-width="4"/><path d="M 188.1637384283556 322.80861692093697 L 175 330 L 188.1637384283556 337.19138307906303" fill="none" stroke="#7addbb" stroke-width="4"/><text x="650" y="385" fill="#7addbb" font-size="40" text-anchor="middle">Release lag = 145 − 120 = 25 ms</text></g></svg>
