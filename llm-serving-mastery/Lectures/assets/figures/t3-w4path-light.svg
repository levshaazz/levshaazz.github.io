<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">W4A16 separates storage from arithmetic</title><desc id="desc">Packed four-bit weights and scales enter unpacking and dequantization. Reconstructed weights multiply sixteen-bit activations and accumulate in the kernel’s declared type. Dequantization may fuse inside a kernel or write a temporary buffer.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><rect x="25" y="105" width="410" height="123" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="230" y="157" fill="#175cad" font-size="34" text-anchor="middle">4-bit codes</text><text x="230" y="198" fill="#172b35" font-size="34" text-anchor="middle">+ scale metadata</text><line x1="452" y1="168" x2="488" y2="168" stroke="#175cad" stroke-width="4"/><path d="M 474.8362615716444 175.19138307906306 L 488 168 L 474.8362615716444 160.80861692093694" fill="none" stroke="#175cad" stroke-width="4"/><rect x="505" y="105" width="410" height="123" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="710" y="157" fill="#175cad" font-size="34" text-anchor="middle">unpack / lookup</text><text x="710" y="198" fill="#172b35" font-size="34" text-anchor="middle">reconstruct tile</text><line x1="932" y1="168" x2="968" y2="168" stroke="#175cad" stroke-width="4"/><path d="M 954.8362615716444 175.19138307906306 L 968 168 L 954.8362615716444 160.80861692093694" fill="none" stroke="#175cad" stroke-width="4"/><rect x="985" y="105" width="410" height="123" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="1190" y="157" fill="#175cad" font-size="34" text-anchor="middle">matrix multiply</text><text x="1190" y="198" fill="#172b35" font-size="34" text-anchor="middle">with A16</text><text x="25" y="324" fill="#146957" font-size="36" text-anchor="start">Fused possibility: tile stays inside the compute kernel</text><text x="25" y="397" fill="#89540a" font-size="34" text-anchor="start">Fallback possibility: temporary higher-precision weights</text><text x="25" y="466" fill="#4b6070" font-size="32" text-anchor="start">The profiler distinguishes these paths; a bit-width label does not.</text></g></svg>
