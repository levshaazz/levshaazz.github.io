="#172b35" font-size="32" text-anchor="middle">4</text><circle cx="1185" cy="233.58059794269528" r="8" fill="#89540a"/><text x="1185" y="211.58059794269528" fill="#172b35" font-size="30" text-anchor="middle">0.3300</text><text x="1185" y="410" fill="#172b35" font-size="32" text-anchor="middle">32</text><text x="720" y="470" fill="#172b35" font-size="32" text-anchor="middle">Multiplier of input-feature column 0</text></g></svg>
