<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Three deployment shapes</title><desc id="desc">Offline jobs read a backlog into a worker. A single interactive engine receives a client request directly. A gateway with a pool selects among replicas and must manage routing, health and state locality.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="20" y="98" fill="#f1f3ed" font-size="34" text-anchor="start">Offline</text><rect x="350" y="40" width="240" height="95" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="470" y="98.5" fill="#8cbcff" font-size="34" text-anchor="middle">Backlog</text><line x1="608" y1="88" x2="700" y2="88" stroke="#8cbcff" stroke-width="4"/><path d="M 686.8362615716444 95.19138307906304 L 700 88 L 686.8362615716444 80.80861692093696" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="720" y="40" width="260" height="95" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="850" y="98.5" fill="#8cbcff" font-size="34" text-anchor="middle">Worker</text><text x="20" y="243" fill="#f1f3ed" font-size="34" text-anchor="start">Single engine</text><rect x="350" y="185" width="240" height="95" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="470" y="243.5" fill="#8cbcff" font-size="34" text-anchor="middle">Client</text><line x1="608" y1="233" x2="700" y2="233" stroke="#8cbcff" stroke-width="4"/><path d="M 686.8362615716444 240.19138307906306 L 700 233 L 686.8362615716444 225.80861692093694" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="720" y="185" width="260" height="95" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="850" y="243.5" fill="#8cbcff" font-size="34" text-anchor="middle">Engine</text><text x="20" y="388" fill="#f1f3ed" font-size="34" text-anchor="start">Worker pool</text><rect x="350" y="330" width="240" height="95" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="470" y="388.5" fill="#8cbcff" font-size="34" text-anchor="middle">Client</text><line x1="608" y1="378" x2="700" y2="378" stroke="#8cbcff" stroke-width="4"/><path d="M 686.8362615716444 385.19138307906303 L 700 378 L 686.8362615716444 370.80861692093697" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="720" y="330" width="260" height="95" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="850" y="388.5" fill="#8cbcff" font-size="34" text-anchor="middle">Gateway</text><line x1="1000" y1="378" x2="1115" y2="325" stroke="#8cbcff" stroke-width="4"/><path d="M 1106.054825249469 337.0409239131582 L 1115 325 L 1100.0348133526925 323.9786339484543" fill="none" stroke="#8cbcff" stroke-width="4"/><line x1="1000" y1="378" x2="1115" y2="425" stroke="#8cbcff" stroke-width="4"/><path d="M 1100.0940150956048 426.67678681708236 L 1115 425 L 1105.5352945306363 413.3630179866858" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="1140" y="282" width="270" height="80" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="1275" y="333" fill="#8cbcff" font-size="34" text-anchor="middle">Replica A</text><rect x="1140" y="387" width="270" height="80" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="1275" y="438" fill="#8cbcff" font-size="34" text-anchor="middle">Replica B</text></g></svg>
