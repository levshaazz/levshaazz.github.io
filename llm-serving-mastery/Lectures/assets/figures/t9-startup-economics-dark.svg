<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Cold start is a sum of named terms; warm restart pays only the tail</title><desc id="desc">Cold start of a container splits into four named terms: pulling the layers over the network (network-bound), extracting them to disk (scales with the sum of layer sizes), starting the Python interpreter, and application init (imports plus the first healthcheck answer). A warm restart — stop and start of a container whose layers are already local — drops the pull and extract terms and pays only interpreter plus init. Term durations are machine- and network-dependent; the lab measures them on the student own build.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="35" y="44" fill="#becad4" font-size="31" text-anchor="start">Startup economics: name the terms before cutting one</text><text x="44" y="118" fill="#f1f3ed" font-size="31" text-anchor="start">cold</text><rect x="160" y="72" width="280" height="80" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="300" y="102.5" fill="#8cbcff" font-size="34" text-anchor="middle">pull</text><text x="300" y="143.5" fill="#f1f3ed" font-size="34" text-anchor="middle">network-bound</text><rect x="448" y="72" width="280" height="80" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="588" y="102.5" fill="#8cbcff" font-size="34" text-anchor="middle">extract</text><text x="588" y="143.5" fill="#f1f3ed" font-size="34" text-anchor="middle">Σ layer sizes</text><rect x="736" y="72" width="280" height="80" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="876" y="102.5" fill="#8cbcff" font-size="34" text-anchor="middle">interpreter</text><text x="876" y="143.5" fill="#f1f3ed" font-size="34" text-anchor="middle">python start</text><rect x="1024" y="72" width="280" height="80" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="1164" y="102.5" fill="#8cbcff" font-size="34" text-anchor="middle">app init</text><text x="1164" y="143.5" fill="#f1f3ed" font-size="34" text-anchor="middle">imports+health</text><text x="44" y="246" fill="#f1f3ed" font-size="31" text-anchor="start">warm</text><rect x="160" y="200" width="280" height="80" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="300" y="230.5" fill="#8cbcff" font-size="34" text-anchor="middle">interpreter</text><text x="300" y="271.5" fill="#f1f3ed" font-size="34" text-anchor="middle">python start</text><rect x="448" y="200" width="280" height="80" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="588" y="230.5" fill="#8cbcff" font-size="34" text-anchor="middle">app init</text><text x="588" y="271.5" fill="#f1f3ed" font-size="34" text-anchor="middle">imports+health</text><rect x="736" y="200" width="568" height="80" fill="#becad4" opacity="0.14"/><text x="1020" y="220" fill="#becad4" font-size="30" text-anchor="middle">layers already local — skipped:</text><text x="1020" y="262" fill="#becad4" font-size="30" text-anchor="middle">pull, extract</text><line x1="160" y1="140" x2="1304" y2="140" stroke="#becad4" stroke-width="4" stroke-dasharray="10 8"/><line x1="160" y1="168" x2="160" y2="196" stroke="#8cbcff" stroke-width="4"/><path d="M 152.80861692093694 182.8362615716444 L 160 196 L 167.19138307906303 182.8362615716444" fill="none" stroke="#8cbcff" stroke-width="4"/><text x="200" y="184" fill="#becad4" font-size="30" text-anchor="start">restart of a local container</text><text x="35" y="340" fill="#f1f3ed" font-size="30" text-anchor="start">Which term dominates decides the justified change:</text><rect x="40" y="364" width="420" height="80" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="250" y="394.5" fill="#8cbcff" font-size="34" text-anchor="middle">smaller base image</text><text x="250" y="435.5" fill="#f1f3ed" font-size="34" text-anchor="middle">cuts extract only</text><rect x="500" y="364" width="420" height="80" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="710" y="394.5" fill="#8cbcff" font-size="34" text-anchor="middle">baked weights</text><text x="710" y="435.5" fill="#f1f3ed" font-size="34" text-anchor="middle">removes a download</text><rect x="960" y="364" width="420" height="80" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="1170" y="394.5" fill="#8cbcff" font-size="34" text-anchor="middle">warm restart</text><text x="1170" y="435.5" fill="#f1f3ed" font-size="34" text-anchor="middle">keeps local layers</text><text x="35" y="470" fill="#becad4" font-size="30" text-anchor="start">Terms, not seconds: the lab journals the terms on YOUR machine first</text></g></svg>
