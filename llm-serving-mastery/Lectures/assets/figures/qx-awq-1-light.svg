<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">AWQ: inspect one rescaling candidate</title><desc id="desc">Column-0 multiplier 2; inputs [10,1,0,0] and [0,1,0,0]; output MSE 1.4250 over four coordinates. Before rounding inverse scaling preserves every original output.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="45" y="45" fill="#172b35" font-size="32" text-anchor="start">Activity: channel 0 mean |x| = 5; channel 1 = 1</text><rect x="40" y="105" width="390" height="100" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="235" y="145.5" fill="#175cad" font-size="34" text-anchor="middle">Multiplier 2</text><text x="235" y="186.5" fill="#172b35" font-size="34" text-anchor="middle">Quantizer step 1.00</text><text x="40" y="285" fill="#146957" font-size="32" text-anchor="start">Before rounding: same outputs</text><text x="40" y="350" fill="#172b35" font-size="32" text-anchor="start">[5.30, −3.70], [.40, −.60]</text><text x="40" y="435" fill="#172b35" font-size="30" text-anchor="start">Input divided; matching column multiplied</text><text x="650" y="85" fill="#172b35" font-size="32" text-anchor="start">After rounding: signed output errors</text><text x="650" y="145" fill="#89540a" font-size="38" text-anchor="start">[-0.30, -2.30]</text><text x="650" y="230" fill="#89540a" font-size="38" text-anchor="start">[-0.40, -0.40]</text><text x="650" y="355" fill="#146957" font-size="42" text-anchor="start">Output MSE: 1.4250</text><text x="650" y="445" fill="#4b6070" font-size="30" text-anchor="start">Hand-picked candidate; not complete AWQ</text></g></svg>
