<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">The scale-down window holds capacity: naive flaps 4 → 1 → 4, the window keeps 4</title><desc id="desc">Replica recommendations over 25 ticks of 15 seconds each. The metric ratio sits in the tolerance band until tick 5, spikes to 1.6 through tick 8, then falls to a quiet 0.5; a second spike arrives at tick 18. The red naive controller follows every movement instantly: up to 4 during the first spike, down to 1 in the quiet gap, up to 4 again, down to 1 — it flaps and serves the second burst from one pod. The green windowed controller takes the maximum recommendation over the trailing 20 ticks: it climbs to 4 at tick 5 and holds 4 for the rest of the picture.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="35" y="44" fill="#4b6070" font-size="31" text-anchor="start">the window holds capacity: naive flaps 4 → 1 → 4, the window keeps 4</text><line x1="144" y1="352" x2="150" y2="352" stroke="#4b6070" stroke-width="4"/><text x="134" y="362" fill="#4b6070" font-size="30" text-anchor="end">0</text><line x1="144" y1="298" x2="150" y2="298" stroke="#4b6070" stroke-width="4"/><text x="134" y="308" fill="#4b6070" font-size="30" text-anchor="end">1</text><line x1="144" y1="244" x2="150" y2="244" stroke="#4b6070" stroke-width="4"/><text x="134" y="254" fill="#4b6070" font-size="30" text-anchor="end">2</text><line x1="144" y1="190" x2="150" y2="190" stroke="#4b6070" stroke-width="4"/><text x="134" y="200" fill="#4b6070" font-size="30" text-anchor="end">3</text><line x1="144" y1="136" x2="150" y2="136" stroke="#4b6070" stroke-width="4"/><text x="134" y="146" fill="#4b6070" font-size="30" text-anchor="end">4</text><line x1="144" y1="82" x2="150" y2="82" stroke="#4b6070" stroke-width="4"/><text x="134" y="92" fill="#4b6070" font-size="30" text-anchor="end">5</text><polyline points="150,244 380,244 380,136 564,136 564,298 978,298 978,136 1070,136 1070,298 1300,298" fill="none" stroke="#af372b" stroke-width="6"/><polyline points="150,244 380,244 380,136 1300,136" fill="none" stroke="#146957" stroke-width="6"/><text x="170" y="116" fill="#af372b" font-size="30" text-anchor="start">naive: instant down — flaps 4 → 1 → 4</text><text x="720" y="116" fill="#146957" font-size="30" text-anchor="start">windowed: max over 20 ticks — holds 4</text><text x="600" y="282" fill="#af372b" font-size="30" text-anchor="start">1 pod before the second burst: SLO risk</text><line x1="150" y1="352" x2="1330" y2="352" stroke="#4b6070" stroke-width="4"/><text x="150" y="384" fill="#4b6070" font-size="30" text-anchor="middle">0</text><text x="380" y="384" fill="#4b6070" font-size="30" text-anchor="middle">5</text><text x="610" y="384" fill="#4b6070" font-size="30" text-anchor="middle">10</text><text x="840" y="384" fill="#4b6070" font-size="30" text-anchor="middle">15</text><text x="1070" y="384" fill="#4b6070" font-size="30" text-anchor="middle">20</text><text x="1300" y="384" fill="#4b6070" font-size="30" text-anchor="middle">25 ticks</text><text x="35" y="444" fill="#4b6070" font-size="30" text-anchor="start">declared: scale-up window 0 s; scale-down 300 s = 20 × 15 s, taking the maximum</text></g></svg>
