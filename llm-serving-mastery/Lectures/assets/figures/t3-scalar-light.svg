<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Each scalar crosses four explicit operations</title><desc id="desc">For scale 0.25 and signed codes −8 through 7, 1.83 divides to 7.32, rounds to 7 and reconstructs 1.75. Input 2.25 divides to 9, rounds to 9, clips to 7 and reconstructs 1.75. Errors reconstructed minus original are −0.08 and −0.50.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="25" y="55" fill="#175cad" font-size="34" text-anchor="start">w</text><text x="365" y="55" fill="#175cad" font-size="34" text-anchor="start">w / s</text><text x="665" y="55" fill="#175cad" font-size="34" text-anchor="start">round</text><text x="970" y="55" fill="#175cad" font-size="34" text-anchor="start">clip</text><text x="1240" y="55" fill="#175cad" font-size="34" text-anchor="start">s × q</text><text x="25" y="148" fill="#172b35" font-size="36" text-anchor="start">1.83</text><text x="365" y="148" fill="#172b35" font-size="36" text-anchor="start">7.32</text><text x="665" y="148" fill="#172b35" font-size="36" text-anchor="start">7</text><text x="970" y="148" fill="#89540a" font-size="36" text-anchor="start">7</text><text x="1240" y="148" fill="#172b35" font-size="36" text-anchor="start">1.75</text><text x="25" y="239" fill="#172b35" font-size="36" text-anchor="start">2.25</text><text x="365" y="239" fill="#172b35" font-size="36" text-anchor="start">9</text><text x="665" y="239" fill="#172b35" font-size="36" text-anchor="start">9</text><text x="970" y="239" fill="#89540a" font-size="36" text-anchor="start">7</text><text x="1240" y="239" fill="#172b35" font-size="36" text-anchor="start">1.75</text><text x="25" y="330" fill="#172b35" font-size="36" text-anchor="start">−2.40</text><text x="365" y="330" fill="#172b35" font-size="36" text-anchor="start">−9.60</text><text x="665" y="330" fill="#172b35" font-size="36" text-anchor="start">−10</text><text x="970" y="330" fill="#89540a" font-size="36" text-anchor="start">−8</text><text x="1240" y="330" fill="#172b35" font-size="36" text-anchor="start">−2.00</text><line x1="25" y1="372" x2="1410" y2="372" stroke="#4b6070" stroke-width="4"/><text x="25" y="447" fill="#146957" font-size="36" text-anchor="start">Signed error ê = ŵ − w: −0.08, −0.50, +0.40</text></g></svg>
