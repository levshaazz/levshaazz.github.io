<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Same requests; change only block size</title><desc id="desc">Same lengths 17, 31, 33; block 8: 12 blocks, 96 capacity slots, 15 unused. These are invented independent-request capacities, not measured GPU memory.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="35" y="48" fill="#becad4" font-size="32" text-anchor="start">Block 8; blue: live, amber: unused; one scale for all states</text><text x="35" y="126" fill="#f1f3ed" font-size="34" text-anchor="start">Length 17</text><rect x="350" y="92" width="221" height="52" fill="#8cbcff" opacity="1"/><rect x="571" y="92" width="91" height="52" fill="#ffcc79" opacity="1"/><line x1="350" y1="92" x2="350" y2="144" stroke="#151b22" stroke-width="4"/><line x1="454" y1="92" x2="454" y2="144" stroke="#151b22" stroke-width="4"/><line x1="558" y1="92" x2="558" y2="144" stroke="#151b22" stroke-width="4"/><line x1="662" y1="92" x2="662" y2="144" stroke="#151b22" stroke-width="4"/><text x="350" y="181" fill="#f1f3ed" font-size="30" text-anchor="start">3 blocks × 8 = 24 slots; 7 unused</text><text x="35" y="235" fill="#f1f3ed" font-size="34" text-anchor="start">Length 31</text><rect x="350" y="201" width="403" height="52" fill="#8cbcff" opacity="1"/><rect x="753" y="201" width="13" height="52" fill="#ffcc79" opacity="1"/><line x1="350" y1="201" x2="350" y2="253" stroke="#151b22" stroke-width="4"/><line x1="454" y1="201" x2="454" y2="253" stroke="#151b22" stroke-width="4"/><line x1="558" y1="201" x2="558" y2="253" stroke="#151b22" stroke-width="4"/><line x1="662" y1="201" x2="662" y2="253" stroke="#151b22" stroke-width="4"/><line x1="766" y1="201" x2="766" y2="253" stroke="#151b22" stroke-width="4"/><text x="350" y="290" fill="#f1f3ed" font-size="30" text-anchor="start">4 blocks × 8 = 32 slots; 1 unused</text><text x="35" y="344" fill="#f1f3ed" font-size="34" text-anchor="start">Length 33</text><rect x="350" y="310" width="429" height="52" fill="#8cbcff" opacity="1"/><rect x="779" y="310" width="91" height="52" fill="#ffcc79" opacity="1"/><line x1="350" y1="310" x2="350" y2="362" stroke="#151b22" stroke-width="4"/><line x1="454" y1="310" x2="454" y2="362" stroke="#151b22" stroke-width="4"/><line x1="558" y1="310" x2="558" y2="362" stroke="#151b22" stroke-width="4"/><line x1="662" y1="310" x2="662" y2="362" stroke="#151b22" stroke-width="4"/><line x1="766" y1="310" x2="766" y2="362" stroke="#151b22" stroke-width="4"/><line x1="870" y1="310" x2="870" y2="362" stroke="#151b22" stroke-width="4"/><text x="350" y="399" fill="#f1f3ed" font-size="30" text-anchor="start">5 blocks × 8 = 40 slots; 7 unused</text><text x="35" y="458" fill="#f1f3ed" font-size="32" text-anchor="start">81 live; total 12 blocks; 15 unused slots</text></g></svg>
