<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Independent requests own independently rounded blocks</title><desc id="desc">Lengths 17, 31, 33 at block 16 use 2, 2, 3 blocks. 81 live positions in 112 slots. 31 unused tail slots. Global rounding would wrongly report 6 rather than 7 blocks.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="35" y="45" fill="#4b6070" font-size="32" text-anchor="start">Block size = 16; blue: live, amber: unused</text><text x="35" y="131" fill="#172b35" font-size="34" text-anchor="start">A: 17 live</text><rect x="335" y="85" width="195" height="76" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="432.5" y="134" fill="#175cad" font-size="34" text-anchor="middle">16 live</text><rect x="335" y="143" width="195" height="18" fill="#175cad" opacity="1"/><rect x="555" y="85" width="195" height="76" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="652.5" y="134" fill="#175cad" font-size="34" text-anchor="middle">1 live</text><rect x="555" y="143" width="12.1875" height="18" fill="#175cad" opacity="1"/><rect x="567.1875" y="143" width="182.8125" height="18" fill="#89540a" opacity="1"/><text x="1085" y="131" fill="#89540a" font-size="34" text-anchor="start">15 unused</text><text x="35" y="244" fill="#172b35" font-size="34" text-anchor="start">B: 31 live</text><rect x="335" y="198" width="195" height="76" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="432.5" y="247" fill="#175cad" font-size="34" text-anchor="middle">16 live</text><rect x="335" y="256" width="195" height="18" fill="#175cad" opacity="1"/><rect x="555" y="198" width="195" height="76" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="652.5" y="247" fill="#175cad" font-size="34" text-anchor="middle">15 live</text><rect x="555" y="256" width="182.8125" height="18" fill="#175cad" opacity="1"/><rect x="737.8125" y="256" width="12.1875" height="18" fill="#89540a" opacity="1"/><text x="1085" y="244" fill="#89540a" font-size="34" text-anchor="start">1 unused</text><text x="35" y="357" fill="#172b35" font-size="34" text-anchor="start">C: 33 live</text><rect x="335" y="311" width="195" height="76" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="432.5" y="360" fill="#175cad" font-size="34" text-anchor="middle">16 live</text><rect x="335" y="369" width="195" height="18" fill="#175cad" opacity="1"/><rect x="555" y="311" width="195" height="76" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="652.5" y="360" fill="#175cad" font-size="34" text-anchor="middle">16 live</text><rect x="555" y="369" width="195" height="18" fill="#175cad" opacity="1"/><rect x="775" y="311" width="195" height="76" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="872.5" y="360" fill="#175cad" font-size="34" text-anchor="middle">1 live</text><rect x="775" y="369" width="12.1875" height="18" fill="#175cad" opacity="1"/><rect x="787.1875" y="369" width="182.8125" height="18" fill="#89540a" opacity="1"/><text x="1085" y="357" fill="#89540a" font-size="34" text-anchor="start">15 unused</text><text x="35" y="450" fill="#172b35" font-size="34" text-anchor="start">7 blocks × 16 = 112 slots; 112 − 81 = 31 unused</text></g></svg>
