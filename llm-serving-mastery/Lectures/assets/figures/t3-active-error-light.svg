<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">The same weights can create different output error</title><desc id="desc">First-row weight error is [0.08, 0.02, 0.01, −0.50]. For input [1, 0, 0, 0], output error is 0.08. For [0, 0, 0, 10], error is −5. The activation distribution determines which errors matter.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="25" y="48" fill="#175cad" font-size="38" text-anchor="start">ΔW[0] = [0.08, 0.02, 0.01, −0.50]</text><rect x="25" y="125" width="885" height="105" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="467.5" y="168" fill="#175cad" font-size="34" text-anchor="middle">Input A = [1, 0, 0, 0]</text><text x="467.5" y="209" fill="#172b35" font-size="34" text-anchor="middle">only feature 0 is active</text><line x1="930" y1="176" x2="1060" y2="176" stroke="#175cad" stroke-width="4"/><path d="M 1046.8362615716444 183.19138307906306 L 1060 176 L 1046.8362615716444 168.80861692093694" fill="none" stroke="#175cad" stroke-width="4"/><text x="1090" y="190" fill="#146957" font-size="46" text-anchor="start">+0.08</text><rect x="25" y="285" width="885" height="105" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="467.5" y="328" fill="#175cad" font-size="34" text-anchor="middle">Input B = [0, 0, 0, 10]</text><text x="467.5" y="369" fill="#172b35" font-size="34" text-anchor="middle">the clipped feature is 10× larger</text><line x1="930" y1="337" x2="1060" y2="337" stroke="#89540a" stroke-width="4"/><path d="M 1046.8362615716444 344.19138307906303 L 1060 337 L 1046.8362615716444 329.80861692093697" fill="none" stroke="#89540a" stroke-width="4"/><text x="1090" y="351" fill="#89540a" font-size="46" text-anchor="start">−5.00</text><text x="25" y="465" fill="#4b6070" font-size="32" text-anchor="start">The checkpoint is identical. The input changed the relevant error.</text></g></svg>
