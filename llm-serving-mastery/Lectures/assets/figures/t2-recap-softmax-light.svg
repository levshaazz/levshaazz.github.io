<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Softmax turns scores into a weighted value sum</title><desc id="desc">The last toy score row is normalized by subtracting its maximum, exponentiating, and dividing by the sum. Probabilities sum to one. Each output coordinate is the weighted sum of the corresponding coordinate across three V rows.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="25" y="48" fill="#175cad" font-size="36" text-anchor="start">scores[2] = [-0.424, 1.506, 1.612]</text><text x="25" y="120" fill="#172b35" font-size="34" text-anchor="start">exp(scores − max) = [0.131, 0.900, 1]; sum = 2.030</text><text x="25" y="192" fill="#146957" font-size="36" text-anchor="start">p = [0.064, 0.443, 0.493]; sum(p) = 1</text><line x1="25" y1="225" x2="1410" y2="225" stroke="#4b6070" stroke-width="4"/><text x="25" y="292" fill="#172b35" font-size="32" text-anchor="start">output[0] = 0.064×1.464 + 0.443×0.050 + 0.493×0.415</text><text x="25" y="365" fill="#146957" font-size="38" text-anchor="start">attention[2] = [0.321, 0.986, 0.630, 1.296]</text><text x="25" y="452" fill="#175cad" font-size="34" text-anchor="start">p = softmax(scores, dim=-1); attention = p @ v</text></g></svg>
