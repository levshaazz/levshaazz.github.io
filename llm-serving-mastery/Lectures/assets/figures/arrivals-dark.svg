<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Who controls the next arrival?</title><desc id="desc">An externally scheduled source sends at 0, 1, 2, 3 and 4 seconds regardless of responses. A single closed-loop user sends at 0 and again at 3 seconds only after the first response completes.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="330" y="50" fill="#becad4" font-size="32" text-anchor="middle">0 s</text><text x="570" y="50" fill="#becad4" font-size="32" text-anchor="middle">1 s</text><text x="810" y="50" fill="#becad4" font-size="32" text-anchor="middle">2 s</text><text x="1050" y="50" fill="#becad4" font-size="32" text-anchor="middle">3 s</text><text x="1290" y="50" fill="#becad4" font-size="32" text-anchor="middle">4 s</text><text x="20" y="155" fill="#f1f3ed" font-size="34" text-anchor="start">Scheduled</text><line x1="330" y1="145" x2="1290" y2="145" stroke="#becad4" stroke-width="4"/><circle cx="330" cy="145" r="8" fill="#8cbcff"/><line x1="330" y1="92" x2="330" y2="125" stroke="#8cbcff" stroke-width="4"/><path d="M 322.80861692093697 111.83626157164441 L 330 125 L 337.19138307906303 111.83626157164441" fill="none" stroke="#8cbcff" stroke-width="4"/><circle cx="570" cy="145" r="8" fill="#8cbcff"/><line x1="570" y1="92" x2="570" y2="125" stroke="#8cbcff" stroke-width="4"/><path d="M 562.808616920937 111.83626157164441 L 570 125 L 577.191383079063 111.83626157164441" fill="none" stroke="#8cbcff" stroke-width="4"/><circle cx="810" cy="145" r="8" fill="#8cbcff"/><line x1="810" y1="92" x2="810" y2="125" stroke="#8cbcff" stroke-width="4"/><path d="M 802.808616920937 111.83626157164441 L 810 125 L 817.191383079063 111.83626157164441" fill="none" stroke="#8cbcff" stroke-width="4"/><circle cx="1050" cy="145" r="8" fill="#8cbcff"/><line x1="1050" y1="92" x2="1050" y2="125" stroke="#8cbcff" stroke-width="4"/><path d="M 1042.8086169209369 111.83626157164441 L 1050 125 L 1057.1913830790631 111.83626157164441" fill="none" stroke="#8cbcff" stroke-width="4"/><circle cx="1290" cy="145" r="8" fill="#8cbcff"/><line x1="1290" y1="92" x2="1290" y2="125" stroke="#8cbcff" stroke-width="4"/><path d="M 1282.8086169209369 111.83626157164441 L 1290 125 L 1297.1913830790631 111.83626157164441" fill="none" stroke="#8cbcff" stroke-width="4"/><text x="20" y="330" fill="#f1f3ed" font-size="34" text-anchor="start">Closed loop</text><line x1="330" y1="320" x2="1290" y2="320" stroke="#becad4" stroke-width="4"/><circle cx="330" cy="320" r="8" fill="#8cbcff"/><circle cx="1050" cy="320" r="8" fill="#8cbcff"/><line x1="330" y1="375" x2="1050" y2="375" stroke="#ffcc79" stroke-width="4"/><text x="690" y="440" fill="#ffcc79" font-size="34" text-anchor="middle">wait for first response: 3 s</text></g></svg>
