<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Protect an active input channel, not the largest weight</title><desc id="desc">Two illustrative input samples have channel zero values ten and zero and channel one values one and one. Mean absolute activation is five versus one. Scaling column zero weights by two and dividing that input channel by two preserves both original outputs before rounding.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="40" y="45" fill="#f1f3ed" font-size="32" text-anchor="start">Mean absolute input activation</text><rect x="100" y="130" width="70" height="190" fill="#ffcc79" opacity="1"/><text x="135" y="370" fill="#f1f3ed" font-size="30" text-anchor="middle">ch 0</text><rect x="235" y="282" width="70" height="38" fill="#8cbcff" opacity="1"/><text x="270" y="370" fill="#f1f3ed" font-size="30" text-anchor="middle">ch 1</text><rect x="370" y="320" width="70" height="0" fill="#8cbcff" opacity="1"/><text x="405" y="370" fill="#f1f3ed" font-size="30" text-anchor="middle">ch 2</text><rect x="505" y="320" width="70" height="0" fill="#8cbcff" opacity="1"/><text x="540" y="370" fill="#f1f3ed" font-size="30" text-anchor="middle">ch 3</text><text x="320" y="450" fill="#ffcc79" font-size="32" text-anchor="middle">Channel 0 is active</text><rect x="685" y="100" width="310" height="100" rx="8" fill="#293744" stroke="#ffcc79" stroke-width="3"/><text x="840" y="140.5" fill="#ffcc79" font-size="34" text-anchor="middle">Input 0: 10 → 5</text><text x="840" y="181.5" fill="#f1f3ed" font-size="34" text-anchor="middle">divide by 2</text><rect x="1040" y="100" width="345" height="100" rx="8" fill="#293744" stroke="#ffcc79" stroke-width="3"/><text x="1212.5" y="140.5" fill="#ffcc79" font-size="34" text-anchor="middle">Weight: .49 → .98</text><text x="1212.5" y="181.5" fill="#f1f3ed" font-size="34" text-anchor="middle">multiply by 2</text><text x="1030" y="285" fill="#f1f3ed" font-size="32" text-anchor="middle">Before rounding: same contribution</text><text x="1030" y="355" fill="#7addbb" font-size="42" text-anchor="middle">4.90 → 4.90</text><text x="1030" y="445" fill="#ffae99" font-size="32" text-anchor="middle">Inverse scaling is essential</text></g></svg>
