<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Cache savings can lose to queueing</title><desc id="desc">Cached worker A needs 300 ms queue plus 20 ms prefill, total 320 ms. Uncached worker B needs 20 ms queue plus 120 ms prefill, total 140 ms. Other costs are assumed equal. Cache affinity alone chooses the slower path.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="25" y="145" fill="#172b35" font-size="34" text-anchor="start">A: cached</text><rect x="330" y="100" width="750" height="80" fill="#89540a" opacity="1"/><rect x="1080" y="100" width="50" height="80" fill="#175cad" opacity="1"/><text x="1150" y="150" fill="#172b35" font-size="38" text-anchor="start">320 ms</text><text x="25" y="325" fill="#172b35" font-size="34" text-anchor="start">B: uncached</text><rect x="330" y="280" width="50" height="80" fill="#89540a" opacity="1"/><rect x="380" y="280" width="300" height="80" fill="#175cad" opacity="1"/><text x="700" y="330" fill="#172b35" font-size="38" text-anchor="start">140 ms</text><text x="330" y="445" fill="#4b6070" font-size="34" text-anchor="start">Amber: queue     Blue: prefill</text></g></svg>
