<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Evaluate transport, format and meaning separately</title><desc id="desc">Eight invented attempts: six complete, five valid labels, four correct. All-attempt accuracy4/8=50%; valid-label rate5/8=62.5%; completion6/8=75%. Conditional accuracy4/5=80% answers a different question and hides three invalid or incomplete attempts.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="25" y="90" fill="#f1f3ed" font-size="36" text-anchor="start">Protocol complete</text><text x="710" y="90" fill="#8cbcff" font-size="36" text-anchor="start">6 / 8</text><text x="1130" y="90" fill="#8cbcff" font-size="36" text-anchor="start">75%</text><line x1="25" y1="126" x2="1410" y2="126" stroke="#becad4" stroke-width="4"/><text x="25" y="185" fill="#f1f3ed" font-size="36" text-anchor="start">Valid task format</text><text x="710" y="185" fill="#8cbcff" font-size="36" text-anchor="start">5 / 8</text><text x="1130" y="185" fill="#8cbcff" font-size="36" text-anchor="start">62.5%</text><line x1="25" y1="221" x2="1410" y2="221" stroke="#becad4" stroke-width="4"/><text x="25" y="280" fill="#f1f3ed" font-size="36" text-anchor="start">Correct task answer</text><text x="710" y="280" fill="#8cbcff" font-size="36" text-anchor="start">4 / 8</text><text x="1130" y="280" fill="#8cbcff" font-size="36" text-anchor="start">50%</text><line x1="25" y1="316" x2="1410" y2="316" stroke="#becad4" stroke-width="4"/><text x="25" y="410" fill="#ffcc79" font-size="34" text-anchor="start">4 / 5 = 80% is accuracy conditional on valid output</text><text x="25" y="474" fill="#f1f3ed" font-size="32" text-anchor="start">It is not the service accuracy over all eight attempts.</text></g></svg>
