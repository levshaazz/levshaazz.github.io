<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Keep attention intermediates close to compute</title><desc id="desc">A naive implementation writes an S-by-S score matrix to device memory and reads it back. An IO-aware tiled attention method loads blocks of Q/K/V and updates online softmax/output state on chip, avoiding that full materialization.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="30" y="42" fill="#172b35" font-size="34" text-anchor="start">Materialize scores</text><rect x="30" y="85" width="390" height="110" rx="8" fill="#e6edf3" stroke="#af372b" stroke-width="3"/><text x="225" y="130.5" fill="#af372b" font-size="34" text-anchor="middle">QKᵀ → S × S</text><text x="225" y="171.5" fill="#172b35" font-size="34" text-anchor="middle">device-memory tensor</text><line x1="440" y1="140" x2="550" y2="140" stroke="#175cad" stroke-width="4"/><path d="M 536.8362615716444 147.19138307906306 L 550 140 L 536.8362615716444 132.80861692093694" fill="none" stroke="#175cad" stroke-width="4"/><rect x="575" y="85" width="810" height="110" rx="8" fill="#e6edf3" stroke="#af372b" stroke-width="3"/><text x="980" y="130.5" fill="#af372b" font-size="34" text-anchor="middle">read scores → softmax → values</text><text x="980" y="171.5" fill="#172b35" font-size="34" text-anchor="middle">write/read intermediate arrays</text><text x="30" y="270" fill="#172b35" font-size="34" text-anchor="start">Tile + online reduction</text><rect x="30" y="310" width="390" height="110" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="225" y="355.5" fill="#175cad" font-size="34" text-anchor="middle">Q / K / V tiles</text><text x="225" y="396.5" fill="#172b35" font-size="34" text-anchor="middle">load a block</text><line x1="440" y1="365" x2="550" y2="365" stroke="#175cad" stroke-width="4"/><path d="M 536.8362615716444 372.19138307906303 L 550 365 L 536.8362615716444 357.80861692093697" fill="none" stroke="#175cad" stroke-width="4"/><rect x="575" y="310" width="810" height="110" rx="8" fill="#e6edf3" stroke="#146957" stroke-width="3"/><text x="980" y="355.5" fill="#146957" font-size="34" text-anchor="middle">on-chip running max, sum, output</text><text x="980" y="396.5" fill="#172b35" font-size="34" text-anchor="middle">do not store the full score matrix</text></g></svg>
