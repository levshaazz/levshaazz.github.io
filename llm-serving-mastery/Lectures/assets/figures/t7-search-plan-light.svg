<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">One factor at a time: the frozen five-configuration plan</title><desc id="desc">The frozen search plan: the default configuration as baseline, then three one-factor moves — seqs-32, mem-085 and chunked — each changing exactly one knob, plus the confirmatory pair (seqs-32 together with chunked prefill). Every row carries a reason sentence written before the run; the plan is frozen to search-plan.json with a timestamp, and rejected configurations stay in the table as evidence.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="35" y="44" fill="#4b6070" font-size="31" text-anchor="start">One factor at a time: the frozen five-configuration plan</text><rect x="40" y="110" width="250" height="104" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="165" y="152.5" fill="#175cad" font-size="34" text-anchor="middle">default</text><text x="165" y="193.5" fill="#172b35" font-size="34" text-anchor="middle">baseline</text><line x1="294" y1="162" x2="316" y2="162" stroke="#175cad" stroke-width="4"/><path d="M 302.8362615716444 169.19138307906306 L 316 162 L 302.8362615716444 154.80861692093694" fill="none" stroke="#175cad" stroke-width="4"/><rect x="320" y="110" width="250" height="104" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="445" y="152.5" fill="#175cad" font-size="34" text-anchor="middle">seqs-32</text><text x="445" y="193.5" fill="#172b35" font-size="34" text-anchor="middle">Δ seqs only</text><line x1="574" y1="162" x2="596" y2="162" stroke="#175cad" stroke-width="4"/><path d="M 582.8362615716444 169.19138307906306 L 596 162 L 582.8362615716444 154.80861692093694" fill="none" stroke="#175cad" stroke-width="4"/><rect x="600" y="110" width="250" height="104" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="725" y="152.5" fill="#175cad" font-size="34" text-anchor="middle">mem-085</text><text x="725" y="193.5" fill="#172b35" font-size="34" text-anchor="middle">Δ mem only</text><line x1="854" y1="162" x2="876" y2="162" stroke="#175cad" stroke-width="4"/><path d="M 862.8362615716444 169.19138307906306 L 876 162 L 862.8362615716444 154.80861692093694" fill="none" stroke="#175cad" stroke-width="4"/><rect x="880" y="110" width="250" height="104" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="1005" y="152.5" fill="#175cad" font-size="34" text-anchor="middle">chunked</text><text x="1005" y="193.5" fill="#172b35" font-size="34" text-anchor="middle">Δ prefill only</text><line x1="1134" y1="162" x2="1156" y2="162" stroke="#175cad" stroke-width="4"/><path d="M 1142.8362615716444 169.19138307906306 L 1156 162 L 1142.8362615716444 154.80861692093694" fill="none" stroke="#175cad" stroke-width="4"/><rect x="1160" y="110" width="250" height="104" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="1285" y="152.5" fill="#175cad" font-size="34" text-anchor="middle">pair</text><text x="1285" y="193.5" fill="#172b35" font-size="34" text-anchor="middle">Δ seqs+prefill</text><text x="720" y="262" fill="#4b6070" font-size="30" text-anchor="middle">every row carries a reason sentence — frozen into search-plan.json before the first run</text><rect x="40" y="300" width="640" height="104" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="360" y="342.5" fill="#175cad" font-size="34" text-anchor="middle">freeze before the run</text><text x="360" y="383.5" fill="#172b35" font-size="34" text-anchor="middle">plan JSON + timestamp; no silent rows</text><rect x="760" y="300" width="640" height="104" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="1080" y="342.5" fill="#175cad" font-size="34" text-anchor="middle">rejected rows stay</text><text x="1080" y="383.5" fill="#172b35" font-size="34" text-anchor="middle">a failure is evidence, not noise</text><text x="35" y="452" fill="#172b35" font-size="30" text-anchor="start">Mid-search change? Version the plan — validation never silently becomes tuning</text></g></svg>
