<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Split the weight matrices, join with all-reduce — the split is exact</title><desc id="desc">Left: column-parallel split — the weight matrix is cut by output features, so each GPU owns its slice of output columns and computes its slice of Y directly. Right: row-parallel split — the weight matrix is cut by input features, each GPU computes a partial result, and an all-reduce sum joins the partials into the exact full output. Bottom strip: one transformer block in the declared model — attention projections, then an all-reduce beat, then the MLP up (column) and down (row) projections, then a second all-reduce beat: two synchronisation beats per block.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="35" y="44" fill="#becad4" font-size="31" text-anchor="start">One layer, many GPUs: split the weights, join the parts exactly</text><text x="60" y="92" fill="#8cbcff" font-size="30" text-anchor="start">column-parallel: split output features</text><rect x="60" y="112" width="330" height="92" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="225" y="148.5" fill="#8cbcff" font-size="34" text-anchor="middle"><tspan data-notation="code">W[:, :h/2]</tspan></text><text x="225" y="189.5" fill="#f1f3ed" font-size="34" text-anchor="middle">GPU 0: cols of Y</text><rect x="60" y="224" width="330" height="92" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="225" y="260.5" fill="#8cbcff" font-size="34" text-anchor="middle"><tspan data-notation="code">W[:, h/2:]</tspan></text><text x="225" y="301.5" fill="#f1f3ed" font-size="34" text-anchor="middle">GPU 1: cols of Y</text><text x="416" y="146" fill="#becad4" font-size="30" text-anchor="start">each GPU reads all of X</text><text x="416" y="182" fill="#becad4" font-size="30" text-anchor="start">but writes only its own</text><text x="416" y="218" fill="#becad4" font-size="30" text-anchor="start">output columns — no join</text><text x="416" y="254" fill="#becad4" font-size="30" text-anchor="start">needed inside the block</text><text x="790" y="92" fill="#8cbcff" font-size="30" text-anchor="middle">row-parallel: split input features</text><rect x="790" y="112" width="250" height="92" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="915" y="148.5" fill="#8cbcff" font-size="34" text-anchor="middle">partial Y₀</text><text x="915" y="189.5" fill="#f1f3ed" font-size="34" text-anchor="middle">GPU 0: rows</text><rect x="1140" y="112" width="250" height="92" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="1265" y="148.5" fill="#8cbcff" font-size="34" text-anchor="middle">partial Y₁</text><text x="1265" y="189.5" fill="#f1f3ed" font-size="34" text-anchor="middle">GPU 1: rows</text><line x1="915" y1="210" x2="915" y2="258" stroke="#8cbcff" stroke-width="4"/><path d="M 907.808616920937 244.8362615716444 L 915 258 L 922.191383079063 244.8362615716444" fill="none" stroke="#8cbcff" stroke-width="4"/><line x1="1265" y1="210" x2="1265" y2="258" stroke="#8cbcff" stroke-width="4"/><path d="M 1257.8086169209369 244.8362615716444 L 1265 258 L 1272.1913830790631 244.8362615716444" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="810" y="258" width="560" height="102" fill="#7addbb" opacity="0.12"/><rect x="830" y="266" width="520" height="84" rx="8" fill="#293744" stroke="#7addbb" stroke-width="3"/><text x="1090" y="298.5" fill="#7addbb" font-size="34" text-anchor="middle"><tspan data-notation="code">all-reduce: Y = Y₀ + Y₁</tspan></text><text x="1090" y="339.5" fill="#f1f3ed" font-size="34" text-anchor="middle">the join is exact</text><text x="35" y="382" fill="#f1f3ed" font-size="30" text-anchor="start">one transformer block (declared model):</text><rect x="60" y="396" width="360" height="56" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="240" y="435" fill="#8cbcff" font-size="34" text-anchor="middle">attention (column)</text><line x1="424" y1="424" x2="462" y2="424" stroke="#8cbcff" stroke-width="4"/><path d="M 448.8362615716444 431.19138307906303 L 462 424 L 448.8362615716444 416.80861692093697" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="466" y="396" width="250" height="56" rx="8" fill="#293744" stroke="#ffcc79" stroke-width="3"/><text x="591" y="435" fill="#ffcc79" font-size="34" text-anchor="middle"><tspan data-notation="code">sync beat 1</tspan></text><line x1="720" y1="424" x2="758" y2="424" stroke="#8cbcff" stroke-width="4"/><path d="M 744.8362615716444 431.19138307906303 L 758 424 L 744.8362615716444 416.80861692093697" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="762" y="396" width="300" height="56" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="912" y="435" fill="#8cbcff" font-size="34" text-anchor="middle">MLP up/down</text><line x1="1066" y1="424" x2="1104" y2="424" stroke="#8cbcff" stroke-width="4"/><path d="M 1090.8362615716444 431.19138307906303 L 1104 424 L 1090.8362615716444 416.80861692093697" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="1108" y="396" width="250" height="56" rx="8" fill="#293744" stroke="#ffcc79" stroke-width="3"/><text x="1233" y="435" fill="#ffcc79" font-size="34" text-anchor="middle"><tspan data-notation="code">sync beat 2</tspan></text><text x="35" y="474" fill="#becad4" font-size="30" text-anchor="start">Two all-reduce beats per block; split == full within fp tolerance — proved, not asserted</text></g></svg>
