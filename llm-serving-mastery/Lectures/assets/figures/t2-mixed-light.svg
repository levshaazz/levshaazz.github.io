<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">A long kernel can interrupt a token stream</title><desc id="desc">A decoder with three 10 ms steps and no interfering work finishes at 30 ms. In a constructed alternative, an 80 ms prefill sits between the first and second steps, stretching completion to 110 ms.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="25" y="110" fill="#172b35" font-size="34" text-anchor="start">Decode only</text><rect x="250" y="65" width="90" height="70" fill="#146957" opacity="1"/><rect x="340" y="65" width="90" height="70" fill="#146957" opacity="1"/><rect x="430" y="65" width="90" height="70" fill="#146957" opacity="1"/><text x="550" y="112" fill="#146957" font-size="36" text-anchor="start">30 ms</text><text x="25" y="295" fill="#172b35" font-size="34" text-anchor="start">Mixed work</text><rect x="250" y="245" width="90" height="70" fill="#146957" opacity="1"/><rect x="340" y="245" width="720" height="70" fill="#89540a" opacity="1"/><rect x="1060" y="245" width="90" height="70" fill="#146957" opacity="1"/><rect x="1150" y="245" width="90" height="70" fill="#146957" opacity="1"/><text x="700" y="294" fill="#faf9f5" font-size="36" text-anchor="middle">80 ms prefill</text><line x1="250" y1="390" x2="1240" y2="390" stroke="#4b6070" stroke-width="4"/><text x="250" y="448" fill="#4b6070" font-size="32" text-anchor="middle">0 ms</text><text x="340" y="448" fill="#4b6070" font-size="32" text-anchor="middle">10 ms</text><text x="1060" y="448" fill="#4b6070" font-size="32" text-anchor="middle">90 ms</text><text x="1240" y="448" fill="#4b6070" font-size="32" text-anchor="middle">110 ms</text></g></svg>
