<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">What the pinned service actually did on a T4</title><desc id="desc">Measured single run (Colab Tesla T4, 21 October 2026, owner-executed, current notebook): waves of 8/32/64/128 closed-loop clients on the frozen A-short corpus. Output throughput rose 29 → 208 → 306 → 311 tok/s with ZERO timeouts at every wave, then flattened: the last doubling bought +2%. The knee lands at wave 32 by the gain rule — exactly the frozen arithmetic prediction.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="35" y="40" fill="#4b6070" font-size="31" text-anchor="start">Measured: throughput vs concurrency — pinned 3B on T4</text><text x="160" y="392" fill="#4b6070" font-size="30" text-anchor="middle">8</text><line x1="160" y1="368" x2="160" y2="376" stroke="#4b6070" stroke-width="4"/><text x="760" y="392" fill="#4b6070" font-size="30" text-anchor="middle">32</text><line x1="760" y1="368" x2="760" y2="376" stroke="#4b6070" stroke-width="4"/><text x="1060" y="392" fill="#4b6070" font-size="30" text-anchor="middle">64</text><line x1="1060" y1="368" x2="1060" y2="376" stroke="#4b6070" stroke-width="4"/><text x="1360" y="392" fill="#4b6070" font-size="30" text-anchor="middle">128</text><line x1="1360" y1="368" x2="1360" y2="376" stroke="#4b6070" stroke-width="4"/><line x1="160" y1="368" x2="1240" y2="368" stroke="#4b6070" stroke-width="4"/><text x="700" y="430" fill="#4b6070" font-size="30" text-anchor="middle">concurrent clients</text><line x1="160" y1="344.22" x2="760" y2="197.604" stroke="#175cad" stroke-width="4"/><line x1="760" y1="197.604" x2="1060" y2="117.244" stroke="#175cad" stroke-width="4"/><line x1="1060" y1="117.244" x2="1360" y2="113.22600000000003" stroke="#175cad" stroke-width="4"/><circle cx="160" cy="344.22" r="9" fill="#175cad"/><circle cx="760" cy="197.604" r="9" fill="#175cad"/><circle cx="1060" cy="117.244" r="9" fill="#175cad"/><circle cx="1360" cy="113.22600000000003" r="9" fill="#175cad"/><text x="166" y="85" fill="#175cad" font-size="30" text-anchor="start">output tok/s (completed)</text><line x1="690" y1="157.604" x2="754" y2="187.604" stroke="#146957" stroke-width="4"/><text x="682" y="151.604" fill="#146957" font-size="30" text-anchor="end">knee = 32 = frozen prediction</text><text x="1240" y="300" fill="#af372b" font-size="30" text-anchor="end">+2% for the last doubling:</text><text x="1240" y="336" fill="#af372b" font-size="30" text-anchor="end">plateau — the tail doubles instead</text><text x="35" y="462" fill="#172b35" font-size="30" text-anchor="start">Zero timeouts, flat throughput, p95 478→1076 ms: the box fills where throughput cannot show it</text></g></svg>
