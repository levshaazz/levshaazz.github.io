<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">One base, many adapters: 491 MB of base weights against ~0.22 MB per LoRA adapter</title><desc id="desc">Declared teaching bar chart on a 1440 by 480 canvas. The left bar is the frozen Qwen 2.5 0.5B base at Q4, drawn full height and labeled 491 MB. Three thin bars to the right, each labeled 0.22 MB, show LoRA adapters at rank 16 over four attention projections. A zoom inset magnifies the adapter slivers and names the arithmetic: 2 times r times (d in plus d out) per matrix, times four matrices.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="35" y="52" fill="#becad4" font-size="31" text-anchor="start">one base, many tenants — the size story is the whole story</text><rect x="80" y="100" width="330" height="300" fill="#8cbcff" opacity="1"/><text x="245" y="170" fill="#f1f3ed" font-size="40" text-anchor="middle">491 MB</text><text x="245" y="226" fill="#f1f3ed" font-size="30" text-anchor="middle">frozen base</text><text x="245" y="270" fill="#becad4" font-size="30" text-anchor="middle">Qwen 2.5 0.5B Q4</text><text x="245" y="316" fill="#becad4" font-size="30" text-anchor="middle">shared by every tenant</text><rect x="470" y="330" width="80" height="70" fill="#7addbb" opacity="1"/><text x="510" y="306" fill="#7addbb" font-size="30" text-anchor="middle">0.22 MB</text><text x="510" y="374" fill="#f1f3ed" font-size="30" text-anchor="middle">L1</text><rect x="610" y="330" width="80" height="70" fill="#7addbb" opacity="1"/><text x="650" y="306" fill="#7addbb" font-size="30" text-anchor="middle">0.22 MB</text><text x="650" y="374" fill="#f1f3ed" font-size="30" text-anchor="middle">L2</text><rect x="750" y="330" width="80" height="70" fill="#7addbb" opacity="1"/><text x="790" y="306" fill="#7addbb" font-size="30" text-anchor="middle">0.22 MB</text><text x="790" y="374" fill="#f1f3ed" font-size="30" text-anchor="middle">L3</text><text x="940" y="120" fill="#f1f3ed" font-size="30" text-anchor="start">the arithmetic, declared:</text><text x="940" y="172" fill="#f1f3ed" font-size="30" text-anchor="start">params = 2 · r · (din + dout) · 4</text><text x="940" y="224" fill="#f1f3ed" font-size="30" text-anchor="start">r = 16, d = 896 → 114 688</text><text x="940" y="276" fill="#f1f3ed" font-size="30" text-anchor="start">fp16 → 229 376 B ≈ 0.22 MB</text><text x="940" y="328" fill="#7addbb" font-size="30" text-anchor="start">0.05 % of the base per tenant</text><text x="80" y="436" fill="#becad4" font-size="30" text-anchor="start">sources: LoRA = arXiv 2106.09685;</text><text x="80" y="472" fill="#becad4" font-size="30" text-anchor="start">S-LoRA = arXiv 2311.03285; base from T09</text></g></svg>
