<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">The attention branch returns to the residual stream</title><desc id="desc">Transpose and reshape concatenate 12 attention heads back to 1536 features. The output projection maps 1536 to 1536 without bias. The first residual addition adds this branch to the original block input, not to the normalized input. Full toy four-value arithmetic is shown.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="25" y="44" fill="#8cbcff" font-size="34" text-anchor="start">[1,12,42,128] → transpose + reshape → [1,42,1536]</text><text x="25" y="110" fill="#f1f3ed" font-size="34" text-anchor="start">branch = concat_heads @ Wo.T;  X1 = x + branch</text><line x1="25" y1="145" x2="1410" y2="145" stroke="#becad4" stroke-width="4"/><text x="25" y="211" fill="#becad4" font-size="32" text-anchor="start">Toy original x[2]</text><text x="650" y="211" fill="#f1f3ed" font-size="36" text-anchor="start">[1, 2, 3, 4]</text><text x="25" y="283" fill="#8cbcff" font-size="32" text-anchor="start">+ projected attention[2]</text><text x="650" y="283" fill="#8cbcff" font-size="36" text-anchor="start">[0.160, 0.493, 0.315, 0.648]</text><line x1="640" y1="318" x2="1390" y2="318" stroke="#becad4" stroke-width="4"/><text x="25" y="378" fill="#7addbb" font-size="32" text-anchor="start">= residual1[2]</text><text x="650" y="378" fill="#7addbb" font-size="36" text-anchor="start">[1.160, 2.493, 3.315, 4.648]</text><text x="25" y="466" fill="#becad4" font-size="32" text-anchor="start">Both addends and their sum have the same shape [1,42,1536].</text></g></svg>
