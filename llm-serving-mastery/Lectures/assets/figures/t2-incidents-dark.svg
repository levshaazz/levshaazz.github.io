<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Same decoder, two different waits</title><desc id="desc">A document assistant has 4096 known prompt positions and 64 requested output tokens. A writer has 32 prompt positions and 1024 outputs. More input expands prompt work; more output expands the dependent chain.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="25" y="50" fill="#f1f3ed" font-size="34" text-anchor="start">Document assistant</text><rect x="25" y="85" width="670" height="125" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="360" y="138" fill="#8cbcff" font-size="34" text-anchor="middle">4,096 prompt tokens</text><text x="360" y="179" fill="#f1f3ed" font-size="34" text-anchor="middle">many known positions</text><line x1="710" y1="147" x2="820" y2="147" stroke="#8cbcff" stroke-width="4"/><path d="M 806.8362615716444 154.19138307906306 L 820 147 L 806.8362615716444 139.80861692093694" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="845" y="85" width="560" height="125" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="1125" y="138" fill="#8cbcff" font-size="34" text-anchor="middle">64 output tokens</text><text x="1125" y="179" fill="#f1f3ed" font-size="34" text-anchor="middle">63 dependent gaps</text><text x="25" y="288" fill="#f1f3ed" font-size="34" text-anchor="start">Long-form writer</text><rect x="25" y="320" width="440" height="125" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="245" y="373" fill="#8cbcff" font-size="34" text-anchor="middle">32 prompt tokens</text><text x="245" y="414" fill="#f1f3ed" font-size="34" text-anchor="middle">small prompt</text><line x1="480" y1="383" x2="575" y2="383" stroke="#8cbcff" stroke-width="4"/><path d="M 561.8362615716444 390.19138307906303 L 575 383 L 561.8362615716444 375.80861692093697" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="600" y="320" width="805" height="125" rx="8" fill="#293744" stroke="#ffcc79" stroke-width="3"/><text x="1002.5" y="373" fill="#ffcc79" font-size="34" text-anchor="middle">1,024 output tokens</text><text x="1002.5" y="414" fill="#f1f3ed" font-size="34" text-anchor="middle">1,023 dependent gaps</text></g></svg>
