<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Rate, residence and average population</title><desc id="desc">At eight requests per second and half a second average residence, average in-flight count is four. At the same rate and two seconds residence, it is sixteen. More resident work does not imply more throughput.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="25" y="90" fill="#f1f3ed" font-size="34" text-anchor="start">8 req/s × 0.5 s</text><circle cx="470" cy="70" r="18" fill="#7addbb"/><circle cx="570" cy="70" r="18" fill="#7addbb"/><circle cx="670" cy="70" r="18" fill="#7addbb"/><circle cx="770" cy="70" r="18" fill="#7addbb"/><text x="1340" y="90" fill="#7addbb" font-size="50" text-anchor="middle">4</text><text x="25" y="290" fill="#f1f3ed" font-size="34" text-anchor="start">8 req/s × 2 s</text><circle cx="470" cy="270" r="18" fill="#ffcc79"/><circle cx="570" cy="270" r="18" fill="#ffcc79"/><circle cx="670" cy="270" r="18" fill="#ffcc79"/><circle cx="770" cy="270" r="18" fill="#ffcc79"/><circle cx="870" cy="270" r="18" fill="#ffcc79"/><circle cx="970" cy="270" r="18" fill="#ffcc79"/><circle cx="1070" cy="270" r="18" fill="#ffcc79"/><circle cx="1170" cy="270" r="18" fill="#ffcc79"/><circle cx="470" cy="330" r="18" fill="#ffcc79"/><circle cx="570" cy="330" r="18" fill="#ffcc79"/><circle cx="670" cy="330" r="18" fill="#ffcc79"/><circle cx="770" cy="330" r="18" fill="#ffcc79"/><circle cx="870" cy="330" r="18" fill="#ffcc79"/><circle cx="970" cy="330" r="18" fill="#ffcc79"/><circle cx="1070" cy="330" r="18" fill="#ffcc79"/><circle cx="1170" cy="330" r="18" fill="#ffcc79"/><text x="1340" y="290" fill="#ffcc79" font-size="50" text-anchor="middle">16</text><text x="470" y="440" fill="#becad4" font-size="34" text-anchor="start">Each dot = one mean resident request</text></g></svg>
