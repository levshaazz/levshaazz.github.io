<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Original demand and retry traffic</title><desc id="desc">100 originals produce 100 attempts. Twenty timed-out originals retry once, adding twenty attempts. Four of those retries also time out but the retry budget prevents another attempt. Total is 120, not 124.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><rect x="70" y="140" width="340" height="120" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="240" y="190.5" fill="#8cbcff" font-size="34" text-anchor="middle">100 originals</text><text x="240" y="231.5" fill="#f1f3ed" font-size="34" text-anchor="middle">100 attempts</text><line x1="425" y1="200" x2="550" y2="200" stroke="#8cbcff" stroke-width="4"/><path d="M 536.8362615716444 207.19138307906306 L 550 200 L 536.8362615716444 192.80861692093694" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="565" y="140" width="340" height="120" rx="8" fill="#293744" stroke="#ffcc79" stroke-width="3"/><text x="735" y="190.5" fill="#ffcc79" font-size="34" text-anchor="middle">20 retry once</text><text x="735" y="231.5" fill="#f1f3ed" font-size="34" text-anchor="middle">+20 attempts</text><line x1="920" y1="200" x2="1030" y2="200" stroke="#8cbcff" stroke-width="4"/><path d="M 1016.8362615716444 207.19138307906306 L 1030 200 L 1016.8362615716444 192.80861692093694" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="1045" y="140" width="330" height="120" rx="8" fill="#293744" stroke="#ffae99" stroke-width="3"/><text x="1210" y="190.5" fill="#ffae99" font-size="34" text-anchor="middle">4 retry failures</text><text x="1210" y="231.5" fill="#f1f3ed" font-size="34" text-anchor="middle">STOP: budget</text><text x="720" y="395" fill="#f1f3ed" font-size="40" text-anchor="middle">Total offered load: 120 attempts for 100 originals</text></g></svg>
