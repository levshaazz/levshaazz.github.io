<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">The weight-only optimum is not the output optimum</title><desc id="desc">Mean squared weight error for seven per-tensor clipping settings, on a logarithmic vertical axis from 5 to 250 in units of MSE times one million. The minimum is at percentile 99, whereas the minimum calibration output error in the next chart is at 99.9. Every weight contributes.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="155" y="45" fill="#172b35" font-size="32" text-anchor="start">Weight MSE × 1,000,000 · log scale</text><line x1="155" y1="355" x2="1295" y2="355" stroke="#4b6070" stroke-width="4"/><line x1="155" y1="355" x2="155" y2="115" stroke="#4b6070" stroke-width="4"/><text x="137" y="365" fill="#4b6070" font-size="30" text-anchor="end">5</text><text x="137" y="322.4758831674661" fill="#4b6070" font-size="30" text-anchor="end">10</text><text x="137" y="223.73794158373303" fill="#4b6070" font-size="30" text-anchor="end">50</text><text x="137" y="125" fill="#4b6070" font-size="30" text-anchor="end">250</text><polyline points="155,297.8695443405415 345,314.2019116402783 535,327.8111111666663 725,326.18939323256905 915,308.66777599049647 1105,253.16623866948078 1295,121.55432254043151" fill="none" stroke="#89540a" stroke-width="6"/><circle cx="155" cy="297.8695443405415" r="8" fill="#89540a"/><circle cx="345" cy="314.2019116402783" r="8" fill="#89540a"/><circle cx="535" cy="327.8111111666663" r="8" fill="#89540a"/><circle cx="725" cy="326.18939323256905" r="8" fill="#89540a"/><circle cx="915" cy="308.66777599049647" r="8" fill="#89540a"/><circle cx="1105" cy="253.16623866948078" r="8" fill="#89540a"/><circle cx="1295" cy="121.55432254043151" r="8" fill="#89540a"/><text x="535" y="289.8111111666663" fill="#172b35" font-size="30" text-anchor="middle">minimum: 7.79</text><text x="155" y="405" fill="#4b6070" font-size="30" text-anchor="middle">95</text><text x="345" y="405" fill="#4b6070" font-size="30" text-anchor="middle">97</text><text x="535" y="405" fill="#4b6070" font-size="30" text-anchor="middle">99</text><text x="725" y="405" fill="#4b6070" font-size="30" text-anchor="middle">99.5</text><text x="915" y="405" fill="#4b6070" font-size="30" text-anchor="middle">99.9</text><text x="1105" y="405" fill="#4b6070" font-size="30" text-anchor="middle">99.99</text><text x="1295" y="405" fill="#4b6070" font-size="30" text-anchor="middle">100</text><text x="725" y="470" fill="#172b35" font-size="30" text-anchor="middle">Retained percentile of absolute weights (tested settings)</text></g></svg>
