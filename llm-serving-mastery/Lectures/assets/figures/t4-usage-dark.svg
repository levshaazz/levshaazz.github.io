<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Usage may arrive after the finish event</title><desc id="desc">The synthetic client asks for stream_options include_usage true. A final accounting event may have choices empty and usage token counters. Code must not index choices[0] unconditionally. The historical ordinary API response reports41prompt plus29completion equals70total.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="25" y="47" fill="#8cbcff" font-size="38" text-anchor="start">stream_options: {&quot;include_usage&quot;: true}</text><rect x="25" y="115" width="560" height="110" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="305" y="160.5" fill="#8cbcff" font-size="34" text-anchor="middle">finish event</text><text x="305" y="201.5" fill="#f1f3ed" font-size="34" text-anchor="middle">choices[0].finish_reason</text><line x1="607" y1="169" x2="750" y2="169" stroke="#8cbcff" stroke-width="4"/><path d="M 736.8362615716444 176.19138307906306 L 750 169 L 736.8362615716444 161.80861692093694" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="775" y="115" width="635" height="110" rx="8" fill="#293744" stroke="#7addbb" stroke-width="3"/><text x="1092.5" y="160.5" fill="#7addbb" font-size="34" text-anchor="middle">usage event</text><text x="1092.5" y="201.5" fill="#f1f3ed" font-size="34" text-anchor="middle">choices: []   usage: {...}</text><text x="25" y="308" fill="#f1f3ed" font-size="32" text-anchor="start">if choices: handle choice     if usage: record counters</text><line x1="25" y1="347" x2="1410" y2="347" stroke="#becad4" stroke-width="4"/><text x="25" y="417" fill="#8cbcff" font-size="36" text-anchor="start">Historical ordinary request only: 41 + 29 = 70 tokens</text><text x="25" y="475" fill="#becad4" font-size="30" text-anchor="start">Two content events do not imply two generated tokens.</text></g></svg>
