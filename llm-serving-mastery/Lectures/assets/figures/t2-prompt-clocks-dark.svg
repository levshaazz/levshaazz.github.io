<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Two clocks around the same recorded call</title><desc id="desc">Prefill synchronized wall 19.63 ms versus CUDA-event 19.09 ms. First decode wall 81.22 ms versus event 81.16 ms. Each covers model forward and argmax; event intervals are not sums of kernel durations.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="25" y="62" fill="#8cbcff" font-size="34" text-anchor="start">Recorded call</text><text x="570" y="62" fill="#8cbcff" font-size="34" text-anchor="start">Sync wall (ms)</text><text x="990" y="62" fill="#8cbcff" font-size="34" text-anchor="start">CUDA events (ms)</text><text x="25" y="170" fill="#f1f3ed" font-size="36" text-anchor="start">Prefill [1, 42]</text><text x="570" y="170" fill="#7addbb" font-size="42" text-anchor="start">19.63</text><text x="990" y="170" fill="#7addbb" font-size="42" text-anchor="start">19.09</text><text x="25" y="274" fill="#f1f3ed" font-size="36" text-anchor="start">First decode [1, 1]</text><text x="570" y="274" fill="#7addbb" font-size="42" text-anchor="start">81.22</text><text x="990" y="274" fill="#7addbb" font-size="42" text-anchor="start">81.16</text><line x1="25" y1="323" x2="1410" y2="323" stroke="#becad4" stroke-width="4"/><text x="25" y="387" fill="#f1f3ed" font-size="34" text-anchor="start">start.record(); forward + argmax; end.record()</text><text x="25" y="451" fill="#becad4" font-size="32" text-anchor="start">end.synchronize(); read wall clock and elapsed_time(end)</text></g></svg>
