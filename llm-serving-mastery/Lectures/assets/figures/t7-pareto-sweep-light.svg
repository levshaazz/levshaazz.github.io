<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Search results: throughput against tail at wave 64</title><desc id="desc">Mock-calibrated sweep, five configurations as points: throughput against p95 TTFT at wave 64. seqs-32 sits alone at 4284 tok/s and 468 ms — faster AND gentler, the frozen profile and the only configuration inside the 800 ms tail SLO. default, seqs-64 and mem-085 cluster at 2322–2380 tok/s and 860–882 ms; chunked sits between at 2426 tok/s and 842 ms. The dashed green line is the two-member Pareto front.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="35" y="44" fill="#4b6070" font-size="31" text-anchor="start">Search results: throughput, tok/s, against p95 tail, wave 64</text><line x1="170" y1="70" x2="170" y2="400" stroke="#4b6070" stroke-width="4"/><line x1="170" y1="400" x2="1330" y2="400" stroke="#4b6070" stroke-width="4"/><text x="156" y="363" fill="#4b6070" font-size="30" text-anchor="end">2500</text><text x="156" y="219" fill="#4b6070" font-size="30" text-anchor="end">3500</text><text x="156" y="76" fill="#4b6070" font-size="30" text-anchor="end">4500</text><text x="170" y="432" fill="#4b6070" font-size="30" text-anchor="middle">400</text><text x="592" y="432" fill="#4b6070" font-size="30" text-anchor="middle">600</text><text x="1014" y="432" fill="#4b6070" font-size="30" text-anchor="middle">800</text><text x="750" y="472" fill="#4b6070" font-size="30" text-anchor="middle">p95 TTFT, ms — lower is better</text><line x1="1014" y1="70" x2="1014" y2="400" stroke="#af372b" stroke-width="4" stroke-dasharray="10 8"/><text x="1000" y="95" fill="#af372b" font-size="30" text-anchor="end">SLO 800 ms</text><text x="1320" y="140" fill="#af372b" font-size="30" text-anchor="end">fails tail SLO</text><polyline points="313.41200000000003,100.91730000000007 1102.1779999999999,367.5977" fill="none" stroke="#146957" stroke-width="6" stroke-dasharray="12 9"/><text x="760" y="175" fill="#146957" font-size="30" text-anchor="start">Pareto front</text><circle cx="313.41200000000003" cy="100.91730000000007" r="11" fill="#146957"/><text x="330" y="98" fill="#146957" font-size="31" text-anchor="start">seqs-32 — frozen</text><circle cx="1102.1779999999999" cy="367.5977" r="8" fill="#175cad"/><text x="1078" y="344" fill="#175cad" font-size="30" text-anchor="end">chunked</text><circle cx="1142.249" cy="374.24175" r="8" fill="#175cad"/><circle cx="1140.1399999999999" cy="374.17" r="8" fill="#175cad"/><circle cx="1186.538" cy="382.52169999999995" r="8" fill="#175cad"/><text x="1400" y="180" fill="#175cad" font-size="30" text-anchor="end">default · seqs-64 · mem-085</text><line x1="1200" y1="192" x2="1160" y2="368" stroke="#175cad" stroke-width="4"/><path d="M 1155.9048083188716 353.56984389915283 L 1160 368 L 1169.9299161568258 356.7573684077788" fill="none" stroke="#175cad" stroke-width="4"/><text x="200" y="250" fill="#4b6070" font-size="30" text-anchor="start">zero timeouts in every config —</text><text x="200" y="290" fill="#4b6070" font-size="30" text-anchor="start">the tail SLO, not speed, eliminates four</text></g></svg>
