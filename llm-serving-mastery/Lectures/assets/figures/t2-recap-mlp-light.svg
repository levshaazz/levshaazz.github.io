<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">SwiGLU gates features before the second addition</title><desc id="desc">SiLU(g)=g sigmoid(g) is multiplied elementwise by the up branch. A down projection restores hidden width and the second residual adds X1. Six-value toy SiLU/product and four-value output/residual are shown.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="25" y="44" fill="#175cad" font-size="32" text-anchor="start">silu(g) = g / (1 + exp(−g));  product = silu(gate) * up</text><text x="25" y="116" fill="#172b35" font-size="32" text-anchor="start">Toy SiLU = [0.216, 0.541, 0.774, 1.192, 0.369, 0.978]</text><text x="25" y="185" fill="#89540a" font-size="32" text-anchor="start">Toy product = [0.040, 0.213, 0.405, 0.874, -0.155, -0.411]</text><line x1="25" y1="226" x2="1410" y2="226" stroke="#4b6070" stroke-width="4"/><text x="25" y="289" fill="#175cad" font-size="32" text-anchor="start">down = product @ Wdown.T   [1,42,8960] → [1,42,1536]</text><text x="25" y="356" fill="#172b35" font-size="34" text-anchor="start">Toy down[2] = [-0.006, 0.038, 0.060, 0.177]</text><text x="25" y="423" fill="#146957" font-size="34" text-anchor="start">X2 = X1 + down = [1.155, 2.531, 3.375, 4.825]</text><text x="25" y="470" fill="#4b6070" font-size="30" text-anchor="start">Second bypass starts at X1, after the first addition.</text></g></svg>
