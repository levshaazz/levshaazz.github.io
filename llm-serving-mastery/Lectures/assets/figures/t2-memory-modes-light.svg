<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Three memory failures need three tests</title><desc id="desc">Capacity asks whether live tensors fit and is tested with an allocation ledger. Bandwidth asks bytes per second and needs traffic/time evidence. Latency asks whether dependent fetches can be hidden and needs a timeline or stall evidence.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><rect x="25" y="40" width="315" height="105" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="182.5" y="83" fill="#175cad" font-size="34" text-anchor="middle">Capacity</text><text x="182.5" y="124" fill="#172b35" font-size="34" text-anchor="middle">live bytes</text><line x1="360" y1="92" x2="535" y2="92" stroke="#175cad" stroke-width="4"/><path d="M 521.8362615716444 99.19138307906304 L 535 92 L 521.8362615716444 84.80861692093696" fill="none" stroke="#175cad" stroke-width="4"/><rect x="560" y="40" width="825" height="105" rx="8" fill="#e6edf3" stroke="#af372b" stroke-width="3"/><text x="972.5" y="103.5" fill="#af372b" font-size="34" text-anchor="middle">allocation / peak</text><rect x="25" y="185" width="315" height="105" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="182.5" y="228" fill="#175cad" font-size="34" text-anchor="middle">Bandwidth</text><text x="182.5" y="269" fill="#172b35" font-size="34" text-anchor="middle">bytes / second</text><line x1="360" y1="237" x2="535" y2="237" stroke="#175cad" stroke-width="4"/><path d="M 521.8362615716444 244.19138307906306 L 535 237 L 521.8362615716444 229.80861692093694" fill="none" stroke="#175cad" stroke-width="4"/><rect x="560" y="185" width="825" height="105" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="972.5" y="248.5" fill="#175cad" font-size="34" text-anchor="middle">traffic counters</text><rect x="25" y="330" width="315" height="105" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="182.5" y="373" fill="#175cad" font-size="34" text-anchor="middle">Latency</text><text x="182.5" y="414" fill="#172b35" font-size="34" text-anchor="middle">dependency wait</text><line x1="360" y1="382" x2="535" y2="382" stroke="#175cad" stroke-width="4"/><path d="M 521.8362615716444 389.19138307906303 L 535 382 L 521.8362615716444 374.80861692093697" fill="none" stroke="#175cad" stroke-width="4"/><rect x="560" y="330" width="825" height="105" rx="8" fill="#e6edf3" stroke="#89540a" stroke-width="3"/><text x="972.5" y="393.5" fill="#89540a" font-size="34" text-anchor="middle">gaps / stalls</text></g></svg>
