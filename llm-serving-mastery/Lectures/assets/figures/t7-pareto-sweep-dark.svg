<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Search results: throughput against tail at wave 64</title><desc id="desc">Mock-calibrated sweep, five configurations as points: throughput against p95 TTFT at wave 64. pair-seqs32-chunked sits alone at 4436.7 tok/s and 450 ms — the fastest SLO-eligible point, the frozen profile, and the single member of the Pareto front; seqs-32 follows at 4283.0 tok/s and 468 ms, also inside the 800 ms tail SLO. default, mem-085 and chunked cluster at 2318–2424 tok/s and 842–882 ms. The green point marks the one-member front, which dominates every other configuration on both axes.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="35" y="44" fill="#becad4" font-size="31" text-anchor="start">Search results: throughput, tok/s, against p95 tail, wave 64</text><line x1="170" y1="70" x2="170" y2="400" stroke="#becad4" stroke-width="4"/><line x1="170" y1="400" x2="1330" y2="400" stroke="#becad4" stroke-width="4"/><text x="156" y="368" fill="#becad4" font-size="30" text-anchor="end">2500</text><text x="156" y="230" fill="#becad4" font-size="30" text-anchor="end">3500</text><text x="156" y="92" fill="#becad4" font-size="30" text-anchor="end">4500</text><text x="170" y="432" fill="#becad4" font-size="30" text-anchor="middle">400</text><text x="592" y="432" fill="#becad4" font-size="30" text-anchor="middle">600</text><text x="1014" y="432" fill="#becad4" font-size="30" text-anchor="middle">800</text><text x="750" y="472" fill="#becad4" font-size="30" text-anchor="middle">p95 TTFT, ms — lower is better</text><line x1="1014" y1="70" x2="1014" y2="400" stroke="#ffae99" stroke-width="4" stroke-dasharray="10 8"/><text x="1000" y="95" fill="#ffae99" font-size="30" text-anchor="end">SLO 800 ms</text><text x="1320" y="140" fill="#ffae99" font-size="30" text-anchor="end">fails tail SLO</text><circle cx="275.45" cy="91.33539999999999" r="11" fill="#7addbb"/><text x="330" y="98" fill="#7addbb" font-size="31" text-anchor="start">pair-seqs32-chunked — frozen</text><text x="500" y="190" fill="#7addbb" font-size="30" text-anchor="start">Pareto front: one member</text><circle cx="313.41200000000003" cy="112.54599999999999" r="8" fill="#8cbcff"/><text x="400" y="150" fill="#8cbcff" font-size="30" text-anchor="start">seqs-32</text><circle cx="1102.1779999999999" cy="369.10179999999997" r="8" fill="#8cbcff"/><text x="1078" y="344" fill="#8cbcff" font-size="30" text-anchor="end">chunked</text><circle cx="1140.1399999999999" cy="375.5602" r="8" fill="#8cbcff"/><circle cx="1186.538" cy="383.716" r="8" fill="#8cbcff"/><text x="1400" y="180" fill="#8cbcff" font-size="30" text-anchor="end">default · mem-085</text><line x1="1200" y1="192" x2="1160" y2="368" stroke="#8cbcff" stroke-width="4"/><path d="M 1155.9048083188716 353.56984389915283 L 1160 368 L 1169.9299161568258 356.7573684077788" fill="none" stroke="#8cbcff" stroke-width="4"/><text x="200" y="250" fill="#becad4" font-size="30" text-anchor="start">zero timeouts in every config —</text><text x="200" y="290" fill="#becad4" font-size="30" text-anchor="start">the tail SLO, not speed, eliminates three of five</text></g></svg>
