<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Per-GPU memory ledger: weights and KV split by tp, the fixed costs do not</title><desc id="desc">Stacked bars of one GPU's memory at TP degree 1, 2, 4 and 8 for a teaching-grade 8B model: weights 16 GB split by tp (blue), KV cache 4 GB split by tp (green), fixed per-GPU costs — activations plus framework overhead — 1.5 GB that does not shrink (amber). A red line marks the declared 15 GiB usable budget of one accelerator: at tp=1 the bar crosses it (does not fit), tp=2 fits with a thin margin, higher degrees fit comfortably.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="35" y="44" fill="#becad4" font-size="31" text-anchor="start">One GPU's ledger at TP degree p: weights/p + KV/p + fixed</text><text x="280" y="88" fill="#8cbcff" font-size="30" text-anchor="start">blue: weights/p</text><text x="560" y="88" fill="#7addbb" font-size="30" text-anchor="start">green: KV/p</text><text x="790" y="88" fill="#ffcc79" font-size="30" text-anchor="start">amber: fixed (activations + framework)</text><rect x="1060" y="104" width="156" height="332" fill="#ffae99" opacity="0.07"/><line x1="1060" y1="104" x2="1060" y2="436" stroke="#ffae99" stroke-width="4" stroke-dasharray="10 8"/><text x="1060" y="468" fill="#ffae99" font-size="30" text-anchor="middle">budget: 15 GiB usable (declared)</text><text x="150" y="168" fill="#f1f3ed" font-size="30" text-anchor="middle">tp=1</text><rect x="280" y="134" width="832" height="60" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="696" y="175" fill="#8cbcff" font-size="34" text-anchor="middle">16 GB</text><rect x="1112" y="134" width="208" height="60" rx="8" fill="#293744" stroke="#7addbb" stroke-width="3"/><text x="1216" y="175" fill="#7addbb" font-size="34" text-anchor="middle">4 GB</text><rect x="1320" y="134" width="78" height="60" rx="8" fill="#293744" stroke="#ffcc79" stroke-width="3"/><text x="1359" y="175" fill="#ffcc79" font-size="34" text-anchor="middle">1.5</text><text x="150" y="242" fill="#f1f3ed" font-size="30" text-anchor="middle">tp=2</text><rect x="280" y="208" width="416" height="60" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="488" y="249" fill="#8cbcff" font-size="34" text-anchor="middle">8 GB</text><rect x="696" y="208" width="104" height="60" rx="8" fill="#293744" stroke="#7addbb" stroke-width="3"/><text x="748" y="249" fill="#7addbb" font-size="34" text-anchor="middle">2 GB</text><rect x="800" y="208" width="78" height="60" rx="8" fill="#293744" stroke="#ffcc79" stroke-width="3"/><text x="839" y="249" fill="#ffcc79" font-size="34" text-anchor="middle">1.5</text><text x="150" y="316" fill="#f1f3ed" font-size="30" text-anchor="middle">tp=4</text><rect x="280" y="282" width="208" height="60" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="384" y="323" fill="#8cbcff" font-size="34" text-anchor="middle">4 GB</text><rect x="488" y="282" width="58" height="60" fill="#7addbb" opacity="0.14"/><text x="517" y="324" fill="#7addbb" font-size="30" text-anchor="middle">1</text><rect x="546" y="282" width="78" height="60" rx="8" fill="#293744" stroke="#ffcc79" stroke-width="3"/><text x="585" y="323" fill="#ffcc79" font-size="34" text-anchor="middle">1.5</text><text x="150" y="390" fill="#f1f3ed" font-size="30" text-anchor="middle">tp=8</text><rect x="280" y="356" width="104" height="60" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="332" y="397" fill="#8cbcff" font-size="34" text-anchor="middle">2 GB</text><rect x="384" y="356" width="58" height="60" fill="#7addbb" opacity="0.14"/><text x="413" y="398" fill="#7addbb" font-size="30" text-anchor="middle">0.5</text><rect x="442" y="356" width="78" height="60" rx="8" fill="#293744" stroke="#ffcc79" stroke-width="3"/><text x="481" y="397" fill="#ffcc79" font-size="34" text-anchor="middle">1.5</text></g></svg>
