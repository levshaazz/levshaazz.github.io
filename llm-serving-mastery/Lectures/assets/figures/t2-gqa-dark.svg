<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Query heads are not stored KV heads</title><desc id="desc">The pinned Qwen2.5-3B has 16 query heads and two KV heads. Eight query heads share each KV head. Logical KV payload uses two KV heads, not sixteen query heads; head dimension is 2048 divided by 16 equals 128.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><rect x="25" y="45" width="145" height="62" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="97.5" y="87" fill="#8cbcff" font-size="34" text-anchor="middle">Q1</text><rect x="199" y="45" width="145" height="62" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="271.5" y="87" fill="#8cbcff" font-size="34" text-anchor="middle">Q2</text><rect x="373" y="45" width="145" height="62" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="445.5" y="87" fill="#8cbcff" font-size="34" text-anchor="middle">Q3</text><rect x="547" y="45" width="145" height="62" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="619.5" y="87" fill="#8cbcff" font-size="34" text-anchor="middle">Q4</text><rect x="721" y="45" width="145" height="62" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="793.5" y="87" fill="#8cbcff" font-size="34" text-anchor="middle">Q5</text><rect x="895" y="45" width="145" height="62" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="967.5" y="87" fill="#8cbcff" font-size="34" text-anchor="middle">Q6</text><rect x="1069" y="45" width="145" height="62" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="1141.5" y="87" fill="#8cbcff" font-size="34" text-anchor="middle">Q7</text><rect x="1243" y="45" width="145" height="62" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="1315.5" y="87" fill="#8cbcff" font-size="34" text-anchor="middle">Q8</text><line x1="715" y1="125" x2="715" y2="158" stroke="#8cbcff" stroke-width="4"/><path d="M 707.808616920937 144.8362615716444 L 715 158 L 722.191383079063 144.8362615716444" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="495" y="170" width="440" height="65" rx="8" fill="#293744" stroke="#7addbb" stroke-width="3"/><text x="715" y="213.5" fill="#7addbb" font-size="34" text-anchor="middle">KV head 1</text><rect x="25" y="275" width="145" height="62" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="97.5" y="317" fill="#8cbcff" font-size="34" text-anchor="middle">Q9</text><rect x="199" y="275" width="145" height="62" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="271.5" y="317" fill="#8cbcff" font-size="34" text-anchor="middle">Q10</text><rect x="373" y="275" width="145" height="62" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="445.5" y="317" fill="#8cbcff" font-size="34" text-anchor="middle">Q11</text><rect x="547" y="275" width="145" height="62" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="619.5" y="317" fill="#8cbcff" font-size="34" text-anchor="middle">Q12</text><rect x="721" y="275" width="145" height="62" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="793.5" y="317" fill="#8cbcff" font-size="34" text-anchor="middle">Q13</text><rect x="895" y="275" width="145" height="62" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="967.5" y="317" fill="#8cbcff" font-size="34" text-anchor="middle">Q14</text><rect x="1069" y="275" width="145" height="62" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="1141.5" y="317" fill="#8cbcff" font-size="34" text-anchor="middle">Q15</text><rect x="1243" y="275" width="145" height="62" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="1315.5" y="317" fill="#8cbcff" font-size="34" text-anchor="middle">Q16</text><line x1="715" y1="355" x2="715" y2="388" stroke="#8cbcff" stroke-width="4"/><path d="M 707.808616920937 374.8362615716444 L 715 388 L 722.191383079063 374.8362615716444" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="495" y="400" width="440" height="65" rx="8" fill="#293744" stroke="#7addbb" stroke-width="3"/><text x="715" y="443.5" fill="#7addbb" font-size="34" text-anchor="middle">KV head 2</text><text x="1000" y="208" fill="#becad4" font-size="32" text-anchor="start">d<tspan baseline-shift="sub" font-size="75%">h</tspan> = 128</text><text x="1000" y="437" fill="#7addbb" font-size="32" text-anchor="start">2 KV ≠ 16 Q</text></g></svg>
