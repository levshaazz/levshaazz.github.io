<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">One pass: order, receipt, serving window</title><desc id="desc">The gateway as one pass with five stages: the client issues one request; validation enforces the public caps at the door; admission takes a service slot, a bounded waiting slot, or refuses with 429; the engine (here the declared mock worker) generates; the error map turns every terminal outcome into one honest status code. Below the stages, one request id travels through all four records a human may read at night: the reply header, the engine journal, the error body and the metrics snapshot.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="35" y="44" fill="#becad4" font-size="31" text-anchor="start">One pass: order, receipt, serving window</text><rect x="40" y="96" width="232" height="84" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="156" y="128.5" fill="#8cbcff" font-size="34" text-anchor="middle">client</text><text x="156" y="169.5" fill="#f1f3ed" font-size="34" text-anchor="middle">one request</text><line x1="276" y1="140" x2="304" y2="140" stroke="#8cbcff" stroke-width="4"/><path d="M 290.8362615716444 147.19138307906306 L 304 140 L 290.8362615716444 132.80861692093694" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="312" y="96" width="232" height="84" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="428" y="128.5" fill="#8cbcff" font-size="34" text-anchor="middle">validate</text><text x="428" y="169.5" fill="#f1f3ed" font-size="34" text-anchor="middle">400 at door</text><line x1="548" y1="140" x2="576" y2="140" stroke="#8cbcff" stroke-width="4"/><path d="M 562.8362615716444 147.19138307906306 L 576 140 L 562.8362615716444 132.80861692093694" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="584" y="96" width="232" height="84" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="700" y="128.5" fill="#8cbcff" font-size="34" text-anchor="middle">admit</text><text x="700" y="169.5" fill="#f1f3ed" font-size="34" text-anchor="middle">queue or 429</text><line x1="820" y1="140" x2="848" y2="140" stroke="#8cbcff" stroke-width="4"/><path d="M 834.8362615716444 147.19138307906306 L 848 140 L 834.8362615716444 132.80861692093694" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="856" y="96" width="232" height="84" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="972" y="128.5" fill="#8cbcff" font-size="34" text-anchor="middle">engine</text><text x="972" y="169.5" fill="#f1f3ed" font-size="34" text-anchor="middle">mock worker</text><line x1="1092" y1="140" x2="1120" y2="140" stroke="#8cbcff" stroke-width="4"/><path d="M 1106.8362615716444 147.19138307906306 L 1120 140 L 1106.8362615716444 132.80861692093694" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="1128" y="96" width="232" height="84" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="1244" y="128.5" fill="#8cbcff" font-size="34" text-anchor="middle">map</text><text x="1244" y="169.5" fill="#f1f3ed" font-size="34" text-anchor="middle">honest codes</text><text x="70" y="222" fill="#becad4" font-size="30" text-anchor="start">one request id travels the whole pass</text><line x1="70" y1="250" x2="1330" y2="250" stroke="#becad4" stroke-width="4" stroke-dasharray="10 8"/><circle cx="280" cy="250" r="8" fill="#8cbcff"/><text x="280" y="296" fill="#becad4" font-size="30" text-anchor="middle">reply header</text><circle cx="580" cy="250" r="8" fill="#8cbcff"/><text x="580" y="296" fill="#becad4" font-size="30" text-anchor="middle">engine journal</text><circle cx="880" cy="250" r="8" fill="#8cbcff"/><text x="880" y="296" fill="#becad4" font-size="30" text-anchor="middle">error body</text><circle cx="1180" cy="250" r="8" fill="#8cbcff"/><text x="1180" y="296" fill="#becad4" font-size="30" text-anchor="middle">metrics</text><rect x="40" y="340" width="420" height="84" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="250" y="372.5" fill="#8cbcff" font-size="34" text-anchor="middle">refusal is an answer</text><text x="250" y="413.5" fill="#f1f3ed" font-size="34" text-anchor="middle">429 beats silence</text><rect x="500" y="340" width="420" height="84" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="710" y="372.5" fill="#8cbcff" font-size="34" text-anchor="middle">a leaving client</text><text x="710" y="413.5" fill="#f1f3ed" font-size="34" text-anchor="middle">stops paying</text><rect x="960" y="340" width="420" height="84" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="1170" y="372.5" fill="#8cbcff" font-size="34" text-anchor="middle">never fake success</text><text x="1170" y="413.5" fill="#f1f3ed" font-size="34" text-anchor="middle">no 200 error body</text><text x="35" y="466" fill="#f1f3ed" font-size="30" text-anchor="start">The pass: the ticket you hold is being cooked or honestly refused</text></g></svg>
