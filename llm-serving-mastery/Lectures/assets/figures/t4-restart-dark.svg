<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">A clean restart preserves immutable assets</title><desc id="desc">Keep the pinned weights, tokenizer and matching packages in durable ignored caches. Recreate server process, sockets and temporary request state. Verify headroom and free port, launch one server, probe its contract, stop it, then verify GPU and port return to baseline.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><rect x="25" y="43" width="650" height="146" rx="8" fill="#293744" stroke="#7addbb" stroke-width="3"/><text x="350" y="86" fill="#7addbb" font-size="34" text-anchor="middle">KEEP: immutable snapshot</text><text x="350" y="127" fill="#f1f3ed" font-size="34" text-anchor="middle">weights + tokenizer +</text><text x="350" y="168" fill="#f1f3ed" font-size="34" text-anchor="middle">package environment</text><rect x="750" y="43" width="660" height="146" rx="8" fill="#293744" stroke="#ffcc79" stroke-width="3"/><text x="1080" y="106.5" fill="#ffcc79" font-size="34" text-anchor="middle">RECREATE: live process</text><text x="1080" y="147.5" fill="#f1f3ed" font-size="34" text-anchor="middle">PID + socket + request state</text><line x1="25" y1="211" x2="1410" y2="211" stroke="#becad4" stroke-width="4"/><rect x="25" y="271" width="306" height="118" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="178" y="320.5" fill="#8cbcff" font-size="34" text-anchor="middle">preflight</text><text x="178" y="361.5" fill="#f1f3ed" font-size="34" text-anchor="middle">free port / RAM</text><line x1="342" y1="330" x2="369" y2="330" stroke="#8cbcff" stroke-width="4"/><path d="M 355.8362615716444 337.19138307906303 L 369 330 L 355.8362615716444 322.80861692093697" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="381" y="271" width="306" height="118" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="534" y="320.5" fill="#8cbcff" font-size="34" text-anchor="middle">start</text><text x="534" y="361.5" fill="#f1f3ed" font-size="34" text-anchor="middle">bounded wait</text><line x1="698" y1="330" x2="725" y2="330" stroke="#8cbcff" stroke-width="4"/><path d="M 711.8362615716444 337.19138307906303 L 725 330 L 711.8362615716444 322.80861692093697" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="737" y="271" width="306" height="118" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="890" y="320.5" fill="#8cbcff" font-size="34" text-anchor="middle">probe</text><text x="890" y="361.5" fill="#f1f3ed" font-size="34" text-anchor="middle">API contract</text><line x1="1054" y1="330" x2="1081" y2="330" stroke="#8cbcff" stroke-width="4"/><path d="M 1067.8362615716444 337.19138307906303 L 1081 330 L 1067.8362615716444 322.80861692093697" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="1093" y="271" width="306" height="118" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="1246" y="320.5" fill="#8cbcff" font-size="34" text-anchor="middle">stop</text><text x="1246" y="361.5" fill="#f1f3ed" font-size="34" text-anchor="middle">verify baseline</text><text x="25" y="464" fill="#becad4" font-size="30" text-anchor="start">Cleanup failure blocks the next GPU process. Model-cache deletion is unrelated.</text></g></svg>
