<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Twelve query heads share two KV heads</title><desc id="desc">Reshape Q from [1,42,1536] to [1,42,12,128], then transpose to [1,12,42,128]. K and V become [1,2,42,128]. Query heads 0–5 use KV head 0 and heads 6–11 use KV head 1. Stored KV still has two heads, not twelve.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="25" y="43" fill="#175cad" font-size="36" text-anchor="start">q.view(1,42,12,128).transpose(1,2)</text><text x="25" y="101" fill="#172b35" font-size="38" text-anchor="start">Q [1,12,42,128]      K,V [1,2,42,128]</text><rect x="25" y="154" width="625" height="82" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="337.5" y="206" fill="#175cad" font-size="34" text-anchor="middle">Q heads 0,1,2,3,4,5</text><rect x="775" y="154" width="625" height="82" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="1087.5" y="206" fill="#175cad" font-size="34" text-anchor="middle">Q heads 6,7,8,9,10,11</text><line x1="337" y1="250" x2="337" y2="297" stroke="#146957" stroke-width="4"/><path d="M 329.80861692093697 283.8362615716444 L 337 297 L 344.19138307906303 283.8362615716444" fill="none" stroke="#146957" stroke-width="4"/><line x1="1087" y1="250" x2="1087" y2="297" stroke="#89540a" stroke-width="4"/><path d="M 1079.8086169209369 283.8362615716444 L 1087 297 L 1094.1913830790631 283.8362615716444" fill="none" stroke="#89540a" stroke-width="4"/><rect x="25" y="315" width="625" height="80" rx="8" fill="#e6edf3" stroke="#146957" stroke-width="3"/><text x="337.5" y="366" fill="#146957" font-size="34" text-anchor="middle">stored KV head 0</text><rect x="775" y="315" width="625" height="80" rx="8" fill="#e6edf3" stroke="#89540a" stroke-width="3"/><text x="1087.5" y="366" fill="#89540a" font-size="34" text-anchor="middle">stored KV head 1</text><text x="25" y="463" fill="#4b6070" font-size="32" text-anchor="start">12 / 2 = 6 query heads per KV head; 1536 / 12 = 128 values per head</text></g></svg>
