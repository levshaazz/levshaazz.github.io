<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Prefill consumes the known prompt</title><desc id="desc">Four known prompt token IDs enter one prompt-processing phase. That phase produces KV state for the prompt and the distribution from which the first output token is selected.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><rect x="30" y="40" width="145" height="80" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="102.5" y="91" fill="#175cad" font-size="34" text-anchor="middle">x1</text><rect x="200" y="40" width="145" height="80" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="272.5" y="91" fill="#175cad" font-size="34" text-anchor="middle">x2</text><rect x="370" y="40" width="145" height="80" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="442.5" y="91" fill="#175cad" font-size="34" text-anchor="middle">x3</text><rect x="540" y="40" width="145" height="80" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="612.5" y="91" fill="#175cad" font-size="34" text-anchor="middle">x4</text><line x1="370" y1="140" x2="370" y2="200" stroke="#175cad" stroke-width="4"/><path d="M 362.80861692093697 186.8362615716444 L 370 200 L 377.19138307906303 186.8362615716444" fill="none" stroke="#175cad" stroke-width="4"/><rect x="90" y="220" width="560" height="100" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="370" y="281" fill="#175cad" font-size="34" text-anchor="middle">Prompt forward pass</text><line x1="675" y1="270" x2="805" y2="135" stroke="#175cad" stroke-width="4"/><path d="M 801.0491808632713 149.47034996635736 L 805 135 L 790.6889836736519 139.49386378376087" fill="none" stroke="#175cad" stroke-width="4"/><line x1="675" y1="270" x2="805" y2="355" stroke="#175cad" stroke-width="4"/><path d="M 790.0468711201886 353.81512165023076 L 805 355 L 797.9178307381524 341.77718341099217" fill="none" stroke="#175cad" stroke-width="4"/><rect x="830" y="80" width="540" height="100" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="1100" y="120.5" fill="#175cad" font-size="34" text-anchor="middle">Prompt KV state</text><text x="1100" y="161.5" fill="#172b35" font-size="34" text-anchor="middle">reused in decode</text><rect x="830" y="315" width="540" height="100" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="1100" y="355.5" fill="#175cad" font-size="34" text-anchor="middle">Next-token logits</text><text x="1100" y="396.5" fill="#172b35" font-size="34" text-anchor="middle">select output y₁</text><text x="40" y="430" fill="#4b6070" font-size="32" text-anchor="start">Known input: all four positions</text></g></svg>
