<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">One request: observed client event arrivals</title><desc id="desc">Elapsed milliseconds from sending one raw greeting request. Nine content events arrive from 58.722 to 143.003 ms. Finish, usage and DONE are close together around 173.6 ms. Points are events, not tokens; first role event is not first content.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="25" y="96" fill="#f1f3ed" font-size="32" text-anchor="start">role</text><line x1="310" y1="85" x2="1350" y2="85" stroke="#becad4" stroke-width="4" stroke-dasharray="10 8"/><text x="25" y="161" fill="#f1f3ed" font-size="32" text-anchor="start">content</text><line x1="310" y1="150" x2="1350" y2="150" stroke="#becad4" stroke-width="4" stroke-dasharray="10 8"/><text x="25" y="226" fill="#f1f3ed" font-size="32" text-anchor="start">finish</text><line x1="310" y1="215" x2="1350" y2="215" stroke="#becad4" stroke-width="4" stroke-dasharray="10 8"/><text x="25" y="291" fill="#f1f3ed" font-size="32" text-anchor="start">usage</text><line x1="310" y1="280" x2="1350" y2="280" stroke="#becad4" stroke-width="4" stroke-dasharray="10 8"/><text x="25" y="356" fill="#f1f3ed" font-size="32" text-anchor="start">DONE</text><line x1="310" y1="345" x2="1350" y2="345" stroke="#becad4" stroke-width="4" stroke-dasharray="10 8"/><line x1="310" y1="65" x2="310" y2="371" stroke="#becad4" stroke-width="4" stroke-dasharray="10 8"/><text x="310" y="416" fill="#becad4" font-size="30" text-anchor="middle">0</text><line x1="585" y1="65" x2="585" y2="371" stroke="#becad4" stroke-width="4" stroke-dasharray="10 8"/><text x="585" y="416" fill="#becad4" font-size="30" text-anchor="middle">50</text><line x1="860" y1="65" x2="860" y2="371" stroke="#becad4" stroke-width="4" stroke-dasharray="10 8"/><text x="860" y="416" fill="#becad4" font-size="30" text-anchor="middle">100</text><line x1="1135" y1="65" x2="1135" y2="371" stroke="#becad4" stroke-width="4" stroke-dasharray="10 8"/><text x="1135" y="416" fill="#becad4" font-size="30" text-anchor="middle">150</text><circle cx="632.6346089995786" cy="85" r="8" fill="#7addbb"/><circle cx="632.9683874988041" cy="150" r="8" fill="#8cbcff"/><circle cx="680.3105999957188" cy="150" r="8" fill="#8cbcff"/><circle cx="730.8169459980127" cy="150" r="8" fill="#8cbcff"/><circle cx="785.745886000368" cy="150" r="8" fill="#8cbcff"/><circle cx="837.7712659953977" cy="150" r="8" fill="#8cbcff"/><circle cx="889.2957390003721" cy="150" r="8" fill="#8cbcff"/><circle cx="939.8566724981356" cy="150" r="8" fill="#8cbcff"/><circle cx="993.1475199987835" cy="150" r="8" fill="#8cbcff"/><circle cx="1096.516021503303" cy="150" r="8" fill="#8cbcff"/><circle cx="1264.487539495858" cy="215" r="8" fill="#7addbb"/><circle cx="1264.716784995071" cy="280" r="8" fill="#7addbb"/><circle cx="1264.9012220004442" cy="345" r="8" fill="#7addbb"/><text x="825" y="474" fill="#f1f3ed" font-size="32" text-anchor="middle">Client arrival after send (ms)</text></g></svg>
