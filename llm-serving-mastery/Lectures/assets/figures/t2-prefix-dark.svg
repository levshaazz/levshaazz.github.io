<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Identical prefixes can share work—not all state</title><desc id="desc">Two requests share an identical reusable prefix but have separate continuation tokens and KV. Reuse requires matching model/tokenization/position and safe isolation. The prefix cannot be evicted while still referenced.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><rect x="40" y="170" width="575" height="135" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="327.5" y="228" fill="#8cbcff" font-size="34" text-anchor="middle">Identical reusable prefix</text><text x="327.5" y="269" fill="#f1f3ed" font-size="34" text-anchor="middle">two live references</text><line x1="640" y1="235" x2="840" y2="105" stroke="#8cbcff" stroke-width="4"/><path d="M 832.8821675508522 118.20365332875181 L 840 105 L 825.0437275453355 106.14451485872615" fill="none" stroke="#8cbcff" stroke-width="4"/><line x1="640" y1="235" x2="840" y2="365" stroke="#8cbcff" stroke-width="4"/><path d="M 825.0437275453355 363.85548514127385 L 840 365 L 832.8821675508522 351.7963466712482" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="870" y="50" width="530" height="115" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="1135" y="98" fill="#8cbcff" font-size="34" text-anchor="middle">Request A continuation</text><text x="1135" y="139" fill="#f1f3ed" font-size="34" text-anchor="middle">private KV</text><rect x="870" y="315" width="530" height="115" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="1135" y="363" fill="#8cbcff" font-size="34" text-anchor="middle">Request B continuation</text><text x="1135" y="404" fill="#f1f3ed" font-size="34" text-anchor="middle">private KV</text><text x="35" y="442" fill="#ffcc79" font-size="34" text-anchor="start">A finishes ≠ shared prefix is unreferenced</text></g></svg>
