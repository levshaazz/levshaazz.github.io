<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Scheduling at token-step boundaries</title><desc id="desc">Three requests across four scheduling steps. Request A advances twice then finishes; B joins and continues; C joins when A leaves. Request-level locking would keep B and C waiting for all of A.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="390" y="48" fill="#becad4" font-size="34" text-anchor="middle">Step 1</text><text x="645" y="48" fill="#becad4" font-size="34" text-anchor="middle">Step 2</text><text x="900" y="48" fill="#becad4" font-size="34" text-anchor="middle">Step 3</text><text x="1155" y="48" fill="#becad4" font-size="34" text-anchor="middle">Step 4</text><text x="45" y="128" fill="#f1f3ed" font-size="34" text-anchor="start">Request A</text><rect x="280" y="77" width="220" height="76" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="390" y="126" fill="#8cbcff" font-size="34" text-anchor="middle">A₁</text><rect x="535" y="77" width="220" height="76" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="645" y="126" fill="#8cbcff" font-size="34" text-anchor="middle">A₂</text><rect x="790" y="77" width="220" height="76" rx="8" fill="#293744" stroke="#becad4" stroke-width="3"/><text x="900" y="126" fill="#becad4" font-size="34" text-anchor="middle">finished</text><rect x="1045" y="77" width="220" height="76" rx="8" fill="#293744" stroke="#becad4" stroke-width="3"/><text x="1155" y="126" fill="#becad4" font-size="34" text-anchor="middle">released</text><text x="45" y="246" fill="#f1f3ed" font-size="34" text-anchor="start">Request B</text><rect x="280" y="195" width="220" height="76" rx="8" fill="#293744" stroke="#becad4" stroke-width="3"/><text x="390" y="244" fill="#becad4" font-size="34" text-anchor="middle">waiting</text><rect x="535" y="195" width="220" height="76" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="645" y="244" fill="#8cbcff" font-size="34" text-anchor="middle">B₁</text><rect x="790" y="195" width="220" height="76" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="900" y="244" fill="#8cbcff" font-size="34" text-anchor="middle">B₂</text><rect x="1045" y="195" width="220" height="76" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="1155" y="244" fill="#8cbcff" font-size="34" text-anchor="middle">B₃</text><text x="45" y="364" fill="#f1f3ed" font-size="34" text-anchor="start">Request C</text><rect x="280" y="313" width="220" height="76" rx="8" fill="#293744" stroke="#becad4" stroke-width="3"/><text x="390" y="362" fill="#becad4" font-size="34" text-anchor="middle">waiting</text><rect x="535" y="313" width="220" height="76" rx="8" fill="#293744" stroke="#becad4" stroke-width="3"/><text x="645" y="362" fill="#becad4" font-size="34" text-anchor="middle">waiting</text><rect x="790" y="313" width="220" height="76" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="900" y="362" fill="#8cbcff" font-size="34" text-anchor="middle">C₁</text><rect x="1045" y="313" width="220" height="76" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="1155" y="362" fill="#8cbcff" font-size="34" text-anchor="middle">C₂</text></g></svg>
