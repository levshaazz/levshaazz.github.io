<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">One forward pass reads every weight once — for the whole batch</title><desc id="desc">Weight traffic per output token falls as batch size grows: 6.2 GiB divided by N requests times 32 tokens each. N=1 moves about 198 MiB of weights per generated token; N=64 about 3.1 MiB. This arithmetic is why throughput grows with concurrency before any resource saturates.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="35" y="40" fill="#4b6070" font-size="31" text-anchor="start">Weight bytes moved per generated token (MiB, arithmetic)</text><rect x="150" y="132.1599999999999" width="180" height="267.8400000000001" fill="#89540a" opacity="1"/><text x="240" y="118.15999999999991" fill="#172b35" font-size="31" text-anchor="middle">198.4</text><text x="240" y="432" fill="#4b6070" font-size="30" text-anchor="middle">N = 1</text><rect x="440" y="366.52" width="180" height="33.48000000000001" fill="#175cad" opacity="1"/><text x="530" y="352.52" fill="#172b35" font-size="31" text-anchor="middle">24.8</text><text x="530" y="432" fill="#4b6070" font-size="30" text-anchor="middle">N = 8</text><rect x="730" y="390" width="180" height="10" fill="#175cad" opacity="1"/><text x="820" y="376" fill="#172b35" font-size="31" text-anchor="middle">6.2</text><text x="820" y="432" fill="#4b6070" font-size="30" text-anchor="middle">N = 32</text><rect x="1020" y="390" width="180" height="10" fill="#175cad" opacity="1"/><text x="1110" y="376" fill="#172b35" font-size="31" text-anchor="middle">3.1</text><text x="1110" y="432" fill="#4b6070" font-size="30" text-anchor="middle">N = 64</text><line x1="120" y1="400" x2="1240" y2="400" stroke="#4b6070" stroke-width="4"/><text x="35" y="80" fill="#172b35" font-size="30" text-anchor="start">6.2 GiB / (N × 32 tokens) — more requests per pass, fewer weight bytes per token</text></g></svg>
