<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Optimize the share of wall time, not a table rank</title><desc id="desc">In 100 ms wall time, kernels occupy 60 ms; a GEMM is 55 percent of kernel time, so only 33 ms of wall time. Speeding that GEMM by 10 percent saves 3 ms, reducing total time to 97 ms: a 3.09 percent speedup.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="30" y="55" fill="#172b35" font-size="34" text-anchor="start">100 ms wall = 33 ms GEMM + 27 ms other kernels + 40 ms gaps</text><rect x="75" y="115" width="396" height="90" fill="#175cad" opacity="1"/><text x="273" y="172" fill="#faf9f5" font-size="36" text-anchor="middle">GEMM</text><rect x="471" y="115" width="324" height="90" fill="#146957" opacity="1"/><text x="633" y="172" fill="#faf9f5" font-size="36" text-anchor="middle">other</text><rect x="795" y="115" width="480" height="90" fill="#89540a" opacity="1"/><text x="1035" y="172" fill="#faf9f5" font-size="36" text-anchor="middle">gaps</text><text x="60" y="305" fill="#175cad" font-size="40" text-anchor="start">GEMM 33 / 1.10 = 30 ms</text><text x="60" y="400" fill="#146957" font-size="40" text-anchor="start">New total = 30 + 27 + 40 = 97 ms</text></g></svg>
