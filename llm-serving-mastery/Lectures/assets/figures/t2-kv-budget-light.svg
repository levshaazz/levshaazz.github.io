<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">A token-count budget, not a request-count budget</title><desc id="desc">At 36 KiB per token, 64 sequences with 768 reserved token positions each require 1.6875 GiB of logical KV. Sixteen KV heads instead of two multiply that payload by eight, to 13.5 GiB.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="25" y="50" fill="#172b35" font-size="34" text-anchor="start">Same 49,152 token positions; different KV width</text><text x="25" y="153" fill="#172b35" font-size="34" text-anchor="start">2 KV heads</text><rect x="290" y="100" width="130" height="80" fill="#146957" opacity="1"/><text x="450" y="153" fill="#146957" font-size="40" text-anchor="start">1.6875 GiB</text><text x="25" y="298" fill="#172b35" font-size="34" text-anchor="start">16 KV heads</text><rect x="290" y="245" width="1040" height="80" fill="#89540a" opacity="1"/><text x="290" y="392" fill="#89540a" font-size="38" text-anchor="start">13.5 GiB — before weights and workspace</text><text x="25" y="468" fill="#4b6070" font-size="32" text-anchor="start">Counterfactual: head ratio 16 / 2 = 8×</text></g></svg>
