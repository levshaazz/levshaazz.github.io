<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Three API observations belong to separate requests</title><desc id="desc">Ordinary chat took0.747534seconds and used41prompt29completion tokens. A separate SDK stream first exposed content at0.053150seconds and completed in0.463421seconds. A different Say hello briefly raw stream had11JSONevents andDONE. These are not interchangeable phase measurements.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="25" y="91" fill="#8cbcff" font-size="34" text-anchor="start">ordinary chat</text><text x="568" y="91" fill="#f1f3ed" font-size="34" text-anchor="start">0.747534 s</text><text x="1000" y="91" fill="#7addbb" font-size="32" text-anchor="start">41 + 29 = 70 tokens</text><line x1="25" y1="125" x2="1410" y2="125" stroke="#becad4" stroke-width="4"/><text x="25" y="204" fill="#8cbcff" font-size="34" text-anchor="start">SDK stream</text><text x="568" y="204" fill="#f1f3ed" font-size="34" text-anchor="start">0.053150 s first</text><text x="1000" y="204" fill="#7addbb" font-size="32" text-anchor="start">0.463421 s total</text><line x1="25" y1="238" x2="1410" y2="238" stroke="#becad4" stroke-width="4"/><text x="25" y="317" fill="#8cbcff" font-size="34" text-anchor="start">raw SSE, other prompt</text><text x="568" y="317" fill="#f1f3ed" font-size="34" text-anchor="start">11 JSON events</text><text x="1000" y="317" fill="#7addbb" font-size="32" text-anchor="start">[DONE] observed</text><line x1="25" y1="351" x2="1410" y2="351" stroke="#becad4" stroke-width="4"/><text x="25" y="463" fill="#becad4" font-size="32" text-anchor="start">No subtraction across requests. No p95. No requests/second estimate.</text></g></svg>
