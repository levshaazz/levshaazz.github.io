<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Two tasks share weights, not a request history</title><desc id="desc">Support A and documents B each render their own system instruction and input. One shared Qwen2.5 3B model has hidden width 2048 and 36 layers. Each request has separate K and V of logical shape [2,S,128] per layer; its predicted label is not necessarily its gold label.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="35" y="40" fill="#becad4" font-size="30" text-anchor="start">Different task instructions → shared computation → separate outcomes</text><rect x="35" y="88" width="350" height="100" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="210" y="128.5" fill="#8cbcff" font-size="34" text-anchor="middle">Support A</text><text x="210" y="169.5" fill="#f1f3ed" font-size="34" text-anchor="middle">ticket + instruction</text><rect x="35" y="252" width="350" height="100" rx="8" fill="#293744" stroke="#ffcc79" stroke-width="3"/><text x="210" y="292.5" fill="#ffcc79" font-size="34" text-anchor="middle">Documents B</text><text x="210" y="333.5" fill="#f1f3ed" font-size="34" text-anchor="middle">text + instruction</text><line x1="405" y1="138" x2="492" y2="188" stroke="#8cbcff" stroke-width="4"/><path d="M 477.0035049942618 187.67575080128344 L 492 188 L 484.1702054610268 175.2056919891123" fill="none" stroke="#8cbcff" stroke-width="4"/><line x1="405" y1="302" x2="492" y2="252" stroke="#ffcc79" stroke-width="4"/><path d="M 484.1702054610268 264.79430801088773 L 492 252 L 477.0035049942618 252.32424919871656" fill="none" stroke="#ffcc79" stroke-width="4"/><rect x="510" y="158" width="410" height="116" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="715" y="206.5" fill="#8cbcff" font-size="34" text-anchor="middle">Shared Qwen weights</text><text x="715" y="247.5" fill="#f1f3ed" font-size="34" text-anchor="middle">36 layers · hidden 2048</text><line x1="940" y1="217" x2="1015" y2="217" stroke="#8cbcff" stroke-width="4"/><path d="M 1001.8362615716444 224.19138307906306 L 1015 217 L 1001.8362615716444 209.80861692093694" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="1035" y="158" width="370" height="116" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="1220" y="206.5" fill="#8cbcff" font-size="34" text-anchor="middle">Predicted label</text><text x="1220" y="247.5" fill="#f1f3ed" font-size="34" text-anchor="middle">compare with gold</text><text x="510" y="332" fill="#8cbcff" font-size="31" text-anchor="start">Request K and V, each layer: [2,S,128]</text><text x="510" y="380" fill="#becad4" font-size="30" text-anchor="start">2 KV heads · S positions · 128 features</text><text x="35" y="450" fill="#f1f3ed" font-size="30" text-anchor="start">Shared weights do not guarantee latency, capacity or isolation</text></g></svg>
