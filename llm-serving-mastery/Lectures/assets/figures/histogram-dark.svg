<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">A fast success percentile can hide failure</title><desc id="desc">Service A completes twenty requests in 0.2 seconds and eighty time out. Service B completes all one hundred in one second. Successful-only p95 favors A, but deadline attainment favors B.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="25" y="60" fill="#f1f3ed" font-size="34" text-anchor="start">100 attempts to each service</text><text x="25" y="155" fill="#f1f3ed" font-size="34" text-anchor="start">Service A</text><rect x="250" y="115" width="160" height="70" fill="#7addbb" opacity="1"/><rect x="410" y="115" width="640" height="70" fill="#ffae99" opacity="1"/><text x="1090" y="141" fill="#7addbb" font-size="32" text-anchor="start">20 completed</text><text x="1090" y="188" fill="#ffae99" font-size="32" text-anchor="start">80 timeout</text><text x="250" y="240" fill="#f1f3ed" font-size="36" text-anchor="start">success p95 0.2 s</text><text x="25" y="345" fill="#f1f3ed" font-size="34" text-anchor="start">Service B</text><rect x="250" y="305" width="800" height="70" fill="#7addbb" opacity="1"/><text x="1090" y="331" fill="#7addbb" font-size="32" text-anchor="start">100 completed</text><text x="1090" y="378" fill="#becad4" font-size="32" text-anchor="start">0 timeout</text><text x="250" y="430" fill="#f1f3ed" font-size="36" text-anchor="start">success p95 1.0 s</text></g></svg>
