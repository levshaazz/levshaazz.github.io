<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Lower allocated does not imply lower reserved</title><desc id="desc">Peak allocated and reserved memory on the T4, using the same dated v3 capture as the timing and ticket examples. Two panels compare FP16 and NF4. Each bar is the largest corresponding peak across all ten timing trials, not an extra allocation to add to another bar.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="170" y="45" fill="#f1f3ed" font-size="34" text-anchor="start">Allocated peak · MiB</text><line x1="170" y1="345" x2="560" y2="345" stroke="#becad4" stroke-width="4"/><line x1="170" y1="345" x2="170" y2="120" stroke="#becad4" stroke-width="4"/><text x="150" y="355" fill="#becad4" font-size="30" text-anchor="end">0</text><text x="150" y="242.5" fill="#becad4" font-size="30" text-anchor="end">700</text><text x="150" y="130" fill="#becad4" font-size="30" text-anchor="end">1400</text><rect x="235" y="189.9844011579241" width="90" height="155.0155988420759" fill="#8cbcff" opacity="1"/><text x="280" y="169.9844011579241" fill="#f1f3ed" font-size="30" text-anchor="middle">964.54</text><text x="280" y="405" fill="#f1f3ed" font-size="32" text-anchor="middle">FP16</text><rect x="415" y="269.3099278041295" width="90" height="75.69007219587054" fill="#7addbb" opacity="1"/><text x="460" y="249.30992780412947" fill="#f1f3ed" font-size="30" text-anchor="middle">470.96</text><text x="460" y="405" fill="#f1f3ed" font-size="32" text-anchor="middle">NF4</text><text x="885" y="45" fill="#f1f3ed" font-size="34" text-anchor="start">Reserved peak · MiB</text><line x1="885" y1="345" x2="1275" y2="345" stroke="#becad4" stroke-width="4"/><line x1="885" y1="345" x2="885" y2="120" stroke="#becad4" stroke-width="4"/><text x="865" y="355" fill="#becad4" font-size="30" text-anchor="end">0</text><text x="865" y="242.5" fill="#becad4" font-size="30" text-anchor="end">700</text><text x="865" y="130" fill="#becad4" font-size="30" text-anchor="end">1400</text><rect x="950" y="148.92857142857142" width="90" height="196.07142857142858" fill="#8cbcff" opacity="1"/><text x="995" y="128.92857142857142" fill="#f1f3ed" font-size="30" text-anchor="middle">1220.00</text><text x="995" y="405" fill="#f1f3ed" font-size="32" text-anchor="middle">FP16</text><rect x="1130" y="143.7857142857143" width="90" height="201.2142857142857" fill="#7addbb" opacity="1"/><text x="1175" y="123.7857142857143" fill="#f1f3ed" font-size="30" text-anchor="middle">1252.00</text><text x="1175" y="405" fill="#f1f3ed" font-size="32" text-anchor="middle">NF4</text><text x="720" y="465" fill="#becad4" font-size="30" text-anchor="middle">Same T4 capture as the timing table; not an RTX comparison</text></g></svg>
