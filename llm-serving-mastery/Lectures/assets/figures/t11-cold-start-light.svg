<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Cold start 165 s vs startupProbe budget 200 s — Ready lands with 35 s of headroom</title><desc id="desc">A time axis from 0 to 250 seconds with two horizontal bars. The blue bar spans 0 to 165 seconds: the pod cold start, walking the T09 members extract, weights, init and health before the pod can serve; a dashed blue marker at 165 seconds is captioned Ready. The green bar spans 0 to 200 seconds: the startupProbe budget of period 5 seconds times failureThreshold 40. A dashed green marker ends the budget at 200 seconds, and a short amber arrow between 165 and 200 names the 35-second headroom.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="35" y="44" fill="#4b6070" font-size="31" text-anchor="start">cold start 165 s vs probe budget 200 s — Ready lands with headroom</text><line x1="140" y1="372" x2="1360" y2="372" stroke="#4b6070" stroke-width="4"/><text x="140" y="406" fill="#4b6070" font-size="30" text-anchor="middle">0</text><text x="378" y="406" fill="#4b6070" font-size="30" text-anchor="middle">50</text><text x="616" y="406" fill="#4b6070" font-size="30" text-anchor="middle">100</text><text x="854" y="406" fill="#4b6070" font-size="30" text-anchor="middle">150</text><text x="1092" y="406" fill="#4b6070" font-size="30" text-anchor="middle">200</text><text x="1330" y="406" fill="#4b6070" font-size="30" text-anchor="middle">250 s</text><rect x="140" y="120" width="785.4" height="56" fill="#175cad" opacity="0.3" data-avoid-text="true"/><text x="140" y="108" fill="#175cad" font-size="30" text-anchor="start">pod cold start — extract → weights → init → /health</text><rect x="140" y="236" width="952" height="56" fill="#146957" opacity="0.3" data-avoid-text="true"/><text x="140" y="224" fill="#146957" font-size="30" text-anchor="start">startupProbe budget — <tspan data-notation="code">period: 5 s</tspan> × <tspan data-notation="code">failureThreshold: 40</tspan></text><line x1="925.4" y1="96" x2="925.4" y2="330" stroke="#175cad" stroke-width="4" stroke-dasharray="10 8"/><text x="937.4" y="84" fill="#175cad" font-size="30" text-anchor="start">Ready at 165 s</text><line x1="1092" y1="212" x2="1092" y2="330" stroke="#146957" stroke-width="4" stroke-dasharray="10 8"/><text x="1102" y="206" fill="#146957" font-size="30" text-anchor="start">budget ends — 200 s</text><line x1="925.4" y1="316" x2="1092" y2="316" stroke="#89540a" stroke-width="4"/><path d="M 1078.8362615716444 323.19138307906303 L 1092 316 L 1078.8362615716444 308.80861692093697" fill="none" stroke="#89540a" stroke-width="4"/><text x="1006.32" y="348" fill="#89540a" font-size="30" text-anchor="middle">+35 s</text><text x="35" y="444" fill="#4b6070" font-size="30" text-anchor="start">declared numbers: 165 s from the T09 fleet run; budget 5 × 40 s from the lab knobs</text></g></svg>
