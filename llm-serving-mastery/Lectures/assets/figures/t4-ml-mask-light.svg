<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Constrained output controls syntax, not meaning</title><desc id="desc">Allowed complete strings are billing, access and bug. At string prefix b only billing and bug remain possible; at bi only billing remains. At the empty prefix access is also allowed. Token grammar handles multi-token names and termination; it is not a mask assuming one token per class.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><rect x="25" y="80" width="360" height="160" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="205" y="130" fill="#175cad" font-size="34" text-anchor="middle">Empty prefix</text><text x="205" y="171" fill="#172b35" font-size="34" text-anchor="middle">billing / access</text><text x="205" y="212" fill="#172b35" font-size="34" text-anchor="middle">bug</text><line x1="405" y1="160" x2="468" y2="160" stroke="#175cad" stroke-width="4"/><path d="M 454.8362615716444 167.19138307906306 L 468 160 L 454.8362615716444 152.80861692093694" fill="none" stroke="#175cad" stroke-width="4"/><rect x="488" y="80" width="450" height="160" rx="8" fill="#e6edf3" stroke="#89540a" stroke-width="3"/><text x="713" y="150.5" fill="#89540a" font-size="34" text-anchor="middle">After prefix b</text><text x="713" y="191.5" fill="#172b35" font-size="34" text-anchor="middle">billing / bug</text><line x1="958" y1="160" x2="1020" y2="160" stroke="#175cad" stroke-width="4"/><path d="M 1006.8362615716444 167.19138307906306 L 1020 160 L 1006.8362615716444 152.80861692093694" fill="none" stroke="#175cad" stroke-width="4"/><rect x="1040" y="80" width="368" height="160" rx="8" fill="#e6edf3" stroke="#146957" stroke-width="3"/><text x="1224" y="150.5" fill="#146957" font-size="34" text-anchor="middle">After prefix bi</text><text x="1224" y="191.5" fill="#172b35" font-size="34" text-anchor="middle">billing only</text><text x="25" y="325" fill="#172b35" font-size="34" text-anchor="start">A sequence-aware grammar constrains legal continuations.</text><text x="25" y="402" fill="#175cad" font-size="34" text-anchor="start">The semantic task still asks: which label fits this ticket?</text><text x="25" y="474" fill="#4b6070" font-size="30" text-anchor="start">Names may span tokens; these are string prefixes, not token IDs.</text></g></svg>
