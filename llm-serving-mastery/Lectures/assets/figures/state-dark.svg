<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Shared model, separate request state</title><desc id="desc">One shared weights/tokenizer/runtime block feeds three requests. Each request has its own token history, KV state and stopping status. Finishing A releases A state, not the shared weights or B and C state.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><rect x="70" y="150" width="420" height="135" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="280" y="208" fill="#8cbcff" font-size="34" text-anchor="middle">Shared model weights</text><text x="280" y="249" fill="#f1f3ed" font-size="34" text-anchor="middle">Tokenizer + runtime</text><line x1="500" y1="218" x2="680" y2="115" stroke="#8cbcff" stroke-width="4"/><path d="M 672.1462414534526 127.7796117582865 L 680 115 L 665.002923655861 115.29614376249516" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="690" y="65" width="650" height="102" rx="8" fill="#293744" stroke="#7addbb" stroke-width="3"/><text x="1015" y="106.5" fill="#7addbb" font-size="34" text-anchor="middle">Request A: tokens + KV</text><text x="1015" y="147.5" fill="#f1f3ed" font-size="34" text-anchor="middle">Own stop / cancel state</text><line x1="500" y1="218" x2="680" y2="250" stroke="#8cbcff" stroke-width="4"/><path d="M 665.7807449195811 254.77627312430755 L 680 250 L 668.2982084426999 240.61554080676464" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="690" y="200" width="650" height="102" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="1015" y="241.5" fill="#8cbcff" font-size="34" text-anchor="middle">Request B: tokens + KV</text><text x="1015" y="282.5" fill="#f1f3ed" font-size="34" text-anchor="middle">Own stop / cancel state</text><line x1="500" y1="218" x2="680" y2="385" stroke="#8cbcff" stroke-width="4"/><path d="M 665.4587428021172 381.31871773630166 L 680 385 L 675.2410174175523 370.7749486897249" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="690" y="335" width="650" height="102" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="1015" y="376.5" fill="#8cbcff" font-size="34" text-anchor="middle">Request C: tokens + KV</text><text x="1015" y="417.5" fill="#f1f3ed" font-size="34" text-anchor="middle">Own stop / cancel state</text><text x="80" y="425" fill="#7addbb" font-size="34" text-anchor="start">A finishes: release A’s blocks</text></g></svg>
