<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Calibration and evaluation answer different questions</title><desc id="desc">Calibration activations select scales or compensation. Frozen held-out prompts evaluate paired outputs. A production canary observes new traffic after the release gate. Reusing evaluation answers while choosing the candidate leaks information.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><rect x="25" y="86" width="650" height="125" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="350" y="139" fill="#8cbcff" font-size="34" text-anchor="middle">Calibration inputs</text><text x="350" y="180" fill="#f1f3ed" font-size="34" text-anchor="middle">choose quantizer parameters</text><rect x="770" y="86" width="625" height="125" rx="8" fill="#293744" stroke="#7addbb" stroke-width="3"/><text x="1082.5" y="139" fill="#7addbb" font-size="34" text-anchor="middle">Held-out prompts</text><text x="1082.5" y="180" fill="#f1f3ed" font-size="34" text-anchor="middle">score a frozen candidate</text><line x1="349" y1="232" x2="349" y2="307" stroke="#8cbcff" stroke-width="4"/><path d="M 341.80861692093697 293.8362615716444 L 349 307 L 356.19138307906303 293.8362615716444" fill="none" stroke="#8cbcff" stroke-width="4"/><line x1="1083" y1="232" x2="1083" y2="307" stroke="#7addbb" stroke-width="4"/><path d="M 1075.8086169209369 293.8362615716444 L 1083 307 L 1090.1913830790631 293.8362615716444" fill="none" stroke="#7addbb" stroke-width="4"/><text x="25" y="361" fill="#8cbcff" font-size="34" text-anchor="start">Scales, groups, recipe hash</text><text x="770" y="361" fill="#7addbb" font-size="32" text-anchor="start">Paired outputs + uncertainty</text><text x="25" y="454" fill="#becad4" font-size="32" text-anchor="start">Tuning after seeing held-out failures requires a new evaluation set.</text></g></svg>
