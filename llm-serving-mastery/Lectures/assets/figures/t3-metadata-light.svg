<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Scale overhead grows as groups get smaller</title><desc id="desc">For 1024 weights, four-bit codes use 512 bytes. Group 128 gives eight two-byte scales, 16 bytes, 528 total. Group 32 gives 32 scales, 64 bytes, 576 total. One global group gives one scale, two bytes, 514 total. No zero points, padding or mixed modules are included.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="25" y="48" fill="#175cad" font-size="32" text-anchor="start">Group size</text><text x="450" y="48" fill="#175cad" font-size="32" text-anchor="start">Code bytes</text><text x="800" y="48" fill="#175cad" font-size="32" text-anchor="start">Scale bytes</text><text x="1160" y="48" fill="#175cad" font-size="32" text-anchor="start">Total bytes</text><line x1="25" y1="78" x2="1410" y2="78" stroke="#4b6070" stroke-width="4"/><text x="25" y="145" fill="#4b6070" font-size="32" text-anchor="start">1024</text><text x="450" y="145" fill="#172b35" font-size="32" text-anchor="start">512</text><text x="800" y="145" fill="#172b35" font-size="32" text-anchor="start">2</text><text x="1160" y="145" fill="#172b35" font-size="32" text-anchor="start">514</text><text x="25" y="222" fill="#4b6070" font-size="32" text-anchor="start">128</text><text x="450" y="222" fill="#172b35" font-size="32" text-anchor="start">512</text><text x="800" y="222" fill="#172b35" font-size="32" text-anchor="start">16</text><text x="1160" y="222" fill="#172b35" font-size="32" text-anchor="start">528</text><text x="25" y="299" fill="#4b6070" font-size="32" text-anchor="start">32</text><text x="450" y="299" fill="#172b35" font-size="32" text-anchor="start">512</text><text x="800" y="299" fill="#172b35" font-size="32" text-anchor="start">64</text><text x="1160" y="299" fill="#172b35" font-size="32" text-anchor="start">576</text><text x="25" y="417" fill="#146957" font-size="34" text-anchor="start">At group 128: 4 + 16/128 = 4.125 effective bits/weight</text></g></svg>
