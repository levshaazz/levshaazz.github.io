<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Readiness accumulates evidence at different layers</title><desc id="desc">A live process proves it has not exited. A listening port proves connectivity. Health checks engine health for the pinned implementation. The model list proves the advertised identity. A tiny complete chat probes rendering, generation and response completion. None alone proves load capacity.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="25" y="45" fill="#8cbcff" font-size="32" text-anchor="start">PROBE</text><text x="510" y="45" fill="#8cbcff" font-size="32" text-anchor="start">EVIDENCE</text><text x="1000" y="45" fill="#8cbcff" font-size="32" text-anchor="start">OPEN QUESTION</text><text x="25" y="127" fill="#f1f3ed" font-size="32" text-anchor="start">process alive</text><text x="510" y="127" fill="#f1f3ed" font-size="32" text-anchor="start">not exited</text><text x="1000" y="127" fill="#f1f3ed" font-size="32" text-anchor="start">chat may still fail</text><line x1="25" y1="152" x2="1410" y2="152" stroke="#becad4" stroke-width="4"/><text x="25" y="220" fill="#f1f3ed" font-size="32" text-anchor="start">port accepts TCP</text><text x="510" y="220" fill="#f1f3ed" font-size="32" text-anchor="start">connectivity</text><text x="1000" y="220" fill="#f1f3ed" font-size="32" text-anchor="start">engine may be loading</text><line x1="25" y1="245" x2="1410" y2="245" stroke="#becad4" stroke-width="4"/><text x="25" y="313" fill="#f1f3ed" font-size="32" text-anchor="start">health + model list</text><text x="510" y="313" fill="#f1f3ed" font-size="32" text-anchor="start">engine check + identity</text><text x="1000" y="313" fill="#f1f3ed" font-size="32" text-anchor="start">template untested</text><line x1="25" y1="338" x2="1410" y2="338" stroke="#becad4" stroke-width="4"/><text x="25" y="406" fill="#f1f3ed" font-size="32" text-anchor="start">tiny complete chat</text><text x="510" y="406" fill="#f1f3ed" font-size="32" text-anchor="start">end-to-end smoke</text><text x="1000" y="406" fill="#f1f3ed" font-size="32" text-anchor="start">load capacity untested</text></g></svg>
