<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Shutdown order changes the failure wave</title><desc id="desc">Unsafe order: kill worker, broken streams, synchronized retries. Safe order: close admission, finish or cancel accepted work, release state, stop worker. Each path needs a finite deadline.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="30" y="55" fill="#ffae99" font-size="38" text-anchor="start">Unsafe</text><text x="30" y="285" fill="#7addbb" font-size="38" text-anchor="start">Bounded drain</text><rect x="70" y="90" width="365" height="100" rx="8" fill="#293744" stroke="#ffae99" stroke-width="3"/><text x="252.5" y="151" fill="#ffae99" font-size="34" text-anchor="middle">Kill worker</text><line x1="450" y1="140" x2="510" y2="140" stroke="#ffae99" stroke-width="4"/><path d="M 496.8362615716444 147.19138307906306 L 510 140 L 496.8362615716444 132.80861692093694" fill="none" stroke="#ffae99" stroke-width="4"/><rect x="530" y="90" width="365" height="100" rx="8" fill="#293744" stroke="#ffae99" stroke-width="3"/><text x="712.5" y="151" fill="#ffae99" font-size="34" text-anchor="middle">Broken streams</text><line x1="910" y1="140" x2="970" y2="140" stroke="#ffae99" stroke-width="4"/><path d="M 956.8362615716444 147.19138307906306 L 970 140 L 956.8362615716444 132.80861692093694" fill="none" stroke="#ffae99" stroke-width="4"/><rect x="990" y="90" width="365" height="100" rx="8" fill="#293744" stroke="#ffae99" stroke-width="3"/><text x="1172.5" y="151" fill="#ffae99" font-size="34" text-anchor="middle">Retries</text><rect x="70" y="320" width="365" height="100" rx="8" fill="#293744" stroke="#7addbb" stroke-width="3"/><text x="252.5" y="381" fill="#7addbb" font-size="34" text-anchor="middle">Stop admission</text><line x1="450" y1="370" x2="510" y2="370" stroke="#7addbb" stroke-width="4"/><path d="M 496.8362615716444 377.19138307906303 L 510 370 L 496.8362615716444 362.80861692093697" fill="none" stroke="#7addbb" stroke-width="4"/><rect x="530" y="320" width="365" height="100" rx="8" fill="#293744" stroke="#7addbb" stroke-width="3"/><text x="712.5" y="381" fill="#7addbb" font-size="34" text-anchor="middle">Finish / cancel</text><line x1="910" y1="370" x2="970" y2="370" stroke="#7addbb" stroke-width="4"/><path d="M 956.8362615716444 377.19138307906303 L 970 370 L 956.8362615716444 362.80861692093697" fill="none" stroke="#7addbb" stroke-width="4"/><rect x="990" y="320" width="365" height="100" rx="8" fill="#293744" stroke="#7addbb" stroke-width="3"/><text x="1172.5" y="381" fill="#7addbb" font-size="34" text-anchor="middle">Release + stop</text></g></svg>
