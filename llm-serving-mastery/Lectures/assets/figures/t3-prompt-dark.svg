<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">The same literal request reaches both candidates</title><desc id="desc">The prompt asks: Reply with exactly one word: blue or orange. What color is the sky on a clear day? Both candidates receive 49 identical chat input IDs. FP16 returned blue with IDs12203,151645. NF4 returned Blue. with IDs10331,13,151645. Final151645 is EOS.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="25" y="46" fill="#8cbcff" font-size="36" text-anchor="start">USER: Reply with exactly one word: blue or orange.</text><text x="25" y="103" fill="#8cbcff" font-size="36" text-anchor="start">What color is the sky on a clear day?</text><rect x="25" y="170" width="530" height="110" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="290" y="215.5" fill="#8cbcff" font-size="34" text-anchor="middle">chat template</text><text x="290" y="256.5" fill="#f1f3ed" font-size="34" text-anchor="middle">49 input IDs</text><line x1="575" y1="225" x2="676" y2="225" stroke="#8cbcff" stroke-width="4"/><path d="M 662.8362615716444 232.19138307906306 L 676 225 L 662.8362615716444 217.80861692093694" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="700" y="155" width="690" height="92" rx="8" fill="#293744" stroke="#7addbb" stroke-width="3"/><text x="1045" y="191.5" fill="#7addbb" font-size="34" text-anchor="middle">FP16: “blue”</text><text x="1045" y="232.5" fill="#f1f3ed" font-size="34" text-anchor="middle">2 output IDs including EOS</text><rect x="700" y="282" width="690" height="92" rx="8" fill="#293744" stroke="#ffcc79" stroke-width="3"/><text x="1045" y="318.5" fill="#ffcc79" font-size="34" text-anchor="middle">NF4: “Blue.”</text><text x="1045" y="359.5" fill="#f1f3ed" font-size="34" text-anchor="middle">3 output IDs including EOS</text><text x="25" y="458" fill="#becad4" font-size="32" text-anchor="start">One observed pair motivates a test; it cannot estimate a regression rate.</text></g></svg>
