<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Visible words and selected token IDs differ</title><desc id="desc">The applied chat has 49 input IDs. The automatic system message occupies positions 0–20 including delimiters and newlines. Final input positions 46–48 are the assistant prefix 151644, 77091, 198. FP16 selects 12203 blue then 151645 end. NF4 selects 10331 Blue, 13 period, 151645 end.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="25" y="48" fill="#175cad" font-size="34" text-anchor="start">49 identical input IDs; last three = [151644, 77091, 198]</text><text x="25" y="118" fill="#4b6070" font-size="34" text-anchor="start">Input ends with the assistant prefix, then its newline.</text><line x1="25" y1="159" x2="1410" y2="159" stroke="#4b6070" stroke-width="4"/><text x="25" y="235" fill="#146957" font-size="36" text-anchor="start">FP16</text><rect x="220" y="179" width="525" height="97" rx="8" fill="#e6edf3" stroke="#146957" stroke-width="3"/><text x="482.5" y="218" fill="#146957" font-size="34" text-anchor="middle">12203 = blue</text><text x="482.5" y="259" fill="#172b35" font-size="34" text-anchor="middle">151645 = EOS</text><text x="25" y="383" fill="#89540a" font-size="36" text-anchor="start">NF4</text><rect x="220" y="322" width="1170" height="97" rx="8" fill="#e6edf3" stroke="#89540a" stroke-width="3"/><text x="805" y="361" fill="#89540a" font-size="34" text-anchor="middle">10331 = Blue; 13 = .; 151645 = EOS</text><text x="805" y="402" fill="#172b35" font-size="34" text-anchor="middle">decoded text = Blue.</text><text x="25" y="474" fill="#4b6070" font-size="30" text-anchor="start">One visible word: 2 selected IDs versus 3, including the stopping ID.</text></g></svg>
