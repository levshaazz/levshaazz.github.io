<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Refill each iteration</title><desc id="desc">Two decode slots, equal unit ticks, prefill 0. Continuous A5 B1 C2 D4. C admitted at 1 and D at 2.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="35" y="48" fill="#becad4" font-size="32" text-anchor="start">A/B/C arrive at 0; D arrives at 2. Work: 5/1/1/2 steps. Two slots.</text><text x="160" y="145" fill="#becad4" font-size="32" text-anchor="middle">Tick 0</text><rect x="80" y="183" width="160" height="88" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="160" y="238" fill="#8cbcff" font-size="34" text-anchor="middle">A+B</text><text x="350" y="145" fill="#becad4" font-size="32" text-anchor="middle">Tick 1</text><rect x="270" y="183" width="160" height="88" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="350" y="238" fill="#8cbcff" font-size="34" text-anchor="middle">A+C</text><text x="540" y="145" fill="#becad4" font-size="32" text-anchor="middle">Tick 2</text><rect x="460" y="183" width="160" height="88" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="540" y="238" fill="#8cbcff" font-size="34" text-anchor="middle">A+D</text><text x="730" y="145" fill="#becad4" font-size="32" text-anchor="middle">Tick 3</text><rect x="650" y="183" width="160" height="88" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="730" y="238" fill="#8cbcff" font-size="34" text-anchor="middle">A+D</text><text x="920" y="145" fill="#becad4" font-size="32" text-anchor="middle">Tick 4</text><rect x="840" y="183" width="160" height="88" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="920" y="238" fill="#8cbcff" font-size="34" text-anchor="middle">A</text><text x="1110" y="145" fill="#becad4" font-size="32" text-anchor="middle">Tick 5</text><rect x="1030" y="183" width="160" height="88" rx="8" fill="#293744" stroke="#becad4" stroke-width="3"/><text x="1110" y="238" fill="#becad4" font-size="34" text-anchor="middle">—</text><text x="1300" y="145" fill="#becad4" font-size="32" text-anchor="middle">Tick 6</text><rect x="1220" y="183" width="160" height="88" rx="8" fill="#293744" stroke="#becad4" stroke-width="3"/><text x="1300" y="238" fill="#becad4" font-size="34" text-anchor="middle">—</text><text x="35" y="364" fill="#8cbcff" font-size="38" text-anchor="start">Finish A5 B1 C2 D4</text><text x="35" y="450" fill="#f1f3ed" font-size="32" text-anchor="start">A freed slot is eligible at the next boundary, not mid-step</text></g></svg>
