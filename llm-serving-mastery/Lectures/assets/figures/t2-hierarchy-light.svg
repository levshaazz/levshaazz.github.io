<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Bytes cross different physical boundaries</title><desc id="desc">CPU DRAM crosses a host link to GPU device memory. On the GPU, L2 caching and per-SM on-chip storage help feed arithmetic. Registers are thread-local and shared memory is programmer-managed; this is not a list of interchangeable capacities.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><rect x="20" y="90" width="300" height="145" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="170" y="153" fill="#175cad" font-size="34" text-anchor="middle">CPU DRAM</text><text x="170" y="194" fill="#172b35" font-size="34" text-anchor="middle">host</text><line x1="331" y1="160" x2="369" y2="160" stroke="#175cad" stroke-width="4"/><path d="M 355.8362615716444 167.19138307906306 L 369 160 L 355.8362615716444 152.80861692093694" fill="none" stroke="#175cad" stroke-width="4"/><rect x="385" y="90" width="300" height="145" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="535" y="153" fill="#175cad" font-size="34" text-anchor="middle">HBM / GDDR</text><text x="535" y="194" fill="#172b35" font-size="34" text-anchor="middle">device</text><line x1="696" y1="160" x2="734" y2="160" stroke="#175cad" stroke-width="4"/><path d="M 720.8362615716444 167.19138307906306 L 734 160 L 720.8362615716444 152.80861692093694" fill="none" stroke="#175cad" stroke-width="4"/><rect x="750" y="90" width="300" height="145" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="900" y="153" fill="#175cad" font-size="34" text-anchor="middle">L2 cache</text><text x="900" y="194" fill="#172b35" font-size="34" text-anchor="middle">shared on chip</text><line x1="1061" y1="160" x2="1099" y2="160" stroke="#175cad" stroke-width="4"/><path d="M 1085.8362615716444 167.19138307906306 L 1099 160 L 1085.8362615716444 152.80861692093694" fill="none" stroke="#175cad" stroke-width="4"/><rect x="1115" y="90" width="300" height="145" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="1265" y="153" fill="#175cad" font-size="34" text-anchor="middle">SM storage</text><text x="1265" y="194" fill="#172b35" font-size="34" text-anchor="middle">L1/shared/regs</text><text x="320" y="310" fill="#89540a" font-size="34" text-anchor="middle">host link</text><text x="745" y="310" fill="#146957" font-size="34" text-anchor="middle">reuse on chip</text><text x="70" y="433" fill="#172b35" font-size="36" text-anchor="start">Capacity: can it live here?    Traffic: how often does it cross?</text></g></svg>
