<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">The knee: throughput stops paying for doubled concurrency</title><desc id="desc">Illustrative saturation shape in relative units: throughput rises while batching amortizes weight traffic, flattens as compute and KV fill, then collapses when queueing turns into timeouts. The knee is the last doubling that still paid; beyond it errors, not tokens, absorb the demand.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="35" y="40" fill="#4b6070" font-size="31" text-anchor="start">Relative throughput and error share vs concurrency (illustrative)</text><text x="160" y="368" fill="#4b6070" font-size="30" text-anchor="middle">8</text><line x1="160" y1="330" x2="160" y2="338" stroke="#4b6070" stroke-width="4"/><text x="740" y="368" fill="#4b6070" font-size="30" text-anchor="middle">32</text><line x1="740" y1="330" x2="740" y2="338" stroke="#4b6070" stroke-width="4"/><text x="1030" y="368" fill="#4b6070" font-size="30" text-anchor="middle">64</text><line x1="1030" y1="330" x2="1030" y2="338" stroke="#4b6070" stroke-width="4"/><text x="1320" y="368" fill="#4b6070" font-size="30" text-anchor="middle">128</text><line x1="1320" y1="330" x2="1320" y2="338" stroke="#4b6070" stroke-width="4"/><line x1="160" y1="330" x2="1240" y2="330" stroke="#4b6070" stroke-width="4"/><text x="700" y="408" fill="#4b6070" font-size="30" text-anchor="middle">concurrent clients</text><line x1="160" y1="206" x2="740" y2="106.79999999999998" stroke="#175cad" stroke-width="4"/><line x1="160" y1="323.8" x2="740" y2="320.7" stroke="#af372b" stroke-width="4"/><line x1="740" y1="106.79999999999998" x2="1030" y2="69.59999999999997" stroke="#175cad" stroke-width="4"/><line x1="740" y1="320.7" x2="1030" y2="299" stroke="#af372b" stroke-width="4"/><line x1="1030" y1="69.59999999999997" x2="1320" y2="150.2" stroke="#175cad" stroke-width="4"/><line x1="1030" y1="299" x2="1320" y2="187.4" stroke="#af372b" stroke-width="4"/><text x="166" y="85" fill="#175cad" font-size="30" text-anchor="start">throughput</text><text x="430" y="85" fill="#af372b" font-size="30" text-anchor="start">error share</text><line x1="740" y1="90" x2="740" y2="320" stroke="#146957" stroke-width="4"/><text x="754" y="104" fill="#146957" font-size="30" text-anchor="start">knee: last doubling that paid</text><text x="35" y="452" fill="#172b35" font-size="30" text-anchor="start">Past the knee, extra clients buy queue position, not tokens</text></g></svg>
