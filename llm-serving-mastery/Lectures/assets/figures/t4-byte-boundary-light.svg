<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Network reads can split a character</title><desc id="desc">The Unicode character é encodes as C3 A9 in UTF8. A network read may end after C3 and the next read begins A9. A streaming decoder holds incomplete bytes until the complete character arrives. SSE records can also split across reads or share a single read.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="25" y="48" fill="#175cad" font-size="40" text-anchor="start">é → UTF-8 bytes C3 A9</text><rect x="25" y="113" width="560" height="107" rx="8" fill="#e6edf3" stroke="#89540a" stroke-width="3"/><text x="305" y="157" fill="#89540a" font-size="34" text-anchor="middle">network read A</text><text x="305" y="198" fill="#172b35" font-size="34" text-anchor="middle">… 43 61 66 C3</text><rect x="800" y="113" width="610" height="107" rx="8" fill="#e6edf3" stroke="#146957" stroke-width="3"/><text x="1105" y="157" fill="#146957" font-size="34" text-anchor="middle">network read B</text><text x="1105" y="198" fill="#172b35" font-size="34" text-anchor="middle">A9 20 …</text><line x1="605" y1="167" x2="780" y2="167" stroke="#175cad" stroke-width="4"/><path d="M 766.8362615716444 174.19138307906306 L 780 167 L 766.8362615716444 159.80861692093694" fill="none" stroke="#175cad" stroke-width="4"/><text x="25" y="282" fill="#172b35" font-size="36" text-anchor="start">Decoder after A: &quot;Caf&quot; + pending byte C3</text><text x="25" y="352" fill="#146957" font-size="36" text-anchor="start">Decoder after B: &quot;Café &quot; + no pending bytes</text><line x1="25" y1="387" x2="1410" y2="387" stroke="#4b6070" stroke-width="4"/><text x="25" y="455" fill="#4b6070" font-size="32" text-anchor="start">☕ → E2 98 95. Splitting CR and LF must also preserve one newline.</text></g></svg>
