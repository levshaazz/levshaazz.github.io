<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Two residents of one 15.36 GiB T4: weights and KV cache</title><desc id="desc">FP16 weights of the pinned 3B model occupy about 6.35 GiB. Every 2048-token request adds about 72 MiB of KV. The arithmetic ceiling is (15360 − 6350) / 72 ≈ 125 simultaneous full-context requests — an upper bound, not a scheduler promise.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="35" y="40" fill="#4b6070" font-size="31" text-anchor="start">One T4 memory plan: weights first, KV fills the rest</text><rect x="90" y="150" width="512.6302083333334" height="120" fill="#89540a" opacity="1"/><text x="346.3151041666667" y="215" fill="#172b35" font-size="31" text-anchor="middle">Weights ≈ 6.2 GiB (6350 MiB)</text><rect x="602.6302083333334" y="150" width="727.3697916666666" height="120" fill="#175cad" opacity="1"/><text x="966.3151041666667" y="215" fill="#172b35" font-size="31" text-anchor="middle">KV pool ≈ 8.75 GiB</text><line x1="90" y1="290" x2="1330" y2="290" stroke="#4b6070" stroke-width="4"/><line x1="602.6302083333334" y1="290" x2="602.6302083333334" y2="302" stroke="#4b6070" stroke-width="4"/><text x="602.6302083333334" y="334" fill="#4b6070" font-size="30" text-anchor="middle">0</text><line x1="784.47265625" y1="290" x2="784.47265625" y2="302" stroke="#4b6070" stroke-width="4"/><text x="784.47265625" y="334" fill="#4b6070" font-size="30" text-anchor="middle">31</text><line x1="966.3151041666667" y1="290" x2="966.3151041666667" y2="302" stroke="#4b6070" stroke-width="4"/><text x="966.3151041666667" y="334" fill="#4b6070" font-size="30" text-anchor="middle">63</text><line x1="1148.1575520833335" y1="290" x2="1148.1575520833335" y2="302" stroke="#4b6070" stroke-width="4"/><text x="1148.1575520833335" y="334" fill="#4b6070" font-size="30" text-anchor="middle">94</text><line x1="1330" y1="290" x2="1330" y2="302" stroke="#4b6070" stroke-width="4"/><text x="1330" y="334" fill="#4b6070" font-size="30" text-anchor="middle">125</text><text x="966.3151041666667" y="372" fill="#4b6070" font-size="30" text-anchor="middle">simultaneous 2048-token requests (arithmetic ceiling ≈ 125)</text><text x="35" y="430" fill="#172b35" font-size="30" text-anchor="start">72 MiB per request = 36 KiB / position × 2048 positions</text><text x="35" y="464" fill="#172b35" font-size="30" text-anchor="start">Upper bound only: fragmentation, activations and policy reduce it — measure, then explain the gap</text></g></svg>
