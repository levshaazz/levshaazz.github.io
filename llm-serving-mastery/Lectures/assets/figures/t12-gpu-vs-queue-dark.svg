<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">GPU 90 % is batching; the queue per pod is the signal that scales</title><desc id="desc">Two stacked traces over a 30-tick burst window. The upper trace is GPU utilization: a flat amber line at 90 percent for the entire window, because continuous batching keeps the engine full before, during and after the burst. The lower trace is queue depth per pod: flat at zero until tick 8, where a dashed blue marker announces the burst, then a blue line jumps to 5 requests per pod and stays there. At tick 12 a blue annotation computes the controller decision: desired = ceil(2 × 5 / 2) = 5 replicas.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="35" y="44" fill="#becad4" font-size="31" text-anchor="start">GPU 90 % is batching; the queue per pod is the signal that scales</text><text x="134" y="200" fill="#becad4" font-size="30" text-anchor="end">0 %</text><text x="134" y="110" fill="#becad4" font-size="30" text-anchor="end">100 %</text><polyline points="150,109 1300,109" fill="none" stroke="#ffcc79" stroke-width="6"/><text x="250" y="95" fill="#ffcc79" font-size="30" text-anchor="start">GPU utilization — flat at 90 % through the burst</text><text x="1312" y="119" fill="#ffcc79" font-size="30" text-anchor="start">90 %</text><text x="134" y="350" fill="#becad4" font-size="30" text-anchor="end">0</text><text x="134" y="249.8" fill="#becad4" font-size="30" text-anchor="end">6</text><polyline points="150,340 456.6666666666667,340 456.6666666666667,256.5 1300,256.5" fill="none" stroke="#8cbcff" stroke-width="6"/><text x="250" y="225" fill="#8cbcff" font-size="30" text-anchor="start">queue depth per pod</text><text x="1312" y="266.5" fill="#8cbcff" font-size="30" text-anchor="start">5 / pod</text><line x1="456.6666666666667" y1="100" x2="456.6666666666667" y2="352" stroke="#8cbcff" stroke-width="4" stroke-dasharray="10 8"/><text x="466.6666666666667" y="352" fill="#8cbcff" font-size="30" text-anchor="start">burst arrives</text><text x="616" y="296" fill="#8cbcff" font-size="30" text-anchor="start">desired = ceil(2 × 5 / 2) = 5 replicas</text><line x1="150" y1="352" x2="1330" y2="352" stroke="#becad4" stroke-width="4"/><text x="150" y="384" fill="#becad4" font-size="30" text-anchor="middle">0</text><text x="533.3333333333333" y="384" fill="#becad4" font-size="30" text-anchor="middle">10</text><text x="916.6666666666666" y="384" fill="#becad4" font-size="30" text-anchor="middle">20</text><text x="1300" y="384" fill="#becad4" font-size="30" text-anchor="middle">30 ticks</text><text x="35" y="444" fill="#becad4" font-size="30" text-anchor="start">declared trace: target queue 2, tolerance ±10 % — the queue discriminates, the GPU does not</text></g></svg>
