<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Status codes narrow the next probe</title><desc id="desc">Historical wrong served name returned404 and over-context returned400. Connection refused has no HTTP status. A200stream that loses DONE is partial. A500response needs server diagnostics. Only the404and400rows are historical measured outcomes.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="25" y="57" fill="#175cad" font-size="34" text-anchor="start">404, wrong model</text><text x="545" y="57" fill="#172b35" font-size="32" text-anchor="start">compare /v1/models</text><text x="1170" y="57" fill="#146957" font-size="30" text-anchor="start">observed</text><line x1="25" y1="82" x2="1410" y2="82" stroke="#4b6070" stroke-width="4"/><text x="25" y="141" fill="#175cad" font-size="34" text-anchor="start">400, 2329 tokens</text><text x="545" y="141" fill="#172b35" font-size="32" text-anchor="start">check 2048 context cap</text><text x="1170" y="141" fill="#146957" font-size="30" text-anchor="start">observed</text><line x1="25" y1="166" x2="1410" y2="166" stroke="#4b6070" stroke-width="4"/><text x="25" y="225" fill="#172b35" font-size="34" text-anchor="start">no HTTP response</text><text x="545" y="225" fill="#172b35" font-size="32" text-anchor="start">check listener / route</text><text x="1170" y="225" fill="#4b6070" font-size="30" text-anchor="start">scenario</text><line x1="25" y1="250" x2="1410" y2="250" stroke="#4b6070" stroke-width="4"/><text x="25" y="309" fill="#172b35" font-size="34" text-anchor="start">200, missing DONE</text><text x="545" y="309" fill="#172b35" font-size="32" text-anchor="start">inspect partial stream</text><text x="1170" y="309" fill="#4b6070" font-size="30" text-anchor="start">scenario</text><line x1="25" y1="334" x2="1410" y2="334" stroke="#4b6070" stroke-width="4"/><text x="25" y="393" fill="#172b35" font-size="34" text-anchor="start">500, valid request</text><text x="545" y="393" fill="#172b35" font-size="32" text-anchor="start">inspect server / worker</text><text x="1170" y="393" fill="#4b6070" font-size="30" text-anchor="start">scenario</text></g></svg>
