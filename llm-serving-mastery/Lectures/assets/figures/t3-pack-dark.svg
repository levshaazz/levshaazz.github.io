<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Two signed four-bit codes occupy one byte</title><desc id="desc">First row codes are −7, −2, 1, 7. Two’s-complement nibbles are 1001, 1110, 0001, 0111. Packing the earlier value into the low nibble gives byte 11101001, hexadecimal E9, then 01110001, hexadecimal 71. A four-value row uses two code bytes.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="25" y="48" fill="#8cbcff" font-size="38" text-anchor="start">q = [−7, −2, 1, 7]</text><rect x="25" y="108" width="320" height="82" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="185" y="160" fill="#8cbcff" font-size="34" text-anchor="middle">−7 = 1001</text><rect x="379" y="108" width="320" height="82" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="539" y="160" fill="#8cbcff" font-size="34" text-anchor="middle">−2 = 1110</text><rect x="733" y="108" width="320" height="82" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="893" y="160" fill="#8cbcff" font-size="34" text-anchor="middle">1 = 0001</text><rect x="1087" y="108" width="320" height="82" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="1247" y="160" fill="#8cbcff" font-size="34" text-anchor="middle">7 = 0111</text><line x1="191" y1="210" x2="310" y2="279" stroke="#8cbcff" stroke-width="4"/><path d="M 295.00486056956856 278.6181708995883 L 310 279 L 302.2193896980754 266.17572211274313" fill="none" stroke="#8cbcff" stroke-width="4"/><line x1="547" y1="210" x2="426" y2="279" stroke="#8cbcff" stroke-width="4"/><path d="M 433.87277302868097 266.2320931692437 L 426 279 L 440.9975005557848 278.72618057184604" fill="none" stroke="#8cbcff" stroke-width="4"/><line x1="899" y1="210" x2="1018" y2="279" stroke="#8cbcff" stroke-width="4"/><path d="M 1003.0048605695686 278.6181708995883 L 1018 279 L 1010.2193896980755 266.17572211274313" fill="none" stroke="#8cbcff" stroke-width="4"/><line x1="1253" y1="210" x2="1136" y2="279" stroke="#8cbcff" stroke-width="4"/><path d="M 1143.6856805664038 266.11860588945416 L 1136 279 L 1150.9919103200934 278.5074302544065" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="120" y="299" width="535" height="85" rx="8" fill="#293744" stroke="#7addbb" stroke-width="3"/><text x="387.5" y="352.5" fill="#7addbb" font-size="34" text-anchor="middle">1110 1001 = 0xE9</text><rect x="792" y="299" width="535" height="85" rx="8" fill="#293744" stroke="#7addbb" stroke-width="3"/><text x="1059.5" y="352.5" fill="#7addbb" font-size="34" text-anchor="middle">0111 0001 = 0x71</text><text x="25" y="463" fill="#becad4" font-size="32" text-anchor="start">byte = (q₀ &amp; 15) | ((q₁ &amp; 15) &lt;&lt; 4); 2 codes per byte</text></g></svg>
