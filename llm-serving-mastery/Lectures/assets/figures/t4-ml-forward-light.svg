<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">What the GPU computes for one request</title><desc id="desc">For one sequence with S rendered positions: input IDs [1,S], decoder hidden states [1,S,896], last-position vocabulary logits [1,151936]. Each layer retains K and V of logical shape [1,2,S,64]. Decode consumes one new position and appends one KV position. These are logical shapes, not a physical vLLM memory trace.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><rect x="25" y="70" width="380" height="135" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="215" y="128" fill="#175cad" font-size="34" text-anchor="middle">Input IDs</text><text x="215" y="169" fill="#172b35" font-size="34" text-anchor="middle">[1, S]</text><line x1="425" y1="137" x2="477" y2="137" stroke="#175cad" stroke-width="4"/><path d="M 463.8362615716444 144.19138307906306 L 477 137 L 463.8362615716444 129.80861692093694" fill="none" stroke="#175cad" stroke-width="4"/><rect x="497" y="70" width="450" height="135" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="722" y="128" fill="#175cad" font-size="34" text-anchor="middle">Decoder hidden states</text><text x="722" y="169" fill="#172b35" font-size="34" text-anchor="middle">[1, S, 896]</text><line x1="967" y1="137" x2="1018" y2="137" stroke="#175cad" stroke-width="4"/><path d="M 1004.8362615716444 144.19138307906306 L 1018 137 L 1004.8362615716444 129.80861692093694" fill="none" stroke="#175cad" stroke-width="4"/><rect x="1038" y="70" width="370" height="135" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="1223" y="128" fill="#175cad" font-size="34" text-anchor="middle">Last-position logits</text><text x="1223" y="169" fill="#172b35" font-size="34" text-anchor="middle">[1, 151936]</text><text x="25" y="280" fill="#175cad" font-size="36" text-anchor="start">One layer: K and V each [1, 2, S, 64]</text><line x1="25" y1="319" x2="1410" y2="319" stroke="#4b6070" stroke-width="4"/><text x="25" y="381" fill="#172b35" font-size="34" text-anchor="start">Decode: one new input position → one new KV position</text><text x="25" y="462" fill="#89540a" font-size="32" text-anchor="start">Logits index vocabulary tokens, not the three ticket classes.</text></g></svg>
