<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">More logical KV can leave the measured peak unchanged</title><desc id="desc">For B1/P4096, output 32 retains 4127 positions and 112.85 MiB logical FP16 KV; output 128 retains 4223 positions and 115.47 MiB. Peak allocated is 3349.34 MiB in all five trials of both cases, reached already in prefill.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="25" y="44" fill="#becad4" font-size="32" text-anchor="start">B1 / P4096 / FP16</text><text x="25" y="110" fill="#8cbcff" font-size="32" text-anchor="start">Output</text><text x="300" y="110" fill="#8cbcff" font-size="32" text-anchor="start">Retained positions</text><text x="730" y="110" fill="#8cbcff" font-size="32" text-anchor="start">Logical KV</text><text x="1060" y="110" fill="#8cbcff" font-size="32" text-anchor="start">Peak allocated</text><text x="25" y="185" fill="#f1f3ed" font-size="34" text-anchor="start">32</text><text x="300" y="185" fill="#f1f3ed" font-size="34" text-anchor="start">4127 = P+O−1</text><text x="730" y="185" fill="#f1f3ed" font-size="34" text-anchor="start">112.85 MiB</text><text x="1060" y="185" fill="#f1f3ed" font-size="34" text-anchor="start">3349.34 MiB</text><text x="25" y="280" fill="#f1f3ed" font-size="34" text-anchor="start">128</text><text x="300" y="280" fill="#f1f3ed" font-size="34" text-anchor="start">4223 = P+O−1</text><text x="730" y="280" fill="#f1f3ed" font-size="34" text-anchor="start">115.47 MiB</text><text x="1060" y="280" fill="#f1f3ed" font-size="34" text-anchor="start">3349.34 MiB</text><line x1="25" y1="325" x2="1395" y2="325" stroke="#becad4" stroke-width="4"/><rect x="25" y="365" width="10" height="84" fill="#7addbb" opacity="1"/><text x="55" y="393" fill="#7addbb" font-size="36" text-anchor="start">KV grew by 2.625 MiB. The prefill peak still dominates.</text><text x="55" y="450" fill="#becad4" font-size="32" text-anchor="start">A peak counter cannot reconstruct the final memory breakdown.</text></g></svg>
