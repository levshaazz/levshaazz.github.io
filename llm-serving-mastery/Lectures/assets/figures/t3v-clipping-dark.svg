<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Choose a range on calibration inputs, then check transfer</title><desc id="desc">Per-tensor clipping sweep. Horizontal axis is the retained absolute-weight percentile on an ordinal grid; vertical is relative layer-output error in percent. Calibration and held-out curves come from separate three-prompt sets. The held-out set does not select the threshold.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="155" y="45" fill="#f1f3ed" font-size="32" text-anchor="start">Relative layer-output error (%)</text><line x1="155" y1="355" x2="1295" y2="355" stroke="#becad4" stroke-width="4"/><line x1="155" y1="355" x2="155" y2="135" stroke="#becad4" stroke-width="4"/><text x="137" y="365" fill="#becad4" font-size="30" text-anchor="end">0</text><text x="137" y="255" fill="#becad4" font-size="30" text-anchor="end">40</text><text x="137" y="145" fill="#becad4" font-size="30" text-anchor="end">80</text><polyline points="155,275.77576890587807 345,282.492119371891 535,290.4540430009365 725,293.5221008211374 915,294.55749683082104 1105,280.03930404782295 1295,149.2221999168396" fill="none" stroke="#8cbcff" stroke-width="6"/><circle cx="155" cy="275.77576890587807" r="8" fill="#8cbcff"/><circle cx="345" cy="282.492119371891" r="8" fill="#8cbcff"/><circle cx="535" cy="290.4540430009365" r="8" fill="#8cbcff"/><circle cx="725" cy="293.5221008211374" r="8" fill="#8cbcff"/><circle cx="915" cy="294.55749683082104" r="8" fill="#8cbcff"/><circle cx="1105" cy="280.03930404782295" r="8" fill="#8cbcff"/><circle cx="1295" cy="149.2221999168396" r="8" fill="#8cbcff"/><polyline points="155,275.7204647362232 345,282.4812437593937 535,290.48913672566414 725,293.49415369331837 915,294.59917165338993 1105,280.1061886548996 1295,149.37298327684402" fill="none" stroke="#7addbb" stroke-width="6" stroke-dasharray="12 9"/><circle cx="155" cy="275.7204647362232" r="8" fill="#7addbb"/><circle cx="345" cy="282.4812437593937" r="8" fill="#7addbb"/><circle cx="535" cy="290.48913672566414" r="8" fill="#7addbb"/><circle cx="725" cy="293.49415369331837" r="8" fill="#7addbb"/><circle cx="915" cy="294.59917165338993" r="8" fill="#7addbb"/><circle cx="1105" cy="280.1061886548996" r="8" fill="#7addbb"/><circle cx="1295" cy="149.37298327684402" r="8" fill="#7addbb"/><text x="155" y="405" fill="#becad4" font-size="30" text-anchor="middle">95</text><text x="345" y="405" fill="#becad4" font-size="30" text-anchor="middle">97</text><text x="535" y="405" fill="#becad4" font-size="30" text-anchor="middle">99</text><text x="725" y="405" fill="#becad4" font-size="30" text-anchor="middle">99.5</text><text x="915" y="405" fill="#becad4" font-size="30" text-anchor="middle">99.9</text><text x="1105" y="405" fill="#becad4" font-size="30" text-anchor="middle">99.99</text><text x="1295" y="405" fill="#becad4" font-size="30" text-anchor="middle">100</text><text x="155" y="95" fill="#8cbcff" font-size="30" text-anchor="start">Calibration: solid blue</text><text x="770" y="95" fill="#7addbb" font-size="30" text-anchor="start">Held-out: dashed green</text><text x="725" y="470" fill="#f1f3ed" font-size="30" text-anchor="middle">Retained percentile of absolute weights (tested settings)</text></g></svg>
