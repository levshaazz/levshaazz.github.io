<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">The measured matrix is inside a gated MLP</title><desc id="desc">Normalized hidden states of width 896 feed two independent projections, gate and up, both width 4864. SiLU acts on gate; an elementwise product feeds the down projection back to width 896. We record the 4864-feature input to down.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><rect x="15" y="170" width="230" height="105" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="130" y="213" fill="#175cad" font-size="34" text-anchor="middle">Normalized</text><text x="130" y="254" fill="#172b35" font-size="34" text-anchor="middle">width 896</text><rect x="310" y="35" width="250" height="85" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="435" y="88.5" fill="#175cad" font-size="34" text-anchor="middle">Gate: 4864</text><rect x="310" y="315" width="250" height="85" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="435" y="368.5" fill="#175cad" font-size="34" text-anchor="middle">Up: 4864</text><line x1="245" y1="195" x2="310" y2="80" stroke="#175cad" stroke-width="4"/><path d="M 309.7832378490826 94.99843372389029 L 310 80 L 297.26213611381644 87.92128926482683" fill="none" stroke="#175cad" stroke-width="4"/><line x1="245" y1="250" x2="310" y2="355" stroke="#175cad" stroke-width="4"/><path d="M 296.956623144025 347.59254968339195 L 310 355 L 309.18578792124134 340.0221143451152" fill="none" stroke="#175cad" stroke-width="4"/><rect x="610" y="35" width="210" height="85" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="715" y="88.5" fill="#175cad" font-size="34" text-anchor="middle">SiLU</text><line x1="570" y1="80" x2="603" y2="80" stroke="#175cad" stroke-width="4"/><path d="M 589.8362615716444 87.19138307906304 L 603 80 L 589.8362615716444 72.80861692093696" fill="none" stroke="#175cad" stroke-width="4"/><rect x="865" y="170" width="220" height="105" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="975" y="213" fill="#175cad" font-size="34" text-anchor="middle">Multiply</text><text x="975" y="254" fill="#172b35" font-size="34" text-anchor="middle">width 4864</text><line x1="820" y1="80" x2="960" y2="165" stroke="#175cad" stroke-width="4"/><path d="M 945.0156301648072 164.31541206396528 L 960 165 L 952.479971310787 152.0212031176455" fill="none" stroke="#175cad" stroke-width="4"/><line x1="560" y1="355" x2="960" y2="285" stroke="#175cad" stroke-width="4"/><path d="M 948.2729695873278 294.35290103124487 L 960 285 L 945.793663585475 280.1854381635147" fill="none" stroke="#175cad" stroke-width="4"/><rect x="1140" y="170" width="275" height="105" rx="8" fill="#e6edf3" stroke="#af372b" stroke-width="3"/><text x="1277.5" y="213" fill="#af372b" font-size="34" text-anchor="middle">Down: 896</text><text x="1277.5" y="254" fill="#172b35" font-size="34" text-anchor="middle">our intervention</text><line x1="1090" y1="220" x2="1135" y2="220" stroke="#af372b" stroke-width="4"/><path d="M 1121.8362615716444 227.19138307906306 L 1135 220 L 1121.8362615716444 212.80861692093694" fill="none" stroke="#af372b" stroke-width="4"/><text x="720" y="465" fill="#172b35" font-size="34" text-anchor="middle">One learned down matrix: 896 output rows × 4864 input columns</text></g></svg>
