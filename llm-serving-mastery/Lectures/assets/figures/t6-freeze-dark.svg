<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Choose on development; preserve the decision on held-out</title><desc id="desc">21development windows precede one120second K decision. Policy is frozen before L; final decision precedes V0/V1. K is1,2,4,8or16, never0. V observes a fixed policy, not a new policy search.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="35" y="42" fill="#becad4" font-size="32" text-anchor="start">No held-out outcomes before the policy choice</text><rect x="35" y="140" width="325" height="130" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="197.5" y="195.5" fill="#8cbcff" font-size="34" text-anchor="middle">21 D windows</text><text x="197.5" y="236.5" fill="#f1f3ed" font-size="34" text-anchor="middle">6 S/O summaries</text><line x1="365" y1="205" x2="385" y2="205" stroke="#8cbcff" stroke-width="4"/><path d="M 371.8362615716444 212.19138307906306 L 385 205 L 371.8362615716444 197.80861692093694" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="390" y="140" width="325" height="130" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="552.5" y="195.5" fill="#8cbcff" font-size="34" text-anchor="middle">One K + forecast</text><text x="552.5" y="236.5" fill="#f1f3ed" font-size="34" text-anchor="middle">120 s deadline</text><line x1="720" y1="205" x2="740" y2="205" stroke="#8cbcff" stroke-width="4"/><path d="M 726.8362615716444 212.19138307906306 L 740 205 L 726.8362615716444 197.80861692093694" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="745" y="140" width="325" height="130" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="907.5" y="195.5" fill="#8cbcff" font-size="34" text-anchor="middle">L → final decision</text><text x="907.5" y="236.5" fill="#f1f3ed" font-size="34" text-anchor="middle">fixed policy</text><line x1="1075" y1="205" x2="1095" y2="205" stroke="#8cbcff" stroke-width="4"/><path d="M 1081.8362615716444 212.19138307906306 L 1095 205 L 1081.8362615716444 197.80861692093694" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="1100" y="140" width="325" height="130" rx="8" fill="#293744" stroke="#7addbb" stroke-width="3"/><text x="1262.5" y="195.5" fill="#7addbb" font-size="34" text-anchor="middle">V0/V1 × 3 repeats</text><text x="1262.5" y="236.5" fill="#f1f3ed" font-size="34" text-anchor="middle">distinct V inputs</text><text x="35" y="370" fill="#ffcc79" font-size="33" text-anchor="start">Intent submitted ≠ freeze committed ≠ 30 windows completed</text><text x="35" y="445" fill="#f1f3ed" font-size="31" text-anchor="start">Resources, lag validity and closure are separate acceptance checks</text></g></svg>
