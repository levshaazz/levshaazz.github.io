<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">The raw trials show what “p95” means here</title><desc id="desc">FP16 wall times in seconds: 0.673160, 0.624353, 0.652399. NF4 wall times: 0.806390, 0.885413, 0.867871. Three sequential trials per prompt. Nearest-rank p95 is the maximum observed trial.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="25" y="48" fill="#175cad" font-size="32" text-anchor="start">Format</text><text x="420" y="48" fill="#175cad" font-size="32" text-anchor="start">Trial 1 / s</text><text x="770" y="48" fill="#175cad" font-size="32" text-anchor="start">Trial 2 / s</text><text x="1110" y="48" fill="#175cad" font-size="32" text-anchor="start">Trial 3 / s</text><line x1="25" y1="78" x2="1410" y2="78" stroke="#4b6070" stroke-width="4"/><text x="25" y="145" fill="#4b6070" font-size="32" text-anchor="start">FP16</text><text x="420" y="145" fill="#172b35" font-size="32" text-anchor="start">0.673160</text><text x="770" y="145" fill="#172b35" font-size="32" text-anchor="start">0.624353</text><text x="1110" y="145" fill="#172b35" font-size="32" text-anchor="start">0.652399</text><text x="25" y="222" fill="#4b6070" font-size="32" text-anchor="start">NF4</text><text x="420" y="222" fill="#172b35" font-size="32" text-anchor="start">0.806390</text><text x="770" y="222" fill="#172b35" font-size="32" text-anchor="start">0.885413</text><text x="1110" y="222" fill="#172b35" font-size="32" text-anchor="start">0.867871</text><text x="25" y="345" fill="#175cad" font-size="34" text-anchor="start">rank = ceil(0.95 × 3) = 3 → maximum of the sorted values</text><text x="25" y="429" fill="#89540a" font-size="34" text-anchor="start">FP16: 0.673160 s; NF4: 0.885413 s for this prompt</text></g></svg>
