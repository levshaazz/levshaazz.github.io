<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Client cancellation has a server-side consequence to verify</title><desc id="desc">The client closes its response after partial content. The transport propagates disconnect or cancellation to the frontend. The engine aborts the corresponding request and releases its live state. A new smoke plus active-request and memory evidence tests cleanup. The historical smoke did not test this chain.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><rect x="25" y="114" width="306" height="118" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="178" y="163.5" fill="#8cbcff" font-size="34" text-anchor="middle">client</text><text x="178" y="204.5" fill="#f1f3ed" font-size="34" text-anchor="middle">close stream</text><line x1="342" y1="173" x2="368" y2="173" stroke="#8cbcff" stroke-width="4"/><path d="M 354.8362615716444 180.19138307906306 L 368 173 L 354.8362615716444 165.80861692093694" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="381" y="114" width="306" height="118" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="534" y="163.5" fill="#8cbcff" font-size="34" text-anchor="middle">frontend</text><text x="534" y="204.5" fill="#f1f3ed" font-size="34" text-anchor="middle">observe disconnect</text><line x1="698" y1="173" x2="724" y2="173" stroke="#8cbcff" stroke-width="4"/><path d="M 710.8362615716444 180.19138307906306 L 724 173 L 710.8362615716444 165.80861692093694" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="737" y="114" width="306" height="118" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="890" y="163.5" fill="#8cbcff" font-size="34" text-anchor="middle">engine</text><text x="890" y="204.5" fill="#f1f3ed" font-size="34" text-anchor="middle">abort request</text><line x1="1054" y1="173" x2="1080" y2="173" stroke="#8cbcff" stroke-width="4"/><path d="M 1066.8362615716444 180.19138307906306 L 1080 173 L 1066.8362615716444 165.80861692093694" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="1093" y="114" width="306" height="118" rx="8" fill="#293744" stroke="#7addbb" stroke-width="3"/><text x="1246" y="163.5" fill="#7addbb" font-size="34" text-anchor="middle">resources</text><text x="1246" y="204.5" fill="#f1f3ed" font-size="34" text-anchor="middle">release live state</text><text x="25" y="321" fill="#8cbcff" font-size="36" text-anchor="start">Client evidence: partial content + cancelled outcome</text><text x="25" y="401" fill="#7addbb" font-size="36" text-anchor="start">Server evidence: request gone + resource recovery</text><text x="25" y="471" fill="#becad4" font-size="30" text-anchor="start">The second line requires an actual cancellation experiment.</text></g></svg>
