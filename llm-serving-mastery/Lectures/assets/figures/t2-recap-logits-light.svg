<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">The last input row scores the vocabulary</title><desc id="desc">Only position 41 of the final normalized stream enters this last-position vocabulary projection. It creates 151936 logits. The top recorded candidates are scored and greedy argmax selects token 23, text 8. Probabilities use full-vocabulary softmax, not top-five renormalization.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="25" y="43" fill="#175cad" font-size="34" text-anchor="start">[1,1,1536] × [1536,151936] = [1,1,151936] logits</text><text x="25" y="113" fill="#4b6070" font-size="32" text-anchor="start">Token</text><text x="325" y="113" fill="#4b6070" font-size="32" text-anchor="start">ID</text><text x="650" y="113" fill="#4b6070" font-size="32" text-anchor="start">Logit</text><text x="1005" y="113" fill="#4b6070" font-size="32" text-anchor="start">Full-vocab p</text><text x="25" y="185" fill="#172b35" font-size="34" text-anchor="start">&quot;8&quot;</text><text x="325" y="185" fill="#172b35" font-size="34" text-anchor="start">23</text><text x="650" y="185" fill="#175cad" font-size="34" text-anchor="start">30.219</text><text x="1005" y="185" fill="#146957" font-size="34" text-anchor="start">0.99104</text><text x="25" y="247" fill="#172b35" font-size="34" text-anchor="start">&quot;9&quot;</text><text x="325" y="247" fill="#172b35" font-size="34" text-anchor="start">24</text><text x="650" y="247" fill="#175cad" font-size="34" text-anchor="start">24.703</text><text x="1005" y="247" fill="#146957" font-size="34" text-anchor="start">0.00399</text><text x="25" y="309" fill="#172b35" font-size="34" text-anchor="start">&quot;The&quot;</text><text x="325" y="309" fill="#172b35" font-size="34" text-anchor="start">785</text><text x="650" y="309" fill="#175cad" font-size="34" text-anchor="start">24.359</text><text x="1005" y="309" fill="#146957" font-size="34" text-anchor="start">0.00283</text><text x="25" y="371" fill="#172b35" font-size="34" text-anchor="start">&quot;1&quot;</text><text x="325" y="371" fill="#172b35" font-size="34" text-anchor="start">16</text><text x="650" y="371" fill="#175cad" font-size="34" text-anchor="start">23.469</text><text x="1005" y="371" fill="#146957" font-size="34" text-anchor="start">0.00116</text><line x1="25" y1="406" x2="1410" y2="406" stroke="#4b6070" stroke-width="4"/><text x="25" y="469" fill="#146957" font-size="34" text-anchor="start">argmax = ID 23 (“8”); this selection has no KV entry yet.</text></g></svg>
