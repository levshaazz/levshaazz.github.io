<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Three learned projections make Q, K and V</title><desc id="desc">The normalized vector goes through separate query, key and value linear maps with separate biases. Actual prefill shapes are Q [1,42,1536], K [1,42,256] and V [1,42,256]. The full tiny weights and biases are in the linked fixture. The last toy Q/K/V rows are displayed.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="25" y="43" fill="#8cbcff" font-size="30" text-anchor="start">q = h @ Wq.T + bq;  k = h @ Wk.T + bk;  v = h @ Wv.T + bv</text><text x="25" y="123" fill="#f1f3ed" font-size="32" text-anchor="start">Q: [1,42,1536] × [1536,1536]</text><text x="865" y="123" fill="#8cbcff" font-size="32" text-anchor="start">[1,42,1536]</text><text x="25" y="165" fill="#8cbcff" font-size="32" text-anchor="start">Toy Q[2] = [0.465, 0.730, 0.995, 1.461]</text><text x="25" y="215" fill="#f1f3ed" font-size="32" text-anchor="start">K: [1,42,1536] × [1536,256]</text><text x="865" y="215" fill="#7addbb" font-size="32" text-anchor="start">[1,42,256]</text><text x="25" y="257" fill="#7addbb" font-size="32" text-anchor="start">Toy K[2] = [0.183, 0.830, 0.548, 1.361]</text><text x="25" y="307" fill="#f1f3ed" font-size="32" text-anchor="start">V: [1,42,1536] × [1536,256]</text><text x="865" y="307" fill="#ffcc79" font-size="32" text-anchor="start">[1,42,256]</text><text x="25" y="349" fill="#ffcc79" font-size="32" text-anchor="start">Toy V[2] = [0.415, 0.730, 1.095, 1.411]</text><line x1="25" y1="384" x2="1410" y2="384" stroke="#becad4" stroke-width="4"/><text x="25" y="451" fill="#becad4" font-size="32" text-anchor="start">Q asks what to retrieve; K supplies match features; V supplies content.</text></g></svg>
