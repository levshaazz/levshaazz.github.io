<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">The queue economy: depth is bought with arrival rate</title><desc id="desc">Mean in-flight requests L against arrival rate. The blue line is Little's law L = lambda W with the declared mock residence W = 0.47 s per request (0.15 s declared first-token wait plus 0.02 s per token times 16 tokens). The green horizontal line is the admit ceiling of 4 service slots; the amber dashed line adds the 4 bounded waiting slots, together 8. The lines cross at lambda = 8 / 0.47 = 17.0 requests per second — the declared knee: beyond it the gateway answers 429 instead of letting an invisible queue grow.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="35" y="44" fill="#4b6070" font-size="31" text-anchor="start">The queue economy: depth is bought with arrival rate</text><text x="1330" y="66" fill="#4b6070" font-size="30" text-anchor="end">arrival rate, req/s</text><rect x="1153" y="74" width="177" height="56" fill="#af372b" opacity="0.08" data-avoid-text="true"/><line x1="150" y1="70" x2="150" y2="390" stroke="#4b6070" stroke-width="4"/><line x1="150" y1="390" x2="1330" y2="390" stroke="#4b6070" stroke-width="4"/><text x="445" y="424" fill="#4b6070" font-size="30" text-anchor="middle">5</text><text x="740" y="424" fill="#4b6070" font-size="30" text-anchor="middle">10</text><text x="1035" y="424" fill="#4b6070" font-size="30" text-anchor="middle">15</text><text x="1330" y="424" fill="#4b6070" font-size="30" text-anchor="middle">20</text><text x="140" y="336" fill="#4b6070" font-size="30" text-anchor="end">2</text><text x="140" y="272" fill="#4b6070" font-size="30" text-anchor="end">4</text><text x="140" y="208" fill="#4b6070" font-size="30" text-anchor="end">6</text><text x="140" y="144" fill="#4b6070" font-size="30" text-anchor="end">8</text><line x1="150" y1="390" x2="1330" y2="89" stroke="#175cad" stroke-width="4"/><text x="190" y="360" fill="#175cad" font-size="30" text-anchor="start">blue: depth = arrival × 0.47 s (mock, declared)</text><line x1="150" y1="262" x2="1330" y2="262" stroke="#146957" stroke-width="4"/><text x="160" y="254" fill="#146957" font-size="30" text-anchor="start">admit ceiling = 4</text><line x1="150" y1="134" x2="1330" y2="134" stroke="#89540a" stroke-width="4" stroke-dasharray="10 8"/><text x="160" y="126" fill="#89540a" font-size="30" text-anchor="start">admit + queue = 8</text><circle cx="1153" cy="134" r="10" fill="#af372b"/><text x="1146" y="108" fill="#af372b" font-size="30" text-anchor="end">429 knee</text><text x="1330" y="172" fill="#af372b" font-size="30" text-anchor="end">knee = 8 / 0.47 = 17.0</text><text x="35" y="466" fill="#4b6070" font-size="30" text-anchor="start">Mock W = 0.47 s (declared): the slope of the blue line; past the knee, refusals</text></g></svg>
