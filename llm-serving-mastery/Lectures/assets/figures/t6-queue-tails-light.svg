<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Near capacity the mean barely moves — the tail explodes</title><desc id="desc">Illustrative queueing shape: as concurrent clients approach service capacity, p50 first-token latency grows mildly while p95 grows explosively. A mean-only report can look healthy exactly where one request in twenty already misses its product deadline.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="35" y="40" fill="#4b6070" font-size="31" text-anchor="start">TTFT vs concurrency: p50 vs p95 (illustrative shapes)</text><text x="120" y="430" fill="#4b6070" font-size="30" text-anchor="middle">8</text><line x1="120" y1="400" x2="120" y2="408" stroke="#4b6070" stroke-width="4"/><text x="720" y="430" fill="#4b6070" font-size="30" text-anchor="middle">32</text><line x1="720" y1="400" x2="720" y2="408" stroke="#4b6070" stroke-width="4"/><text x="1020" y="430" fill="#4b6070" font-size="30" text-anchor="middle">64</text><line x1="1020" y1="400" x2="1020" y2="408" stroke="#4b6070" stroke-width="4"/><text x="1320" y="430" fill="#4b6070" font-size="30" text-anchor="middle">128</text><line x1="1320" y1="400" x2="1320" y2="408" stroke="#4b6070" stroke-width="4"/><line x1="120" y1="400" x2="1240" y2="400" stroke="#4b6070" stroke-width="4"/><text x="680" y="466" fill="#4b6070" font-size="30" text-anchor="middle">concurrent clients</text><line x1="120" y1="378.57142857142856" x2="720" y2="370" stroke="#175cad" stroke-width="4"/><line x1="120" y1="355.7142857142857" x2="720" y2="320" stroke="#af372b" stroke-width="4"/><line x1="720" y1="370" x2="1020" y2="362.85714285714283" stroke="#175cad" stroke-width="4"/><line x1="720" y1="320" x2="1020" y2="214.28571428571428" stroke="#af372b" stroke-width="4"/><line x1="1020" y1="362.85714285714283" x2="1320" y2="357.14285714285717" stroke="#175cad" stroke-width="4"/><line x1="1020" y1="214.28571428571428" x2="1320" y2="28.571428571428555" stroke="#af372b" stroke-width="4"/><text x="166" y="85" fill="#175cad" font-size="30" text-anchor="start">p50: 150 → 300 ms</text><text x="820" y="85" fill="#af372b" font-size="30" text-anchor="start">p95: 310 → 2600 ms</text></g></svg>
