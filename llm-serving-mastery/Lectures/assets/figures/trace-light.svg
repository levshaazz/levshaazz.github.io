<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">A trace becomes a metric report</title><desc id="desc">A common monotonic clock records send 0 ms, admitted 8, prefill start 228, first content 323, last content 3117 and terminal acknowledgement 3120. TTFT is 323 ms, 127 gaps average 22 ms and E2E is 3120 ms.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><rect x="25" y="55" width="590" height="355" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="320" y="161.5" fill="#175cad" font-size="34" text-anchor="middle">send 0 ms; admit 8 ms</text><text x="320" y="202.5" fill="#172b35" font-size="34" text-anchor="middle">prefill start 228 ms</text><text x="320" y="243.5" fill="#172b35" font-size="34" text-anchor="middle">first content 323 ms</text><text x="320" y="284.5" fill="#172b35" font-size="34" text-anchor="middle">last content 3117 ms</text><text x="320" y="325.5" fill="#172b35" font-size="34" text-anchor="middle">terminal 3120 ms</text><line x1="635" y1="225" x2="735" y2="225" stroke="#175cad" stroke-width="4"/><path d="M 721.8362615716444 232.19138307906306 L 735 225 L 721.8362615716444 217.80861692093694" fill="none" stroke="#175cad" stroke-width="4"/><text x="790" y="110" fill="#175cad" font-size="40" text-anchor="start">TTFT = 323 ms</text><text x="790" y="220" fill="#172b35" font-size="40" text-anchor="start">127 gaps × 22 ms</text><text x="790" y="330" fill="#146957" font-size="40" text-anchor="start">E2E = 3120 ms</text><text x="25" y="468" fill="#4b6070" font-size="34" text-anchor="start">Observer, event names and units travel with the numbers</text></g></svg>
