<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Continuous batching: one decode step at a time — until a prefill arrives</title><desc id="desc">Four resident requests decode together (steps t0–t2, one token each per step). At t3 request R5 is admitted: its prefill needs a full compute step, so every resident request stalls one step and TPOT jumps although nothing failed. At t6 the KV pool runs short: R3 is preempted and later recomputed from its start.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="35" y="40" fill="#4b6070" font-size="30" text-anchor="start">Decode steps t0…t8 · one row per request · wide block = prefill step</text><text x="90" y="154" fill="#172b35" font-size="30" text-anchor="start">R1</text><text x="90" y="204" fill="#172b35" font-size="30" text-anchor="start">R2</text><text x="90" y="254" fill="#172b35" font-size="30" text-anchor="start">R3</text><text x="90" y="304" fill="#172b35" font-size="30" text-anchor="start">R4</text><text x="90" y="354" fill="#172b35" font-size="30" text-anchor="start">R5</text><rect x="200" y="120" width="104" height="40" fill="#175cad" opacity="1"/><rect x="200" y="170" width="104" height="40" fill="#175cad" opacity="1"/><rect x="200" y="270" width="104" height="40" fill="#175cad" opacity="1"/><rect x="318" y="120" width="104" height="40" fill="#175cad" opacity="1"/><rect x="318" y="170" width="104" height="40" fill="#175cad" opacity="1"/><rect x="318" y="270" width="104" height="40" fill="#175cad" opacity="1"/><rect x="436" y="120" width="104" height="40" fill="#175cad" opacity="1"/><rect x="436" y="170" width="104" height="40" fill="#175cad" opacity="1"/><rect x="436" y="270" width="104" height="40" fill="#175cad" opacity="1"/><rect x="554" y="110" width="104" height="260" fill="#146957" opacity="1"/><rect x="672" y="120" width="104" height="40" fill="#175cad" opacity="1"/><rect x="672" y="170" width="104" height="40" fill="#175cad" opacity="1"/><rect x="672" y="270" width="104" height="40" fill="#175cad" opacity="1"/><rect x="790" y="120" width="104" height="40" fill="#175cad" opacity="1"/><rect x="790" y="170" width="104" height="40" fill="#175cad" opacity="1"/><rect x="790" y="270" width="104" height="40" fill="#175cad" opacity="1"/><rect x="790" y="320" width="104" height="40" fill="#175cad" opacity="1"/><rect x="908" y="220" width="104" height="40" fill="#af372b" opacity="1"/><rect x="908" y="120" width="104" height="40" fill="#175cad" opacity="1"/><rect x="908" y="170" width="104" height="40" fill="#175cad" opacity="1"/><rect x="908" y="270" width="104" height="40" fill="#175cad" opacity="1"/><rect x="908" y="320" width="104" height="40" fill="#175cad" opacity="1"/><rect x="1026" y="220" width="104" height="40" fill="#89540a" opacity="1"/><rect x="1026" y="120" width="104" height="40" fill="#175cad" opacity="1"/><rect x="1026" y="170" width="104" height="40" fill="#175cad" opacity="1"/><rect x="1026" y="270" width="104" height="40" fill="#175cad" opacity="1"/><rect x="1026" y="320" width="104" height="40" fill="#175cad" opacity="1"/><rect x="1144" y="220" width="104" height="40" fill="#175cad" opacity="1"/><rect x="1144" y="120" width="104" height="40" fill="#175cad" opacity="1"/><rect x="1144" y="170" width="104" height="40" fill="#175cad" opacity="1"/><rect x="1144" y="270" width="104" height="40" fill="#175cad" opacity="1"/><rect x="1144" y="320" width="104" height="40" fill="#175cad" opacity="1"/><text x="546" y="90" fill="#146957" font-size="30" text-anchor="end">R5 prefill: everyone waits one step</text><text x="900" y="395" fill="#af372b" font-size="30" text-anchor="end">R3 preempted at t6 (red) · recomputed at t7 (amber)</text><text x="35" y="455" fill="#172b35" font-size="30" text-anchor="start">Resident tokens keep flowing except where a wide prefill or a preemption takes the step</text></g></svg>
