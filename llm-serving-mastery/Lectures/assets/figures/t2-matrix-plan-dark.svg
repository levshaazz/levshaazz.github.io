<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">One required protocol across slides, Book and lab</title><desc id="desc">For each of two pinned models run batch one with input 128/4096 and output 32/128, plus batch four with input 128/output 32. Five trials per case give fifty core trials. Smoke and focused profiles are separate.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><rect x="25" y="80" width="300" height="140" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="175" y="140.5" fill="#8cbcff" font-size="34" text-anchor="middle">P=128</text><text x="175" y="181.5" fill="#f1f3ed" font-size="34" text-anchor="middle">O=32</text><rect x="375" y="80" width="300" height="140" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="525" y="140.5" fill="#8cbcff" font-size="34" text-anchor="middle">P=4096</text><text x="525" y="181.5" fill="#f1f3ed" font-size="34" text-anchor="middle">O=32</text><rect x="725" y="80" width="300" height="140" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="875" y="140.5" fill="#8cbcff" font-size="34" text-anchor="middle">P=128</text><text x="875" y="181.5" fill="#f1f3ed" font-size="34" text-anchor="middle">O=128</text><rect x="1075" y="80" width="300" height="140" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="1225" y="140.5" fill="#8cbcff" font-size="34" text-anchor="middle">P=4096</text><text x="1225" y="181.5" fill="#f1f3ed" font-size="34" text-anchor="middle">O=128</text><text x="25" y="45" fill="#f1f3ed" font-size="34" text-anchor="start">Core batch 1: four shapes per model</text><rect x="30" y="280" width="690" height="110" rx="8" fill="#293744" stroke="#ffcc79" stroke-width="3"/><text x="375" y="325.5" fill="#ffcc79" font-size="34" text-anchor="middle">Matched batch 4: P=128, O=32</text><text x="375" y="366.5" fill="#f1f3ed" font-size="34" text-anchor="middle">same counts, dtype and clocks</text><text x="780" y="315" fill="#8cbcff" font-size="34" text-anchor="start">2 models × 5 cases × 5 trials</text><text x="780" y="395" fill="#7addbb" font-size="46" text-anchor="start">50 raw trials</text><text x="30" y="470" fill="#becad4" font-size="32" text-anchor="start">Smoke first → bounded matrix → separate two-shape profiles</text></g></svg>
