<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">The 64-client outcome</title><desc id="desc">192 attempts per path. Serialized pipeline: 38 completions and 154 timeouts. vLLM: 192 completions and zero timeouts. Same GPU and pinned model; three simultaneous waves.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="40" y="55" fill="#172b35" font-size="34" text-anchor="start">64 clients × 3 waves = 192 attempts per path</text><text x="40" y="125" fill="#172b35" font-size="34" text-anchor="start">Serialized</text><rect x="310" y="88" width="198" height="72" fill="#146957" opacity="1"/><rect x="508" y="88" width="802" height="72" fill="#af372b" opacity="1"/><text x="409" y="135" fill="#faf9f5" font-size="36" text-anchor="middle">38</text><text x="909" y="135" fill="#faf9f5" font-size="36" text-anchor="middle">154 timeout</text><text x="40" y="260" fill="#172b35" font-size="34" text-anchor="start">vLLM</text><rect x="310" y="222" width="1000" height="72" fill="#146957" opacity="1"/><text x="810" y="269" fill="#faf9f5" font-size="36" text-anchor="middle">192 completed</text><text x="310" y="360" fill="#172b35" font-size="34" text-anchor="start">Completion share: 19.8% versus 100%</text><text x="310" y="420" fill="#4b6070" font-size="34" text-anchor="start">Observed outcomes, not a universal engine ranking</text></g></svg>
