<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Block size changes tail waste, not the logical KV payload</title><desc id="desc">The same 81 live positions: block 8 needs 12 blocks / 96 slots / 15 unused; block 16 needs 7 / 112 / 31; block 32 needs 4 / 128 / 47. Larger blocks reduce table entries here but waste more tail space.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="35" y="45" fill="#4b6070" font-size="32" text-anchor="start">Same lengths 17, 31, 33; live payload 972 KiB</text><rect x="35" y="90" width="215" height="78" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="142.5" y="140" fill="#175cad" font-size="34" text-anchor="middle">Block 8</text><text x="300" y="137" fill="#172b35" font-size="34" text-anchor="start">12 blocks</text><text x="655" y="137" fill="#172b35" font-size="34" text-anchor="start">96 slots</text><text x="1050" y="137" fill="#89540a" font-size="34" text-anchor="start">15 unused</text><rect x="35" y="202" width="215" height="78" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="142.5" y="252" fill="#175cad" font-size="34" text-anchor="middle">Block 16</text><text x="300" y="249" fill="#172b35" font-size="34" text-anchor="start">7 blocks</text><text x="655" y="249" fill="#172b35" font-size="34" text-anchor="start">112 slots</text><text x="1050" y="249" fill="#89540a" font-size="34" text-anchor="start">31 unused</text><rect x="35" y="314" width="215" height="78" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="142.5" y="364" fill="#175cad" font-size="34" text-anchor="middle">Block 32</text><text x="300" y="361" fill="#172b35" font-size="34" text-anchor="start">4 blocks</text><text x="655" y="361" fill="#172b35" font-size="34" text-anchor="start">128 slots</text><text x="1050" y="361" fill="#89540a" font-size="34" text-anchor="start">47 unused</text><text x="35" y="450" fill="#172b35" font-size="32" text-anchor="start">Smaller tails can mean more table entries and different kernels</text></g></svg>
