<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Ticket data, shared weights, request KV and predicted label</title><desc id="desc">Rendered support ticket produces S token IDs, hidden states of width 896 and 24 attention layers. Each layer has 14 query heads, 2 KV heads, feature width 64. Per-request K/V[2,S,64] persists across decode; shared model weights do not belong to individual requests. Vocabulary logits select the next ID, not directly a guaranteed gold label.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="35" y="40" fill="#4b6070" font-size="32" text-anchor="start">One support ticket → model computation → selected label</text><rect x="35" y="85" width="365" height="110" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="217.5" y="130.5" fill="#175cad" font-size="34" text-anchor="middle">Rendered ticket</text><text x="217.5" y="171.5" fill="#172b35" font-size="34" text-anchor="middle">S token IDs</text><line x1="415" y1="140" x2="490" y2="140" stroke="#175cad" stroke-width="4"/><path d="M 476.8362615716444 147.19138307906306 L 490 140 L 476.8362615716444 132.80861692093694" fill="none" stroke="#175cad" stroke-width="4"/><rect x="510" y="85" width="365" height="110" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="692.5" y="130.5" fill="#175cad" font-size="34" text-anchor="middle">Hidden states</text><text x="692.5" y="171.5" fill="#172b35" font-size="34" text-anchor="middle">[S,896]</text><line x1="890" y1="140" x2="975" y2="140" stroke="#175cad" stroke-width="4"/><path d="M 961.8362615716444 147.19138307906306 L 975 140 L 961.8362615716444 132.80861692093694" fill="none" stroke="#175cad" stroke-width="4"/><rect x="995" y="85" width="410" height="110" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="1200" y="130.5" fill="#175cad" font-size="34" text-anchor="middle">24 attention layers</text><text x="1200" y="171.5" fill="#172b35" font-size="34" text-anchor="middle">14 Q / 2 KV heads</text><line x1="1200" y1="210" x2="1200" y2="263" stroke="#175cad" stroke-width="4"/><path d="M 1192.8086169209369 249.8362615716444 L 1200 263 L 1207.1913830790631 249.8362615716444" fill="none" stroke="#175cad" stroke-width="4"/><rect x="995" y="280" width="410" height="110" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="1200" y="325.5" fill="#175cad" font-size="34" text-anchor="middle">Next-ID logits</text><text x="1200" y="366.5" fill="#172b35" font-size="34" text-anchor="middle">vocabulary 151936</text><rect x="35" y="280" width="370" height="110" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="220" y="325.5" fill="#175cad" font-size="34" text-anchor="middle">Shared weights</text><text x="220" y="366.5" fill="#172b35" font-size="34" text-anchor="middle">not request-owned</text><line x1="210" y1="265" x2="620" y2="210" stroke="#175cad" stroke-width="4"/><path d="M 607.9092621110989 218.87772816107196 L 620 210 L 605.9969957804254 204.6226518778699" fill="none" stroke="#175cad" stroke-width="4"/><rect x="510" y="280" width="405" height="110" rx="8" fill="#e6edf3" stroke="#89540a" stroke-width="3"/><text x="712.5" y="325.5" fill="#89540a" font-size="34" text-anchor="middle">Request K and V</text><text x="712.5" y="366.5" fill="#172b35" font-size="34" text-anchor="middle">each layer: [2,S,64]</text><line x1="735" y1="263" x2="1010" y2="210" stroke="#89540a" stroke-width="4"/><path d="M 998.4350618437209 219.55260202465476 L 1010 210 L 995.7131998137758 205.42973300135498" fill="none" stroke="#89540a" stroke-width="4"/><text x="35" y="450" fill="#172b35" font-size="32" text-anchor="start">Gold label is the task target; cached history is request-specific</text></g></svg>
