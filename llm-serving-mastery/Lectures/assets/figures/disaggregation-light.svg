<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Separating phases adds a state-transfer boundary</title><desc id="desc">A router sends prompt work to a prefill worker. The produced KV state crosses a transfer boundary to a decode worker, which streams output. Separate queues and transfer/recovery cost accompany independent scaling.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><rect x="30" y="160" width="250" height="110" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="155" y="226" fill="#175cad" font-size="34" text-anchor="middle">Router</text><line x1="295" y1="215" x2="375" y2="215" stroke="#175cad" stroke-width="4"/><path d="M 361.8362615716444 222.19138307906306 L 375 215 L 361.8362615716444 207.80861692093694" fill="none" stroke="#175cad" stroke-width="4"/><rect x="390" y="160" width="300" height="110" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="540" y="205.5" fill="#175cad" font-size="34" text-anchor="middle">Prefill worker</text><text x="540" y="246.5" fill="#172b35" font-size="34" text-anchor="middle">prompt queue</text><line x1="705" y1="215" x2="925" y2="215" stroke="#175cad" stroke-width="4"/><path d="M 911.8362615716444 222.19138307906306 L 925 215 L 911.8362615716444 207.80861692093694" fill="none" stroke="#175cad" stroke-width="4"/><text x="815" y="140" fill="#89540a" font-size="34" text-anchor="middle">KV transfer</text><rect x="940" y="160" width="320" height="110" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="1100" y="205.5" fill="#175cad" font-size="34" text-anchor="middle">Decode worker</text><text x="1100" y="246.5" fill="#172b35" font-size="34" text-anchor="middle">decode queue</text><line x1="1095" y1="285" x2="1095" y2="365" stroke="#175cad" stroke-width="4"/><path d="M 1087.8086169209369 351.8362615716444 L 1095 365 L 1102.1913830790631 351.8362615716444" fill="none" stroke="#175cad" stroke-width="4"/><text x="1095" y="435" fill="#146957" font-size="34" text-anchor="middle">stream to client</text><text x="390" y="380" fill="#af372b" font-size="38" text-anchor="start">Who owns state if transfer fails?</text></g></svg>
