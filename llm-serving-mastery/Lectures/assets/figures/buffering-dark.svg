<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">One symptom, three possible causes</title><desc id="desc">Three hypothetical first-content delays of 2 seconds: queue-heavy, prefill-heavy, and proxy-buffer-heavy. The same client observation does not locate the wait.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="20" y="115" fill="#f1f3ed" font-size="34" text-anchor="start">A: queue</text><rect x="300" y="75" width="864" height="65" fill="#ffcc79" opacity="1"/><text x="732" y="120" fill="#151b22" font-size="36" text-anchor="middle">1.8 s</text><rect x="1164" y="75" width="48" height="65" fill="#8cbcff" opacity="1"/><rect x="1212" y="75" width="48" height="65" fill="#7addbb" opacity="1"/><text x="20" y="228" fill="#f1f3ed" font-size="34" text-anchor="start">B: prefill</text><rect x="300" y="188" width="48" height="65" fill="#ffcc79" opacity="1"/><rect x="348" y="188" width="864" height="65" fill="#8cbcff" opacity="1"/><text x="780" y="233" fill="#151b22" font-size="36" text-anchor="middle">1.8 s</text><rect x="1212" y="188" width="48" height="65" fill="#7addbb" opacity="1"/><text x="20" y="341" fill="#f1f3ed" font-size="34" text-anchor="start">C: buffer</text><rect x="300" y="301" width="48" height="65" fill="#ffcc79" opacity="1"/><rect x="348" y="301" width="48" height="65" fill="#8cbcff" opacity="1"/><rect x="396" y="301" width="864" height="65" fill="#7addbb" opacity="1"/><text x="828" y="346" fill="#151b22" font-size="36" text-anchor="middle">1.8 s</text><text x="300" y="445" fill="#becad4" font-size="32" text-anchor="start">amber: queue   blue: prefill   green: delivery / buffer</text></g></svg>
