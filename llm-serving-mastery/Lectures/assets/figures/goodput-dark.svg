<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Useful answers in one minute</title><desc id="desc">120 completions, of which 110 are correct, of which 90 also meet all SLOs. In 60 seconds: 2.00, 1.83 and 1.50 requests per second respectively.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="25" y="95" fill="#f1f3ed" font-size="34" text-anchor="start">Completed</text><rect x="400" y="49" width="480" height="65" fill="#8cbcff" opacity="1"/><text x="900" y="94" fill="#8cbcff" font-size="34" text-anchor="start">120 / 60 = 2.00 req/s</text><text x="25" y="223" fill="#f1f3ed" font-size="34" text-anchor="start">Correct</text><rect x="400" y="177" width="440" height="65" fill="#ffcc79" opacity="1"/><text x="860" y="222" fill="#ffcc79" font-size="34" text-anchor="start">110 / 60 = 1.83 req/s</text><text x="25" y="351" fill="#f1f3ed" font-size="34" text-anchor="start">Correct + on time</text><rect x="400" y="305" width="360" height="65" fill="#7addbb" opacity="1"/><text x="780" y="350" fill="#7addbb" font-size="34" text-anchor="start">90 / 60 = 1.50 req/s</text></g></svg>
