<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">The exact ordinary chat request</title><desc id="desc">POST /v1/chat/completions to localhost sends model topic04, one user message saying Reply with one short sentence explaining what an API server does., max_tokens48 and temperature0. The historical response used 41 prompt and29 completion tokens.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="25" y="43" fill="#175cad" font-size="34" text-anchor="start">POST http://127.0.0.1:8000/v1/chat/completions</text><text x="25" y="106" fill="#172b35" font-size="32" text-anchor="start">model: &quot;topic04&quot;        temperature: 0        max_tokens: 48</text><line x1="25" y1="140" x2="1410" y2="140" stroke="#4b6070" stroke-width="4"/><text x="25" y="208" fill="#4b6070" font-size="34" text-anchor="start">messages[0].role = &quot;user&quot;</text><text x="25" y="280" fill="#172b35" font-size="40" text-anchor="start">&quot;Reply with one short sentence explaining</text><text x="25" y="337" fill="#172b35" font-size="40" text-anchor="start">what an API server does.&quot;</text><text x="25" y="438" fill="#146957" font-size="34" text-anchor="start">Recorded usage: prompt 41 + completion 29 = total 70 tokens</text></g></svg>
