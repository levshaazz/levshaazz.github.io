<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">A client that leaves must stop paying</title><desc id="desc">Two timelines on one clock (mock knobs: 0.15 s before the first token, 0.02 s per token, a 64-token request would run 1.43 s). Top row, no watcher: the client leaves at 0.30 s and the engine keeps decoding to 1.43 s — 64 tokens burned for an absent reader. Bottom row, with the disconnect watcher: the same disconnect at 0.30 s, cancellation lands at 0.35 s, generation stops — the declared waste is (0.35 − 0.15) / 0.02 = 10 tokens. Grey marks the wait, blue the useful service, red the waste.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="35" y="44" fill="#4b6070" font-size="31" text-anchor="start">A client that leaves must stop paying</text><text x="30" y="146" fill="#af372b" font-size="30" text-anchor="start">orphan (no watcher)</text><rect x="340" y="110" width="93" height="60" fill="#4b6070" opacity="0.45" data-avoid-text="true"/><rect x="433" y="110" width="93" height="60" fill="#175cad" opacity="1" data-avoid-text="true"/><rect x="526" y="110" width="701" height="60" fill="#af372b" opacity="0.55" data-avoid-text="true"/><line x1="526" y1="90" x2="526" y2="190" stroke="#af372b" stroke-width="4" stroke-dasharray="10 8"/><circle cx="1227" cy="140" r="9" fill="#af372b"/><text x="1240" y="150" fill="#4b6070" font-size="30" text-anchor="start">1.43 s</text><text x="546" y="88" fill="#af372b" font-size="30" text-anchor="start">client leaves at 0.30 s</text><text x="30" y="296" fill="#146957" font-size="30" text-anchor="start">with the watcher</text><rect x="340" y="260" width="93" height="60" fill="#4b6070" opacity="0.45" data-avoid-text="true"/><rect x="433" y="260" width="124" height="60" fill="#175cad" opacity="1" data-avoid-text="true"/><rect x="557" y="260" width="30" height="60" fill="#af372b" opacity="0.55" data-avoid-text="true"/><line x1="557" y1="240" x2="557" y2="340" stroke="#af372b" stroke-width="4" stroke-dasharray="10 8"/><circle cx="587" cy="290" r="9" fill="#146957"/><text x="575" y="248" fill="#146957" font-size="30" text-anchor="start">cancel lands: generation stops</text><text x="340" y="404" fill="#4b6070" font-size="30" text-anchor="middle">0</text><text x="650" y="404" fill="#4b6070" font-size="30" text-anchor="middle">0.5 s</text><text x="960" y="404" fill="#4b6070" font-size="30" text-anchor="middle">1.0 s</text><text x="1270" y="404" fill="#4b6070" font-size="30" text-anchor="middle">1.5 s</text><text x="35" y="466" fill="#172b35" font-size="30" text-anchor="start">orphan: 64 tokens for a gone reader — watcher: 10 = (0.35 − 0.15) / 0.02, declared mock arithmetic</text></g></svg>
