<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">The last acceptable load point</title><desc id="desc">At loads 2, 4, 6, 8, 10 requests per second, useful completions are 2, 4, 6, 6.5, 5.5 and p95 latency is 0.2, 0.25, 0.4, 0.9, 2 seconds. With p95 target 0.8 seconds, six requests per second is the last tested passing point, not proven exact capacity.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><line x1="90" y1="390" x2="665" y2="390" stroke="#4b6070" stroke-width="4"/><text x="100" y="418" fill="#4b6070" font-size="32" text-anchor="middle">2</text><text x="230" y="418" fill="#4b6070" font-size="32" text-anchor="middle">4</text><text x="360" y="418" fill="#4b6070" font-size="32" text-anchor="middle">6</text><text x="490" y="418" fill="#4b6070" font-size="32" text-anchor="middle">8</text><text x="620" y="418" fill="#4b6070" font-size="32" text-anchor="middle">10</text><text x="330" y="466" fill="#4b6070" font-size="32" text-anchor="middle">Offered req/s</text><text x="90" y="35" fill="#172b35" font-size="34" text-anchor="start">Useful req/s</text><polyline points="100,304 230,218 360,132 490,110.5 620,153.5" fill="none" stroke="#146957" stroke-width="6"/><circle cx="100" cy="304" r="8" fill="#146957"/><text x="100" y="284" fill="#172b35" font-size="32" text-anchor="middle">2</text><circle cx="230" cy="218" r="8" fill="#146957"/><text x="230" y="198" fill="#172b35" font-size="32" text-anchor="middle">4</text><circle cx="360" cy="132" r="8" fill="#146957"/><text x="360" y="112" fill="#172b35" font-size="32" text-anchor="middle">6</text><circle cx="490" cy="110.5" r="8" fill="#146957"/><text x="490" y="90.5" fill="#172b35" font-size="32" text-anchor="middle">6.5</text><circle cx="620" cy="153.5" r="8" fill="#146957"/><text x="620" y="133.5" fill="#172b35" font-size="32" text-anchor="middle">5.5</text><line x1="810" y1="390" x2="1385" y2="390" stroke="#4b6070" stroke-width="4"/><text x="820" y="418" fill="#4b6070" font-size="32" text-anchor="middle">2</text><text x="950" y="418" fill="#4b6070" font-size="32" text-anchor="middle">4</text><text x="1080" y="418" fill="#4b6070" font-size="32" text-anchor="middle">6</text><text x="1210" y="418" fill="#4b6070" font-size="32" text-anchor="middle">8</text><text x="1340" y="418" fill="#4b6070" font-size="32" text-anchor="middle">10</text><text x="1050" y="466" fill="#4b6070" font-size="32" text-anchor="middle">Offered req/s</text><text x="810" y="35" fill="#172b35" font-size="34" text-anchor="start">p95 latency (s)</text><polyline points="820,360 950,352.5 1080,330 1210,255 1340,90" fill="none" stroke="#af372b" stroke-width="6"/><circle cx="820" cy="360" r="8" fill="#af372b"/><text x="820" y="340" fill="#172b35" font-size="32" text-anchor="middle">0.2</text><circle cx="950" cy="352.5" r="8" fill="#af372b"/><text x="950" y="332.5" fill="#172b35" font-size="32" text-anchor="middle">0.25</text><circle cx="1080" cy="330" r="8" fill="#af372b"/><text x="1080" y="310" fill="#172b35" font-size="32" text-anchor="middle">0.4</text><circle cx="1210" cy="255" r="8" fill="#af372b"/><text x="1210" y="235" fill="#172b35" font-size="32" text-anchor="middle">0.9</text><circle cx="1340" cy="90" r="8" fill="#af372b"/><text x="1340" y="70" fill="#172b35" font-size="32" text-anchor="middle">2</text><line x1="810" y1="270" x2="1380" y2="270" stroke="#89540a" stroke-width="4" stroke-dasharray="10 8"/><text x="1310" y="310" fill="#89540a" font-size="32" text-anchor="end">SLO 0.8</text></g></svg>
