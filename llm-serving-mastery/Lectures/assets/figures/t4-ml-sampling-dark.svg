<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Temperature changes the next-token distribution</title><desc id="desc">Toy vocabulary tokens A,B,C have logits2,1,0. Probabilities at temperature0.5:0.8668,0.1173,0.0159; at1:0.6652,0.2447,0.0900; at2:0.5065,0.3072,0.1863. Greedy temperature0 selects A. These are invented next-token probabilities, not Qwen class confidence.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><line x1="170" y1="345" x2="1370" y2="345" stroke="#becad4" stroke-width="4"/><line x1="170" y1="50" x2="170" y2="345" stroke="#becad4" stroke-width="4"/><text x="145" y="350" fill="#becad4" font-size="30" text-anchor="end">0</text><text x="145" y="210" fill="#becad4" font-size="30" text-anchor="end">0.5</text><line x1="170" y1="205" x2="1370" y2="205" stroke="#becad4" stroke-width="4" stroke-dasharray="10 8"/><text x="145" y="70" fill="#becad4" font-size="30" text-anchor="end">1</text><line x1="170" y1="65" x2="1370" y2="65" stroke="#becad4" stroke-width="4" stroke-dasharray="10 8"/><rect x="225" y="102.29599999999999" width="65" height="242.704" fill="#8cbcff" opacity="1"/><text x="257" y="85.29599999999999" fill="#f1f3ed" font-size="30" text-anchor="middle">0.87</text><rect x="315" y="312.156" width="65" height="32.844" fill="#7addbb" opacity="1"/><text x="347" y="295.156" fill="#f1f3ed" font-size="30" text-anchor="middle">0.12</text><rect x="405" y="340.548" width="65" height="4.452" fill="#ffcc79" opacity="1"/><text x="437" y="323.548" fill="#f1f3ed" font-size="30" text-anchor="middle">0.02</text><text x="345" y="405" fill="#f1f3ed" font-size="32" text-anchor="middle">T = 0.5</text><rect x="625" y="158.744" width="65" height="186.256" fill="#8cbcff" opacity="1"/><text x="657" y="141.744" fill="#f1f3ed" font-size="30" text-anchor="middle">0.67</text><rect x="715" y="276.484" width="65" height="68.516" fill="#7addbb" opacity="1"/><text x="747" y="259.484" fill="#f1f3ed" font-size="30" text-anchor="middle">0.24</text><rect x="805" y="319.8" width="65" height="25.2" fill="#ffcc79" opacity="1"/><text x="837" y="302.8" fill="#f1f3ed" font-size="30" text-anchor="middle">0.09</text><text x="745" y="405" fill="#f1f3ed" font-size="32" text-anchor="middle">T = 1</text><rect x="1025" y="203.18" width="65" height="141.82" fill="#8cbcff" opacity="1"/><text x="1057" y="186.18" fill="#f1f3ed" font-size="30" text-anchor="middle">0.51</text><rect x="1115" y="258.98400000000004" width="65" height="86.01599999999999" fill="#7addbb" opacity="1"/><text x="1147" y="241.984" fill="#f1f3ed" font-size="30" text-anchor="middle">0.31</text><rect x="1205" y="292.836" width="65" height="52.164" fill="#ffcc79" opacity="1"/><text x="1237" y="275.836" fill="#f1f3ed" font-size="30" text-anchor="middle">0.19</text><text x="1145" y="405" fill="#f1f3ed" font-size="32" text-anchor="middle">T = 2</text><text x="170" y="31" fill="#becad4" font-size="30" text-anchor="start">Probability</text><text x="710" y="464" fill="#f1f3ed" font-size="32" text-anchor="middle">Blue A · Green B · Amber C (toy tokens)</text></g></svg>
