<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Step time vs TP degree: compute falls, the sync beat stays — the knee is predictable</title><desc id="desc">Declared step-time arithmetic against TP degree 1..8. The compute term C/tp falls roughly inversely with the degree (blue). The synchronisation term grows with the degree: the all-reduce share (tp−1)/tp of the declared byte cost plus a fixed per-beat latency overhead (amber). The total (green) falls, reaches a minimum — the knee — and rises again: over-parallelising a small model makes it slower.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="35" y="44" fill="#becad4" font-size="31" text-anchor="start">t(tp) = C/tp + sync(tp): the knee is predictable before the sweep</text><line x1="150" y1="110" x2="150" y2="376" stroke="#becad4" stroke-width="4" stroke-dasharray="10 8"/><line x1="150" y1="376" x2="1330" y2="376" stroke="#becad4" stroke-width="4" stroke-dasharray="10 8"/><line x1="1334" y1="376" x2="1356" y2="376" stroke="#8cbcff" stroke-width="4"/><path d="M 1342.8362615716444 383.19138307906303 L 1356 376 L 1342.8362615716444 368.80861692093697" fill="none" stroke="#8cbcff" stroke-width="4"/><line x1="150" y1="102" x2="150" y2="84" stroke="#8cbcff" stroke-width="4"/><path d="M 157.19138307906303 97.16373842835559 L 150 84 L 142.80861692093694 97.16373842835559" fill="none" stroke="#8cbcff" stroke-width="4"/><text x="164" y="94" fill="#becad4" font-size="30" text-anchor="start">ms</text><line x1="150" y1="139.55555555555557" x2="315.7142857142857" y2="257.77777777777777" stroke="#8cbcff" stroke-width="4"/><line x1="315.7142857142857" y1="257.77777777777777" x2="481.42857142857144" y2="297.08666666666664" stroke="#8cbcff" stroke-width="4"/><line x1="481.42857142857144" y1="297.08666666666664" x2="647.1428571428571" y2="316.8888888888889" stroke="#8cbcff" stroke-wid