 text-anchor="start">total t(tp)</text><text x="1075" y="164" fill="#8cbcff" font-size="30" text-anchor="start">compute C/tp</text><text x="1075" y="200" fill="#ffcc79" font-size="30" text-anchor="start">sync beat</text><rect x="760.8571428571429" y="257.78222222222223" width="104" height="26" fill="#7addbb" opacity="0.16"/><text x="812.8571428571429" y="224.78222222222223" fill="#7addbb" font-size="30" text-anchor="middle">knee: predicted p = 5</text><text x="1150" y="330" fill="#becad4" font-size="30" text-anchor="start">sync eats the gain</text><text x="35" y="472" fill="#becad4" font-size="30" text-anchor="start">Declared knobs: C = 800 ms; bytes term 120·(tp−1)/tp; 25 ms per beat</text></g></svg>
