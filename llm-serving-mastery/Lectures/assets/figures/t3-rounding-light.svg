<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Ties are part of the reproducibility contract</title><desc id="desc">Round-to-nearest ties-to-even maps −2.5 to −2, −1.5 to −2, 1.5 to 2 and 2.5 to 2. With scale 0.25, input 0.625 maps to 2.5 then 2 and reconstructs 0.5. A different tie rule can give code 3 and reconstruction 0.75.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="25" y="48" fill="#175cad" font-size="32" text-anchor="start">w / s</text><text x="430" y="48" fill="#175cad" font-size="32" text-anchor="start">nearest neighbors</text><text x="1020" y="48" fill="#175cad" font-size="32" text-anchor="start">ties-even</text><line x1="25" y1="78" x2="1410" y2="78" stroke="#4b6070" stroke-width="4"/><text x="25" y="145" fill="#4b6070" font-size="32" text-anchor="start">−2.5</text><text x="430" y="145" fill="#172b35" font-size="32" text-anchor="start">−3 and −2</text><text x="1020" y="145" fill="#172b35" font-size="32" text-anchor="start">−2</text><text x="25" y="222" fill="#4b6070" font-size="32" text-anchor="start">−1.5</text><text x="430" y="222" fill="#172b35" font-size="32" text-anchor="start">−2 and −1</text><text x="1020" y="222" fill="#172b35" font-size="32" text-anchor="start">−2</text><text x="25" y="299" fill="#4b6070" font-size="32" text-anchor="start">1.5</text><text x="430" y="299" fill="#172b35" font-size="32" text-anchor="start">1 and 2</text><text x="1020" y="299" fill="#172b35" font-size="32" text-anchor="start">2</text><text x="25" y="376" fill="#4b6070" font-size="32" text-anchor="start">2.5</text><text x="430" y="376" fill="#172b35" font-size="32" text-anchor="start">2 and 3</text><text x="1020" y="376" fill="#172b35" font-size="32" text-anchor="start">2</text><text x="25" y="463" fill="#146957" font-size="34" text-anchor="start">At s = 0.25: w = 0.625 → q = 2 → ŵ = 0.500</text></g></svg>
