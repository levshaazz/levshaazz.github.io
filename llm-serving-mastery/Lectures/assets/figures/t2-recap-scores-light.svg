<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Causal scores compare only available positions</title><desc id="desc">The complete 3-by-3 scaled toy attention score matrix appears with causal future entries masked. Each score is q_i dot k_j divided by sqrt(4)=2. Actual conceptual prefill scores per head have 42-by-42 positions, while first decode has 1-by-43.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="25" y="47" fill="#175cad" font-size="34" text-anchor="start">s[b,h,i,j] = dot(Q′[b,h,i], K′[b,g(h),j]) / √dₕ + mask</text><text x="550" y="110" fill="#4b6070" font-size="32" text-anchor="middle">key 0</text><text x="850" y="110" fill="#4b6070" font-size="32" text-anchor="middle">key 1</text><text x="1150" y="110" fill="#4b6070" font-size="32" text-anchor="middle">key 2</text><text x="25" y="177" fill="#172b35" font-size="34" text-anchor="start">query 0</text><rect x="437" y="140" width="226" height="55" fill="#175cad" opacity="0.13"/><text x="550" y="177" fill="#172b35" font-size="34" text-anchor="middle">1</text><rect x="737" y="140" width="226" height="55" fill="#e6edf3" opacity="1"/><text x="850" y="177" fill="#172b35" font-size="34" text-anchor="middle">−∞</text><rect x="1037" y="140" width="226" height="55" fill="#e6edf3" opacity="1"/><text x="1150" y="177" fill="#172b35" font-size="34" text-anchor="middle">−∞</text><text x="25" y="253" fill="#172b35" font-size="34" text-anchor="start">query 1</text><rect x="437" y="216" width="226" height="55" fill="#175cad" opacity="0.13"/><text x="550" y="253" fill="#172b35" font-size="34" text-anchor="middle">0.058</text><rect x="737" y="216" width="226" height="55" fill="#175cad" opacity="0.13"/><text x="850" y="253" fill="#172b35" font-size="34" text-anchor="middle">2</text><rect x="1037" y="216" width="226" height="55" fill="#e6edf3" opacity="1"/><text x="1150" y="253" fill="#172b35" font-size="34" text-anchor="middle">−∞</text><text x="25" y="329" fill="#172b35" font-size="34" text-anchor="start">query 2</text><rect x="437" y="292" width="226" height="55" fill="#175cad" opacity="0.13"/><text x="550" y="329" fill="#172b35" font-size="34" text-anchor="middle">-0.424</text><rect x="737" y="292" width="226" height="55" fill="#175cad" opacity="0.13"/><text x="850" y="329" fill="#172b35" font-size="34" text-anchor="middle">1.506</text><rect x="1037" y="292" width="226" height="55" fill="#175cad" opacity="0.13"/><text x="1150" y="329" fill="#172b35" font-size="34" text-anchor="middle">1.612</text><line x1="25" y1="364" x2="1410" y2="364" stroke="#4b6070" stroke-width="4"/><text x="25" y="423" fill="#146957" font-size="32" text-anchor="start">Toy row 2: [-0.424, 1.506, 1.612]; divisor √4 = 2</text><text x="25" y="474" fill="#4b6070" font-size="30" text-anchor="start">Real conceptual shape: [1,12,42,42]; next decode: [1,12,1,43]</text></g></svg>
