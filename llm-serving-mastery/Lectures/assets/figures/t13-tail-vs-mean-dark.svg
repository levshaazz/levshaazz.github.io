<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">The mean hides the tail: 96 fast requests, 4 burst-hit — the mean reads 1.06 s</title><desc id="desc">Declared teaching trace of 100 requests sorted by latency. Ninety-six requests complete at 0.8 seconds (blue band along the bottom); the last four, hit by a traffic burst, complete at 7.2 seconds (red spikes on the right). The mean line sits at 1.06 seconds (amber dashed) — inside the comfortable zone — while the 95th percentile line at 7.2 seconds (red dashed) exposes the tail. The p50 marker sits on the fast band.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="35" y="44" fill="#becad4" font-size="31" text-anchor="start">mean 1.06 s vs p95 7.2 s: the same trace, two verdicts</text><line x1="140" y1="84" x2="140" y2="366" stroke="#becad4" stroke-width="4" stroke-dasharray="10 8"/><line x1="140" y1="366" x2="1360" y2="366" stroke="#becad4" stroke-width="4" stroke-dasharray="10 8"/><text x="1370" y="378" fill="#becad4" font-size="30" text-anchor="start">№</text><text x="1160" y="70" fill="#becad4" font-size="30" text-anchor="start">latency, s</text><circle cx="140" cy="328.8" r="7" fill="#8cbcff"/><circle cx="152.02020202020202" cy="328.8" r="7" fill="#8cbcff"/><circle cx="164.04040404040404" cy="328.8" r="7" fill="#8cbcff"/><circle cx="176.06060606060606" cy="328.8" r="7" fill="#8cbcff"/><circle cx="188.08080808080808" cy="328.8" r="7" fill="#8cbcff"/><circle cx="200.1010101010101" cy="328.8" r="7" fill="#8cbcff"/><circle cx="212.12121212121212" cy="328.8" r="7" fill="#8cbcff"/><circle cx="224.14141414141415" cy="328.8" r="7" fill="#8cbcff"/><circle cx="236.16161616161617" cy="328.8" r="7" fill="#8cbcff"/><circle cx="248.1818181818182" cy="328.8" r="7" fill="#8cbcff"/><circle cx="260.2020202020202" cy="328.8" r="7" fill="#8cbcff"/><circle cx="272.22222222222223" cy="328.8"