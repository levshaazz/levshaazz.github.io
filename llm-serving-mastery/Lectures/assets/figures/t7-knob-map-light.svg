<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Four knobs, four mechanisms, four metrics</title><desc id="desc">Each engine knob maps to one mechanism from Topic 06 and moves one measurable quantity: max_num_seqs caps the decode batch and trades amortization against the tail; gpu_memory_utilization scales the KV pool and moves the admission ceiling; max_model_len plans the worst-case context and decides long-prompt admits versus rejections; chunked prefill slices prompt compute so decode keeps earning during big prefills.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="35" y="44" fill="#4b6070" font-size="31" text-anchor="start">Each knob is a lever on a mechanism you already derived</text><text x="205" y="82" fill="#4b6070" font-size="30" text-anchor="middle">knob</text><text x="690" y="82" fill="#4b6070" font-size="30" text-anchor="middle">mechanism</text><text x="1197" y="82" fill="#4b6070" font-size="30" text-anchor="middle">what moves</text><rect x="55" y="102" width="300" height="88" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="205" y="157" fill="#175cad" font-size="34" text-anchor="middle"><tspan data-notation="code">max_num_seqs</tspan></text><line x1="360" y1="146" x2="444" y2="146" stroke="#175cad" stroke-width="4"/><path d="M 430.8362615716444 153.19138307906306 L 444 146 L 430.8362615716444 138.80861692093694" fill="none" stroke="#175cad" stroke-width="4"/><rect x="450" y="102" width="480" height="88" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="690" y="136.5" fill="#175cad" font-size="34" text-anchor="middle">caps the decode batch</text><text x="690" y="177.5" fill="#172b35" font-size="34" text-anchor="middle">amortization ceiling</text><line x1="936" y1="146" x2="1004" y2="146" stroke="#175cad" stroke-width="4"/><path d="M 990.8362615716444 153.19138307906306 L 1004 146 L 990.8362615716444 138.80861692093694" fill="none" stroke="#175cad" stroke-width="4"/><rect x="1010" y="102" width="375" height="88" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="1197.5" y="136.5" fill="#175cad" font-size="34" text-anchor="middle">TPOT and the p95 tail;</text><text x="1197.5" y="177.5" fill="#172b35" font-size="34" text-anchor="middle">admission blocking</text><rect x="55" y="198" width="300" height="88" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="205" y="253" fill="#175cad" font-size="34" text-anchor="middle"><tspan data-notation="code">gpu_mem_util</tspan></text><line x1="360" y1="242" x2="444" y2="242" stroke="#175cad" stroke-width="4"/><path d="M 430.8362615716444 249.19138307906306 L 444 242 L 430.8362615716444 234.80861692093694" fill="none" stroke="#175cad" stroke-width="4"/><rect x="450" y="198" width="480" height="88" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="690" y="232.5" fill="#175cad" font-size="34" text-anchor="middle">scales the KV pool</text><text x="690" y="273.5" fill="#172b35" font-size="34" text-anchor="middle">admission headroom</text><line x1="936" y1="242" x2="1004" y2="242" stroke="#175cad" stroke-width="4"/><path d="M 990.8362615716444 249.19138307906306 L 1004 242 L 990.8362615716444 234.80861692093694" fill="none" stroke="#175cad" stroke-width="4"/><rect x="1010" y="198" width="375" height="88" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="1197.5" y="232.5" fill="#175cad" font-size="34" text-anchor="middle">resident requests</text><text x="1197.5" y="273.5" fill="#172b35" font-size="34" text-anchor="middle">before preemption</text><rect x="55" y="294" width="300" height="88" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="205" y="349" fill="#175cad" font-size="34" text-anchor="middle"><tspan data-notation="code">max_model_len</tspan></text><line x1="360" y1="338" x2="444" y2="338" stroke="#175cad" stroke-width="4"/><path d="M 430.8362615716444 345.19138307906303 L 444 338 L 430.8362615716444 330.80861692093697" fill="none" stroke="#175cad" stroke-width="4"/><rect x="450" y="294" width="480" height="88" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="690" y="328.5" fill="#175cad" font-size="34" text-anchor="middle">plans worst-case context</text><text x="690" y="369.5" fill="#172b35" font-size="34" text-anchor="middle">KV reservation</text><line x1="936" y1="338" x2="1004" y2="338" stroke="#175cad" stroke-width="4"/><path d="M 990.8362615716444 345.19138307906303 L 1004 338 L 990.8362615716444 330.80861692093697" fill="none" stroke="#175cad" stroke-width="4"/><rect x="1010" y="294" width="375" height="88" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="1197.5" y="328.5" fill="#175cad" font-size="34" text-anchor="middle">long-prompt admits</text><text x="1197.5" y="369.5" fill="#172b35" font-size="34" text-anchor="middle">versus rejections</text><rect x="55" y="390" width="300" height="88" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="205" y="445" fill="#175cad" font-size="34" text-anchor="middle">chunked prefill</text><line x1="360" y1="434" x2="444" y2="434" stroke="#175cad" stroke-width="4"/><path d="M 430.8362615716444 441.19138307906303 L 444 434 L 430.8362615716444 426.80861692093697" fill="none" stroke="#175cad" stroke-width="4"/><rect x="450" y="390" width="480" height="88" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="690" y="424.5" fill="#175cad" font-size="34" text-anchor="middle">slices prompt compute</text><text x="690" y="465.5" fill="#172b35" font-size="34" text-anchor="middle">across scheduler steps</text><line x1="936" y1="434" x2="1004" y2="434" stroke="#175cad" stroke-width="4"/><path d="M 990.8362615716444 441.19138307906303 L 1004 434 L 990.8362615716444 426.80861692093697" fill="none" stroke="#175cad" stroke-width="4"/><rect x="1010" y="390" width="375" height="88" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="1197.5" y="424.5" fill="#175cad" font-size="34" text-anchor="middle">decode keeps earning</text><text x="1197.5" y="465.5" fill="#172b35" font-size="34" text-anchor="middle">during big prefills</text></g></svg>
