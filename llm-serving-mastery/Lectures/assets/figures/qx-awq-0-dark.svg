<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">AWQ: inspect one rescaling candidate</title><desc id="desc">Column-0 multiplier 1; inputs [10,1,0,0] and [0,1,0,0]; output MSE 8.9250 over four coordinates. Before rounding inverse scaling preserves every original output.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="45" y="45" fill="#f1f3ed" font-size="32" text-anchor="start">Activity: channel 0 mean |x| = 5; channel 1 = 1</text><rect x="40" y="105" width="390" height="100" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="235" y="145.5" fill="#8cbcff" font-size="34" text-anchor="middle">Multiplier 1</text><text x="235" y="186.5" fill="#f1f3ed" font-size="34" text-anchor="middle">Quantizer step 1.00</text><text x="40" y="285" fill="#7addbb" font-size="32" text-anchor="start">Before rounding: same outputs</text><text x="40" y="350" fill="#f1f3ed" font-size="32" text-anchor="start">[5.30, −3.70], [.40, −.60]</text><text x="40" y="435" fill="#f1f3ed" font-size="30" text-anchor="start">Input divided; matching column multiplied</text><text x="650" y="85" fill="#f1f3ed" font-size="32" text-anchor="start">After rounding: signed output errors</text><text x="650" y="145" fill="#ffcc79" font-size="38" text-anchor="start">[-5.30, 2.70]</text><text x="650" y="230" fill="#ffcc79" font-size="38" text-anchor="start">[-0.40, -0.40]</text><text x="650" y="355" fill="#7addbb" font-size="42" text-anchor="start">Output MSE: 8.9250</text><text x="650" y="445" fill="#becad4" font-size="30" text-anchor="start">Hand-picked candidate; not complete AWQ</text></g></svg>
