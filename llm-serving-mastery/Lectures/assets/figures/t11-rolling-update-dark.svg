<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Rolling update, replicas 3: plan 0/1 holds the floor, plan 2/0 digs a pit to 1 pod</title><desc id="desc">A capacity timeline over a 400-second window. The green line stays at 3 Ready pods for the whole rollout: with maxUnavailable 0 and maxSurge 1 the replacement pod is added before any old pod dies, so capacity never dips. The red line (dashed, drawn on top of the green one) drops from 3 to 1 at second 50 and crawls back at second 215: with maxUnavailable 2 and no surge two pods are deleted first and the fleet serves on one pod for the 165 seconds the replacement spends loading weights. A muted arrow points into the dip: the new pod pays the weight load before it can serve.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="35" y="44" fill="#becad4" font-size="31" text-anchor="start">rolling update, replicas 3: the floor you hold vs the pit you dig</text><line x1="140" y1="88" x2="140" y2="362" stroke="#becad4" stroke-width="4" stroke-dasharray="10 8"/><line x1="140" y1="362" x2="1340" y2="362" stroke="#becad4" stroke-width="4"/><text x="1352" y="370" fill="#becad4" font-size="30" text-anchor="start">t</text><line x1="134" y1="352" x2="140" y2="352" stroke="#becad4" stroke-width="4"/><text x="124" y="362" fill="#becad4" font-size="30" text-anchor="end">0</text><line x1="134" y1="293.8181818181818" x2="140" y2="293.8181818181818" stroke="#becad4" stroke-width="4"/><text x="124" y="303.8181818181818" fill="#becad4" font-size="30" text-anchor="end">1</text><line x1="134" y1="235.63636363636363" x2="140" y2="235.63636363636363" stroke="#becad4" stroke-width="4"/><text x="124" y="245.63636363636363" fill="#becad4" font-size="30" text-anchor="end">2</text><line x1="134" y1="177.45454545454547" x2="140" y2="177.45454545454547" stroke="#becad4" stroke-width="4"/><text x="124" y="187.45454545454547" fill="#becad4" font-size="30" text-anchor="end">3</text><line x1="134" y1="119.27272727272728" x2="140" y2="119.27272727272728" stroke="#becad4" stroke-width="4"/><text x="124" y="129.27272727272728" fill="#becad4" font-size="30" text-anchor="end">4</text><polyline points="140,177.45454545454547 1310,177.45454545454547" fill="none" stroke="#7addbb" stroke-width="6"/><text x="250" y="159.45454545454547" fill="#7addbb" font-size="30" text-anchor="start">plan <tspan data-notation="code">maxUnavailable: 0</tspan> · <tspan data-notation="code">maxSurge: 1</tspan> — capacity stays at 3</text><line x1="140" y1="177.45454545454547" x2="286.25" y2="177.45454545454547" stroke="#ffae99" stroke-width="4" stroke-dasharray="10 8"/><line x1="286.25" y1="177.45454545454547" x2="286.25" y2="293.8181818181818" stroke="#ffae99" stroke-width="4" stroke-dasharray="10 8"/><line x1="286.25" y1="293.8181818181818" x2="768.875" y2="293.8181818181818" stroke="#ffae99" stroke-width="4" stroke-dasharray="10 8"/><line x1="768.875" y1="293.8181818181818" x2="768.875" y2="177.45454545454547" stroke="#ffae99" stroke-width="4" stroke-dasharray="10 8"/><line x1="1310" y1="177.45454545454547" x2="768.875" y2="177.45454545454547" stroke="#ffae99" stroke-width="4" stroke-dasharray="10 8"/><text x="782.875" y="215.45454545454547" fill="#ffae99" font-size="30" text-anchor="start">plan <tspan data-notation="code">maxUnavailable: 2</tspan> · <tspan data-notation="code">maxSurge: 0</tspan></text><text x="390" y="334" fill="#ffae99" font-size="30" text-anchor="start">the pit: 1 Ready pod for 165 s</text><text x="860" y="272" fill="#becad4" font-size="30" text-anchor="start">the new pod pays a 165 s weight load</text><line x1="856" y1="266" x2="742" y2="266" stroke="#becad4" stroke-width="4"/><path d="M 755.1637384283556 258.80861692093697 L 742 266 L 755.1637384283556 273.19138307906303" fill="none" stroke="#becad4" stroke-width="4"/><text x="140" y="396" fill="#becad4" font-size="30" text-anchor="middle">0</text><text x="432.5" y="396" fill="#becad4" font-size="30" text-anchor="middle">100</text><text x="725" y="396" fill="#becad4" font-size="30" text-anchor="middle">200</text><text x="1017.5" y="396" fill="#becad4" font-size="30" text-anchor="middle">300</text><text x="1310" y="396" fill="#becad4" font-size="30" text-anchor="middle">400 s</text><text x="35" y="444" fill="#becad4" font-size="30" text-anchor="start">declared rollout; the OpenAI lesson — “the app works, the rollout is stuck”</text></g></svg>
