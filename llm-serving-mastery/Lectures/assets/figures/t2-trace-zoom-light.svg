<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">A CPU launch and its actual CUDA kernel</title><desc id="desc">Eight consecutive kernel starts across a 916.4 microsecond trace excerpt. The first matched CPU cudaLaunchKernel call spans 0–35.809 microseconds. Its GPU indexSelectSmallIndex spans 47.801–49.241 microseconds, duration 1.440 microseconds. These are distinct intervals around associated work on the same aligned trace time base.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="25" y="40" fill="#175cad" font-size="34" text-anchor="start">Eight GPU start markers; relative time (µs)</text><line x1="290" y1="110" x2="1359.5" y2="110" stroke="#4b6070" stroke-width="4"/><circle cx="344.97089815" cy="110" r="7" fill="#175cad"/><circle cx="460.96816435" cy="110" r="7" fill="#175cad"/><circle cx="629.2960448499999" cy="110" r="7" fill="#175cad"/><circle cx="857.4632323499999" cy="110" r="7" fill="#175cad"/><circle cx="981.00400405" cy="110" r="7" fill="#175cad"/><circle cx="1100.7915529499999" cy="110" r="7" fill="#175cad"/><circle cx="1226.5772948499998" cy="110" r="7" fill="#175cad"/><circle cx="1342.24326215" cy="110" r="7" fill="#175cad"/><text x="290" y="161" fill="#4b6070" font-size="30" text-anchor="middle">0</text><text x="635" y="161" fill="#4b6070" font-size="30" text-anchor="middle">300</text><text x="980" y="161" fill="#4b6070" font-size="30" text-anchor="middle">600</text><text x="1325" y="161" fill="#4b6070" font-size="30" text-anchor="middle">900</text><line x1="25" y1="198" x2="1410" y2="198" stroke="#4b6070" stroke-width="4"/><text x="25" y="246" fill="#172b35" font-size="36" text-anchor="start">First pair, 0–50 µs</text><text x="25" y="312" fill="#89540a" font-size="32" text-anchor="start">CPU launch</text><text x="25" y="397" fill="#146957" font-size="32" text-anchor="start">GPU kernel</text><rect x="415" y="282" width="644.5619999999999" height="42" fill="#89540a" opacity="1"/><rect x="1275.414058" y="367" width="25.919999999999998" height="42" fill="#146957" opacity="1"/><text x="415" y="357" fill="#89540a" font-size="30" text-anchor="start">0–35.809 µs</text><text x="890" y="357" fill="#146957" font-size="30" text-anchor="start">47.801–49.241 µs</text><text x="25" y="466" fill="#4b6070" font-size="32" text-anchor="start">Kernel: indexSelectSmallIndex; duration 1.440 µs</text></g></svg>
