<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Text becomes integer IDs before the GPU</title><desc id="desc">Text on the CPU passes through a tokenizer to an integer tensor with batch and position axes. The GPU embedding table looks up vectors and creates the residual stream. Token IDs are not floating-point word vectors.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><rect x="25" y="100" width="360" height="125" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="205" y="153" fill="#175cad" font-size="34" text-anchor="middle">Text on CPU</text><text x="205" y="194" fill="#172b35" font-size="34" text-anchor="middle">“GPU memory”</text><line x1="400" y1="160" x2="485" y2="160" stroke="#175cad" stroke-width="4"/><path d="M 471.8362615716444 167.19138307906306 L 485 160 L 471.8362615716444 152.80861692093694" fill="none" stroke="#175cad" stroke-width="4"/><rect x="505" y="100" width="370" height="125" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="690" y="153" fill="#175cad" font-size="34" text-anchor="middle">Tokenizer → IDs</text><text x="690" y="194" fill="#172b35" font-size="34" text-anchor="middle">[17, 42, 9]</text><line x1="890" y1="160" x2="985" y2="160" stroke="#175cad" stroke-width="4"/><path d="M 971.8362615716444 167.19138307906306 L 985 160 L 971.8362615716444 152.80861692093694" fill="none" stroke="#175cad" stroke-width="4"/><rect x="1005" y="100" width="405" height="125" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="1207.5" y="153" fill="#175cad" font-size="34" text-anchor="middle">Embedding lookup</text><text x="1207.5" y="194" fill="#172b35" font-size="34" text-anchor="middle">[B, P, d] floats</text><line x1="955" y1="55" x2="955" y2="360" stroke="#89540a" stroke-width="4" stroke-dasharray="10 8"/><text x="550" y="305" fill="#4b6070" font-size="34" text-anchor="start">integer indices</text><text x="1050" y="305" fill="#89540a" font-size="34" text-anchor="start">GPU boundary</text><text x="25" y="440" fill="#172b35" font-size="36" text-anchor="start">A token need not be a word; record the actual token count.</text></g></svg>
