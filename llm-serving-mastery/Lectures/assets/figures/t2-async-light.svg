<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">A CPU launch can finish before device work does</title><desc id="desc">CPU enqueue takes 1 ms while device work completes at 11 ms. A host timer without a completion barrier can report only the enqueue interval. A synchronized wall interval waits for the device; events bracket a device-stream interval.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="25" y="125" fill="#172b35" font-size="34" text-anchor="start">CPU</text><rect x="240" y="80" width="95" height="65" fill="#89540a" opacity="1"/><text x="360" y="124" fill="#89540a" font-size="34" text-anchor="start">enqueue ends</text><text x="25" y="275" fill="#172b35" font-size="34" text-anchor="start">GPU</text><rect x="335" y="225" width="950" height="65" fill="#175cad" opacity="1"/><text x="810" y="270" fill="#faf9f5" font-size="34" text-anchor="middle">device work / stream interval</text><line x1="240" y1="370" x2="1285" y2="370" stroke="#4b6070" stroke-width="4"/><text x="240" y="428" fill="#4b6070" font-size="32" text-anchor="middle">0 ms</text><text x="335" y="428" fill="#4b6070" font-size="32" text-anchor="middle">1 ms</text><text x="1285" y="428" fill="#4b6070" font-size="32" text-anchor="middle">11 ms</text><line x1="1285" y1="320" x2="1285" y2="165" stroke="#146957" stroke-width="4"/><path d="M 1292.1913830790631 178.1637384283556 L 1285 165 L 1277.8086169209369 178.1637384283556" fill="none" stroke="#146957" stroke-width="4"/><text x="1000" y="145" fill="#146957" font-size="34" text-anchor="start">sync returns</text></g></svg>
