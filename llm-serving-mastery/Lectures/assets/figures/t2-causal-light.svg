<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Known positions can be computed together</title><desc id="desc">A four-by-four query/key grid allows one, two, three and four positions by row: ten valid causal query-key pairs. Decode uses one new query row against retained history plus the current position.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="35" y="42" fill="#172b35" font-size="34" text-anchor="start">Keys →</text><text x="330" y="42" fill="#172b35" font-size="34" text-anchor="start">Queries ↓</text><rect x="60" y="80" width="74" height="66" fill="#175cad" opacity="1"/><text x="97" y="126" fill="#faf9f5" font-size="34" text-anchor="middle">✓</text><rect x="150" y="80" width="74" height="66" fill="#e6edf3" opacity="1"/><rect x="240" y="80" width="74" height="66" fill="#e6edf3" opacity="1"/><rect x="330" y="80" width="74" height="66" fill="#e6edf3" opacity="1"/><rect x="60" y="162" width="74" height="66" fill="#175cad" opacity="1"/><text x="97" y="208" fill="#faf9f5" font-size="34" text-anchor="middle">✓</text><rect x="150" y="162" width="74" height="66" fill="#175cad" opacity="1"/><text x="187" y="208" fill="#faf9f5" font-size="34" text-anchor="middle">✓</text><rect x="240" y="162" width="74" height="66" fill="#e6edf3" opacity="1"/><rect x="330" y="162" width="74" height="66" fill="#e6edf3" opacity="1"/><rect x="60" y="244" width="74" height="66" fill="#175cad" opacity="1"/><text x="97" y="290" fill="#faf9f5" font-size="34" text-anchor="middle">✓</text><rect x="150" y="244" width="74" height="66" fill="#175cad" opacity="1"/><text x="187" y="290" fill="#faf9f5" font-size="34" text-anchor="middle">✓</text><rect x="240" y="244" width="74" height="66" fill="#175cad" opacity="1"/><text x="277" y="290" fill="#faf9f5" font-size="34" text-anchor="middle">✓</text><rect x="330" y="244" width="74" height="66" fill="#e6edf3" opacity="1"/><rect x="60" y="326" width="74" height="66" fill="#175cad" opacity="1"/><text x="97" y="372" fill="#faf9f5" font-size="34" text-anchor="middle">✓</text><rect x="150" y="326" width="74" height="66" fill="#175cad" opacity="1"/><text x="187" y="372" fill="#faf9f5" font-size="34" text-anchor="middle">✓</text><rect x="240" y="326" width="74" height="66" fill="#175cad" opacity="1"/><text x="277" y="372" fill="#faf9f5" font-size="34" text-anchor="middle">✓</text><rect x="330" y="326" width="74" height="66" fill="#175cad" opacity="1"/><text x="367" y="372" fill="#faf9f5" font-size="34" text-anchor="middle">✓</text><rect x="530" y="85" width="825" height="115" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="942.5" y="133" fill="#175cad" font-size="34" text-anchor="middle">Prefill: 1 + 2 + 3 + 4 = 10 pairs</text><text x="942.5" y="174" fill="#172b35" font-size="34" text-anchor="middle">4 known query rows</text><rect x="530" y="275" width="825" height="115" rx="8" fill="#e6edf3" stroke="#89540a" stroke-width="3"/><text x="942.5" y="323" fill="#89540a" font-size="34" text-anchor="middle">Decode: one new query row</text><text x="942.5" y="364" fill="#172b35" font-size="34" text-anchor="middle">attends history + current position</text><text x="35" y="457" fill="#4b6070" font-size="34" text-anchor="start">Causality masks future positions; it does not serialize all prompt rows.</text></g></svg>
