<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Flatten token rows; watch M collapse</title><desc id="desc">For batch eight and prompt length 512, prefill has 4096 token rows. One decode step has eight token rows. Both multiply the same weight matrix; changing M alters reuse and parallel work.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="25" y="45" fill="#f1f3ed" font-size="34" text-anchor="start">Prefill: M = 8 × 512 = 4,096</text><rect x="80" y="90" width="260" height="265" fill="#8cbcff" opacity="1"/><text x="210" y="239" fill="#151b22" font-size="48" text-anchor="middle">X</text><line x1="365" y1="215" x2="525" y2="215" stroke="#8cbcff" stroke-width="4"/><path d="M 511.8362615716444 222.19138307906306 L 525 215 L 511.8362615716444 207.80861692093694" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="555" y="105" width="330" height="225" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="720" y="208" fill="#8cbcff" font-size="34" text-anchor="middle">Shared weights</text><text x="720" y="249" fill="#f1f3ed" font-size="34" text-anchor="middle">[d, d_out]</text><line x1="905" y1="215" x2="1045" y2="215" stroke="#8cbcff" stroke-width="4"/><path d="M 1031.8362615716444 222.19138307906306 L 1045 215 L 1031.8362615716444 207.80861692093694" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="1070" y="140" width="335" height="150" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="1237.5" y="205.5" fill="#8cbcff" font-size="34" text-anchor="middle">Y</text><text x="1237.5" y="246.5" fill="#f1f3ed" font-size="34" text-anchor="middle">[M, d_out]</text><rect x="80" y="393" width="260" height="28" fill="#ffcc79" opacity="1"/><text x="375" y="423" fill="#ffcc79" font-size="38" text-anchor="start">Decode: M = 8 × 1 = 8</text></g></svg>
