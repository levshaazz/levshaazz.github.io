<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">The same request changes the projection shape</title><desc id="desc">For the concrete request, batch one prefill processes 42 rows, while decode processes one. Qwen2.5-1.5B hidden width is 1536; its query projection maps 1536 to 1536. These shapes explain new-token rows, not elapsed time or full attention cost.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="25" y="48" fill="#8cbcff" font-size="38" text-anchor="start">Prefill: X [42, 1536]</text><rect x="40" y="92" width="315" height="200" fill="#8cbcff" opacity="1"/><text x="197" y="211" fill="#151b22" font-size="42" text-anchor="middle">42 rows</text><line x1="375" y1="190" x2="510" y2="190" stroke="#8cbcff" stroke-width="4"/><path d="M 496.8362615716444 197.19138307906306 L 510 190 L 496.8362615716444 182.80861692093694" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="535" y="104" width="470" height="172" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="770" y="180.5" fill="#8cbcff" font-size="34" text-anchor="middle">same Q weights</text><text x="770" y="221.5" fill="#f1f3ed" font-size="34" text-anchor="middle">[1536, 1536]</text><line x1="1025" y1="190" x2="1095" y2="190" stroke="#8cbcff" stroke-width="4"/><path d="M 1081.8362615716444 197.19138307906306 L 1095 190 L 1081.8362615716444 182.80861692093694" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="1115" y="125" width="295" height="130" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="1262.5" y="180.5" fill="#8cbcff" font-size="34" text-anchor="middle">Q output</text><text x="1262.5" y="221.5" fill="#f1f3ed" font-size="34" text-anchor="middle">42 rows</text><rect x="40" y="367" width="315" height="25" fill="#ffcc79" opacity="1"/><text x="395" y="397" fill="#ffcc79" font-size="40" text-anchor="start">Decode X [1, 1536]</text><text x="25" y="467" fill="#becad4" font-size="34" text-anchor="start">The one new query attends the whole growing KV history.</text></g></svg>
