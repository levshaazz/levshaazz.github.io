<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">A bounded experiment has a stopping rule</title><desc id="desc">Freeze the manifest, warm the service, measure one bounded load point, check guardrails, and either stop or increase load. Always retain raw records and verify resources return to baseline.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><rect x="30" y="65" width="300" height="100" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="180" y="126" fill="#8cbcff" font-size="34" text-anchor="middle">Freeze</text><line x1="337" y1="115" x2="369" y2="115" stroke="#8cbcff" stroke-width="4"/><path d="M 355.8362615716444 122.19138307906304 L 369 115 L 355.8362615716444 107.80861692093696" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="385" y="65" width="300" height="100" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="535" y="126" fill="#8cbcff" font-size="34" text-anchor="middle">Warm</text><line x1="692" y1="115" x2="724" y2="115" stroke="#8cbcff" stroke-width="4"/><path d="M 710.8362615716444 122.19138307906304 L 724 115 L 710.8362615716444 107.80861692093696" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="740" y="65" width="300" height="100" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="890" y="126" fill="#8cbcff" font-size="34" text-anchor="middle">One load point</text><line x1="1047" y1="115" x2="1079" y2="115" stroke="#8cbcff" stroke-width="4"/><path d="M 1065.8362615716444 122.19138307906304 L 1079 115 L 1065.8362615716444 107.80861692093696" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="1095" y="65" width="300" height="100" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="1245" y="126" fill="#8cbcff" font-size="34" text-anchor="middle">Check limits</text><line x1="1250" y1="180" x2="1250" y2="285" stroke="#ffae99" stroke-width="4"/><path d="M 1242.8086169209369 271.8362615716444 L 1250 285 L 1257.1913830790631 271.8362615716444" fill="none" stroke="#ffae99" stroke-width="4"/><rect x="1080" y="305" width="330" height="100" rx="8" fill="#293744" stroke="#ffae99" stroke-width="3"/><text x="1245" y="366" fill="#ffae99" font-size="34" text-anchor="middle">STOP + cleanup</text><line x1="1130" y1="205" x2="640" y2="295" stroke="#7addbb" stroke-width="4"/><path d="M 651.6480233417327 285.5488861910116 L 640 295 L 654.246291914725 299.6950150884145" fill="none" stroke="#7addbb" stroke-width="4"/><text x="620" y="354" fill="#7addbb" font-size="36" text-anchor="middle">Pass: next bounded point</text><text x="60" y="460" fill="#becad4" font-size="36" text-anchor="start">Always retain raw events and verify teardown</text></g></svg>
