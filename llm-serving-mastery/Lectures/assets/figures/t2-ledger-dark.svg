<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Do not add allocated bytes to reserved bytes</title><desc id="desc">Device process memory includes a caching allocator pool and allocations outside it. Within the pool, live allocated tensors occupy part of the reserved space; the rest can be reusable. Reserved and allocated are not disjoint terms.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><rect x="30" y="65" width="950" height="320" fill="#293744" opacity="1"/><text x="60" y="113" fill="#becad4" font-size="36" text-anchor="start">Allocator reserved pool</text><rect x="60" y="155" width="550" height="190" fill="#8cbcff" opacity="1"/><text x="335" y="240" fill="#151b22" font-size="34" text-anchor="middle">Allocated live tensors</text><text x="335" y="290" fill="#151b22" font-size="32" text-anchor="middle">weights + KV + temporaries</text><text x="790" y="240" fill="#becad4" font-size="34" text-anchor="middle">Reusable</text><text x="790" y="290" fill="#becad4" font-size="34" text-anchor="middle">pool space</text><rect x="1025" y="155" width="375" height="190" rx="8" fill="#293744" stroke="#ffcc79" stroke-width="3"/><text x="1212.5" y="240.5" fill="#ffcc79" font-size="34" text-anchor="middle">Other process</text><text x="1212.5" y="281.5" fill="#f1f3ed" font-size="34" text-anchor="middle">CUDA memory</text><text x="50" y="455" fill="#f1f3ed" font-size="34" text-anchor="start">Allocated ⊆ reserved; device-used has a wider accounting boundary.</text></g></svg>
