<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Read-size distribution, not token latency</title><desc id="desc">A histogram of 13 client reads from one raw response. One read is 14 bytes, eleven are 128 to under 256 bytes and one is 260 bytes. Bin counts are 1,11,1,0 for ranges 0–128,128–256,256–384,384–512 bytes. Same response has 13 events and ten reported completion tokens.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><line x1="180" y1="345" x2="1320" y2="345" stroke="#4b6070" stroke-width="4"/><line x1="180" y1="45" x2="180" y2="345" stroke="#4b6070" stroke-width="4"/><text x="145" y="355" fill="#4b6070" font-size="30" text-anchor="end">0</text><text x="145" y="230" fill="#4b6070" font-size="30" text-anchor="end">5</text><line x1="180" y1="220" x2="1320" y2="220" stroke="#4b6070" stroke-width="4" stroke-dasharray="10 8"/><text x="145" y="105" fill="#4b6070" font-size="30" text-anchor="end">10</text><line x1="180" y1="95" x2="1320" y2="95" stroke="#4b6070" stroke-width="4" stroke-dasharray="10 8"/><rect x="250" y="320" width="160" height="25" fill="#175cad" opacity="1"/><text x="330" y="302" fill="#172b35" font-size="32" text-anchor="middle">1</text><text x="330" y="405" fill="#172b35" font-size="30" text-anchor="middle">0–128</text><rect x="510" y="70" width="160" height="275" fill="#175cad" opacity="1"/><text x="590" y="52" fill="#172b35" font-size="32" text-anchor="middle">11</text><text x="590" y="405" fill="#172b35" font-size="30" text-anchor="middle">128–256</text><rect x="770" y="320" width="160" height="25" fill="#175cad" opacity="1"/><text x="850" y="302" fill="#172b35" font-size="32" text-anchor="middle">1</text><text x="850" y="405" fill="#172b35" font-size="30" text-anchor="middle">256–384</text><rect x="1030" y="345" width="160" height="0" fill="#175cad" opacity="1"/><text x="1110" y="327" fill="#172b35" font-size="32" text-anchor="middle">0</text><text x="1110" y="405" fill="#172b35" font-size="30" text-anchor="middle">384–512</text><text x="750" y="468" fill="#172b35" font-size="32" text-anchor="middle">Read size (bytes); right edge excluded</text><text x="25" y="31" fill="#4b6070" font-size="30" text-anchor="start">Reads</text></g></svg>
