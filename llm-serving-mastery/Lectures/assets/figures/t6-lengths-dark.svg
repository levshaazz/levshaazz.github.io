<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">The actual teaching inputs have different rendered lengths</title><desc id="desc">Two equal-axis histograms of240 synthetic inputs per application. A ranges93–197 and B472–817 rendered tokens. The plotted counts use the frozen corpus, not an illustrative distribution. B is longer on this teaching corpus, not on every production task.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="35" y="38" fill="#becad4" font-size="30" text-anchor="start">Input distribution, NOT observed latency or throughput</text><text x="390" y="85" fill="#f1f3ed" font-size="30" text-anchor="middle">A: n=240; 93–197 tokens</text><line x1="95" y1="340" x2="685" y2="340" stroke="#293744" stroke-width="4"/><text x="85" y="348" fill="#becad4" font-size="30" text-anchor="end">0</text><line x1="95" y1="235" x2="685" y2="235" stroke="#293744" stroke-width="4"/><text x="85" y="243" fill="#becad4" font-size="30" text-anchor="end">120</text><line x1="95" y1="130" x2="685" y2="130" stroke="#293744" stroke-width="4"/><text x="85" y="138" fill="#becad4" font-size="30" text-anchor="end">240</text><rect x="133.875" y="235" width="32.875" height="105" fill="#8cbcff" opacity="1"/><rect x="170.75" y="241.125" width="32.875" height="98.875" fill="#8cbcff" opacity="1"/><rect x="207.625" y="333.875" width="32.875" height="6.125" fill="#8cbcff" opacity="1"/><line x1="95" y1="340" x2="685" y2="340" stroke="#becad4" stroke-width="4"/><text x="95" y="377" fill="#becad4" font-size="30" text-anchor="middle">0</text><text x="390" y="377" fill="#becad4" font-size="30" text-anchor="middle">512</text><text x="685" y="377" fill="#becad4" font-size="30" text-anchor="middle">1024</text><text x="390" y="421" fill="#becad4" font-size="30" text-anchor="middle">Rendered input tokens</text><text x="1100" y="85" fill="#f1f3ed" font-size="30" text-anchor="middle">B: n=240; 472–817 tokens</text><line x1="805" y1="340" x2="1395" y2="340" stroke="#293744" stroke-width="4"/><text x="795" y="348" fill="#becad4" font-size="30" text-anchor="end">0</text><line x1="805" y1="235" x2="1395" y2="235" stroke="#293744" stroke-width="4"/><text x="795" y="243" fill="#becad4" font-size="30" text-anchor="end">120</text><line x1="805" y1="130" x2="1395" y2="130" stroke="#293744" stroke-width="4"/><text x="795" y="138" fill="#becad4" font-size="30" text-anchor="end">240</text><rect x="1065.125" y="237.625" width="32.875" height="102.375" fill="#ffcc79" opacity="1"/><rect x="1102" y="337.375" width="32.875" height="2.625" fill="#ffcc79" opacity="1"/><rect x="1212.625" y="330.375" width="32.875" height="9.625" fill="#ffcc79" opacity="1"/><rect x="1249.5" y="244.625" width="32.875" height="95.375" fill="#ffcc79" opacity="1"/><line x1="805" y1="340" x2="1395" y2="340" stroke="#becad4" stroke-width="4"/><text x="805" y="377" fill="#becad4" font-size="30" text-anchor="middle">0</text><text x="1100" y="377" fill="#becad4" font-size="30" text-anchor="middle">512</text><text x="1395" y="377" fill="#becad4" font-size="30" text-anchor="middle">1024</text><text x="1100" y="421" fill="#becad4" font-size="30" text-anchor="middle">Rendered input tokens</text><text x="35" y="465" fill="#f1f3ed" font-size="30" text-anchor="start">Same count scale; a short label does not imply a short input</text></g></svg>
