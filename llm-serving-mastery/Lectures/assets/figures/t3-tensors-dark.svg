<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">The quantization target follows the tensor lifetime</title><desc id="desc">Projection weights persist across requests. Input activations change each token or batch. KV history persists for the lifetime of one sequence. W4A16 changes weights but leaves activation and KV precision separate.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><rect x="25" y="75" width="560" height="112" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="305" y="121.5" fill="#8cbcff" font-size="34" text-anchor="middle">W: shared model parameters</text><text x="305" y="162.5" fill="#f1f3ed" font-size="34" text-anchor="middle">store once per replica</text><rect x="25" y="285" width="560" height="112" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="305" y="331.5" fill="#8cbcff" font-size="34" text-anchor="middle">x: current token / batch</text><text x="305" y="372.5" fill="#f1f3ed" font-size="34" text-anchor="middle">changes every forward</text><line x1="605" y1="132" x2="748" y2="222" stroke="#8cbcff" stroke-width="4"/><path d="M 733.0285759878116 221.0745471123466 L 748 222 L 740.6896468368519 208.9019567633157" fill="none" stroke="#8cbcff" stroke-width="4"/><line x1="605" y1="338" x2="748" y2="248" stroke="#8cbcff" stroke-width="4"/><path d="M 740.6896468368519 261.0980432366843 L 748 248 L 733.0285759878116 248.9254528876534" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="770" y="180" width="625" height="114" rx="8" fill="#293744" stroke="#7addbb" stroke-width="3"/><text x="1082.5" y="227.5" fill="#7addbb" font-size="34" text-anchor="middle">projection / attention</text><text x="1082.5" y="268.5" fill="#f1f3ed" font-size="34" text-anchor="middle">output + updated KV</text><text x="790" y="381" fill="#8cbcff" font-size="34" text-anchor="start">KV: retained per sequence</text><text x="25" y="470" fill="#becad4" font-size="32" text-anchor="start">Weight compression alone does not change the bytes of retained KV.</text></g></svg>
