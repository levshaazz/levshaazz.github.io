<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Generation and delivery clocks</title><desc id="desc">The worker emits token events before the server groups content into transport chunks. The client first sees chunk 1, then chunk 2. Chunk boundaries need not match token boundaries.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="25" y="89" fill="#f1f3ed" font-size="34" text-anchor="start">Worker tokens</text><circle cx="330" cy="80" r="8" fill="#8cbcff"/><text x="330" y="132" fill="#8cbcff" font-size="32" text-anchor="middle">1</text><circle cx="475" cy="80" r="8" fill="#8cbcff"/><text x="475" y="132" fill="#8cbcff" font-size="32" text-anchor="middle">2</text><circle cx="620" cy="80" r="8" fill="#8cbcff"/><text x="620" y="132" fill="#8cbcff" font-size="32" text-anchor="middle">3</text><circle cx="765" cy="80" r="8" fill="#8cbcff"/><text x="765" y="132" fill="#8cbcff" font-size="32" text-anchor="middle">4</text><circle cx="910" cy="80" r="8" fill="#8cbcff"/><text x="910" y="132" fill="#8cbcff" font-size="32" text-anchor="middle">5</text><circle cx="1055" cy="80" r="8" fill="#8cbcff"/><text x="1055" y="132" fill="#8cbcff" font-size="32" text-anchor="middle">6</text><text x="25" y="239" fill="#f1f3ed" font-size="34" text-anchor="start">Server chunks</text><rect x="310" y="184" width="440" height="86" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="530" y="238" fill="#8cbcff" font-size="34" text-anchor="middle">chunk 1: grouped text</text><rect x="850" y="184" width="440" height="86" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="1070" y="238" fill="#8cbcff" font-size="34" text-anchor="middle">chunk 2: grouped text</text><line x1="620" y1="144" x2="530" y2="179" stroke="#8cbcff" stroke-width="4"/><path d="M 539.6621758006357 167.52644959929103 L 530 179 L 544.8751556197144 180.9312548483506" fill="none" stroke="#8cbcff" stroke-width="4"/><line x1="1055" y1="144" x2="1070" y2="179" stroke="#8cbcff" stroke-width="4"/><path d="M 1058.2046253755457 169.73343982543784 L 1070 179 L 1071.4244734076992 164.06779066880063" fill="none" stroke="#8cbcff" stroke-width="4"/><text x="25" y="394" fill="#f1f3ed" font-size="34" text-anchor="start">Client observes</text><line x1="530" y1="278" x2="650" y2="357" stroke="#8cbcff" stroke-width="4"/><path d="M 635.0506615209297 355.76822118942283 L 650 357 L 642.9593440773568 343.75503249611575" fill="none" stroke="#8cbcff" stroke-width="4"/><line x1="1070" y1="278" x2="1190" y2="357" stroke="#8cbcff" stroke-width="4"/><path d="M 1175.0506615209297 355.76822118942283 L 1190 357 L 1182.959344077357 343.75503249611575" fill="none" stroke="#8cbcff" stroke-width="4"/><circle cx="650" cy="380" r="8" fill="#7addbb"/><circle cx="1190" cy="380" r="8" fill="#7addbb"/><text x="650" y="444" fill="#7addbb" font-size="32" text-anchor="middle">first content</text><text x="1190" y="444" fill="#7addbb" font-size="32" text-anchor="middle">more content</text></g></svg>
