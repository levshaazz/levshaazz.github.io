<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">What stays resident is not what is read per second</title><desc id="desc">At each decode step one new key/value position is appended. The query attends a growing retained history. Resident capacity grows by one position per sequence, while read demand depends on history, reuse and kernel implementation.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="25" y="102" fill="#172b35" font-size="34" text-anchor="start">Step 1</text><rect x="235" y="54" width="83" height="66" fill="#175cad" opacity="1"/><rect x="335" y="54" width="83" height="66" fill="#175cad" opacity="1"/><rect x="435" y="54" width="83" height="66" fill="#175cad" opacity="1"/><rect x="535" y="54" width="83" height="66" fill="#146957" opacity="1"/><line x1="930" y1="88" x2="850" y2="88" stroke="#89540a" stroke-width="4"/><path d="M 863.1637384283556 80.80861692093696 L 850 88 L 863.1637384283556 95.19138307906304" fill="none" stroke="#89540a" stroke-width="4"/><text x="975" y="100" fill="#172b35" font-size="34" text-anchor="start">read 4; append 1</text><text x="25" y="237" fill="#172b35" font-size="34" text-anchor="start">Step 2</text><rect x="235" y="189" width="83" height="66" fill="#175cad" opacity="1"/><rect x="335" y="189" width="83" height="66" fill="#175cad" opacity="1"/><rect x="435" y="189" width="83" height="66" fill="#175cad" opacity="1"/><rect x="535" y="189" width="83" height="66" fill="#175cad" opacity="1"/><rect x="635" y="189" width="83" height="66" fill="#146957" opacity="1"/><line x1="930" y1="223" x2="850" y2="223" stroke="#89540a" stroke-width="4"/><path d="M 863.1637384283556 215.80861692093694 L 850 223 L 863.1637384283556 230.19138307906303" fill="none" stroke="#89540a" stroke-width="4"/><text x="975" y="235" fill="#172b35" font-size="34" text-anchor="start">read 5; append 1</text><text x="25" y="372" fill="#172b35" font-size="34" text-anchor="start">Step 3</text><rect x="235" y="324" width="83" height="66" fill="#175cad" opacity="1"/><rect x="335" y="324" width="83" height="66" fill="#175cad" opacity="1"/><rect x="435" y="324" width="83" height="66" fill="#175cad" opacity="1"/><rect x="535" y="324" width="83" height="66" fill="#175cad" opacity="1"/><rect x="635" y="324" width="83" height="66" fill="#175cad" opacity="1"/><rect x="735" y="324" width="83" height="66" fill="#146957" opacity="1"/><line x1="930" y1="358" x2="850" y2="358" stroke="#89540a" stroke-width="4"/><path d="M 863.1637384283556 350.80861692093697 L 850 358 L 863.1637384283556 365.19138307906303" fill="none" stroke="#89540a" stroke-width="4"/><text x="975" y="370" fill="#172b35" font-size="34" text-anchor="start">read 6; append 1</text><text x="235" y="464" fill="#4b6070" font-size="32" text-anchor="start">Blue: retained history     Green: newly computed K/V</text></g></svg>
