<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">The MLP expands each position along two branches</title><desc id="desc">The second RMSNorm consumes the first updated residual. Two independent bias-free projections, gate_proj and up_proj, expand each position from 1536 to 8960 features. They do not mix positions. Both last-row toy vectors have six coordinates.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><rect x="25" y="76" width="330" height="116" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="190" y="124.5" fill="#175cad" font-size="34" text-anchor="middle">x1 [1,42,1536]</text><text x="190" y="165.5" fill="#172b35" font-size="34" text-anchor="middle">second RMSNorm</text><line x1="375" y1="135" x2="477" y2="135" stroke="#175cad" stroke-width="4"/><path d="M 463.8362615716444 142.19138307906306 L 477 135 L 463.8362615716444 127.80861692093696" fill="none" stroke="#175cad" stroke-width="4"/><rect x="500" y="38" width="860" height="90" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="930" y="94" fill="#175cad" font-size="34" text-anchor="middle">gate = h2 @ Wgate.T   [1,42,8960]</text><rect x="500" y="180" width="860" height="90" rx="8" fill="#e6edf3" stroke="#89540a" stroke-width="3"/><text x="930" y="236" fill="#89540a" font-size="34" text-anchor="middle">up = h2 @ Wup.T         [1,42,8960]</text><line x1="450" y1="137" x2="475" y2="225" stroke="#89540a" stroke-width="4"/><path d="M 464.4850062132724 214.30257481142866 L 475 225 L 478.32029751917787 210.37209432679643" fill="none" stroke="#89540a" stroke-width="4"/><text x="25" y="338" fill="#175cad" font-size="32" text-anchor="start">Toy gate[2] = [0.366, 0.787, 1.046, 1.467, 0.577, 1.257]</text><text x="25" y="408" fill="#89540a" font-size="32" text-anchor="start">Toy up[2]   = [0.183, 0.393, 0.523, 0.733, -0.421, -0.421]</text><text x="25" y="475" fill="#4b6070" font-size="30" text-anchor="start">Each token position uses the same learned maps independently.</text></g></svg>
