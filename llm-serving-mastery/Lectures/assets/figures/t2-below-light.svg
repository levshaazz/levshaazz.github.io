<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Below both roofs: separate kernels from gaps</title><desc id="desc">One illustrative interval has 60 ms of kernels and 40 ms of gaps. A kernel-only roofline does not account for the gaps. The next test is a timeline before interpreting kernel hardware counters.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="30" y="60" fill="#172b35" font-size="34" text-anchor="start">Elapsed boundary: 100 ms</text><rect x="75" y="130" width="300" height="105" fill="#175cad" opacity="1"/><rect x="375" y="130" width="240" height="105" fill="#89540a" opacity="1"/><rect x="615" y="130" width="420" height="105" fill="#175cad" opacity="1"/><rect x="1035" y="130" width="240" height="105" fill="#89540a" opacity="1"/><text x="225" y="195" fill="#faf9f5" font-size="34" text-anchor="middle">25 ms</text><text x="495" y="195" fill="#faf9f5" font-size="34" text-anchor="middle">20 ms</text><text x="825" y="195" fill="#faf9f5" font-size="34" text-anchor="middle">35 ms</text><text x="1155" y="195" fill="#faf9f5" font-size="34" text-anchor="middle">20 ms</text><text x="90" y="330" fill="#175cad" font-size="38" text-anchor="start">Blue kernels: 60 ms</text><text x="780" y="330" fill="#89540a" font-size="38" text-anchor="start">Amber gaps: 40 ms</text><line x1="75" y1="385" x2="1275" y2="385" stroke="#4b6070" stroke-width="4"/><text x="75" y="449" fill="#4b6070" font-size="36" text-anchor="start">First locate the missing time; then interrogate the kernel.</text></g></svg>
