<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Rendered input and requested output share a context budget</title><desc id="desc">A measured prompt2329 already exceeds the configured2048token context by281 and received400. An illustrative1800prompt with512output cap asks2312,264over; the same prompt with128output cap asks1928,120spare. These are arithmetic plans, not new API observations.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="25" y="46" fill="#8cbcff" font-size="32" text-anchor="start">CASE</text><text x="535" y="46" fill="#8cbcff" font-size="32" text-anchor="start">PROMPT + OUTPUT</text><text x="1080" y="46" fill="#8cbcff" font-size="32" text-anchor="start">RESULT</text><text x="25" y="142" fill="#f1f3ed" font-size="32" text-anchor="start">measured input</text><text x="535" y="142" fill="#f1f3ed" font-size="34" text-anchor="start">2329 + any</text><text x="1080" y="142" fill="#ffae99" font-size="34" text-anchor="start">281 over</text><line x1="25" y1="172" x2="1410" y2="172" stroke="#becad4" stroke-width="4"/><text x="25" y="244" fill="#f1f3ed" font-size="32" text-anchor="start">illustrative plan</text><text x="535" y="244" fill="#f1f3ed" font-size="34" text-anchor="start">1800 + 512 = 2312</text><text x="1080" y="244" fill="#ffae99" font-size="34" text-anchor="start">264 over</text><line x1="25" y1="274" x2="1410" y2="274" stroke="#becad4" stroke-width="4"/><text x="25" y="346" fill="#f1f3ed" font-size="32" text-anchor="start">illustrative plan</text><text x="535" y="346" fill="#f1f3ed" font-size="34" text-anchor="start">1800 + 128 = 1928</text><text x="1080" y="346" fill="#7addbb" font-size="34" text-anchor="start">120 spare</text><line x1="25" y1="376" x2="1410" y2="376" stroke="#becad4" stroke-width="4"/><text x="25" y="465" fill="#becad4" font-size="34" text-anchor="start">Configured maximum: 2048 token positions per sequence</text></g></svg>
