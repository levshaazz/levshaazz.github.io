<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Admission policy changes who waits</title><desc id="desc">A shared FIFO places tenant B behind three tenant A requests. A per-tenant policy can select B earlier but must define fair shares and starvation protection. Queue slots do not encode equal token cost.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="25" y="70" fill="#f1f3ed" font-size="36" text-anchor="start">FIFO</text><rect x="260" y="95" width="240" height="90" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="380" y="151" fill="#8cbcff" font-size="34" text-anchor="middle">A long</text><line x1="505" y1="140" x2="530" y2="140" stroke="#8cbcff" stroke-width="4"/><path d="M 516.8362615716444 147.19138307906306 L 530 140 L 516.8362615716444 132.80861692093694" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="540" y="95" width="240" height="90" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="660" y="151" fill="#8cbcff" font-size="34" text-anchor="middle">A long</text><line x1="785" y1="140" x2="810" y2="140" stroke="#8cbcff" stroke-width="4"/><path d="M 796.8362615716444 147.19138307906306 L 810 140 L 796.8362615716444 132.80861692093694" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="820" y="95" width="240" height="90" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="940" y="151" fill="#8cbcff" font-size="34" text-anchor="middle">A long</text><line x1="1065" y1="140" x2="1090" y2="140" stroke="#8cbcff" stroke-width="4"/><path d="M 1076.8362615716444 147.19138307906306 L 1090 140 L 1076.8362615716444 132.80861692093694" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="1100" y="95" width="240" height="90" rx="8" fill="#293744" stroke="#7addbb" stroke-width="3"/><text x="1220" y="151" fill="#7addbb" font-size="34" text-anchor="middle">B short</text><text x="25" y="295" fill="#f1f3ed" font-size="36" text-anchor="start">Fair-share sketch</text><rect x="260" y="320" width="240" height="90" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="380" y="376" fill="#8cbcff" font-size="34" text-anchor="middle">A long</text><line x1="505" y1="365" x2="530" y2="365" stroke="#8cbcff" stroke-width="4"/><path d="M 516.8362615716444 372.19138307906303 L 530 365 L 516.8362615716444 357.80861692093697" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="540" y="320" width="240" height="90" rx="8" fill="#293744" stroke="#7addbb" stroke-width="3"/><text x="660" y="376" fill="#7addbb" font-size="34" text-anchor="middle">B short</text><line x1="785" y1="365" x2="810" y2="365" stroke="#8cbcff" stroke-width="4"/><path d="M 796.8362615716444 372.19138307906303 L 810 365 L 796.8362615716444 357.80861692093697" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="820" y="320" width="240" height="90" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="940" y="376" fill="#8cbcff" font-size="34" text-anchor="middle">A long</text><line x1="1065" y1="365" x2="1090" y2="365" stroke="#8cbcff" stroke-width="4"/><path d="M 1076.8362615716444 372.19138307906303 L 1090 365 L 1076.8362615716444 357.80861692093697" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="1100" y="320" width="240" height="90" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="1220" y="376" fill="#8cbcff" font-size="34" text-anchor="middle">A long</text></g></svg>
