<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">The next call receives the token just selected</title><desc id="desc">After the 42-token prefill, each next call consumes exactly one previously selected ID. First decode input &quot;8&quot; [23], output &quot;,&quot; [11], retained KV 43. The following decode selects &quot;␠&quot; [220].</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="25" y="50" fill="#8cbcff" font-size="30" text-anchor="start">Call / shape</text><text x="235" y="50" fill="#8cbcff" font-size="30" text-anchor="start">Consumed token</text><text x="650" y="50" fill="#8cbcff" font-size="30" text-anchor="start">Selected token</text><text x="1030" y="50" fill="#8cbcff" font-size="30" text-anchor="start">KV after</text><text x="25" y="135" fill="#f1f3ed" font-size="34" text-anchor="start">#2 [1, 1]</text><text x="235" y="135" fill="#f1f3ed" font-size="34" text-anchor="start">&quot;8&quot; [23]</text><text x="650" y="135" fill="#7addbb" font-size="34" text-anchor="start">&quot;,&quot; [11]</text><text x="1030" y="135" fill="#f1f3ed" font-size="34" text-anchor="start">43 positions</text><text x="25" y="230" fill="#f1f3ed" font-size="34" text-anchor="start">#3 [1, 1]</text><text x="235" y="230" fill="#f1f3ed" font-size="34" text-anchor="start">&quot;,&quot; [11]</text><text x="650" y="230" fill="#7addbb" font-size="34" text-anchor="start">&quot;␠&quot; [220]</text><text x="1030" y="230" fill="#f1f3ed" font-size="34" text-anchor="start">44 positions</text><text x="25" y="325" fill="#f1f3ed" font-size="34" text-anchor="start">#4 [1, 1]</text><text x="235" y="325" fill="#f1f3ed" font-size="34" text-anchor="start">&quot;␠&quot; [220]</text><text x="650" y="325" fill="#7addbb" font-size="34" text-anchor="start">&quot;1&quot; [16]</text><text x="1030" y="325" fill="#f1f3ed" font-size="34" text-anchor="start">45 positions</text><line x1="25" y1="373" x2="1410" y2="373" stroke="#becad4" stroke-width="4"/><text x="25" y="443" fill="#becad4" font-size="34" text-anchor="start">The selected ID in one row becomes the consumed ID in the next.</text></g></svg>
