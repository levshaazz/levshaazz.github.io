<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">4,096 prompt tokens versus 31 generated steps</title><desc id="desc">Synthetic P4096/O32 on RTX 5070 Ti: prefill median 163.7 ms, range 163.4–163.8; 31 post-first decode steps median 1039.1 ms, range 763.9–1154.4. With O128, prefill is 164.0 ms and 127 decode steps take 3284.8 ms. Five trials per case.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="20" y="92" fill="#172b35" font-size="32" text-anchor="start">O32: 4,096 inputs</text><rect x="355" y="57" width="38.46126278056545" height="37" fill="#175cad" opacity="1" data-avoid-text="true"/><line x1="393.3885232301691" y1="103" x2="393.49394470033076" y2="103" stroke="#175cad" stroke-width="4"/><circle cx="393.46126278056545" cy="103" r="5" fill="#175cad"/><text x="1410" y="92" fill="#175cad" font-size="32" text-anchor="end">163.7 ms</text><text x="20" y="178" fill="#172b35" font-size="32" text-anchor="start">O32: 31 steps</text><rect x="355" y="143" width="244.1962418397634" height="37" fill="#89540a" opacity="1" data-avoid-text="true"/><line x1="534.5152469804088" y1="189" x2="626.2907637699391" y2="189" stroke="#89540a" stroke-width="4"/><circle cx="599.1962418397634" cy="189" r="5" fill="#89540a"/><text x="1410" y="178" fill="#89540a" font-size="32" text-anchor="end">1039.1 ms</text><text x="20" y="264" fill="#172b35" font-size="32" text-anchor="start">O128: 4,096 inputs</text><rect x="355" y="229" width="38.53751769544033" height="37" fill="#175cad" opacity="1" data-avoid-text="true"/><line x1="393.413736850689" y1="275" x2="393.7382633899324" y2="275" stroke="#175cad" stroke-width="4"/><circle cx="393.53751769544033" cy="275" r="5" fill="#175cad"/><text x="1410" y="264" fill="#175cad" font-size="32" text-anchor="end">164.0 ms</text><text x="20" y="350" fill="#172b35" font-size="32" text-anchor="start">O128: 127 steps</text><rect x="355" y="315" width="771.916837499939" height="37" fill="#89540a" opacity="1" data-avoid-text="true"/><line x1="1076.5979766803866" y1="361" x2="1358.51882210025" y2="361" stroke="#89540a" stroke-width="4"/><circle cx="1126.916837499939" cy="361" r="5" fill="#89540a"/><text x="1410" y="350" fill="#89540a" font-size="32" text-anchor="end">3284.8 ms</text><line x1="355" y1="401" x2="1365.5" y2="401" stroke="#4b6070" stroke-width="4"/><text x="355" y="446" fill="#4b6070" font-size="30" text-anchor="middle">0</text><text x="590" y="446" fill="#4b6070" font-size="30" text-anchor="middle">1000</text><text x="825" y="446" fill="#4b6070" font-size="30" text-anchor="middle">2000</text><text x="1060" y="446" fill="#4b6070" font-size="30" text-anchor="middle">3000</text><text x="1295" y="446" fill="#4b6070" font-size="30" text-anchor="middle">4000</text><text x="20" y="446" fill="#4b6070" font-size="30" text-anchor="start">Time (ms)</text></g></svg>
