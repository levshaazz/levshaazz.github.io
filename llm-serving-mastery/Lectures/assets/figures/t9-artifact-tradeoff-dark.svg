<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Model artifacts: bake, mount, or download — three honest trade-offs</title><desc id="desc">Three ways to get model weights into a serving container. Baked into the image: the largest image and the heaviest pull, but the fastest and most reproducible cold start with no host coupling. Mounted from the host at run time: a small image, but the start depends on a host filesystem path and the artifact escapes the image version control. Downloaded at container start: also a small image, but every start pays a network download and gains a network failure mode. Envelope directions are declared; absolute numbers belong to the owner demonstration.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="35" y="44" fill="#becad4" font-size="31" text-anchor="start">Bake, mount, or download: pick which cost you accept</text><text x="420" y="92" fill="#8cbcff" font-size="31" text-anchor="middle">baked into image</text><text x="840" y="92" fill="#8cbcff" font-size="31" text-anchor="middle">mounted at run</text><text x="1220" y="92" fill="#8cbcff" font-size="31" text-anchor="middle">download at start</text><text x="40" y="162" fill="#becad4" font-size="30" text-anchor="start">image size</text><rect x="240" y="116" width="420" height="80" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="450" y="167" fill="#8cbcff" font-size="34" text-anchor="middle">largest</text><rect x="660" y="116" width="360" height="80" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="840" y="167" fill="#8cbcff" font-size="34" text-anchor="middle">smallest</text><rect x="1080" y="116" width="320" height="80" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="1240" y="167" fill="#8cbcff" font-size="34" text-anchor="middle">smallest</text><text x="40" y="248" fill="#becad4" font-size="30" text-anchor="start">cold start</text><rect x="240" y="202" width="420" height="80" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="450" y="253" fill="#8cbcff" font-size="34" text-anchor="middle">fastest: local</text><rect x="660" y="202" width="360" height="80" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="840" y="253" fill="#8cbcff" font-size="34" text-anchor="middle">host-path</text><rect x="1080" y="202" width="320" height="80" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="1240" y="253" fill="#8cbcff" font-size="34" text-anchor="middle">slowest: network</text><text x="40" y="334" fill="#becad4" font-size="30" text-anchor="start">coupling</text><rect x="240" y="288" width="420" height="80" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="450" y="339" fill="#8cbcff" font-size="34" text-anchor="middle">none: self-contained</text><rect x="660" y="288" width="360" height="80" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="840" y="339" fill="#8cbcff" font-size="34" text-anchor="middle">host path</text><rect x="1080" y="288" width="320" height="80" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="1240" y="339" fill="#8cbcff" font-size="34" text-anchor="middle">registry + network</text><text x="40" y="420" fill="#becad4" font-size="30" text-anchor="start">drift</text><rect x="240" y="374" width="420" height="80" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="450" y="425" fill="#8cbcff" font-size="34" text-anchor="middle">image pins weights</text><rect x="660" y="374" width="360" height="80" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="840" y="425" fill="#8cbcff" font-size="34" text-anchor="middle">drifts outside</text><rect x="1080" y="374" width="320" height="80" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="1240" y="425" fill="#8cbcff" font-size="34" text-anchor="middle">download fails</text><text x="35" y="470" fill="#becad4" font-size="30" text-anchor="start">Declared directions, not measurements; the GPU envelope = owner demonstration</text></g></svg>
