<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">The scale-down window holds capacity: naive flaps 4 → 1 → 4, the window keeps 4</title><desc id="desc">Replica recommendations over 25 ticks of 15 seconds each. The metric ratio sits in the tolerance band until tick 5, spikes to 1.6 through tick 8, then falls to a quiet 0.5; a second spike arrives at tick 18. The red naive controller (dashed, drawn on top of the green trace) follows every movement instantly: up to 4 during the first spike, down to 1 in the quiet gap, up to 4 again, down to 1 — it flaps and serves the second burst from one pod. The green windowed controller takes the maximum recommendation over the trailing 20 ticks: it climbs to 4 at tick 5 and holds 4 for the rest of the picture.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="35" y="44" fill="#becad4" font-size="31" text-anchor="start">the window holds capacity: naive flaps 4 → 1 → 4, the window keeps 4</text><line x1="144" y1="352" x2="150" y2="352" stroke="#becad4" stroke-width="4"/><text x="134" y="362" fill="#becad4" font-size="30" text-anchor="end">0</text><line x1="144" y1="298" x2="150" y2="298" stroke="#becad4" stroke-width="4"/><text x="134" y="308" fill="#becad4" font-size="30" text-anchor="end">1</text><line x1="144" y1="244" x2="150" y2="244" stroke="#becad4" stroke-width="4"/><text x="134" y="254" fill="#becad4" font-size="30" text-anchor="end">2</text><line x1="144" y1="190" x2="150" y2="190" stroke="#becad4" stroke-width="4"/><text x="134" y="200" fill="#becad4" font-size="30" text-anchor="end">3</text><line x1="144" y1="136" x2="150" y2="136" stroke="#becad4" stroke-width="4"/><text x="134" y="146" fill="#becad4" font-size="30" text-anchor="end">4</text><line x1="144" y1="82" x2="150" y2="82" stroke="#becad4" stroke-width="4"/><text x="134" y="92" fill="#becad4" font-size="30" text-anchor="end">5</text><polyline points="150,244 380,244 380,136 1300,136" fill="none" stroke="#7addbb" stroke-width="6"/><line x1="150" y1="244" x2="380" y2="244" stroke="#ffae99" stroke-width="4" stroke-dasharray="10 8"/><line x1="380" y1="244" x2="380" y2="136" stroke="#ffae99" stroke-width="4" stroke-dasharray="10 8"/><line x1="380" y1="136" x2="564" y2="136" stroke="#ffae99" stroke-width="4" stroke-dasharray="10 8"/><line x1="564" y1="136" x2="564" y2="298" stroke="#ffae99" stroke-width="4" stroke-dasharray="10 8"/><line x1="564" y1="298" x2="978" y2="298" stroke="#ffae99" stroke-width="4" stroke-dasharray="10 8"/><line x1="978" y1="298" x2="978" y2="136" stroke="#ffae99" stroke-width="4" stroke-dasharray="10 8"/><line x1="978" y1="136" x2="1070" y2="136" stroke="#ffae99" stroke-width="4" stroke-dasharray="10 8"/><line x1="1070" y1="136" x2="1070" y2="298" stroke="#ffae99" stroke-width="4" stroke-dasharray="10 8"/><line x1="1070" y1="298" x2="1300" y2="298" stroke="#ffae99" stroke-width="4" stroke-dasharray="10 8"/><text x="170" y="116" fill="#ffae99" font-size="30" text-anchor="start">naive: instant down — flaps 4 → 1 → 4</text><text x="720" y="116" fill="#7addbb" font-size="30" text-anchor="start">windowed: max over 20 ticks — holds 4</text><text x="771" y="234" fill="#ffae99" font-size="30" text-anchor="middle">1 pod before the</text><text x="771" y="272" fill="#ffae99" font-size="30" text-anchor="middle">second burst: SLO risk</text><line x1="150" y1="352" x2="1330" y2="352" stroke="#becad4" stroke-width="4"/><text x="150" y="384" fill="#becad4" font-size="30" text-anchor="middle">0</text><text x="380" y="384" fill="#becad4" font-size="30" text-anchor="middle">5</text><text x="610" y="384" fill="#becad4" font-size="30" text-anchor="middle">10</text><text x="840" y="384" fill="#becad4" font-size="30" text-anchor="middle">15</text><text x="1070" y="384" fill="#becad4" font-size="30" text-anchor="middle">20</text><text x="1300" y="384" fill="#becad4" font-size="30" text-anchor="middle">25 ticks</text><text x="35" y="444" fill="#becad4" font-size="30" text-anchor="start">declared: scale-up window 0 s; scale-down 300 s = 20 × 15 s, taking the maximum</text></g></svg>
