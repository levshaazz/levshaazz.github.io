<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">The slowest required branch gates completion</title><desc id="desc">Three required parallel branches take 100, 120 and 800 milliseconds. Joining all branches takes at least 800 milliseconds, not the mean 340 milliseconds. Shared failures invalidate independence assumptions.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><rect x="25" y="170" width="220" height="110" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="135" y="215.5" fill="#8cbcff" font-size="34" text-anchor="middle">Parent</text><text x="135" y="256.5" fill="#f1f3ed" font-size="34" text-anchor="middle">request</text><rect x="1180" y="170" width="220" height="110" rx="8" fill="#293744" stroke="#ffae99" stroke-width="3"/><text x="1290" y="215.5" fill="#ffae99" font-size="34" text-anchor="middle">Join all</text><text x="1290" y="256.5" fill="#f1f3ed" font-size="34" text-anchor="middle">≥ 800 ms</text><line x1="260" y1="225" x2="455" y2="85" stroke="#8cbcff" stroke-width="4"/><path d="M 448.50084624337336 98.51891269472978 L 455 85 L 440.1127194603368 86.835450389786" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="470" y="40" width="450" height="90" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="695" y="96" fill="#8cbcff" font-size="34" text-anchor="middle">Branch 1: 100 ms</text><line x1="940" y1="85" x2="1160" y2="225" stroke="#8cbcff" stroke-width="4"/><path d="M 1145.0333835232957 223.9998043995084 L 1160 225 L 1152.7551381835387 211.86561850484077" fill="none" stroke="#8cbcff" stroke-width="4"/><line x1="260" y1="225" x2="455" y2="225" stroke="#8cbcff" stroke-width="4"/><path d="M 441.8362615716444 232.19138307906306 L 455 225 L 441.8362615716444 217.80861692093694" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="470" y="180" width="450" height="90" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="695" y="236" fill="#8cbcff" font-size="34" text-anchor="middle">Branch 2: 120 ms</text><line x1="940" y1="225" x2="1160" y2="225" stroke="#8cbcff" stroke-width="4"/><path d="M 1146.8362615716444 232.19138307906306 L 1160 225 L 1146.8362615716444 217.80861692093694" fill="none" stroke="#8cbcff" stroke-width="4"/><line x1="260" y1="225" x2="455" y2="365" stroke="#8cbcff" stroke-width="4"/><path d="M 440.1127194603368 363.164549610214 L 455 365 L 448.50084624337336 351.48108730527025" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="470" y="320" width="450" height="90" rx="8" fill="#293744" stroke="#ffae99" stroke-width="3"/><text x="695" y="376" fill="#ffae99" font-size="34" text-anchor="middle">Branch 3: 800 ms</text><line x1="940" y1="365" x2="1160" y2="225" stroke="#8cbcff" stroke-width="4"/><path d="M 1152.7551381835387 238.13438149515923 L 1160 225 L 1145.0333835232957 226.0001956004916" fill="none" stroke="#8cbcff" stroke-width="4"/><text x="470" y="465" fill="#becad4" font-size="32" text-anchor="start">Only partial-result policy can skip a required branch</text></g></svg>
