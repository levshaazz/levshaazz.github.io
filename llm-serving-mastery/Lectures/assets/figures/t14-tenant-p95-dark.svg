<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Tenant p95 under mixed traffic vs affinity grouping — the honest per-tenant promise</title><desc id="desc">Declared teaching bar chart with two panels. Left panel, mixed batching: tenant A p95 at 0.9 s, tenant B p95 at 1.6 s — tenant B inherits the swaps of tenant A. Right panel, affinity grouping: tenant A p95 at 0.7 s, tenant B p95 at 0.8 s — both close to the shared 0.7 s engine floor. A dashed line across both panels marks the declared per-tenant SLO at 1.0 s; the mixed B bar crosses it, the grouped bars do not.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="35" y="52" fill="#becad4" font-size="31" text-anchor="start">p95 per tenant: mixed batching vs affinity grouping</text><line x1="90" y1="108" x2="90" y2="392" stroke="#becad4" stroke-width="4" stroke-dasharray="10 8"/><line x1="90" y1="392" x2="710" y2="392" stroke="#becad4" stroke-width="4" stroke-dasharray="10 8"/><text x="90" y="86" fill="#f1f3ed" font-size="30" text-anchor="start">mixed</text><rect x="240" y="264.2" width="100" height="127.80000000000001" fill="#8cbcff" opacity="1"/><text x="290" y="250.2" fill="#8cbcff" font-size="30" text-anchor="middle">A: 0.9 s</text><rect x="470" y="164.79999999999998" width="100" height="227.20000000000002" fill="#ffcc79" opacity="1"/><text x="520" y="150.79999999999998" fill="#ffcc79" font-size="30" text-anchor="middle">B: 1.6 s</text><text x="240" y="418" fill="#becad4" font-size="30" text-anchor="middle">tenant A</text><text x="470" y="418" fill="#becad4" font-size="30" text-anchor="middle">tenant B</text><line x1="90" y1="250" x2="710" y2="250" stroke="#ffae99" stroke-width="4" stroke-dasharray="10 8"/><text x="706" y="238" fill="#ffae99" font-size="30" text-anchor="end">SLO 1.0 s</text><line x1="810" y1="108" x2="810" y2="392" stroke="#becad4" stroke-width="4" stroke-dasharray="10 8"/><line x1="810" y1="392" x2="1370" y2="392" stroke="#becad4" stroke-width="4" stroke-dasharray="10 8"/><text x="810" y="86" fill="#f1f3ed" font-size="30" text-anchor="start">grouped</text><rect x="960" y="292.6" width="100" height="99.39999999999998" fill="#7addbb" opacity="1"/><text x="1010" y="278.6" fill="#7addbb" font-size="30" text-anchor="middle">A: 0.7 s</text><rect x="1190" y="278.4" width="100" height="113.60000000000002" fill="#7addbb" opacity="1"/><text x="1240" y="264.4" fill="#7addbb" font-size="30" text-anchor="middle">B: 0.8 s</text><text x="960" y="418" fill="#becad4" font-size="30" text-anchor="middle">tenant A</text><text x="1190" y="418" fill="#becad4" font-size="30" text-anchor="middle">tenant B</text><text x="35" y="452" fill="#becad4" font-size="30" text-anchor="start">tenant B inherits tenant A swaps in its own p95 — the journal shows it</text></g></svg>
