<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Scheduled requests disappear from a blocking test</title><desc id="desc">A target schedule has requests at 0, 1, 2, 3, 4 seconds. A blocking client sends only at 0 and 4 while the service stalls. Requests intended at 1, 2, 3 are absent from its histogram, not fast responses.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="25" y="145" fill="#f1f3ed" font-size="34" text-anchor="start">Intended sends</text><text x="25" y="285" fill="#f1f3ed" font-size="34" text-anchor="start">Actual sends</text><circle cx="340" cy="135" r="8" fill="#8cbcff"/><text x="340" y="70" fill="#becad4" font-size="32" text-anchor="middle">0 s</text><circle cx="340" cy="275" r="8" fill="#7addbb"/><circle cx="575" cy="135" r="8" fill="#8cbcff"/><text x="575" y="70" fill="#becad4" font-size="32" text-anchor="middle">1 s</text><line x1="560" y1="258" x2="590" y2="292" stroke="#ffae99" stroke-width="4"/><line x1="590" y1="258" x2="560" y2="292" stroke="#ffae99" stroke-width="4"/><circle cx="810" cy="135" r="8" fill="#8cbcff"/><text x="810" y="70" fill="#becad4" font-size="32" text-anchor="middle">2 s</text><line x1="795" y1="258" x2="825" y2="292" stroke="#ffae99" stroke-width="4"/><line x1="825" y1="258" x2="795" y2="292" stroke="#ffae99" stroke-width="4"/><circle cx="1045" cy="135" r="8" fill="#8cbcff"/><text x="1045" y="70" fill="#becad4" font-size="32" text-anchor="middle">3 s</text><line x1="1030" y1="258" x2="1060" y2="292" stroke="#ffae99" stroke-width="4"/><line x1="1060" y1="258" x2="1030" y2="292" stroke="#ffae99" stroke-width="4"/><circle cx="1280" cy="135" r="8" fill="#8cbcff"/><text x="1280" y="70" fill="#becad4" font-size="32" text-anchor="middle">4 s</text><circle cx="1280" cy="275" r="8" fill="#7addbb"/><line x1="340" y1="355" x2="1280" y2="355" stroke="#ffcc79" stroke-width="4"/><text x="805" y="420" fill="#ffae99" font-size="38" text-anchor="middle">3 scheduled requests are missing, not successful</text></g></svg>
