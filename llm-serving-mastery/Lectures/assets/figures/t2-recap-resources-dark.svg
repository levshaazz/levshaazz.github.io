<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">The same graph exposes different resource questions</title><desc id="desc">Dense projections read weights and perform matrix multiplication. Attention reads available KV and mixes positions. RMSNorm/softmax reduce features or positions. RoPE, SiLU and residual adds use elementwise work. KV cache retains rotated keys and values per layer, while queries and intermediate activations are not reused across generation steps.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="25" y="47" fill="#8cbcff" font-size="30" text-anchor="start">Operation</text><text x="555" y="47" fill="#8cbcff" font-size="30" text-anchor="start">Work / traffic</text><text x="1020" y="47" fill="#8cbcff" font-size="30" text-anchor="start">Retained next step</text><text x="25" y="143" fill="#f1f3ed" font-size="30" text-anchor="start">Q/K/V, <tspan data-notation="code">o_proj</tspan>, MLP</text><text x="555" y="143" fill="#f1f3ed" font-size="30" text-anchor="start">GEMM + weight reads</text><text x="1020" y="143" fill="#7addbb" font-size="30" text-anchor="start">K/V only</text><text x="25" y="230" fill="#f1f3ed" font-size="30" text-anchor="start">QKᵀ, softmax, pV</text><text x="555" y="230" fill="#f1f3ed" font-size="30" text-anchor="start">KV reads + reductions</text><text x="1020" y="230" fill="#7addbb" font-size="30" text-anchor="start">K/V history</text><text x="25" y="317" fill="#f1f3ed" font-size="30" text-anchor="start">Norm, RoPE, SiLU, +</text><text x="555" y="317" fill="#f1f3ed" font-size="30" text-anchor="start">reduce / elementwise</text><text x="1020" y="317" fill="#7addbb" font-size="30" text-anchor="start">no prior Q/MLP</text><line x1="25" y1="359" x2="1410" y2="359" stroke="#becad4" stroke-width="4"/><text x="25" y="421" fill="#ffcc79" font-size="34" text-anchor="start">Serial: selected ID → next step, and block ℓ → block ℓ+1.</text><text x="25" y="470" fill="#becad4" font-size="30" text-anchor="start">Parallel within a step: token rows, heads, batch sequences and matrix tiles.</text></g></svg>
