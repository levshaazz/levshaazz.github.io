<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">The synthetic stream has six data events</title><desc id="desc">A comment heartbeat emits no data event. The six data events are role assistant, content Café space, content coffee symbol period, finish stop, usage-only with empty choices and DONE. The two text deltas concatenate to Café coffee symbol period.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="25" y="50" fill="#175cad" font-size="34" text-anchor="start">1</text><text x="128" y="50" fill="#172b35" font-size="34" text-anchor="start">role: &quot;assistant&quot;</text><text x="1030" y="50" fill="#4b6070" font-size="30" text-anchor="start">no content</text><text x="25" y="119" fill="#175cad" font-size="34" text-anchor="start">2</text><text x="128" y="119" fill="#172b35" font-size="34" text-anchor="start">content: &quot;Café &quot;</text><text x="1030" y="119" fill="#4b6070" font-size="30" text-anchor="start">partial</text><text x="25" y="188" fill="#175cad" font-size="34" text-anchor="start">3</text><text x="128" y="188" fill="#172b35" font-size="34" text-anchor="start">content: &quot;☕.&quot;</text><text x="1030" y="188" fill="#4b6070" font-size="30" text-anchor="start">partial</text><text x="25" y="257" fill="#175cad" font-size="34" text-anchor="start">4</text><text x="128" y="257" fill="#172b35" font-size="34" text-anchor="start">finish_reason: &quot;stop&quot;</text><text x="1030" y="257" fill="#4b6070" font-size="30" text-anchor="start">generation ended</text><text x="25" y="326" fill="#175cad" font-size="34" text-anchor="start">5</text><text x="128" y="326" fill="#172b35" font-size="34" text-anchor="start">choices: [], usage: {...}</text><text x="1030" y="326" fill="#4b6070" font-size="30" text-anchor="start">accounting</text><text x="25" y="395" fill="#175cad" font-size="34" text-anchor="start">6</text><text x="128" y="395" fill="#172b35" font-size="34" text-anchor="start">[DONE]</text><text x="1030" y="395" fill="#146957" font-size="30" text-anchor="start">terminal marker</text><line x1="25" y1="446" x2="1410" y2="446" stroke="#4b6070" stroke-width="4"/></g></svg>
