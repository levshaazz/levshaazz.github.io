<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">The synthetic stream has six data events</title><desc id="desc">A comment heartbeat emits no data event. The six data events are role assistant, content Café space, content coffee symbol period, finish stop, usage-only with empty choices and DONE. The two text deltas concatenate to Café coffee symbol period.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="25" y="50" fill="#8cbcff" font-size="34" text-anchor="start">1</text><text x="128" y="50" fill="#f1f3ed" font-size="34" text-anchor="start">role: &quot;assistant&quot;</text><text x="1030" y="50" fill="#becad4" font-size="30" text-anchor="start">no content</text><text x="25" y="119" fill="#8cbcff" font-size="34" text-anchor="start">2</text><text x="128" y="119" fill="#f1f3ed" font-size="34" text-anchor="start">content: &quot;Café &quot;</text><text x="1030" y="119" fill="#becad4" font-size="30" text-anchor="start">partial</text><text x="25" y="188" fill="#8cbcff" font-size="34" text-anchor="start">3</text><text x="128" y="188" fill="#f1f3ed" font-size="34" text-anchor="start">content: &quot;☕.&quot;</text><text x="1030" y="188" fill="#becad4" font-size="30" text-anchor="start">partial</text><text x="25" y="257" fill="#8cbcff" font-size="34" text-anchor="start">4</text><text x="128" y="257" fill="#f1f3ed" font-size="34" text-anchor="start">finish_reason: &quot;stop&quot;</text><text x="1030" y="257" fill="#becad4" font-size="30" text-anchor="start">generation ended</text><text x="25" y="326" fill="#8cbcff" font-size="34" text-anchor="start">5</text><text x="128" y="326" fill="#f1f3ed" font-size="34" text-anchor="start">choices: [], usage: {...}</text><text x="1030" y="326" fill="#becad4" font-size="30" text-anchor="start">accounting</text><text x="25" y="395" fill="#8cbcff" font-size="34" text-anchor="start">6</text><text x="128" y="395" fill="#f1f3ed" font-size="34" text-anchor="start">[DONE]</text><text x="1030" y="395" fill="#7addbb" font-size="30" text-anchor="start">terminal marker</text><line x1="25" y1="446" x2="1410" y2="446" stroke="#becad4" stroke-width="4"/></g></svg>
