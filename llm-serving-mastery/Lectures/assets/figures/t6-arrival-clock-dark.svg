<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">The product clock starts before admission</title><desc id="desc">Invented request: logical arrival20.00, admitted20.40, HTTP invoked20.45, first content20.70, terminal20.80 seconds. Product latency0.80, external admission wait0.40, invocation-to-terminal0.35. One shared monotonic origin.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="35" y="42" fill="#becad4" font-size="31" text-anchor="start">One invented request · seconds from the same origin</text><line x1="110" y1="230" x2="1300" y2="230" stroke="#becad4" stroke-width="4"/><circle cx="110" cy="230" r="10" fill="#ffcc79"/><text x="110" y="164" fill="#f1f3ed" font-size="30" text-anchor="middle">Arrival</text><text x="110" y="212" fill="#becad4" font-size="30" text-anchor="middle">20.00</text><circle cx="640" cy="230" r="10" fill="#8cbcff"/><text x="640" y="164" fill="#f1f3ed" font-size="30" text-anchor="middle">Admit</text><text x="640" y="212" fill="#becad4" font-size="30" text-anchor="middle">20.40</text><circle cx="705" cy="230" r="10" fill="#8cbcff"/><text x="705" y="304" fill="#f1f3ed" font-size="30" text-anchor="middle">Invoke</text><text x="705" y="352" fill="#becad4" font-size="30" text-anchor="middle">20.45</text><circle cx="1030" cy="230" r="10" fill="#8cbcff"/><text x="1030" y="164" fill="#f1f3ed" font-size="30" text-anchor="middle">Content</text><text x="1030" y="212" fill="#becad4" font-size="30" text-anchor="middle">20.70</text><circle cx="1160" cy="230" r="10" fill="#8cbcff"/><text x="1160" y="164" fill="#f1f3ed" font-size="30" text-anchor="middle">Terminal</text><text x="1160" y="212" fill="#becad4" font-size="30" text-anchor="middle">20.80</text><line x1="110" y1="95" x2="1160" y2="95" stroke="#8cbcff" stroke-width="4"/><text x="640" y="83" fill="#8cbcff" font-size="30" text-anchor="middle">Product latency = 0.80 s</text><text x="35" y="430" fill="#f1f3ed" font-size="32" text-anchor="start">Admission wait = 0.40 s; invocation → terminal = 0.35 s</text></g></svg>
