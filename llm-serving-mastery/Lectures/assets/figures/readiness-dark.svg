<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Traffic begins after readiness</title><desc id="desc">Load, warm, ready and drain are distinct states. The process may be alive throughout. Admission is off during load and warm, on when ready, and off again during drain.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><rect x="50" y="90" width="240" height="100" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="170" y="151" fill="#8cbcff" font-size="34" text-anchor="middle">LOAD</text><line x1="294" y1="140" x2="320" y2="140" stroke="#8cbcff" stroke-width="4"/><path d="M 306.8362615716444 147.19138307906306 L 320 140 L 306.8362615716444 132.80861692093694" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="330" y="90" width="240" height="100" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="450" y="151" fill="#8cbcff" font-size="34" text-anchor="middle">WARM</text><line x1="574" y1="140" x2="600" y2="140" stroke="#8cbcff" stroke-width="4"/><path d="M 586.8362615716444 147.19138307906306 L 600 140 L 586.8362615716444 132.80861692093694" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="610" y="90" width="240" height="100" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="730" y="151" fill="#8cbcff" font-size="34" text-anchor="middle">READY</text><line x1="854" y1="140" x2="880" y2="140" stroke="#8cbcff" stroke-width="4"/><path d="M 866.8362615716444 147.19138307906306 L 880 140 L 866.8362615716444 132.80861692093694" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="890" y="90" width="240" height="100" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="1010" y="151" fill="#8cbcff" font-size="34" text-anchor="middle">DRAIN</text><text x="25" y="300" fill="#f1f3ed" font-size="34" text-anchor="start">Process alive</text><line x1="300" y1="288" x2="1300" y2="288" stroke="#7addbb" stroke-width="4"/><text x="25" y="355" fill="#f1f3ed" font-size="34" text-anchor="start">Admission</text><text x="170" y="400" fill="#ffae99" font-size="42" text-anchor="middle">OFF</text><text x="450" y="400" fill="#ffae99" font-size="42" text-anchor="middle">OFF</text><text x="730" y="400" fill="#7addbb" font-size="42" text-anchor="middle">ON</text><text x="1010" y="400" fill="#ffae99" font-size="42" text-anchor="middle">OFF</text></g></svg>
