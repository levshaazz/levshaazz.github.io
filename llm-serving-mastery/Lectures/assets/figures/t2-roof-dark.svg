<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">A roof bounds rate; it does not promise it</title><desc id="desc">On log axes, a 600 GB/s bandwidth roof rises to a 60 TFLOP/s compute roof at 100 FLOP/byte. At intensity 20 the ceiling is 12 TFLOP/s; a point measured below the roof needs additional diagnosis.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><line x1="160" y1="50" x2="160" y2="380" stroke="#becad4" stroke-width="4"/><line x1="160" y1="380" x2="1350" y2="380" stroke="#becad4" stroke-width="4"/><text x="160" y="425" fill="#becad4" font-size="32" text-anchor="middle">1</text><text x="540" y="425" fill="#becad4" font-size="32" text-anchor="middle">10</text><text x="920" y="425" fill="#becad4" font-size="32" text-anchor="middle">100</text><text x="1300" y="425" fill="#becad4" font-size="32" text-anchor="middle">1000</text><text x="135" y="390" fill="#becad4" font-size="32" text-anchor="end">0.6</text><text x="135" y="245" fill="#becad4" font-size="32" text-anchor="end">6</text><text x="135" y="100" fill="#becad4" font-size="32" text-anchor="end">60</text><polyline points="160,380 920,90 1300,90" fill="none" stroke="#8cbcff" stroke-width="6"/><circle cx="654.3913983523129" cy="191.35065062872272" r="8" fill="#ffcc79"/><text x="644.3913983523129" y="169.35065062872272" fill="#ffcc79" font-size="34" text-anchor="middle">20 → 12</text><text x="980" y="80" fill="#8cbcff" font-size="34" text-anchor="start">60 TFLOP/s</text><text x="510" y="470" fill="#becad4" font-size="32" text-anchor="start">Intensity (FLOP/B, log)</text><text x="25" y="33" fill="#becad4" font-size="32" text-anchor="start">TFLOP/s (log)</text></g></svg>
