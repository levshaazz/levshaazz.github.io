<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">One decode query reads a longer history</title><desc id="desc">Prefill queries 42 positions and retains 42 KV positions. First decode consumes ID23, queries one new position, retains the old 42 and appends one for 43. Next output ID11 has no cache entry yet. The complete earlier replay selects 10 IDs including EOS and ends with 51 cached positions.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="25" y="44" fill="#8cbcff" font-size="32" text-anchor="start">Operation / state</text><text x="665" y="44" fill="#8cbcff" font-size="32" text-anchor="start">Prefill</text><text x="1060" y="44" fill="#8cbcff" font-size="32" text-anchor="start">Next decode</text><text x="25" y="111" fill="#becad4" font-size="30" text-anchor="start">New input IDs</text><text x="665" y="111" fill="#f1f3ed" font-size="30" text-anchor="start">[1,42]</text><text x="1060" y="111" fill="#f1f3ed" font-size="30" text-anchor="start">[1,1] = 23</text><text x="25" y="174" fill="#becad4" font-size="30" text-anchor="start">Q per layer</text><text x="665" y="174" fill="#f1f3ed" font-size="30" text-anchor="start">[1,12,42,128]</text><text x="1060" y="174" fill="#f1f3ed" font-size="30" text-anchor="start">[1,12,1,128]</text><text x="25" y="237" fill="#becad4" font-size="30" text-anchor="start">Stored K or V</text><text x="665" y="237" fill="#f1f3ed" font-size="30" text-anchor="start">[1,2,42,128]</text><text x="1060" y="237" fill="#f1f3ed" font-size="30" text-anchor="start">[1,2,43,128]</text><text x="25" y="300" fill="#becad4" font-size="30" text-anchor="start">Greedy output</text><text x="665" y="300" fill="#f1f3ed" font-size="30" text-anchor="start">23 = “8”</text><text x="1060" y="300" fill="#f1f3ed" font-size="30" text-anchor="start">11 = “,”</text><line x1="25" y1="338" x2="1410" y2="338" stroke="#becad4" stroke-width="4"/><text x="25" y="392" fill="#7addbb" font-size="34" text-anchor="start">Final replay KV = P + O − 1 = 42 + 10 − 1 = 51</text><text x="25" y="458" fill="#becad4" font-size="30" text-anchor="start">9 decode calls × 37.59 ms mean ≈ 338.32 ms, excluding gaps between calls</text></g></svg>
