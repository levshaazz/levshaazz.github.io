<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Batching changes both numerator and denominator</title><desc id="desc">If a 31-step decode takes one second at batch one, the aggregate rate is 31 tokens/s. If it takes 1.5 seconds at batch four, aggregate rate is 82.7 tokens/s but the per-sequence mean step interval worsens from 32.3 to 48.4 ms.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><rect x="30" y="45" width="635" height="290" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="347.5" y="160" fill="#8cbcff" font-size="34" text-anchor="middle">B = 1; 31 steps in 1.0 s</text><text x="347.5" y="201" fill="#f1f3ed" font-size="34" text-anchor="middle">31 tokens/s aggregate</text><text x="347.5" y="242" fill="#f1f3ed" font-size="34" text-anchor="middle">32.3 ms mean step</text><rect x="775" y="45" width="635" height="290" rx="8" fill="#293744" stroke="#ffcc79" stroke-width="3"/><text x="1092.5" y="160" fill="#ffcc79" font-size="34" text-anchor="middle">B = 4; 31 steps in 1.5 s</text><text x="1092.5" y="201" fill="#f1f3ed" font-size="34" text-anchor="middle">82.7 tokens/s aggregate</text><text x="1092.5" y="242" fill="#f1f3ed" font-size="34" text-anchor="middle">48.4 ms mean step</text><text x="80" y="438" fill="#f1f3ed" font-size="36" text-anchor="start">More aggregate throughput can coexist with slower user cadence.</text></g></svg>
