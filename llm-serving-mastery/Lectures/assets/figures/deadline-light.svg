<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">A five-second deadline budget</title><desc id="desc">Transit and validation consume 0.2 seconds, predicted queue 3.9 seconds, predicted service 1.4 seconds: total 5.5 seconds versus a 5 second deadline. The optimistic finish misses by half a second.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><rect x="110" y="150" width="45" height="100" fill="#146957" opacity="1"/><rect x="155" y="150" width="877.5" height="100" fill="#89540a" opacity="1"/><rect x="1032.5" y="150" width="315" height="100" fill="#175cad" opacity="1"/><line x1="1235" y1="80" x2="1235" y2="300" stroke="#af372b" stroke-width="4" stroke-dasharray="10 8"/><text x="1235" y="55" fill="#af372b" font-size="34" text-anchor="middle">deadline 5 s</text><text x="110" y="340" fill="#146957" font-size="32" text-anchor="start">0.2 s transit</text><text x="570" y="210" fill="#faf9f5" font-size="38" text-anchor="middle">3.9 s queue</text><text x="1190" y="210" fill="#faf9f5" font-size="38" text-anchor="middle">1.4 s</text><text x="720" y="425" fill="#172b35" font-size="40" text-anchor="middle">0.2 + 3.9 + 1.4 = 5.5 s: 0.5 s too late</text></g></svg>
