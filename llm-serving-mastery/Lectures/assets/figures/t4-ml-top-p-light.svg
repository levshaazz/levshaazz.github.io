<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Nucleus sampling keeps a cumulative prefix</title><desc id="desc">Descending A,B,C probabilities0.6652,0.2447,0.0900. A alone is below0.8; A+B reaches0.9100. Keep A and B, remove C. After renormalization probabilities0.7311,0.2689,0. Probability0.8 is a nucleus mass threshold, not a confidence cutoff for each token.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="25" y="50" fill="#175cad" font-size="32" text-anchor="start">Token</text><text x="340" y="50" fill="#175cad" font-size="32" text-anchor="start">Before</text><text x="680" y="50" fill="#175cad" font-size="32" text-anchor="start">Cumulative</text><text x="1060" y="50" fill="#175cad" font-size="32" text-anchor="start">After mask</text><text x="25" y="135" fill="#172b35" font-size="34" text-anchor="start">A</text><text x="340" y="135" fill="#172b35" font-size="34" text-anchor="start">0.6652</text><text x="680" y="135" fill="#172b35" font-size="34" text-anchor="start">0.6652</text><text x="1060" y="135" fill="#172b35" font-size="34" text-anchor="start">0.7311</text><line x1="25" y1="164" x2="1410" y2="164" stroke="#4b6070" stroke-width="4"/><text x="25" y="225" fill="#172b35" font-size="34" text-anchor="start">B</text><text x="340" y="225" fill="#172b35" font-size="34" text-anchor="start">0.2447</text><text x="680" y="225" fill="#172b35" font-size="34" text-anchor="start">0.9100</text><text x="1060" y="225" fill="#172b35" font-size="34" text-anchor="start">0.2689</text><line x1="25" y1="254" x2="1410" y2="254" stroke="#4b6070" stroke-width="4"/><text x="25" y="315" fill="#4b6070" font-size="34" text-anchor="start">C</text><text x="340" y="315" fill="#4b6070" font-size="34" text-anchor="start">0.0900</text><text x="680" y="315" fill="#4b6070" font-size="34" text-anchor="start">1.0000</text><text x="1060" y="315" fill="#4b6070" font-size="34" text-anchor="start">0 (removed)</text><line x1="25" y1="344" x2="1410" y2="344" stroke="#4b6070" stroke-width="4"/><text x="25" y="430" fill="#146957" font-size="36" text-anchor="start">A alone &lt; 0.8; A + B ≥ 0.8 → retain both</text></g></svg>
