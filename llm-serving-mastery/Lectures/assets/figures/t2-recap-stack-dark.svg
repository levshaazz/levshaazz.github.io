<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Twenty-eight blocks update the same-shaped stream</title><desc id="desc">Blocks 0 through 27 have distinct learned weights. Each maps [1,42,1536] to [1,42,1536]. Residual additions preserve shapes, not values. A final RMSNorm follows block 27 before the vocabulary projection. The first four captured last-position values after final norm are shown.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><rect x="25" y="80" width="285" height="125" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="167.5" y="133" fill="#8cbcff" font-size="34" text-anchor="middle">block 0</text><text x="167.5" y="174" fill="#f1f3ed" font-size="34" text-anchor="middle">W⁽⁰⁾</text><line x1="322" y1="142" x2="365" y2="142" stroke="#8cbcff" stroke-width="4"/><path d="M 351.8362615716444 149.19138307906306 L 365 142 L 351.8362615716444 134.80861692093694" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="376" y="80" width="285" height="125" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="518.5" y="133" fill="#8cbcff" font-size="34" text-anchor="middle">block 1</text><text x="518.5" y="174" fill="#f1f3ed" font-size="34" text-anchor="middle">W⁽¹⁾</text><line x1="673" y1="142" x2="716" y2="142" stroke="#8cbcff" stroke-width="4"/><path d="M 702.8362615716444 149.19138307906306 L 716 142 L 702.8362615716444 134.80861692093694" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="727" y="80" width="285" height="125" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="869.5" y="133" fill="#8cbcff" font-size="34" text-anchor="middle">…</text><text x="869.5" y="174" fill="#f1f3ed" font-size="34" text-anchor="middle">…</text><line x1="1024" y1="142" x2="1067" y2="142" stroke="#8cbcff" stroke-width="4"/><path d="M 1053.8362615716444 149.19138307906306 L 1067 142 L 1053.8362615716444 134.80861692093694" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="1078" y="80" width="285" height="125" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="1220.5" y="133" fill="#8cbcff" font-size="34" text-anchor="middle">block 27</text><text x="1220.5" y="174" fill="#f1f3ed" font-size="34" text-anchor="middle">W⁽²⁷⁾</text><text x="25" y="264" fill="#8cbcff" font-size="36" text-anchor="start">Every boundary: [1,42,1536], with different values</text><line x1="25" y1="306" x2="1410" y2="306" stroke="#becad4" stroke-width="4"/><text x="25" y="372" fill="#f1f3ed" font-size="36" text-anchor="start">After block 27 → final RMSNorm → h<tspan baseline-shift="sub" font-size="75%">f</tspan></text><text x="25" y="450" fill="#7addbb" font-size="32" text-anchor="start">Captured h<tspan baseline-shift="sub" font-size="75%">f</tspan>[0,41,0:4] = [0.745, -0.887, 1.418, -0.189]</text></g></svg>
