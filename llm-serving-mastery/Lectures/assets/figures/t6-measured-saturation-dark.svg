<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">What the pinned service actually did on a T4</title><desc id="desc">Measured single run (Colab Tesla T4, 18 October 2026): waves of 8/32/64/128 closed-loop clients on the frozen A-short corpus. Output throughput rose 68 → 105 → 347 → 460 tok/s with ZERO timeouts at every wave: natural-EOS classification replies (~2 output tokens) never saturated this GPU. The knee lands at wave 64 by the gain rule — the last doubling that still paid ≥50%.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="35" y="40" fill="#becad4" font-size="31" text-anchor="start">Measured: throughput vs concurrency — pinned 3B on T4</text><text x="160" y="392" fill="#becad4" font-size="30" text-anchor="middle">8</text><line x1="160" y1="360" x2="160" y2="368" stroke="#becad4" stroke-width="4"/><text x="760" y="392" fill="#becad4" font-size="30" text-anchor="middle">32</text><line x1="760" y1="360" x2="760" y2="368" stroke="#becad4" stroke-width="4"/><text x="1060" y="392" fill="#becad4" font-size="30" text-anchor="middle">64</text><line x1="1060" y1="360" x2="1060" y2="368" stroke="#becad4" stroke-width="4"/><text x="1360" y="392" fill="#becad4" font-size="30" text-anchor="middle">128</text><line x1="1360" y1="360" x2="1360" y2="368" stroke="#becad4" stroke-width="4"/><line x1="160" y1="360" x2="1240" y2="360" stroke="#becad4" stroke-width="4"/><text x="700" y="430" fill="#becad4" font-size="30" text-anchor="middle">concurrent clients</text><line x1="160" y1="314.856" x2="760" y2="290.37" stroke="#8cbcff" stroke-width="4"/><line x1="760" y1="290.37" x2="1060" y2="131.24399999999997" stroke="#8cbcff" stroke-width="4"/><line x1="1060" y1="131.24399999999997" x2="1360" y2="56.46600000000001" stroke="#8cbcff" stroke-width="4"/><circle cx="160" cy="314.856" r="9" fill="#8cbcff"/><circle cx="760" cy="290.37" r="9" fill="#8cbcff"/><circle cx="1060" cy="131.24399999999997" r="9" fill="#8cbcff"/><circle cx="1360" cy="56.46600000000001" r="9" fill="#8cbcff"/><text x="166" y="85" fill="#8cbcff" font-size="30" text-anchor="start">output tok/s (completed)</text><line x1="990" y1="85.24399999999997" x2="1060" y2="123.24399999999997" stroke="#7addbb" stroke-width="4"/><text x="982" y="79.24399999999997" fill="#7addbb" font-size="30" text-anchor="end">knee = 64 by the γ-rule</text><text x="35" y="462" fill="#f1f3ed" font-size="30" text-anchor="start">Zero timeouts at 128: this workload never saturated the GPU — the definition still applies</text></g></svg>
