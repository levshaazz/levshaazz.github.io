<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">One output chain advances sequentially</title><desc id="desc">Output y1 is fed back to compute y2; y2 is fed back to compute y3. The retained KV state grows at each step. Different requests may advance in the same iteration.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><rect x="120" y="75" width="200" height="100" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="220" y="136" fill="#175cad" font-size="34" text-anchor="middle">y₁</text><line x1="340" y1="125" x2="540" y2="125" stroke="#175cad" stroke-width="4"/><path d="M 526.8362615716444 132.19138307906306 L 540 125 L 526.8362615716444 117.80861692093696" fill="none" stroke="#175cad" stroke-width="4"/><text x="440" y="65" fill="#4b6070" font-size="32" text-anchor="middle">forward</text><rect x="70" y="260" width="300" height="100" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="220" y="300.5" fill="#175cad" font-size="34" text-anchor="middle">KV retained</text><text x="220" y="341.5" fill="#172b35" font-size="34" text-anchor="middle">prompt only</text><rect x="570" y="75" width="200" height="100" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="670" y="136" fill="#175cad" font-size="34" text-anchor="middle">y₂</text><line x1="790" y1="125" x2="990" y2="125" stroke="#175cad" stroke-width="4"/><path d="M 976.8362615716444 132.19138307906306 L 990 125 L 976.8362615716444 117.80861692093696" fill="none" stroke="#175cad" stroke-width="4"/><text x="890" y="65" fill="#4b6070" font-size="32" text-anchor="middle">forward</text><rect x="520" y="260" width="300" height="100" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="670" y="300.5" fill="#175cad" font-size="34" text-anchor="middle">KV retained</text><text x="670" y="341.5" fill="#172b35" font-size="34" text-anchor="middle">prompt + 1</text><rect x="1020" y="75" width="200" height="100" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="1120" y="136" fill="#175cad" font-size="34" text-anchor="middle">y₃</text><rect x="970" y="260" width="300" height="100" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="1120" y="300.5" fill="#175cad" font-size="34" text-anchor="middle">KV retained</text><text x="1120" y="341.5" fill="#172b35" font-size="34" text-anchor="middle">prompt + 2</text><text x="720" y="441" fill="#172b35" font-size="40" text-anchor="middle">Next token depends on the previous choice</text></g></svg>
