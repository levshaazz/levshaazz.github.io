<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">A weight error becomes an activation-weighted error</title><desc id="desc">Original row 0 dot input equals −1.83 + 1.04 + 0.12 + 3.375 = 2.705. Reconstructed row 0 gives −1.75 + 1 + 0.125 + 2.625 = 2.0. Full original output is [2.705, −1.15], reconstructed output [2, −0.25], so error is [−0.705, 0.9].</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="25" y="49" fill="#8cbcff" font-size="32" text-anchor="start">y₀ = −1.83×1 − 0.52×(−2) + 0.24×0.5 + 2.25×1.5</text><text x="25" y="124" fill="#f1f3ed" font-size="36" text-anchor="start">y₀ = −1.83 + 1.04 + 0.12 + 3.375 = 2.705</text><text x="25" y="210" fill="#7addbb" font-size="36" text-anchor="start">ŷ₀ = −1.75 + 1.00 + 0.125 + 2.625 = 2.000</text><line x1="25" y1="253" x2="1410" y2="253" stroke="#becad4" stroke-width="4"/><text x="25" y="322" fill="#f1f3ed" font-size="36" text-anchor="start">y = [2.705, -1.150];  ŷ = [2, -0.250]</text><text x="25" y="407" fill="#ffcc79" font-size="36" text-anchor="start">Δy = [-0.705, 0.900] = (Ŵ − W) @ x</text><text x="25" y="470" fill="#becad4" font-size="30" text-anchor="start">This is one linear layer, not a prediction of whole-model quality.</text></g></svg>
