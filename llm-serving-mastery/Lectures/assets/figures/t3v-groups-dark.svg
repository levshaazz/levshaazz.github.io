<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Local scales trade metadata for smaller output error</title><desc id="desc">Five quantization configurations are compared on held-out relative layer-output error. Each bar is labeled with the ideal bits per weight including one FP16 scale per tensor, row or group. These are theoretical packed sizes, not observed resident memory.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="85" y="45" fill="#f1f3ed" font-size="32" text-anchor="start">Held-out relative output error (%)</text><line x1="180" y1="340" x2="1230" y2="340" stroke="#becad4" stroke-width="4"/><line x1="180" y1="340" x2="180" y2="130" stroke="#becad4" stroke-width="4"/><text x="160" y="350" fill="#becad4" font-size="30" text-anchor="end">0</text><text x="160" y="245" fill="#becad4" font-size="30" text-anchor="end">37.5</text><text x="160" y="140" fill="#becad4" font-size="30" text-anchor="end">75</text><rect x="232" y="130.63431024551392" width="96" height="209.36568975448608" fill="#ffcc79" opacity="1"/><text x="280" y="115.63431024551392" fill="#f1f3ed" font-size="30" text-anchor="middle">74.8%</text><text x="280" y="390" fill="#f1f3ed" font-size="32" text-anchor="middle">tensor</text><text x="280" y="440" fill="#becad4" font-size="30" text-anchor="middle">4.000 b/w</text><rect x="442" y="284.8060256242752" width="96" height="55.1939743757248" fill="#7addbb" opacity="1"/><text x="490" y="269.8060256242752" fill="#f1f3ed" font-size="30" text-anchor="middle">19.7%</text><text x="490" y="390" fill="#f1f3ed" font-size="32" text-anchor="middle">row</text><text x="490" y="440" fill="#becad4" font-size="30" text-anchor="middle">4.003 b/w</text><rect x="652" y="305.3527972102165" width="96" height="34.64720278978348" fill="#7addbb" opacity="1"/><text x="700" y="290.3527972102165" fill="#f1f3ed" font-size="30" text-anchor="middle">12.4%</text><text x="700" y="390" fill="#f1f3ed" font-size="32" text-anchor="middle">g128</text><text x="700" y="440" fill="#becad4" font-size="30" text-anchor="middle">4.125 b/w</text><rect x="862" y="309.3587216734886" width="96" height="30.641278326511387" fill="#7addbb" opacity="1"/><text x="910" y="294.3587216734886" fill="#f1f3ed" font-size="30" text-anchor="middle">10.9%</text><text x="910" y="390" fill="#f1f3ed" font-size="32" text-anchor="middle">g64</text><text x="910" y="440" fill="#becad4" font-size="30" text-anchor="middle">4.250 b/w</text><rect x="1072" y="313.3438888192177" width="96" height="26.65611118078232" fill="#7addbb" opacity="1"/><text x="1120" y="298.3438888192177" fill="#f1f3ed" font-size="30" text-anchor="middle">9.5%</text><text x="1120" y="390" fill="#f1f3ed" font-size="32" text-anchor="middle">g32</text><text x="1120" y="440" fill="#becad4" font-size="30" text-anchor="middle">4.500 b/w</text></g></svg>
