<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Locate the intervention before looking at a histogram</title><desc id="desc">Qwen2.5-0.5B-Instruct has token embeddings of width 896, 24 pre-norm decoder blocks, final RMSNorm and a vocabulary projection to 151936 logits. Only block 12 MLP down projection is changed in this study.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><rect x="25" y="120" width="245" height="105" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="147.5" y="183.5" fill="#8cbcff" font-size="34" text-anchor="middle">Token IDs</text><line x1="275" y1="172" x2="303" y2="172" stroke="#8cbcff" stroke-width="4"/><path d="M 289.8362615716444 179.19138307906306 L 303 172 L 289.8362615716444 164.80861692093694" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="310" y="120" width="245" height="105" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="432.5" y="183.5" fill="#8cbcff" font-size="34" text-anchor="middle">Embedding</text><line x1="560" y1="172" x2="588" y2="172" stroke="#8cbcff" stroke-width="4"/><path d="M 574.8362615716444 179.19138307906306 L 588 172 L 574.8362615716444 164.80861692093694" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="595" y="120" width="245" height="105" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="717.5" y="183.5" fill="#8cbcff" font-size="34" text-anchor="middle">24 blocks</text><line x1="845" y1="172" x2="873" y2="172" stroke="#8cbcff" stroke-width="4"/><path d="M 859.8362615716444 179.19138307906306 L 873 172 L 859.8362615716444 164.80861692093694" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="880" y="120" width="245" height="105" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="1002.5" y="183.5" fill="#8cbcff" font-size="34" text-anchor="middle">Final norm</text><line x1="1130" y1="172" x2="1158" y2="172" stroke="#8cbcff" stroke-width="4"/><path d="M 1144.8362615716444 179.19138307906306 L 1158 172 L 1144.8362615716444 164.80861692093694" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="1165" y="120" width="245" height="105" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="1287.5" y="183.5" fill="#8cbcff" font-size="34" text-anchor="middle">LM head</text><text x="147" y="290" fill="#f1f3ed" font-size="30" text-anchor="middle">[1, S]</text><text x="432" y="290" fill="#f1f3ed" font-size="30" text-anchor="middle">[1, S, 896]</text><text x="717" y="290" fill="#f1f3ed" font-size="30" text-anchor="middle">[1, S, 896]</text><text x="1002" y="290" fill="#f1f3ed" font-size="30" text-anchor="middle">[1, S, 896]</text><text x="1287" y="290" fill="#f1f3ed" font-size="30" text-anchor="middle">[1, S, 151936]</text><text x="720" y="380" fill="#ffae99" font-size="38" text-anchor="middle">Zoom into block 12 → MLP → down projection</text><text x="720" y="450" fill="#becad4" font-size="32" text-anchor="middle">Only this matrix changes; all other weights remain fixed</text></g></svg>
