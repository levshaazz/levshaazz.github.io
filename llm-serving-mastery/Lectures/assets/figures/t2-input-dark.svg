<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">The literal text has real tokenizer IDs</title><desc id="desc">The full rendered chat contains 42 input IDs. The numerical suffix 2, 4, 6, splits into number, comma and space tokens. The replay preserves every ID and token piece, including system/user/assistant role markers and newlines.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="25" y="48" fill="#f1f3ed" font-size="40" text-anchor="start">Exact suffix: “2, 4, 6,”</text><text x="124.375" y="137" fill="#8cbcff" font-size="42" text-anchor="middle">2</text><text x="124.375" y="215" fill="#f1f3ed" font-size="34" text-anchor="middle">17</text><text x="124.375" y="290" fill="#becad4" font-size="30" text-anchor="middle">pos 29</text><text x="293.125" y="137" fill="#8cbcff" font-size="42" text-anchor="middle">,</text><text x="293.125" y="215" fill="#f1f3ed" font-size="34" text-anchor="middle">11</text><text x="293.125" y="290" fill="#becad4" font-size="30" text-anchor="middle">pos 30</text><text x="461.875" y="137" fill="#8cbcff" font-size="42" text-anchor="middle">␠</text><text x="461.875" y="215" fill="#f1f3ed" font-size="34" text-anchor="middle">220</text><text x="461.875" y="290" fill="#becad4" font-size="30" text-anchor="middle">pos 31</text><text x="630.625" y="137" fill="#8cbcff" font-size="42" text-anchor="middle">4</text><text x="630.625" y="215" fill="#f1f3ed" font-size="34" text-anchor="middle">19</text><text x="630.625" y="290" fill="#becad4" font-size="30" text-anchor="middle">pos 32</text><text x="799.375" y="137" fill="#8cbcff" font-size="42" text-anchor="middle">,</text><text x="799.375" y="215" fill="#f1f3ed" font-size="34" text-anchor="middle">11</text><text x="799.375" y="290" fill="#becad4" font-size="30" text-anchor="middle">pos 33</text><text x="968.125" y="137" fill="#8cbcff" font-size="42" text-anchor="middle">␠</text><text x="968.125" y="215" fill="#f1f3ed" font-size="34" text-anchor="middle">220</text><text x="968.125" y="290" fill="#becad4" font-size="30" text-anchor="middle">pos 34</text><text x="1136.875" y="137" fill="#8cbcff" font-size="42" text-anchor="middle">6</text><text x="1136.875" y="215" fill="#f1f3ed" font-size="34" text-anchor="middle">21</text><text x="1136.875" y="290" fill="#becad4" font-size="30" text-anchor="middle">pos 35</text><text x="1305.625" y="137" fill="#8cbcff" font-size="42" text-anchor="middle">,</text><text x="1305.625" y="215" fill="#f1f3ed" font-size="34" text-anchor="middle">11</text><text x="1305.625" y="290" fill="#becad4" font-size="30" text-anchor="middle">pos 36</text><line x1="25" y1="337" x2="1410" y2="337" stroke="#becad4" stroke-width="4"/><text x="25" y="397" fill="#8cbcff" font-size="38" text-anchor="start">Complete input tensor: [1, 42] integer IDs</text><text x="25" y="463" fill="#becad4" font-size="34" text-anchor="start">Spaces and punctuation occupy positions too. Token ≠ word.</text></g></svg>
