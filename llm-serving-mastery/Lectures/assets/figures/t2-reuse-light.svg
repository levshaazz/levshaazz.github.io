<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">One weight tile, several token rows</title><desc id="desc">At batch one a loaded weight tile is used for one decode row. At batch four that tile can serve four rows before another load, increasing work per transferred weight byte. KV and activation traffic still grow.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><rect x="35" y="165" width="350" height="130" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="210" y="220.5" fill="#175cad" font-size="34" text-anchor="middle">One weight tile</text><text x="210" y="261.5" fill="#172b35" font-size="34" text-anchor="middle">load from memory</text><line x1="405" y1="230" x2="600" y2="90" stroke="#175cad" stroke-width="4"/><path d="M 593.5008462433733 103.51891269472978 L 600 90 L 585.1127194603368 91.835450389786" fill="none" stroke="#175cad" stroke-width="4"/><rect x="625" y="60" width="365" height="65" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="807.5" y="103.5" fill="#175cad" font-size="34" text-anchor="middle">Token row 1</text><line x1="405" y1="230" x2="600" y2="195" stroke="#175cad" stroke-width="4"/><path d="M 588.3137702404243 204.4038308154926 L 600 195 L 585.7728523367169 190.24728820912304" fill="none" stroke="#175cad" stroke-width="4"/><rect x="625" y="165" width="365" height="65" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="807.5" y="208.5" fill="#175cad" font-size="34" text-anchor="middle">Token row 2</text><line x1="405" y1="230" x2="600" y2="300" stroke="#175cad" stroke-width="4"/><path d="M 585.1806446718311 302.32092818877976 L 600 300 L 590.0400744160302 288.7839453299396" fill="none" stroke="#175cad" stroke-width="4"/><rect x="625" y="270" width="365" height="65" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="807.5" y="313.5" fill="#175cad" font-size="34" text-anchor="middle">Token row 3</text><line x1="405" y1="230" x2="600" y2="405" stroke="#175cad" stroke-width="4"/><path d="M 585.3997944347632 401.55994223117864 L 600 405 L 595.0061840654798 390.8556794998087" fill="none" stroke="#175cad" stroke-width="4"/><rect x="625" y="375" width="365" height="65" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="807.5" y="418.5" fill="#175cad" font-size="34" text-anchor="middle">Token row 4</text><text x="1040" y="160" fill="#4b6070" font-size="34" text-anchor="start">B = 1: 1 use</text><text x="1040" y="265" fill="#146957" font-size="34" text-anchor="start">B = 4: 4 uses</text><text x="1040" y="370" fill="#89540a" font-size="34" text-anchor="start">More KV state</text></g></svg>
