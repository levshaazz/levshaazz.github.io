<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Shared wrapper and user text are different populations</title><desc id="desc">Grouped bars compare calibration relative output errors on all 414 chat positions and on only 240 user-content positions, for per-tensor, per-row, group128, group64 and group32 quantization. Same full 896 by 4864 weight matrix. Similar aggregate results here do not make wrapper disclosure optional.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="55" y="42" fill="#f1f3ed" font-size="32" text-anchor="start">Calibration relative output error (%)</text><text x="650" y="95" fill="#8cbcff" font-size="30" text-anchor="start">All chat positions</text><text x="1020" y="95" fill="#7addbb" font-size="30" text-anchor="start">User text only</text><line x1="150" y1="340" x2="1330" y2="340" stroke="#becad4" stroke-width="4"/><line x1="150" y1="340" x2="150" y2="110" stroke="#becad4" stroke-width="4"/><text x="135" y="350" fill="#becad4" font-size="30" text-anchor="end">0</text><text x="135" y="235" fill="#becad4" font-size="30" text-anchor="end">40</text><text x="135" y="120" fill="#becad4" font-size="30" text-anchor="end">80</text><rect x="195" y="123.64536911249161" width="55" height="216.3546308875084" fill="#8cbcff" opacity="1"/><rect x="260" y="124.19595956802368" width="55" height="215.80404043197632" fill="#7addbb" opacity="1"/><text x="260" y="395" fill="#f1f3ed" font-size="32" text-anchor="middle">tensor</text><text x="260" y="450" fill="#7addbb" font-size="30" text-anchor="middle">75.06%</text><rect x="425" y="282.8500987589359" width="55" height="57.14990124106407" fill="#8cbcff" opacity="1"/><rect x="490" y="282.5609488040209" width="55" height="57.43905119597912" fill="#7addbb" opacity="1"/><text x="490" y="395" fill="#f1f3ed" font-size="32" text-anchor="middle">row</text><text x="490" y="450" fill="#7addbb" font-size="30" text-anchor="middle">19.98%</text><rect x="655" y="304.21730536967516" width="55" height="35.78269463032484" fill="#8cbcff" opacity="1"/><rect x="720" y="304.11755261942744" width="55" height="35.88244738057256" fill="#7addbb" opacity="1"/><text x="720" y="395" fill="#f1f3ed" font-size="32" text-anchor="middle">g128</text><text x="720" y="450" fill="#7addbb" font-size="30" text-anchor="middle">12.48%</text><rect x="885" y="308.2064407505095" width="55" height="31.7935592494905" fill="#8cbcff" opacity="1"/><rect x="950" y="308.02220586687326" width="55" height="31.977794133126736" fill="#7addbb" opacity="1"/><text x="950" y="395" fill="#f1f3ed" font-size="32" text-anchor="middle">g64</text><text x="950" y="450" fill="#7addbb" font-size="30" text-anchor="middle">11.12%</text><rect x="1115" y="312.2415207885206" width="55" height="27.758479211479425" fill="#8cbcff" opacity="1"/><rect x="1180" y="311.9718334265053" width="55" height="28.028166573494673" fill="#7addbb" opacity="1"/><text x="1180" y="395" fill="#f1f3ed" font-size="32" text-anchor="middle">g32</text><text x="1180" y="450" fill="#7addbb" font-size="30" text-anchor="middle">9.75%</text></g></svg>
