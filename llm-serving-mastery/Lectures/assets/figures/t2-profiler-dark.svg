<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">A timeline and a kernel counter answer different questions</title><desc id="desc">End-to-end request spans locate queueing and delivery. A system timeline locates CPU launches, CUDA kernels and gaps. A focused kernel profile tests hardware utilization/traffic. Each instrument narrows a different boundary.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><rect x="25" y="80" width="420" height="210" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="235" y="175.5" fill="#8cbcff" font-size="34" text-anchor="middle">Request spans</text><text x="235" y="216.5" fill="#f1f3ed" font-size="34" text-anchor="middle">where did the user wait?</text><line x1="454" y1="185" x2="494" y2="185" stroke="#8cbcff" stroke-width="4"/><path d="M 480.8362615716444 192.19138307906306 L 494 185 L 480.8362615716444 177.80861692093694" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="505" y="80" width="420" height="210" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="715" y="175.5" fill="#8cbcff" font-size="34" text-anchor="middle">System timeline</text><text x="715" y="216.5" fill="#f1f3ed" font-size="34" text-anchor="middle">where are the gaps?</text><line x1="934" y1="185" x2="974" y2="185" stroke="#8cbcff" stroke-width="4"/><path d="M 960.8362615716444 192.19138307906306 L 974 185 L 960.8362615716444 177.80861692093694" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="985" y="80" width="420" height="210" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="1195" y="175.5" fill="#8cbcff" font-size="34" text-anchor="middle">Kernel counters</text><text x="1195" y="216.5" fill="#f1f3ed" font-size="34" text-anchor="middle">which roof / dependency?</text><rect x="270" y="355" width="890" height="85" rx="8" fill="#293744" stroke="#7addbb" stroke-width="3"/><text x="715" y="408.5" fill="#7addbb" font-size="34" text-anchor="middle">Change → repeat the unprofiled workload</text></g></svg>
