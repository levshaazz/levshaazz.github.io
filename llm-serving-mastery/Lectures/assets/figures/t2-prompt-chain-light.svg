<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Selected output and cached input differ by one token</title><desc id="desc">First three selected token IDs are 23, 11, 220. After each choice, cache lengths are 42, 43, 44. At natural stopping there are 10 selected IDs but only 51 retained positions, P+O−1.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><rect x="25" y="65" width="415" height="115" rx="8" fill="#e6edf3" stroke="#146957" stroke-width="3"/><text x="232.5" y="113" fill="#146957" font-size="34" text-anchor="middle">choose &quot;8&quot;</text><text x="232.5" y="154" fill="#172b35" font-size="34" text-anchor="middle">ID 23</text><rect x="25" y="263" width="415" height="96" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="232.5" y="301.5" fill="#175cad" font-size="34" text-anchor="middle">retained KV: 42</text><text x="232.5" y="342.5" fill="#172b35" font-size="34" text-anchor="middle">1176 KiB logical</text><line x1="449" y1="125" x2="489" y2="125" stroke="#175cad" stroke-width="4"/><path d="M 475.8362615716444 132.19138307906306 L 489 125 L 475.8362615716444 117.80861692093696" fill="none" stroke="#175cad" stroke-width="4"/><rect x="505" y="65" width="415" height="115" rx="8" fill="#e6edf3" stroke="#146957" stroke-width="3"/><text x="712.5" y="113" fill="#146957" font-size="34" text-anchor="middle">choose &quot;,&quot;</text><text x="712.5" y="154" fill="#172b35" font-size="34" text-anchor="middle">ID 11</text><rect x="505" y="263" width="415" height="96" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="712.5" y="301.5" fill="#175cad" font-size="34" text-anchor="middle">retained KV: 43</text><text x="712.5" y="342.5" fill="#172b35" font-size="34" text-anchor="middle">1204 KiB logical</text><line x1="929" y1="125" x2="969" y2="125" stroke="#175cad" stroke-width="4"/><path d="M 955.8362615716444 132.19138307906306 L 969 125 L 955.8362615716444 117.80861692093696" fill="none" stroke="#175cad" stroke-width="4"/><rect x="985" y="65" width="415" height="115" rx="8" fill="#e6edf3" stroke="#146957" stroke-width="3"/><text x="1192.5" y="113" fill="#146957" font-size="34" text-anchor="middle">choose &quot;␠&quot;</text><text x="1192.5" y="154" fill="#172b35" font-size="34" text-anchor="middle">ID 220</text><rect x="985" y="263" width="415" height="96" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="1192.5" y="301.5" fill="#175cad" font-size="34" text-anchor="middle">retained KV: 44</text><text x="1192.5" y="342.5" fill="#172b35" font-size="34" text-anchor="middle">1232 KiB logical</text><text x="25" y="445" fill="#172b35" font-size="36" text-anchor="start">Final: P + O − 1 = 42 + 10 − 1 = 51 cached positions</text></g></svg>
