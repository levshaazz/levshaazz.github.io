<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">The historical phase puzzle remains visible</title><desc id="desc">Pinned 1.5B RTX 5070 Ti batch-one v1 measurements. At output 32, prefill is 27.8 versus 185.6 ms for input 128 versus 4096; decode is 1116.3 versus 965.7 ms. The lower decode median is not proof that longer prompts accelerate decoding.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="25" y="40" fill="#172b35" font-size="34" text-anchor="start">Output 32; B=1</text><text x="275" y="105" fill="#175cad" font-size="36" text-anchor="start">Prefill (ms)</text><text x="850" y="105" fill="#89540a" font-size="36" text-anchor="start">Decode (ms)</text><text x="25" y="203" fill="#172b35" font-size="34" text-anchor="start">P=128</text><rect x="275" y="160" width="58.38" height="70" fill="#175cad" opacity="1"/><text x="349.38" y="205" fill="#175cad" font-size="34" text-anchor="start">27.8</text><rect x="850" y="160" width="357.216" height="70" fill="#89540a" opacity="1"/><text x="1223.216" y="205" fill="#89540a" font-size="34" text-anchor="start">1116.3</text><text x="25" y="358" fill="#172b35" font-size="34" text-anchor="start">P=4096</text><rect x="275" y="315" width="389.76" height="70" fill="#175cad" opacity="1"/><text x="680.76" y="360" fill="#175cad" font-size="34" text-anchor="start">185.6</text><rect x="850" y="315" width="309.024" height="70" fill="#89540a" opacity="1"/><text x="1175.024" y="360" fill="#89540a" font-size="34" text-anchor="start">965.7</text><text x="25" y="467" fill="#4b6070" font-size="32" text-anchor="start">Prediction agreed for prefill; decode needs a discriminating follow-up.</text></g></svg>
