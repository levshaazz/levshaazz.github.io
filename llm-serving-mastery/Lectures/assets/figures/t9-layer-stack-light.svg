<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">An image is ordered layers; a cache hit rewires only above the edit</title><desc id="desc">Left: the lean gateway image as four ordered layers — the pinned base image, an os-libs layer, the dependency layer built from requirements, and the application code layer on top. Right: the same stack after one source file edit. The bottom three layers are unchanged, so every layer below the edit is a build-cache hit; only the top layer is rebuilt. Editing the dependency file instead would invalidate the dependency layer and everything above it.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="35" y="44" fill="#4b6070" font-size="31" text-anchor="start">Image = ordered layers. One edit rewires only what sits above it</text><text x="240" y="84" fill="#172b35" font-size="30" text-anchor="middle">v1 lean image</text><text x="1048" y="84" fill="#172b35" font-size="30" text-anchor="middle">after one code-file edit</text><rect x="772" y="96" width="396" height="168" fill="#146957" opacity="0.1"/><rect x="772" y="264" width="396" height="74" fill="#af372b" opacity="0.12"/><rect x="80" y="100" width="380" height="74" rx="8" fill="#e6edf3" stroke="#146957" stroke-width="3"/><text x="270" y="148" fill="#146957" font-size="34" text-anchor="middle">app code layer</text><rect x="780" y="100" width="380" height="74" rx="8" fill="#e6edf3" stroke="#146957" stroke-width="3"/><text x="970" y="148" fill="#146957" font-size="34" text-anchor="middle">app code layer</text><rect x="80" y="184" width="380" height="74" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="270" y="232" fill="#175cad" font-size="34" text-anchor="middle">deps layer</text><rect x="780" y="184" width="380" height="74" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="970" y="232" fill="#175cad" font-size="34" text-anchor="middle">deps layer</text><rect x="80" y="268" width="380" height="74" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="270" y="316" fill="#175cad" font-size="34" text-anchor="middle">os libs layer</text><rect x="780" y="268" width="380" height="74" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="970" y="316" fill="#175cad" font-size="34" text-anchor="middle">os libs layer</text><rect x="80" y="352" width="380" height="74" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="270" y="400" fill="#175cad" font-size="34" text-anchor="middle"><tspan data-notation="code">python:3.12-slim</tspan></text><rect x="780" y="352" width="380" height="74" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="970" y="400" fill="#175cad" font-size="34" text-anchor="middle"><tspan data-notation="code">python:3.12-slim</tspan></text><text x="1210" y="146" fill="#146957" font-size="30" text-anchor="start">cache hit</text><text x="1210" y="190" fill="#146957" font-size="30" text-anchor="start">all layers</text><text x="1210" y="234" fill="#146957" font-size="30" text-anchor="start">below the</text><text x="1210" y="278" fill="#146957" font-size="30" text-anchor="start">edit</text><text x="1210" y="322" fill="#af372b" font-size="30" text-anchor="start">rebuilt:</text><text x="1210" y="366" fill="#af372b" font-size="30" text-anchor="start">this layer</text><text x="1210" y="410" fill="#af372b" font-size="30" text-anchor="start">only</text><line x1="470" y1="240" x2="560" y2="240" stroke="#175cad" stroke-width="4"/><path d="M 546.8362615716444 247.19138307906306 L 560 240 L 546.8362615716444 232.80861692093694" fill="none" stroke="#175cad" stroke-width="4"/><text x="665" y="196" fill="#4b6070" font-size="30" text-anchor="middle">edit one file</text><text x="665" y="236" fill="#4b6070" font-size="30" text-anchor="middle">in app/</text><text x="665" y="300" fill="#4b6070" font-size="30" text-anchor="middle">edit requirements</text><text x="665" y="340" fill="#4b6070" font-size="30" text-anchor="middle">instead: deps layer</text><text x="665" y="380" fill="#4b6070" font-size="30" text-anchor="middle">and all above it</text><text x="35" y="464" fill="#172b35" font-size="30" text-anchor="start">Cache policy = layer order: deps copy before code, so code edits keep the cache</text></g></svg>
