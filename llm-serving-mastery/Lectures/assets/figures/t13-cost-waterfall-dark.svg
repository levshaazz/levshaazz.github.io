<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Cost per 1M output tokens: declared levers move the bill — $2.22 → $0.69</title><desc id="desc">A waterfall of declared arithmetic. The base bar is 2.22 dollars per one million output tokens: a 2.00 dollar per GPU-hour price divided by a measured 250 tokens per second. The first lever raises sustained throughput from 250 to 400 tokens per second and cuts the bill to 1.39; the second lever moves the same load to a 1.00 dollar per GPU-hour tier and lands at 0.69. Each bar is named: throughput, then price tier.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><text x="35" y="44" fill="#becad4" font-size="31" text-anchor="start">cost per 1M output tokens: name the lever, move the bar</text><rect x="120" y="116.69999999999999" width="200" height="255.3" fill="#8cbcff" opacity="0.85"/><text x="220" y="104.69999999999999" fill="#8cbcff" font-size="34" text-anchor="middle">$2.22</text><text x="220" y="412" fill="#f1f3ed" font-size="30" text-anchor="start">base</text><line x1="330" y1="153.5" x2="400" y2="153.5" stroke="#ffcc79" stroke-width="4"/><path d="M 386.8362615716444 160.69138307906306 L 400 153.5 L 386.8362615716444 146.30861692093694" fill="none" stroke="#ffcc79" stroke-width="4"/><text x="365" y="137.5" fill="#ffcc79" font-size="32" text-anchor="middle">−$0.83</text><text x="365" y="412" fill="#f1f3ed" font-size="30" text-anchor="start">batching</text><rect x="410" y="212.15" width="200" height="159.85" fill="#8cbcff" opacity="0.85"/><text x="510" y="200.15" fill="#8cbcff" font-size="34" text-anchor="middle">$1.39</text><line x1="620" y1="251.25" x2="690" y2="251.25" stroke="#ffcc79" stroke-width="4"/><path d="M 676.8362615716444 258.44138307906303 L 690 251.25 L 676.8362615716444 244.05861692093694" fill="none" stroke="#ffcc79" stroke-width="4"/><text x="655" y="235.25" fill="#ffcc79" font-size="32" text-anchor="middle">−$0.69</text><text x="655" y="412" fill="#f1f3ed" font-size="30" text-anchor="start">price tier</text><rect x="700" y="292.65" width="200" height="79.35" fill="#7addbb" opacity="0.85"/><text x="800" y="280.65" fill="#7addbb" font-size="34" text-anchor="middle">$0.69</text><text x="800" y="412" fill="#f1f3ed" font-size="30" text-anchor="start">after both</text><rect x="960" y="96" width="420" height="220" fill="#293744" opacity="0.6"/><text x="980" y="140" fill="#f1f3ed" font-size="30" text-anchor="start">declared arithmetic:</text><text x="980" y="186" fill="#f1f3ed" font-size="30" text-anchor="start">cost = P · 1e6 / (r · 3600)</text><text x="980" y="232" fill="#becad4" font-size="30" text-anchor="start">P — dollars per GPU-hour</text><text x="980" y="278" fill="#becad4" font-size="30" text-anchor="start">r — sustained output tok/s</text><text x="35" y="464" fill="#becad4" font-size="30" text-anchor="start">250 → 400 tok/s, then $2 → $1 per GPU-hour; the lab ledger uses the student own measured tok/s</text></g></svg>
