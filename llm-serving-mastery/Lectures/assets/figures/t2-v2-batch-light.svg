<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Batch four raises aggregate rate in this run</title><desc id="desc">At prompt 128/output 32, batch one has median 36.9 aggregate post-first tokens/s, range 24.7–37.1. Batch four has median 155.2, range 103.3–162.5. Five raw trials per case; this is not a capacity or p95 estimate.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><line x1="260" y1="75" x2="260" y2="340" stroke="#4b6070" stroke-width="4" stroke-dasharray="10 8"/><text x="260" y="395" fill="#4b6070" font-size="32" text-anchor="middle">0</text><line x1="500" y1="75" x2="500" y2="340" stroke="#4b6070" stroke-width="4" stroke-dasharray="10 8"/><text x="500" y="395" fill="#4b6070" font-size="32" text-anchor="middle">40</text><line x1="740" y1="75" x2="740" y2="340" stroke="#4b6070" stroke-width="4" stroke-dasharray="10 8"/><text x="740" y="395" fill="#4b6070" font-size="32" text-anchor="middle">80</text><line x1="980" y1="75" x2="980" y2="340" stroke="#4b6070" stroke-width="4" stroke-dasharray="10 8"/><text x="980" y="395" fill="#4b6070" font-size="32" text-anchor="middle">120</text><line x1="1220" y1="75" x2="1220" y2="340" stroke="#4b6070" stroke-width="4" stroke-dasharray="10 8"/><text x="1220" y="395" fill="#4b6070" font-size="32" text-anchor="middle">160</text><text x="25" y="150" fill="#172b35" font-size="34" text-anchor="start">Batch 1</text><line x1="408.1708831439844" y1="140" x2="482.88944857674386" y2="140" stroke="#175cad" stroke-width="4"/><circle cx="481.65166171490654" cy="140" r="12" fill="#175cad"/><text x="481.65166171490654" y="110" fill="#175cad" font-size="34" text-anchor="middle">36.9</text><text x="25" y="310" fill="#172b35" font-size="34" text-anchor="start">Batch 4</text><line x1="879.8025567310722" y1="300" x2="1235.169204931944" y2="300" stroke="#146957" stroke-width="4"/><circle cx="1191.02936352