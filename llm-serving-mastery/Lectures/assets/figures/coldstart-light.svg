<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Cached artifacts still need loading and warmup</title><desc id="desc">Demand detection takes fifteen seconds, provisioning thirty, cached weight loading forty, warmup ten. The serial total is ninety-five seconds, longer than a twenty-second burst. Cache reuse removes downloading, not loading.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><rect x="90" y="120" width="195" height="100" fill="#175cad" opacity="1"/><text x="187.5" y="180" fill="#faf9f5" font-size="36" text-anchor="middle">15 s</text><text x="187.5" y="275" fill="#172b35" font-size="34" text-anchor="middle">detect</text><rect x="285" y="120" width="390" height="100" fill="#89540a" opacity="1"/><text x="480" y="180" fill="#faf9f5" font-size="36" text-anchor="middle">30 s</text><text x="480" y="275" fill="#172b35" font-size="34" text-anchor="middle">provision</text><rect x="675" y="120" width="520" height="100" fill="#146957" opacity="1"/><text x="935" y="180" fill="#faf9f5" font-size="36" text-anchor="middle">40 s</text><text x="935" y="275" fill="#172b35" font-size="34" text-anchor="middle">load</text><rect x="1195" y="120" width="130" height="100" fill="#af372b" opacity="1"/><text x="1260" y="180" fill="#faf9f5" font-size="36" text-anchor="middle">10 s</text><text x="1260" y="275" fill="#172b35" font-size="34" text-anchor="middle">warm</text><line x1="90" y1="355" x2="350" y2="355" stroke="#af372b" stroke-width="4"/><text x="90" y="420" fill="#af372b" font-size="34" text-anchor="start">20 s burst ends</text><text x="1325" y="420" fill="#146957" font-size="40" text-anchor="end">95 s ready</text></g></svg>
