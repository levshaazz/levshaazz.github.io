<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">The byte is unreadable without a reconstruction rule</title><desc id="desc">Unpack hexadecimal E9 into low nibble 9 and high nibble 14. Sign extension maps 9 to −7 and 14 to −2. Multiply by scale 0.25 to recover −1.75 and −0.50. Reading nibbles as unsigned or reversing their order reconstructs different weights.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><rect x="25" y="88" width="290" height="104" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="170" y="130.5" fill="#8cbcff" font-size="34" text-anchor="middle">byte 0xE9</text><text x="170" y="171.5" fill="#f1f3ed" font-size="34" text-anchor="middle">233 decimal</text><line x1="335" y1="140" x2="439" y2="140" stroke="#8cbcff" stroke-width="4"/><path d="M 425.8362615716444 147.19138307906306 L 439 140 L 425.8362615716444 132.80861692093694" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="460" y="55" width="930" height="85" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="925" y="108.5" fill="#8cbcff" font-size="34" text-anchor="middle">low = 233 &amp; 15 = 9; high = 233 &gt;&gt; 4 = 14</text><text x="460" y="225" fill="#8cbcff" font-size="34" text-anchor="start">signed(v) = v − 16 if v ≥ 8, otherwise v</text><text x="460" y="315" fill="#f1f3ed" font-size="38" text-anchor="start">codes [−7, −2] × scale 0.25</text><text x="460" y="406" fill="#7addbb" font-size="36" text-anchor="start">reconstructed weights [−1.75, −0.50]</text></g></svg>
