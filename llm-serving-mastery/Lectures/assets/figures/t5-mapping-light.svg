<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Logical ownership maps to noncontiguous physical IDs</title><desc id="desc">Toy block 4. A logical block0 maps physical3, A block1 maps physical0, B block0 maps physical2. A has 6 positions and B has 3. Physical IDs are toy indices, not addresses.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="35" y="45" fill="#4b6070" font-size="34" text-anchor="start">Logical block (request, index)</text><text x="910" y="45" fill="#4b6070" font-size="34" text-anchor="start">Physical pool ID</text><rect x="35" y="84" width="590" height="78" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="330" y="134" fill="#175cad" font-size="34" text-anchor="middle">A block 0: positions 0–3</text><line x1="650" y1="123" x2="870" y2="123" stroke="#175cad" stroke-width="4"/><path d="M 856.8362615716444 130.19138307906306 L 870 123 L 856.8362615716444 115.80861692093696" fill="none" stroke="#175cad" stroke-width="4"/><rect x="905" y="84" width="485" height="78" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="1147.5" y="134" fill="#175cad" font-size="34" text-anchor="middle">3 · A positions 0–3</text><rect x="35" y="196" width="590" height="78" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="330" y="246" fill="#175cad" font-size="34" text-anchor="middle">A block 1: positions 4–5</text><line x1="650" y1="235" x2="870" y2="235" stroke="#175cad" stroke-width="4"/><path d="M 856.8362615716444 242.19138307906306 L 870 235 L 856.8362615716444 227.80861692093694" fill="none" stroke="#175cad" stroke-width="4"/><rect x="905" y="196" width="485" height="78" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="1147.5" y="246" fill="#175cad" font-size="34" text-anchor="middle">0 · A two live slots</text><rect x="35" y="308" width="590" height="78" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="330" y="358" fill="#175cad" font-size="34" text-anchor="middle">B block 0: positions 0–2</text><line x1="650" y1="347" x2="870" y2="347" stroke="#175cad" stroke-width="4"/><path d="M 856.8362615716444 354.19138307906303 L 870 347 L 856.8362615716444 339.80861692093697" fill="none" stroke="#175cad" stroke-width="4"/><rect x="905" y="308" width="485" height="78" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="1147.5" y="358" fill="#175cad" font-size="34" text-anchor="middle">2 · B three live slots</text><text x="35" y="450" fill="#89540a" font-size="32" text-anchor="start">Toy block size 4; unused slots are masked, not new tokens</text></g></svg>
