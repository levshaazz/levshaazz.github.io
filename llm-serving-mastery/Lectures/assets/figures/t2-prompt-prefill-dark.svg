<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">The first call consumes the complete chat</title><desc id="desc">The exact prompt and chat wrapper enter as [1,42] IDs. Prefill retains 42 KV positions and selects &quot;8&quot; [23]. Synchronized wall interval 19.63 ms. The selected output has not entered the cache yet.</desc><rect width="1440" height="480" fill="#151b22"/><g font-family="Arial, sans-serif"><rect x="25" y="115" width="375" height="130" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="212.5" y="170.5" fill="#8cbcff" font-size="34" text-anchor="middle"><tspan data-notation="code">input_ids [1, 42]</tspan></text><text x="212.5" y="211.5" fill="#f1f3ed" font-size="34" text-anchor="middle">complete chat</text><line x1="425" y1="180" x2="540" y2="180" stroke="#8cbcff" stroke-width="4"/><path d="M 526.8362615716444 187.19138307906306 L 540 180 L 526.8362615716444 172.80861692093694" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="565" y="115" width="365" height="130" rx="8" fill="#293744" stroke="#8cbcff" stroke-width="3"/><text x="747.5" y="170.5" fill="#8cbcff" font-size="34" text-anchor="middle">28 decoder blocks</text><text x="747.5" y="211.5" fill="#f1f3ed" font-size="34" text-anchor="middle">last-position logits</text><line x1="950" y1="180" x2="1045" y2="180" stroke="#8cbcff" stroke-width="4"/><path d="M 1031.8362615716444 187.19138307906306 L 1045 180 L 1031.8362615716444 172.80861692093694" fill="none" stroke="#8cbcff" stroke-width="4"/><rect x="1070" y="115" width="340" height="130" rx="8" fill="#293744" stroke="#7addbb" stroke-width="3"/><text x="1240" y="170.5" fill="#7addbb" font-size="34" text-anchor="middle">selected ID</text><text x="1240" y="211.5" fill="#f1f3ed" font-size="34" text-anchor="middle">23</text><text x="25" y="65" fill="#8cbcff" font-size="38" text-anchor="start">One prefill call: 19.63 ms wall</text><text x="25" y="327" fill="#f1f3ed" font-size="38" text-anchor="start">KV after call: 42 positions</text><text x="750" y="327" fill="#7addbb" font-size="38" text-anchor="start">Text selected: &quot;8&quot;</text><text x="25" y="442" fill="#becad4" font-size="34" text-anchor="start">That new output enters KV only when the next forward consumes it.</text></g></svg>
