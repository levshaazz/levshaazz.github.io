<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">The same prefill shape has different observed medians</title><desc id="desc">For 1.5B/B1/P128 the O32 group has prefill median 22.3 ms and range 18.1–30.7 ms; O128 group median 64.6 ms and range 21.2–100.2 ms. Future output length is not an input to the initial forward call, so these groups do not establish causality.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="25" y="130" fill="#172b35" font-size="34" text-anchor="start">Later output: 32</text><line x1="537.6528043915459" y1="120" x2="646.8559700163314" y2="120" stroke="#175cad" stroke-width="4"/><circle cx="574.0301840128086" cy="102" r="6" fill="#175cad"/><circle cx="547.3926197072433" cy="111" r="6" fill="#175cad"/><circle cx="599.7616432869836" cy="120" r="6" fill="#175cad"/><circle cx="646.8559700163314" cy="129" r="6" fill="#175cad"/><circle cx="537.6528043915459" cy="138" r="6" fill="#175cad"/><text x="574.0301840128086" y="80" fill="#175cad" font-size="34" text-anchor="middle">22.3 ms</text><text x="25" y="275" fill="#172b35" font-size="34" text-anchor="start">Later output: 128</text><line x1="564.376846716259" y1="265" x2="1252.0560971069062" y2="265" stroke="#89540a" stroke-width="4"/><circle cx="1252.0560971069062" cy="247" r="6" fill="#89540a"/><circle cx="564.376846716259" cy="256" r="6" fill="#89540a"/><circle cx="942.3410822121514" cy="265" r="6" fill="#89540a"/><circle cx="830.6158997130115" cy="274" r="6" fill="#89540a"/><circle cx="976.1705363086367" cy="283" r="6" fill="#89540a"/><text x="942.3410822121514" y="225" fill="#89540a" font-size="34" text-anchor="middle">64.6 ms</text><text x="380" y="361" fill="#4b6070" font-size="30" text-anchor="middle">0 ms</text><text x="597.5" y="361" fill="#4b6070" font-size="30" text-anchor="middle">25 ms</text><text x="815" y="361" fill="#4b6070" font-size="30" text-anchor="middle">50 ms</text><text x="1032.5" y="361" fill="#4b6070" font-size="30" text-anchor="middle">75 ms</text><text x="1250" y="361" fill="#4b6070" font-size="30" text-anchor="middle">100 ms</text><text x="25" y="441" fill="#172b35" font-size="36" text-anchor="start">Question: how could future output length alter this forward call?</text></g></svg>
