<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Finish, DONE and useful output are separate checks</title><desc id="desc">The application checks HTTP status, a valid data stream, generation finish reason and the terminal DONE marker. Finish stop plus DONE means protocol complete under this text-only course contract. Length plus DONE is complete transport with generation capped. A quality or format assertion can still fail.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="25" y="47" fill="#175cad" font-size="32" text-anchor="start">OBSERVED</text><text x="550" y="47" fill="#175cad" font-size="32" text-anchor="start">CLASSIFICATION</text><text x="1060" y="47" fill="#175cad" font-size="32" text-anchor="start">NEXT CHECK</text><text x="25" y="130" fill="#172b35" font-size="34" text-anchor="start">stop + DONE</text><text x="550" y="130" fill="#146957" font-size="32" text-anchor="start">protocol complete</text><text x="1060" y="130" fill="#4b6070" font-size="30" text-anchor="start">check task answer</text><line x1="25" y1="159" x2="1410" y2="159" stroke="#4b6070" stroke-width="4"/><text x="25" y="220" fill="#172b35" font-size="34" text-anchor="start">length + DONE</text><text x="550" y="220" fill="#146957" font-size="32" text-anchor="start">generation capped</text><text x="1060" y="220" fill="#4b6070" font-size="30" text-anchor="start">check truncation</text><line x1="25" y1="249" x2="1410" y2="249" stroke="#4b6070" stroke-width="4"/><text x="25" y="310" fill="#172b35" font-size="34" text-anchor="start">content, then EOF</text><text x="550" y="310" fill="#af372b" font-size="32" text-anchor="start">partial response</text><text x="1060" y="310" fill="#4b6070" font-size="30" text-anchor="start">keep failure</text><line x1="25" y1="339" x2="1410" y2="339" stroke="#4b6070" stroke-width="4"/><text x="25" y="400" fill="#172b35" font-size="34" text-anchor="start">error, then DONE</text><text x="550" y="400" fill="#af372b" font-size="32" text-anchor="start">failed request</text><text x="1060" y="400" fill="#4b6070" font-size="30" text-anchor="start">terminal ≠ success</text></g></svg>
