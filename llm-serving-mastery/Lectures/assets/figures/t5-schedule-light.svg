<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">A released slot admits new work at the next iteration</title><desc id="desc">A5, B1, C1 arrive at 0; D2 arrives at 2, two slots. Static completes A5 B1 C6 D7. Continuous completes A5 B1 C2 D4. Every tick costs one invented unit; prefill 0.</desc><rect width="1440" height="480" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="35" y="42" fill="#4b6070" font-size="30" text-anchor="start">Tick interval start</text><text x="350" y="42" fill="#4b6070" font-size="32" text-anchor="middle">0</text><text x="505" y="42" fill="#4b6070" font-size="32" text-anchor="middle">1</text><text x="660" y="42" fill="#4b6070" font-size="32" text-anchor="middle">2</text><text x="815" y="42" fill="#4b6070" font-size="32" text-anchor="middle">3</text><text x="970" y="42" fill="#4b6070" font-size="32" text-anchor="middle">4</text><text x="1125" y="42" fill="#4b6070" font-size="32" text-anchor="middle">5</text><text x="1280" y="42" fill="#4b6070" font-size="32" text-anchor="middle">6</text><text x="35" y="145" fill="#172b35" font-size="34" text-anchor="start">Static</text><rect x="280" y="88" width="135" height="80" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="347.5" y="139" fill="#175cad" font-size="34" text-anchor="middle">A+B</text><rect x="435" y="88" width="135" height="80" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="502.5" y="139" fill="#175cad" font-size="34" text-anchor="middle">A</text><rect x="590" y="88" width="135" height="80" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="657.5" y="139" fill="#175cad" font-size="34" text-anchor="middle">A</text><rect x="745" y="88" width="135" height="80" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="812.5" y="139" fill="#175cad" font-size="34" text-anchor="middle">A</text><rect x="900" y="88" width="135" height="80" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="967.5" y="139" fill="#175cad" font-size="34" text-anchor="middle">A</text><rect x="1055" y="88" width="135" height="80" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="1122.5" y="139" fill="#175cad" font-size="34" text-anchor="middle">C+D</text><rect x="1210" y="88" width="135" height="80" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="1277.5" y="139" fill="#175cad" font-size="34" text-anchor="middle">D</text><text x="35" y="295" fill="#172b35" font-size="34" text-anchor="start">Continuous</text><rect x="280" y="238" width="135" height="80" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="347.5" y="289" fill="#175cad" font-size="34" text-anchor="middle">A+B</text><rect x="435" y="238" width="135" height="80" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="502.5" y="289" fill="#175cad" font-size="34" text-anchor="middle">A+C</text><rect x="590" y="238" width="135" height="80" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="657.5" y="289" fill="#175cad" font-size="34" text-anchor="middle">A+D</text><rect x="745" y="238" width="135" height="80" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="812.5" y="289" fill="#175cad" font-size="34" text-anchor="middle">A+D</text><rect x="900" y="238" width="135" height="80" rx="8" fill="#e6edf3" stroke="#175cad" stroke-width="3"/><text x="967.5" y="289" fill="#175cad" font-size="34" text-anchor="middle">A</text><rect x="1055" y="238" width="135" height="80" rx="8" fill="#e6edf3" stroke="#4b6070" stroke-width="3"/><text x="1122.5" y="289" fill="#4b6070" font-size="34" text-anchor="middle">—</text><rect x="1210" y="238" width="135" height="80" rx="8" fill="#e6edf3" stroke="#4b6070" stroke-width="3"/><text x="1277.5" y="289" fill="#4b6070" font-size="34" text-anchor="middle">—</text><text x="35" y="423" fill="#89540a" font-size="34" text-anchor="start">C: finishes at 6 versus 2; D: at 7 versus 4</text></g></svg>
